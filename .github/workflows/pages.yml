# site/ 폴더를 GitHub Pages 루트로 배포 — 짧은 주소를 위해
# https://sin0nis.github.io/hots-scrap/            (허브)
# https://sin0nis.github.io/hots-scrap/encyclopedia/  등
name: Deploy Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
