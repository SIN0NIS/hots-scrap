# 패치 노트 자동 업데이트 — 6시간마다 "확인만" 싸게 하고, 있을 때만 일을 벌인다.
#
# 확인은 요청 3개로 끝난다(한국어 뉴스 1 + 영어 뉴스 1 + GitHub 빌드 목록 1).
# 새 것이 없으면 그대로 끝나므로 서버에 부담이 없다.
#
# 여기서 자동으로 처리하는 것: **한국어 공식 패치 노트**. 받아서 파싱하고 색인을 다시 만든 뒤
# 바로 커밋·푸시한다. 푸시하면 Deploy Pages 가 이어 돌아 사이트가 갱신된다.
#
# 여기서 처리하지 않고 알림만 남기는 것
#   · 한국어판이 없는 영문 노트 → 사람이 번역해야 한다(Claude 예약 작업이 로컬에서 한다)
#   · 새 게임 빌드 → 전체 시계열을 다시 만들어야 해서 무겁다. 로컬에서 돌린다
#
# 손으로 돌리려면 Actions 탭에서 Run workflow.
name: Update Patch Notes

on:
  schedule:
    - cron: "10 */6 * * *"      # 6시간마다. cron 은 UTC 기준 00:10·06:10·12:10·18:10
                                # = 한국 시각 09:10 · 15:10 · 21:10 · 03:10
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-patchnotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install --quiet requests beautifulsoup4 jsonpatch

      - name: 갱신 확인 (요청 3개)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub API 한도를 넉넉히
        run: |
          set +e
          python pipeline/steps/check_updates.py --json > /tmp/check.json
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          # 확인이 실패하면(참고 서버가 잠깐 막히는 등) 아무 일도 벌이지 않고 조용히 끝낸다.
          # 출력이 비면 '' != '0' 이 참이 되어 무거운 분기가 통째로 헛돌기 때문에 0 으로 못박는다.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              d = json.load(open('/tmp/check.json', encoding='utf-8'))
              if d.get('ok') is False:
                  raise ValueError(d.get('error', '확인 실패'))
              ko = [x['newsId'] for x in d['newKo']]
              print('ok=1')
              print('ko_ids=' + ','.join(ko))
              print('ko_count=%d' % len(ko))
              print('en_count=%d' % len(d['newEnOnly']))
              print('build_count=%d' % len(d['newBuilds']))
          except Exception as e:
              print('ok=0')
              print('ko_ids=')
              print('ko_count=0')
              print('en_count=0')
              print('build_count=0')
              print('error=%s' % ' '.join(str(e).split())[:200])
          PY
          cat /tmp/check.json

      - name: 캐시 — 복원한 빌드 자료
        if: steps.check.outputs.ok == '1' && steps.check.outputs.ko_count != '0'
        uses: actions/cache@v4
        with:
          path: vendor/full
          key: vendor-full-${{ hashFiles('site/data/patchnotes/builds.json') }}

      - name: 새 한국어 노트 받아서 반영
        if: steps.check.outputs.ok == '1' && steps.check.outputs.ko_count != '0'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          for id in $(echo "${{ steps.check.outputs.ko_ids }}" | tr ',' ' '); do
            echo "::group::$id"
            python pipeline/steps/fetch_official_patchnotes.py --id "$id"
            python pipeline/steps/parse_official_patchnotes.py --id "$id"
            echo "::endgroup::"
          done
          python pipeline/steps/ci_prepare.py
          python pipeline/steps/build_patch_index.py
          python pipeline/steps/build_status.py      # 허브에 보일 "자료 갱신" 시각
          rm -f site/data/patchnotes/unmatched.json

      - name: 달라진 것이 있으면 커밋·푸시
        id: commit
        if: steps.check.outputs.ok == '1' && steps.check.outputs.ko_count != '0'
        run: |
          git config user.name  "hots-scrap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/patchnotes site/data/hub.json
          if git diff --cached --quiet; then
            echo "바뀐 파일이 없습니다."
            exit 0
          fi
          n=$(python -c "import json;print(len(json.load(open('site/data/patchnotes/index.json',encoding='utf-8-sig'))))")
          git commit -m "패치 기록: 새 한국어 공식 노트 ${{ steps.check.outputs.ko_count }}건 반영 (모두 ${n}건)

          GitHub Actions 가 블리자드 뉴스에서 받아 자동으로 넣었습니다.
          영문만 있는 회차와 새 게임 빌드는 사람이 따로 처리합니다."
          # 그 사이 사람이 먼저 올렸을 수 있다. 한 번 맞춰 보고 그래도 안 되면 실패로 남긴다.
          git push || { git pull --rebase --autostash && git push; }
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 으로 한 푸시는 다른 워크플로를 깨우지 못한다(재귀 방지 규칙).
      # 그래서 Deploy Pages(push 로 도는 워크플로)가 그냥 넘어가 사이트가 갱신되지 않는다.
      # workflow_dispatch 는 그 규칙의 예외라, 배포를 여기서 직접 깨운다.
      - name: 배포 깨우기 (토큰 푸시는 배포를 자동으로 깨우지 못한다)
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: 사람 손이 필요한 것은 이슈로 알림
        if: steps.check.outputs.ok == '1' && (steps.check.outputs.en_count != '0' || steps.check.outputs.build_count != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/tmp/check.json', 'utf8'));
            const lines = ['자동으로 처리하지 못한 것이 있습니다.', ''];
            if (d.newEnOnly.length) {
              lines.push('### 번역이 필요한 영문 노트');
              for (const x of d.newEnOnly) lines.push(`- ${x.date} · \`${x.newsId}\` — ${x.title}`);
              lines.push('', '한국어 공식판이 없는 회차입니다. 로컬에서 번역 단계를 돌려 주세요.', '');
            }
            if (d.newBuilds.length) {
              lines.push('### 새 게임 빌드');
              for (const b of d.newBuilds) lines.push(`- ${b.version}${b.isPtr ? ' (테스트 서버)' : ''}`);
              lines.push('', '시계열·빌드메이커 자료를 다시 만들어야 해서 무겁습니다. 로컬에서 돌려 주세요.', '');
            }
            lines.push('---', '`python pipeline/steps/check_updates.py` 로 같은 내용을 볼 수 있습니다.');
            const body = lines.join('\n');
            const title = '패치 자료 갱신 필요';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-update',
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['auto-update'],
              });
            }

      - name: 요약
        run: |
          echo "### 갱신 확인 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 새 한국어 노트: ${{ steps.check.outputs.ko_count }}건 (자동 반영)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 번역 필요한 영문 노트: ${{ steps.check.outputs.en_count }}건" >> "$GITHUB_STEP_SUMMARY"
          echo "- 새 게임 빌드: ${{ steps.check.outputs.build_count }}개" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.ok }}" != "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 확인에 실패해 아무것도 하지 않았습니다 — ${{ steps.check.outputs.error }}" >> "$GITHUB_STEP_SUMMARY"
          fi
