<!DOCTYPE html>

<title>HotS Scrap 이 hotscrap.com 으로 옮겼습니다</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages serves this page for every old address under /hots-scrap/: send it to the same path on hotscrap.com
  var path = location.pathname.replace(/^\/hots-scrap(\/|$)/, '/');
  location.replace('https://hotscrap.com' + path + location.search + location.hash);
</script>

</body>
