<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>특성 빌드 · HotS Scrap</title>
<link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --p: #a333ff; --bg: #0b0b0d; --card: #16161a; --blue: #00d4ff; --gold: #ffd700; --green: #00ff00; --fs: 14px; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; width: 100%; font-size: var(--fs); }
        
        #top-bar { background: #000; padding: 6px 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 2100; }
        #top-bar a { color: #888; text-decoration: none; font-size: 11px; }
        .ch-btn.on { background: #1758a8; border-color: #1758a8; color: #fff; }
        .lang-btn { background: #222; color: #fff; border: 1px solid var(--p); padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }

        #header { padding: 10px; background: #1a1a1e; border-bottom: 1px solid #333; flex-shrink: 0; }
        .search-box { width: 100%; padding: 12px; background: #222; color: white; border: 1px solid var(--p); border-radius: 6px; font-size: 16px; outline: none; box-sizing: border-box; }
        #hero-list-dropdown { position: absolute; left: 10px; right: 10px; max-height: 250px; background: #2a2a2a; overflow-y: auto; z-index: 3000; border-radius: 4px; display: none; border: 1px solid var(--p); }
        .hero-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; }
        
        #capture-area { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 280px; background: #0b0b0d; width: 100%; box-sizing: border-box; }
        #hero-stat-container { background: #1a1a20; margin: 8px; padding: 12px; border-radius: 8px; border: 1px solid #333; display: none; }
        
        .slider-wrapper { margin: 10px 5px 25px 5px; position: relative; }
        #level-slider { width: 100%; height: 6px; background: #333; border-radius: 5px; outline: none; }
        .slider-ticks { display: flex; justify-content: space-between; padding: 0 2px; margin-top: 5px; position: relative; }
        .tick { font-size: 10px; color: #666; position: absolute; transform: translateX(-50%); text-align: center; }
        .tick::before { content: '|'; display: block; font-size: 8px; margin-bottom: -2px; color: #444; }
        .tick.highlight { color: var(--gold); font-weight: bold; }

        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
        .stat-item { background: #111; padding: 6px; border-radius: 4px; display: flex; flex-direction: column; gap: 2px; }
        .stat-value { color: #fff; font-weight: bold; font-size: 1.25em; }
        .stat-label { color: #888; font-size: 0.85em; display: flex; justify-content: space-between; align-items: center; }
        .growth-tag { color: var(--green); font-size: 0.9em; }
        .dps-tag { color: var(--gold); font-size: 0.85em; margin-left: 4px; }
        
        .ability-list { border-top: 1px solid #444; padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
        .ability-item { display: flex; gap: 8px; align-items: flex-start; background: #111; padding: 6px; border-radius: 6px; }
        .ability-icon { width: 34px; height: 34px; border: 1px solid #444; border-radius: 4px; flex-shrink: 0; }
        .tier-row { display: flex; align-items: center; background: var(--card); padding: 6px 8px; border-radius: 6px; border-left: 4px solid var(--p); gap: 8px; margin: 4px 8px; }
        .t-icon { width: 38px; height: 38px; border: 1px solid #444; cursor: pointer; border-radius: 5px; }
        .t-icon.selected { border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }
        .t-icon.sub { border: 1px dashed #4d9fff; box-shadow: 0 0 6px #4d9fff88; }
        .lv-list-btn { width:35px; background:none; border:1px solid #233a5c; color:var(--blue); font-weight:bold; border-radius:5px; cursor:pointer; padding:4px 0; font:inherit; font-weight:bold; flex-shrink:0; }
        .lv-list-btn:hover { border-color:var(--gold); color:var(--gold); }
        :root[data-theme="light"] .lv-list-btn { border-color:#cdd9ea; }
        /* ── 모바일: 좁은 폭에서 설명이 세로로 찌그러지지 않게 ── */
        @media (max-width: 640px) {
          .tier-row { flex-wrap: wrap; }
          .t-info-display { flex-basis: 100%; margin-top: 4px; }
          #bp-modal > div, #tc-modal > div, #tcp-modal > div { padding: 10px; margin: 8px auto; }
          .option-group { gap: 8px; flex-wrap: wrap; }
        }
        /* ── 공통 위젯 색 — 테마를 따른다 ── */
        .x-btn { margin-left:auto; background:none; border:1px solid #445; color:#aaa; border-radius:5px; padding:6px 10px; cursor:pointer; }
        .tcd { color:#bbb; }
        .tdesc { color:#bbb; }
        .tname { color:#fff; }
        :root[data-theme="light"] .tdesc { color:#43536b; }
        :root[data-theme="light"] .tname { color:#122036; }
        :root[data-theme="light"] #code-load-input { background:#ffffff; border-color:#cdd9ea; color:#122036; }
        :root[data-theme="light"] .x-btn { border-color:#cdd9ea; color:#5d6d84; }
        :root[data-theme="light"] .tcd { color:#43536b; }
        :root[data-theme="light"] .t-info-display { color:#43536b !important; }
        :root[data-theme="light"] .t-info-display b { color:#122036 !important; }
        /* 모달 상자·글자 라이트 전환 (저장 카드 자체는 공유 이미지 일관성 위해 다크 고정) */
        :root[data-theme="light"] #bp-modal > div, :root[data-theme="light"] #tc-modal > div, :root[data-theme="light"] #tcp-modal > div { background:#ffffff !important; border-color:#cdd9ea !important; }
        :root[data-theme="light"] #bp-modal b, :root[data-theme="light"] #tc-modal b, :root[data-theme="light"] #tcp-modal b { color:#122036 !important; }
        :root[data-theme="light"] #bp-modal label { color:#5d6d84 !important; }
        :root[data-theme="light"] #tc-modal .tc-tab:not(.on) { background:#eef2f8; color:#31405a; border-color:#cdd9ea; }
        :root[data-theme="light"] .tc-card div[style*="font-weight:bold"] { color:#122036; }
        :root[data-theme="light"] #welcome-area .bh-role span { color:#8a97a8 !important; }
        .tc-tab { background:#132b4d; border:1px solid #233a5c; color:#eaf1fa; border-radius:99px; padding:5px 14px; cursor:pointer; font-size:13px; }
        .tc-tab.on { background:var(--p); border-color:var(--p); color:#fff; font-weight:bold; }
        .tc-tier { font-size:15px; font-weight:bold; color:var(--gold); border-bottom:1px solid #233a5c; padding-bottom:4px; margin:16px 0 8px; }
        .tc-card { display:flex; gap:10px; background:#0d1a30; border:1px solid #233a5c; border-radius:8px; padding:10px; margin-bottom:8px; }
        .tc-card img { width:40px; height:40px; border:1px solid #444; border-radius:5px; flex-shrink:0; }
        :root[data-theme="light"] .tc-card { background:#eef2f8; border-color:#dbe3ee; }
        :root[data-theme="light"] .tc-tier { border-bottom-color:#d5deea; }
        
        #footer { position: fixed; bottom: 0; width: 100%; background: rgba(10,10,12,0.98); border-top: 2px solid var(--p); padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; z-index: 1500; }
        #selected-summary { display: flex; justify-content: center; gap: 4px; }
        .summary-icon { width: 32px; height: 32px; border: 1px solid #444; border-radius: 4px; background: #000; }
        #build-code-box { background: #111; border: 1px dashed var(--gold); color: var(--gold); padding: 8px; border-radius: 4px; font-family: monospace; font-size: 13px; text-align: center; cursor: pointer; }
        
        .option-group { display: flex; gap: 12px; align-items: center; background: #222; padding: 6px 12px; border-radius: 6px; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        .footer-btn { flex: 1; background: var(--p); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .cap-row { display: flex; align-items: flex-start; gap: 15px; border-bottom: 1px solid #333; padding: 15px 0; }
        .cap-lv { color: var(--blue); font-size: 14px; font-weight: bold; width: 45px; flex-shrink: 0; }
        .cap-img { width: 60px; height: 60px; border: 2px solid var(--gold); border-radius: 8px; flex-shrink: 0; }
    /* 시작 화면 영웅 그리드 (역할군별) */
#welcome-area .bh-role { font-size:15px; font-weight:bold; color:var(--gold); border-bottom:1px solid #233a5c; padding-bottom:5px; margin:18px 0 10px; text-align:left; }
#welcome-area .bh-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; }
#welcome-area .bh-card { display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; padding:6px 2px; border-radius:8px; text-align:center; }
#welcome-area .bh-card:hover { background:#132b4d; }
#welcome-area .bh-card img { width:56px; height:56px; border-radius:50%; border:2px solid #233a5c; object-fit:cover; background:#0d1a30; }
#welcome-area .bh-card:hover img { border-color:var(--gold); }
#welcome-area .bh-name { font-size:11px; color:#ccc; line-height:1.25; }
:root[data-theme="light"] #welcome-area .bh-role { border-bottom-color:#d5deea; }
:root[data-theme="light"] #welcome-area .bh-card:hover { background:#e3ebf5; }
:root[data-theme="light"] #welcome-area .bh-card img { border-color:#cdd9ea; background:#dfe6f0; }
:root[data-theme="light"] #welcome-area .bh-name { color:#31405a; }
</style>
<style id="scrap-theme">
/* HotS Scrap 팔레트 — 원본 스타일 위에 겹쳐 쓴다 (허브와 통일) */
:root { --p:#4d9fff; --bg:#0b1526; --card:#101f38; --blue:#5aa8ff; --gold:#e8c268; --green:#4dbc92; }
#top-bar { background:#08101f; border-bottom:1px solid #233a5c; }
#header { background:#0e1c33; border-bottom:1px solid #233a5c; }
.search-box, .lang-btn, .option-group { background:#132b4d; }
#hero-list-dropdown { background:#101f38; }
.hero-item { border-bottom-color:#233a5c; }
#capture-area { background:transparent; }
#hero-stat-container { background:#101f38; border-color:#233a5c; }
.stat-item, .ability-item, #build-code-box { background:#0d1a30; }
#footer { background:rgba(8,16,31,0.98); }
.summary-icon { background:#0b1526; }
/* 라이트 테마 — 전역 바 토글(scrap.theme)이 data-theme 을 켠다 */
:root[data-theme="light"] { --p:#1758a8; --bg:#f3f6fb; --card:#ffffff; --blue:#1758a8; --gold:#a97e1f; --green:#1c7d4f; }
:root[data-theme="light"] body { color:#122036; }
:root[data-theme="light"] #top-bar { background:#e8eef7; border-bottom:1px solid #cdd9ea; }
:root[data-theme="light"] #top-bar a { color:#5d6d84; }
:root[data-theme="light"] #header { background:#eef2f8; border-bottom:1px solid #cdd9ea; }
:root[data-theme="light"] .search-box, :root[data-theme="light"] .lang-btn, :root[data-theme="light"] .option-group { background:#ffffff; color:#122036; }
:root[data-theme="light"] #hero-list-dropdown { background:#ffffff; }
:root[data-theme="light"] .hero-item { border-bottom-color:#dbe3ee; }
:root[data-theme="light"] #capture-area { background:transparent; }
:root[data-theme="light"] #hero-stat-container { background:#ffffff; border-color:#cdd9ea; }
:root[data-theme="light"] .stat-item, :root[data-theme="light"] .ability-item, :root[data-theme="light"] #build-code-box { background:#eef2f8; }
:root[data-theme="light"] .stat-value { color:#122036; }
:root[data-theme="light"] .stat-label { color:#5d6d84; }
:root[data-theme="light"] #footer { background:rgba(240,244,250,0.98); }
:root[data-theme="light"] .summary-icon { background:#e6ecf5; }
:root[data-theme="light"] #level-slider { background:#c6d2e2; }
:root[data-theme="light"] .tick { color:#8a97a8; }
:root[data-theme="light"] .ability-list { border-top-color:#cdd9ea; }
:root[data-theme="light"] .cap-row { border-bottom-color:#dbe3ee; }
</style>
</head>
<body data-scrap-back-bottom="190px">
    <div id="top-bar">
        <span style="display:flex; align-items:center; gap:12px;">
          <a href="./" title="빌드 홈으로" style="font-weight:bold; color:var(--p); font-size:12px; text-decoration:none;">⌂ 특성 빌드</a>
        <button type="button" onclick="openTierList()" style="margin-left:10px; background:#132b4d; border:1px solid #233a5c; color:#eaf1fa; border-radius:5px; padding:3px 10px; cursor:pointer; font-size:11px;">⚖ 특성 나열</button>
        </span>
        <span style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
          <span id="ch-note" style="font-size:11px; color:#8fa2bd;"></span>
          <button type="button" class="lang-btn ch-btn" id="ch-live" onclick="setChannel('live')" hidden>본 서버</button>
          <button type="button" class="lang-btn ch-btn" id="ch-ptr" onclick="setChannel('ptr')" hidden>테스트 서버</button>
          <button class="lang-btn" onclick="toggleLanguage()">KO / EN</button>
        </span>
    </div>

    <div id="header">
        <input type="text" id="hero-search" class="search-box" placeholder="영웅 검색 (초성 지원)..." onclick="showList()" oninput="handleSearch(this.value)">
        <div id="hero-list-dropdown"></div>
    </div>
    <div id="capture-area">
        <div id="welcome-area" style="padding:40px; text-align:center; color:#666;">영웅을 선택하세요. / Select a Hero.</div>
        <div id="hero-stat-container">
            <h2 id="hero-info-title" style="margin:0; font-size: 24px;"></h2>
            <div style="display:flex; align-items:center; gap:8px; margin: 10px 0;">
              <div id="level-display" style="color:var(--gold); font-weight:bold;">LV 1</div>
              <button type="button" title="레벨 -1" style="background:#132b4d;border:1px solid #233a5c;color:#eaf1fa;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;"
                onclick="var s=document.getElementById('level-slider');s.value=Math.max(1,parseInt(s.value)-1);updateLevel(s.value)">−</button>
              <button type="button" title="레벨 +1" style="background:#132b4d;border:1px solid #233a5c;color:#eaf1fa;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;"
                onclick="var s=document.getElementById('level-slider');s.value=Math.min(30,parseInt(s.value)+1);updateLevel(s.value)">+</button>
            </div>
            
            <div class="slider-wrapper">
                <input type="range" id="level-slider" min="1" max="30" value="1" step="1" oninput="updateLevel(this.value)">
                <div class="slider-ticks">
                    <span class="tick highlight" style="left: 0%;">1</span>
                    <span class="tick highlight" style="left: 10.34%;">4</span>
                    <span class="tick highlight" style="left: 20.68%;">7</span>
                    <span class="tick highlight" style="left: 31.03%;">10</span>
                    <span class="tick highlight" style="left: 41.37%;">13</span>
                    <span class="tick highlight" style="left: 51.72%;">16</span>
                    <span class="tick highlight" style="left: 65.51%;">20</span>
                    <span class="tick highlight" style="left: 100%;">30</span>
                </div>
            </div>

            <div class="stat-grid" id="stat-grid"></div>
            <div id="ability-container" class="ability-list"></div>
        </div>
        <div id="main-content"></div>
    </div>
    <div id="footer">
        <div id="selected-summary"></div>
        <div style="display:flex; gap:6px;">
            <input type="text" id="code-load-input" placeholder="[T3211224,Diablo] 코드 붙여넣기" style="flex:1; background:#132b4d; border:1px dashed #233a5c; color:#eaf1fa; border-radius:4px; padding:7px 10px; font-family:monospace; font-size:12px; outline:none;">
            <button type="button" onclick="loadBuildCode(document.getElementById('code-load-input').value)" style="background:#1758a8; border:none; color:#fff; border-radius:4px; padding:0 14px; cursor:pointer; font-size:12px; font-weight:bold;">불러오기</button>
        </div>
        <div id="build-code-box" onclick="copyBuildCode()">특성을 선택하세요.</div>
        <div class="option-group">
            <span style="font-size:12px; color:#aaa;">이름 <input type="color" id="name-color" value="#a333ff"></span>
            <span style="font-size:12px; color:#aaa;">테두리 <input type="color" id="border-color" value="#a333ff"></span>
            <button type="button" onclick="openBuildPreview()" style="background:#132b4d; border:1px solid #233a5c; color:#eaf1fa; border-radius:5px; padding:4px 12px; cursor:pointer; font-size:12px;">👁 미리보기</button>
            <button type="button" onclick="resetTalents()" title="선택한 특성을 모두 지운다" style="background:#3a1520; border:1px solid #6b2b3a; color:#e8a0a8; border-radius:5px; padding:4px 12px; cursor:pointer; font-size:12px;">🗑 초기화</button>
            <input type="range" min="12" max="20" value="14" oninput="updateFontSize(this.value)">
        </div>
        <div class="btn-group">
            <button class="footer-btn" onclick="takeScreenshot('save')">📸 저장</button>
            <button class="footer-btn" style="background:#27ae60;" onclick="takeScreenshot('copy')">📋 이미지 복사</button>
        </div>
    </div>
    <script>
        /* 영웅 데이터는 파일로 따로 둔다(data/builds/). 한 번에 받는 양을 줄이려고
           고른 판(본 서버/테스트 서버)과 고른 언어 하나만 받는다. */
        let dataKO = {}, dataEN = {}, heroList = [];
        let BUILD_INDEX = null, currentChannel = 'live';
        const DATA_DIR = '../data/builds/';
        const CH_LABEL = { live: '본 서버', ptr: '테스트 서버' };
        const _dataCache = {};

        function loadPart(ch, lang) {
            const key = ch + '.' + lang;
            if (!_dataCache[key]) {
                _dataCache[key] = fetch(DATA_DIR + key + '.json')
                    .then(r => { if (!r.ok) throw new Error(key + ' ' + r.status); return r.json(); });
            }
            return _dataCache[key];
        }

        async function ensureData(ch, lang) {
            const d = await loadPart(ch, lang);
            if (lang === 'ko') dataKO = d; else dataEN = d;
        }

        function markChannel() {
            const meta = (BUILD_INDEX && BUILD_INDEX.channels) || {};
            ['live', 'ptr'].forEach(function (c) {
                const b = document.getElementById('ch-' + c);
                if (!b) return;
                const m = meta[c];
                b.hidden = !m;
                b.classList.toggle('on', c === currentChannel);
                if (m) b.title = CH_LABEL[c] + ' ' + m.version + ' (' + m.date + ')';
            });
            const tag = document.getElementById('ch-note');
            const m = meta[currentChannel];
            if (tag && m) {
                const stale = currentChannel === 'ptr' && meta.live && meta.live.build > m.build;
                tag.textContent = CH_LABEL[currentChannel] + ' ' + m.version + ' · ' + m.date
                    + (stale ? ' (본 서버보다 오래된 빌드입니다. 새 테스트 서버 자료가 아직 없습니다)' : '');
                tag.style.color = stale ? '#e8a13a' : '';
            }
        }

        async function setChannel(ch) {
            if (!BUILD_INDEX || !BUILD_INDEX.channels[ch] || ch === currentChannel) return;
            try { await ensureData(ch, currentLang); } catch (e) { alert('데이터를 불러오지 못했습니다.'); return; }
            currentChannel = ch;
            try { localStorage.setItem('builds.channel', ch); } catch (e) {}
            markChannel();
            if (currentHeroId) { const saved = [...selectedTalents]; selectHero(currentHeroId); selectedTalents = saved; refreshTalentUI(); }
            const box = document.getElementById('hero-search');
            if (window.renderHeroGrid) window.renderHeroGrid(box ? box.value : '');
        }
        const imgBase = "https://sin0nis.github.io/images/abilitytalents/";
        let currentLang = 'ko', currentHeroId = null, currentLevel = 1, selectedTalents = [];

        async function toggleLanguage() {
            const nxt = (currentLang === 'ko') ? 'en' : 'ko';
            try { await ensureData(currentChannel, nxt); } catch (e) { alert('데이터를 불러오지 못했습니다.'); return; }
            currentLang = nxt;
            if(currentHeroId) { 
                const saved = [...selectedTalents];
                selectHero(currentHeroId); 
                selectedTalents = saved;
                refreshTalentUI();
            }
            handleSearch(document.getElementById("hero-search").value);
        }

        function getActiveData() { return currentLang === 'ko' ? dataKO : dataEN; }

        function getChosung(str) {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let res = ""; for(let i=0; i<str.length; i++) {
                let c = str.charCodeAt(i) - 44032;
                if(c >= 0 && c < 11172) res += cho[Math.floor(c/588)];
                else res += str.charAt(i);
            } return res;
        }
        function handleSearch(v) {
            const s = v.toLowerCase().replace(/\s/g, ""), choInput = getChosung(s);
            const fil = heroList.filter(h => {
                const n_ko = h.name_ko.toLowerCase().replace(/\s/g, "");
                const n_en = h.name_en.toLowerCase().replace(/\s/g, "");
                return n_ko.includes(s) || n_en.includes(s) || getChosung(n_ko).includes(choInput);
            }); renderList(fil);
        }
        function renderList(l) { document.getElementById("hero-list-dropdown").innerHTML = l.map(h => `<div class="hero-item" onclick="selectHero('${h.id}')">${currentLang==='ko'?h.name_ko:h.name_en}</div>`).join(""); }
        function showList() { document.getElementById("hero-list-dropdown").style.display = "block"; }
        function updateFontSize(v) { document.documentElement.style.setProperty('--fs', v + 'px'); }

        function processTooltip(t, lv) {
            if(!t) return ""; let p = t.replace(/<[^>]*>?/gm, "").replace(/\n/g, "<br>");
            p = p.replace(/(\d+(?:\.\d+)?)\s*~~(0\.\d+)~~/g, (m, b, s) => {
                const v = parseFloat(b) * Math.pow(1 + parseFloat(s), lv - 1);
                return "<strong>" + v.toFixed(1) + "</strong>(+" + (parseFloat(s)*100).toFixed(1) + "%)";
            }); return p.replace(/~~(0\.\d+)~~/g, (m, s) => "(+" + (parseFloat(s)*100).toFixed(1) + "%)");
        }

        function selectHero(id) {

            const lvs = Object.keys(hData.talents).filter(l => hData.talents[l].length > 0).sort((a,b) => parseInt(a.replace(/\D/g,"")) - parseInt(b.replace(/\D/g,"")));
            selectedTalents = new Array(lvs.length).fill(0);
            let h = ''; lvs.forEach((lv, i) => {
                h += `<div class="tier-row"><button type="button" class="lv-list-btn" title="${currentLang==='ko'?'이 레벨 특성 모두 보기':'Show all talents of this tier'}" onclick="openTierAt('${lv}')">${lv.replace(/\D/g,"")}</button><div style="display:flex;gap:4px;">`;
                hData.talents[lv].forEach((t, ti) => { h += `<img src="${imgBase}${t.icon}" class="t-icon t-row-${i}" onclick="toggleTalent(${i}, ${ti+1}, this)">`; });
                h += `</div><div class="t-info-display" id="desc-${i}" style="font-size:0.9em; color:#aaa;">${currentLang==='ko'?'클릭: 메인 → 보조(1개) · 재클릭: 해제':'Click: main → sub · Click again: clear'}</div></div>`;
            });
            document.getElementById("main-content").innerHTML = h; 
            renderStats(); renderAbilities(); updateBuildUI();
        }

        function toggleTalent(ti, tn, el) {
            if(selectedTalents[ti] == tn) selectedTalents[ti] = 0;

        function refreshTalentUI() {
            if(!currentHeroId) return;

            const lvs = Object.keys(hData.talents).filter(l => hData.talents[l].length > 0).sort((a,b) => parseInt(a.replace(/\D/g,"")) - parseInt(b.replace(/\D/g,"")));
            selectedTalents.forEach((tn, ti) => {

                } else { box.innerHTML = currentLang==='ko'?'클릭: 메인 → 보조(1개) · 재클릭: 해제':'Click: main → sub · Click again: clear'; }

        function updateBuildUI() {
            if(!currentHeroId) return;
            const hData = getActiveData()[currentHeroId];
            const lvs = Object.keys(hData.talents).filter(l => hData.talents[l].length > 0).sort((a,b) => parseInt(a.replace(/\D/g,"")) - parseInt(b.replace(/\D/g,"")));
            let summaryHTML = "";

        function updateLevel(lv) { 
            currentLevel = parseInt(lv); 
            // 증가율 계산 (가장 보편적인 4% 성장 기준)
            const totalInc = ((Math.pow(1.04, currentLevel - 1) - 1) * 100).toFixed(1);
            document.getElementById("level-display").innerHTML = `LV ${currentLevel} <span style="font-size:0.8em; color:#aaa; font-weight:normal;">(+$[totalInc]%)</span>`.replace("$[totalInc]", totalInc);
            
            if(currentHeroId) { renderStats(); renderAbilities(); refreshTalentUI(); } 
        }

        function renderStats() {
            const h = getActiveData()[currentHeroId];
            const calc = (b, s, lv) => (b * Math.pow(1 + (s || 0), lv - 1)).toFixed(0);
            const getGT = (s) => s > 0 ? `(+${(s*100).toFixed(1)}%)` : "";
            const energyMap = { "Mana": "마나", "Energy": "기력", "Fury": "분노", "Rage": "광기", "Essence": "정수", "Soul": "영혼", "Focus": "집중", "Brew": "취기" };

            let sArr = [];
            sArr.push({l: currentLang==='ko'?'생명력':'HP', v: calc(h.life.amount, h.life.scale, currentLevel), g: getGT(h.life.scale)});
            if(h.shield) sArr.push({l: currentLang==='ko'?'보호막':'Shield', v: calc(h.shield.amount, h.shield.scale, currentLevel), g: getGT(h.shield.scale)});
            if(h.energy && h.energy.type !== "None") {
                let eName = (currentLang==='ko' ? (energyMap[h.energy.type] || h.energy.type) : h.energy.type);
                let eScale = (h.energy.type === "Mana") ? 0.04 : 0;
                sArr.push({l: eName, v: calc(h.energy.amount, eScale, currentLevel), g: getGT(eScale)});
            }
            const w = h.weapons?.[0] || {damage:0, period:1, damageScale:0.04, range:0};
            const dmg = parseFloat(calc(w.damage, w.damageScale, currentLevel)), dps = (dmg / w.period).toFixed(1);
            sArr.push({ l: currentLang==='ko'?'공격력':'Attack', v: dmg + `<span class="dps-tag">(DPS: ${dps})</span>`, g: getGT(w.damageScale) });
            sArr.push({l: currentLang==='ko'?'공격 주기':'Period', v: w.period.toFixed(2) + "s", g: ""});
            sArr.push({l: currentLang==='ko'?'사거리':'Range', v: w.range.toFixed(1), g: ""});
            sArr.push({l: currentLang==='ko'?'피격 반지름':'Radius', v: h.radius.toFixed(2), g: ""});

            document.getElementById("stat-grid").innerHTML = sArr.map(s => `
                <div class="stat-item">
                    <div class="stat-label"><span>${s.l}</span> <span class="growth-tag">${s.g}</span></div>
                    <b class="stat-value">${s.v}</b>
                </div>`).join("");
        }

        function renderAbilities() {
            const h = getActiveData()[currentHeroId]; let html = "";
            const process = (list) => { if(!list) return; list.forEach(s => { html += `<div class="ability-item"><img src="${imgBase}${s.icon}" class="ability-icon"><div style="flex:1"><b style="color:var(--blue)">[${s.abilityType}] ${s.name}</b><div class="tdesc" style="font-size:0.95em;">${processTooltip(s.fullTooltip||s.description, currentLevel)}</div></div></div>`; }); };
            ["basic", "heroic", "trait", "mount", "activable"].forEach(k => process(h.abilities[k]));
            document.getElementById("ability-container").innerHTML = html;
        }

        async function takeScreenshot(mode) {
            if (!currentHeroId) return;
            const nameColor = document.getElementById("name-color").value, borderColor = document.getElementById("border-color").value;
            const tempDiv = document.createElement('div');
            tempDiv.style.cssText = `position:absolute; left:-9999px; top:0; width:500px; background:#0b0b0d; padding:25px; border:3px solid ${borderColor}; color:white; border-radius:12px;`;
            let innerHTML = `<div style="text-align:center; margin-bottom:25px;"><div style="font-size:36px; font-weight:bold; color:${nameColor};">${getActiveData()[currentHeroId].name}</div></div>`;
            const lvs = Object.keys(getActiveData()[currentHeroId].talents).filter(l => getActiveData()[currentHeroId].talents[l].length > 0).sort((a,b) => parseInt(a.replace(/\D/g,"")) - parseInt(b.replace(/\D/g,"")));
            selectedTalents.forEach((tn, ti) => { 
                if (tn > 0) { 
                    const t = getActiveData()[currentHeroId].talents[lvs[ti]][tn-1]; 
                    innerHTML += `<div class="cap-row"><div class="cap-lv">${lvs[ti].replace(/\D/g,"")}Lv</div><img src="${imgBase}${t.icon}" class="cap-img"><div style="flex:1; padding-left:15px;"><div style="font-size:18px; font-weight:bold;">${t.name}</div><div style="opacity:0.78; font-size:14px;">${processTooltip(t.fullTooltip, currentLevel)}</div></div></div>`; 
                } 
            });
            tempDiv.innerHTML = innerHTML; document.body.appendChild(tempDiv);
            try {
                const canvas = await html2canvas(tempDiv, { useCORS:true, backgroundColor:"#0b0b0d", scale: 2 });
                if (mode === 'save') {
                    const hd = getActiveData()[currentHeroId];
                    const igCode = `[T${selectedTalents.join("")},${hd.hyperlinkId}]`;
                    const link = document.createElement('a');
                    link.download = `hots_scrap_build_${window.DATA_BUILD || '97650'}_${hd.name}_${igCode}.png`;
                    link.href = canvas.toDataURL(); link.click();
                } else {
                    canvas.toBlob(async blob => {
                        try {
                            if (navigator.clipboard && window.ClipboardItem) {
                                const item = new ClipboardItem({ "image/png": blob });
                                await navigator.clipboard.write([item]); alert(currentLang==='ko'?"복사되었습니다!":"Copied!");
                            } else { throw new Error(); }
                        } catch (e) { alert(currentLang==='ko'?"보안 문제로 차단되었습니다. [저장]을 이용해 주세요.":"Blocked by security."); }
                    }, "image/png");
                }
            } catch (err) { alert("Error"); } finally { document.body.removeChild(tempDiv); }
        }
    </script>

<script>
/* 시작 화면: 위키 메인처럼 역할군별 초상화 그리드 — 검색과 연동 (2026-08) */
(function () {
  var ROLE_ORDER = ['전사', '투사', '근접 암살자', '원거리 암살자', '치유사', '지원가'];
  var PBASE = 'https://sin0nis.github.io/images/heroportraits/';
  function heroData(id) { try { return getActiveData()[id] || {}; } catch (e) { return {}; } }
  function roleOf(id) { var d = heroData(id); return d.expandedRole || (d.roles && d.roles[0]) || '기타'; }
  function portraitOf(id) { var p = heroData(id).portraits || {}; return p.heroSelect || p.draftScreen || p.loading || ''; }
  window.renderHeroGrid = function (filter) {
    var wrap = document.getElementById('welcome-area');
    if (!wrap) return;
    var f = (filter || '').toLowerCase().replace(/\s/g, '');
    var fCho = f ? getChosung(f) : '';
    var groups = {};
    heroList.forEach(function (h) {
      if (f) {
        var ko = h.name_ko.toLowerCase().replace(/\s/g, ''), en = h.name_en.toLowerCase().replace(/\s/g, '');
        if (!(ko.indexOf(f) > -1 || en.indexOf(f) > -1 || getChosung(ko).indexOf(fCho) > -1)) return;
      }
      var r = roleOf(h.id);
      (groups[r] = groups[r] || []).push(h);
    });
    var order = ROLE_ORDER.concat(Object.keys(groups).filter(function (r) { return ROLE_ORDER.indexOf(r) < 0; }));
    var html = '';
    order.forEach(function (r) {
      var list = groups[r];
      if (!list || !list.length) return;
      list.sort(function (a, b) { return a.name_ko.localeCompare(b.name_ko, 'ko'); });
      html += '<div class="bh-role">' + r + ' <span style="font-weight:normal;font-size:11px;color:#888;">' + list.length + '</span></div><div class="bh-grid">';
      list.forEach(function (h) {
        var img = portraitOf(h.id);
        html += '<div class="bh-card" onclick="selectHero(\'' + h.id + '\')" title="' + h.name_ko + '">'
          + (img ? '<img loading="lazy" src="' + PBASE + img + '" alt="" onerror="this.style.visibility=\'hidden\'">'
                 : '<div style="width:56px;height:56px;border-radius:50%;background:#222;"></div>')
          + '<div class="bh-name">' + h.name_ko + '</div></div>';
      });
      html += '</div>';
    });
    wrap.style.padding = '4px 10px 60px';
    wrap.style.textAlign = 'left';
    wrap.innerHTML = html || '<div style="padding:40px;text-align:center;color:#888;">검색 결과가 없습니다</div>';
  };
  var _hs = window.handleSearch;
  window.handleSearch = function (v) { _hs(v); renderHeroGrid(v); };
  window.__bootGrid = function () { renderHeroGrid(''); };
})();
</script>

/* ── 보조(상황별) 특성 + 특성 나열 — 원본 함수를 래핑해 확장한다 (2026-08) ── */
var subTalents = [];

/* 저장 카드 배경·폰트 색 — 프리셋: 다크/라이트 기본 */
var CARD_DARK = { bg: '#0b0b0d', font: '#ffffff' };
var CARD_LIGHT = { bg: '#f3f6fb', font: '#122036' };
var cardBg = CARD_DARK.bg, cardFont = CARD_DARK.font;
try {
  cardBg = localStorage.getItem('builds.cardBg') || cardBg;
  cardFont = localStorage.getItem('builds.cardFont') || cardFont;
} catch (e) {}
function saveCardTheme() { try { localStorage.setItem('builds.cardBg', cardBg); localStorage.setItem('builds.cardFont', cardFont); } catch (e) {} }
function syncCardPickers() {
  ['bp-bg-color', 'tcp-bg-color'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = cardBg; });
  ['bp-font-color', 'tcp-font-color'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = cardFont; });
}
function rerenderOpenPreviews() {
  if (document.getElementById('bp-modal').style.display === 'block') bpRenderCard();
  if (document.getElementById('tcp-modal').style.display === 'block') openTcPreview();
}
function setCardTheme(mode) {
  var p = mode === 'light' ? CARD_LIGHT : CARD_DARK;
  cardBg = p.bg; cardFont = p.font;
  saveCardTheme(); syncCardPickers(); rerenderOpenPreviews();
}
function onCardColorInput(kind, v) {
  if (kind === 'bg') cardBg = v; else cardFont = v;
  saveCardTheme(); syncCardPickers(); rerenderOpenPreviews();
}

function tierLevels(hData) {
  return Object.keys(hData.talents).filter(function (l) { return hData.talents[l].length > 0; })
    .sort(function (a, b) { return parseInt(a.replace(/\D/g, "")) - parseInt(b.replace(/\D/g, "")); });
}

/* 영웅 선택 시 보조 상태 초기화 */
(function () {
  var _sh = window.selectHero;
  window.selectHero = function (id) {
    _sh(id);
    subTalents = (selectedTalents || []).map(function () { return []; });
  };
})();

/* 클릭 모델: 첫 클릭 = 메인, 다음 클릭 = 상황별(보조), 보조 클릭 = 메인과 교체, 메인 클릭 = 해제 */
(function () {
  window.toggleTalent = function (ti, tn, el) {
    var main = selectedTalents[ti];
    if (!subTalents[ti]) subTalents[ti] = [];
    var subs = subTalents[ti];
    if (main === tn) {
      selectedTalents[ti] = 0;                       // 메인 다시 클릭 → 해제 (보조는 유지)
    } else if (subs.indexOf(tn) > -1) {
      subTalents[ti] = subs.filter(function (x) { return x !== tn; });   // 보조 재클릭 → 해제
    } else if (main === 0) {
      selectedTalents[ti] = tn;                      // 첫 선택 → 메인
    } else {
      subTalents[ti] = [tn];                         // 메인이 있으면 → 상황별 (1개만, 새로 찍으면 교체)
    }
    refreshTalentUI();
  };
})();

/* 선택 UI 갱신 뒤 보조 표시도 함께 */
(function () {
  var _rtu = window.refreshTalentUI;
  window.refreshTalentUI = function () { _rtu(); applySubClasses(); };
})();

function applySubClasses() {
  (subTalents || []).forEach(function (subs, ti) {
    document.querySelectorAll('.t-row-' + ti).forEach(function (img, idx) {
      img.classList.toggle('sub', subs.indexOf(idx + 1) > -1 && selectedTalents[ti] !== idx + 1);
    });
  });
}

function toggleSubTalent(ti, tn) {
  /* 우클릭·길게 누르기 = 지우개: 메인이면 메인 해제, 보조면 보조 제거 */
  if (!subTalents[ti]) subTalents[ti] = [];
  if (selectedTalents[ti] === tn) { selectedTalents[ti] = 0; refreshTalentUI(); return; }
  var i = subTalents[ti].indexOf(tn);
  if (i > -1) { subTalents[ti].splice(i, 1); refreshTalentUI(); }
}

/* 보조 토글 — PC 우클릭 + 모바일 길게 누르기(iOS 포함). 델리게이션이라 다시 그려도 산다 */
function subToggleFromEl(el) {
  var rowCls = null;
  el.classList.forEach(function (c) { if (/^t-row-\d+$/.test(c)) rowCls = c; });
  if (!rowCls) return;
  var ti = parseInt(rowCls.slice(6), 10);
  var icons = Array.prototype.slice.call(document.querySelectorAll('.' + rowCls));
  toggleSubTalent(ti, icons.indexOf(el) + 1);
}
document.addEventListener('contextmenu', function (e) {
  var el = e.target.closest ? e.target.closest('.t-icon') : null;
  if (!el) return;
  e.preventDefault();
  subToggleFromEl(el);
});
var lpTimer = null, lpFired = false;
document.addEventListener('touchstart', function (e) {
  var el = e.target.closest ? e.target.closest('.t-icon') : null;
  if (!el) return;
  lpFired = false;
  lpTimer = setTimeout(function () {
    lpFired = true;
    subToggleFromEl(el);
    if (navigator.vibrate) navigator.vibrate(30);
  }, 500);
}, { passive: true });
document.addEventListener('touchmove', function () { clearTimeout(lpTimer); }, { passive: true });
document.addEventListener('touchend', function (e) {
  clearTimeout(lpTimer);
  if (lpFired) { e.preventDefault(); lpFired = false; } // 길게 눌렀으면 클릭(메인 선택)으로 이어지지 않게
}, { passive: false });

/* 선택 초기화 — 메인·보조 전부 비우고 다시 고르기 */
function resetTalents() {
  if (!currentHeroId) return;
  selectedTalents = selectedTalents.map(function () { return 0; });
  subTalents = (subTalents || []).map(function () { return []; });
  refreshTalentUI();
}

/* ── 저장 카드 공용 빌더 — 메인 줄 + ↳ 상황별 줄 ── */
function buildCardInner(nameColor) {
  var hData = getActiveData()[currentHeroId];
  var lvs = tierLevels(hData);
  var html = '<div style="text-align:center; margin-bottom:25px;"><div id="bp-hero-name" style="font-size:36px; font-weight:bold; color:' + nameColor + ';">' + hData.name + '</div></div>';
  selectedTalents.forEach(function (tn, ti) {
    var subs = (subTalents[ti] || []).filter(function (x) { return x !== tn; });
    var sub = subs.length ? hData.talents[lvs[ti]][subs[0] - 1] : null;
    var lvLabel = lvs[ti].replace(/\D/g, "") + 'Lv';
    if (tn === 0 && !sub) return;
    var t = tn > 0 ? hData.talents[lvs[ti]][tn - 1] : null;
    var mainIcon = t ? '<img src="' + imgBase + t.icon + '" class="cap-img">'
      : (sub ? '<img src="' + imgBase + sub.icon + '" class="cap-img" style="border:2px dashed #4d9fff;">' : '');
    var text = '';
    if (t) {
      text += '<div style="font-size:18px; font-weight:bold;">' + t.name + '</div><div style="opacity:0.78; font-size:14px;">' + processTooltip(t.fullTooltip, currentLevel) + '</div>';
    } else if (sub) {
      text += '<div style="font-size:18px; font-weight:bold; color:#9fc6ff;">' + sub.name + '</div><div style="opacity:0.78; font-size:14px;">' + processTooltip(sub.fullTooltip, currentLevel) + '</div>';
    }
    /* 보조는 오른쪽 별도 칸 — 아이콘 + 이름만 */
    var subCol = (t && sub)
      ? '<div style="width:88px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px; padding-left:8px; border-left:1px dashed #4d9fff55;"><img src="' + imgBase + sub.icon + '" style="width:34px; height:34px; border:1px dashed #4d9fff; border-radius:5px;"><span style="font-size:11px; color:#9fc6ff; text-align:center; line-height:1.3;">' + sub.name + '</span></div>'
      : '';
    html += '<div class="cap-row"><div class="cap-lv">' + lvLabel + '</div>' + mainIcon + '<div style="flex:1; padding-left:15px;">' + text + '</div>' + subCol + '</div>';
  });
  return html;
}

/* 저장·복사 — 보조 포함 카드로 캡처 (원본을 대체) */
window.takeScreenshot = async function (mode) {
  if (!currentHeroId) return;
  var nameColor = document.getElementById('name-color').value, borderColor = document.getElementById('border-color').value;
  var tempDiv = document.createElement('div');
  tempDiv.style.cssText = 'position:absolute; left:-9999px; top:0; width:500px; background:' + cardBg + '; padding:25px; border:3px solid ' + borderColor + '; color:' + cardFont + '; border-radius:12px;';
  tempDiv.innerHTML = buildCardInner(nameColor);
  document.body.appendChild(tempDiv);
  try {
    var canvas = await html2canvas(tempDiv, { useCORS: true, backgroundColor: cardBg, scale: 2 });
    if (mode === 'save') {
      var hd = getActiveData()[currentHeroId];
      var igCode = '[T' + selectedTalents.join('') + ',' + hd.hyperlinkId + ']';
      var link = document.createElement('a');
      link.download = 'hots_scrap_build_' + (window.DATA_BUILD || '97650') + '_' + hd.name + '_' + igCode + '.png';
      link.href = canvas.toDataURL(); link.click();
    } else {
      canvas.toBlob(async function (blob) {
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            alert(currentLang === 'ko' ? '복사되었습니다!' : 'Copied!');
          } else { throw new Error(); }
        } catch (e) { alert(currentLang === 'ko' ? '보안 문제로 차단되었습니다. [저장]을 이용해 주세요.' : 'Blocked by security.'); }
      }, 'image/png');
    }
  } catch (err) { alert('Error'); } finally { document.body.removeChild(tempDiv); }
};

/* 미리보기도 공용 빌더 사용 (보조 포함) */
window.bpRenderCard = function () {
  if (!currentHeroId) return;
  var borderColor = document.getElementById('border-color').value;
  var card = document.getElementById('bp-card');
  card.style.cssText = 'width:500px; background:' + cardBg + '; padding:25px; border:3px solid ' + borderColor + '; color:' + cardFont + '; border-radius:12px;';
  card.innerHTML = buildCardInner(document.getElementById('name-color').value);
  var wrap = document.getElementById('bp-wrap');
  var avail = wrap.clientWidth, w = 556;
  card.style.transformOrigin = 'top left';
  if (avail > 0 && avail < w) {
    card.style.transform = 'scale(' + (avail / w) + ')';
    requestAnimationFrame(function () { wrap.style.height = (card.offsetHeight * avail / w) + 'px'; });
  } else { card.style.transform = ''; wrap.style.height = ''; }
};

/* ── 특성 나열 모드 — 빌드 선택과 무관, 레벨 탭으로 전체 툴팁 나열 ── */
var tcLevel = 'all';
function openTierList() {
  if (!currentHeroId) { alert(currentLang === 'ko' ? '영웅을 먼저 선택하세요.' : 'Select a hero first.'); return; }
  tcLevel = 'all';
  document.getElementById('tc-modal').style.display = 'block';
  tcRender();
}
function closeTierList() { document.getElementById('tc-modal').style.display = 'none'; }
function openTcPreview() {
  if (!currentHeroId) return;
  document.getElementById('tcp-modal').style.display = 'block';
  syncCardPickers();
  var card = document.getElementById('tcp-card');
  card.style.cssText = 'width:500px; background:' + cardBg + '; padding:25px; border:3px solid #233a5c; color:' + cardFont + '; border-radius:12px;';
  card.innerHTML = tcCardInner();
  var wrap = document.getElementById('tcp-wrap');
  var avail = wrap.clientWidth, w = 556;
  card.style.transformOrigin = 'top left';
  if (avail > 0 && avail < w) {
    card.style.transform = 'scale(' + (avail / w) + ')';
    requestAnimationFrame(function () { wrap.style.height = (card.offsetHeight * avail / w) + 'px'; });
  } else { card.style.transform = ''; wrap.style.height = ''; }
}
/* 인게임 특성 코드 로드 — [T3211224,Diablo] 형태를 그대로 찍는다 */
function loadBuildCode(raw) {
  var m = /\[?\s*T(\d+)\s*,\s*([A-Za-z0-9.]+)\s*\]?/.exec((raw || '').trim());
  if (!m) { alert(currentLang === 'ko' ? '코드 형식이 아닙니다. 예: [T3211224,Diablo]' : 'Invalid code. e.g. [T3211224,Diablo]'); return false; }
  var digits = m[1], want = m[2].toLowerCase();
  var entry = null;
  heroList.forEach(function (h) {
    if (entry) return;
    var hd = getActiveData()[h.id] || {};
    var cand = [h.id, h.hId, hd.hyperlinkId, h.name_en].filter(Boolean).map(function (s) { return String(s).toLowerCase(); });
    if (cand.indexOf(want) > -1) entry = h;
  });
  if (!entry) { alert((currentLang === 'ko' ? '영웅을 찾을 수 없습니다: ' : 'Hero not found: ') + m[2]); return false; }
  selectHero(entry.id);
  var hData = getActiveData()[entry.id];
  var lvs = tierLevels(hData);
  for (var i = 0; i < lvs.length; i++) {
    var d = i < digits.length ? parseInt(digits.charAt(i), 10) : 0;
    selectedTalents[i] = (d >= 0 && d <= hData.talents[lvs[i]].length) ? d : 0;
  }
  refreshTalentUI();
  var inp = document.getElementById('code-load-input');
  if (inp) inp.value = '';
  return true;
}
/* 영웅 검색창에 코드를 붙여넣어도 바로 로드된다 */
(function () {
  var _hs = window.handleSearch;
  window.handleSearch = function (v) {
    if (/\[?\s*T\d+\s*,/.test(v || '')) {
      if (loadBuildCode(v)) { var s = document.getElementById('hero-search'); if (s) s.value = ''; return; }
    }
    _hs(v);
  };
})();
document.getElementById('code-load-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') loadBuildCode(this.value);
});
/* URL 로 공유: ?b=[T3211224,Diablo] 또는 ?hero=Diablo — 자료가 온 뒤에 실행한다 */
window.__bootQuery = function () {
  try {
    var q = new URLSearchParams(location.search);
    var b = q.get('b') || q.get('code');
    if (b) { loadBuildCode(b); return; }
    var hero = q.get('hero');
    if (hero) loadBuildCode('T0000000,' + hero);
  } catch (e) {}
};

function closeTcPreview() { document.getElementById('tcp-modal').style.display = 'none'; }
function openTierAt(lv) {
  if (!currentHeroId) return;
  tcLevel = lv;
  document.getElementById('tc-modal').style.display = 'block';
  tcRender();
}
function tcRender() {
  var hData = getActiveData()[currentHeroId];
  var lvs = tierLevels(hData);
  document.getElementById('tc-title').textContent = hData.name + (currentLang === 'ko' ? ' — 특성 나열' : ' — Talents');
  var tabs = '<button class="tc-tab' + (tcLevel === 'all' ? ' on' : '') + '" onclick="tcLevel=\'all\';tcRender()">' + (currentLang === 'ko' ? '전체' : 'All') + '</button>';
  lvs.forEach(function (lv) {
    var n = lv.replace(/\D/g, '');
    tabs += '<button class="tc-tab' + (tcLevel === lv ? ' on' : '') + '" onclick="tcLevel=\'' + lv + '\';tcRender()">' + n + '</button>';
  });
  document.getElementById('tc-tabs').innerHTML = tabs;
  var body = '';
  lvs.forEach(function (lv, ti) {
    if (tcLevel !== 'all' && tcLevel !== lv) return;
    body += '<div class="tc-tier">' + lv.replace(/\D/g, '') + (currentLang === 'ko' ? '레벨' : ' Lv') + '</div>';
    hData.talents[lv].forEach(function (t, idx) {
      var mark = selectedTalents[ti] === idx + 1 ? ' <span style="color:var(--gold); font-size:11px;">● ' + (currentLang === 'ko' ? '메인' : 'main') + '</span>'
        : ((subTalents[ti] || []).indexOf(idx + 1) > -1 ? ' <span style="color:#4d9fff; font-size:11px;">◐ ' + (currentLang === 'ko' ? '보조' : 'sub') + '</span>' : '');
      body += '<div class="tc-card"><img src="' + imgBase + t.icon + '"><div style="flex:1;"><div style="font-weight:bold; font-size:14px;">' + t.name + mark + '</div><div class="tcd" style="font-size:13px; margin-top:3px; line-height:1.5;">' + processTooltip(t.fullTooltip, currentLevel) + '</div></div></div>';
    });
  });
  document.getElementById('tc-body').innerHTML = body;
}

/* 나열 카드 공용 빌더 — 미리보기와 캡처가 같은 마크업을 쓴다 */
function tcCardInner() {
  var hData = getActiveData()[currentHeroId];
  var lvs = tierLevels(hData);
  var isAll = tcLevel === 'all';
  var lvNum = isAll ? '' : tcLevel.replace(/\D/g, '');
  var title = hData.name + ' — ' + (isAll ? (currentLang === 'ko' ? '특성 전체' : 'All Talents') : lvNum + (currentLang === 'ko' ? '레벨 특성' : 'Lv Talents'));
  var html = '<div style="text-align:center; margin-bottom:18px; font-size:26px; font-weight:bold; color:#e8c268;">' + title + '</div>';
  lvs.forEach(function (lv) {
    if (!isAll && lv !== tcLevel) return;
    if (isAll) html += '<div style="color:#4d9fff; font-weight:bold; font-size:16px; margin:14px 0 4px;">' + lv.replace(/\D/g, '') + (currentLang === 'ko' ? '레벨' : ' Lv') + '</div>';
    hData.talents[lv].forEach(function (t) {
      html += '<div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #222;"><img src="' + imgBase + t.icon + '" style="width:44px; height:44px; border:1px solid #444; border-radius:6px; flex-shrink:0;"><div style="flex:1;"><div style="font-size:16px; font-weight:bold;">' + t.name + '</div><div style="color:#bbb; font-size:13px; margin-top:2px; line-height:1.5;">' + processTooltip(t.fullTooltip, currentLevel) + '</div></div></div>';
    });
  });
  return html;
}

/* 나열 화면을 이미지로 — 빌드 카드 저장과 별개 */
async function tcCapture(mode) {
  if (!currentHeroId) return;
  var hData = getActiveData()[currentHeroId];
  var isAll = tcLevel === 'all';
  var lvNum = isAll ? '' : tcLevel.replace(/\D/g, '');
  var tempDiv = document.createElement('div');
  tempDiv.style.cssText = 'position:absolute; left:-9999px; top:0; width:500px; background:' + cardBg + '; padding:25px; border:3px solid #233a5c; color:' + cardFont + '; border-radius:12px;';
  tempDiv.innerHTML = tcCardInner();
  document.body.appendChild(tempDiv);
  try {
    var canvas = await html2canvas(tempDiv, { useCORS: true, backgroundColor: cardBg, scale: 2 });
    if (mode === 'save') {
      var link = document.createElement('a');
      link.download = 'hots_scrap_talents_' + (window.DATA_BUILD || '97650') + '_' + hData.name + '_' + (isAll ? 'all' : lvNum + 'Lv') + '.png';
      link.href = canvas.toDataURL(); link.click();
    } else {
      canvas.toBlob(async function (blob) {
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            alert(currentLang === 'ko' ? '복사되었습니다!' : 'Copied!');
          } else { throw new Error(); }
        } catch (e) { alert(currentLang === 'ko' ? '보안 문제로 차단되었습니다. [저장]을 이용해 주세요.' : 'Blocked by security.'); }
      }, 'image/png');
    }
  } catch (err) { alert('Error'); } finally { document.body.removeChild(tempDiv); }
}

/* 시동: 목록·판 정보(6KB) → 고른 판·언어 하나(약 1.5MB) */
(async function boot() {
  const welcome = document.getElementById('welcome-area');
  if (welcome) welcome.textContent = '데이터를 불러오는 중…';
  try {
    BUILD_INDEX = await fetch(DATA_DIR + 'index.json').then(r => { if (!r.ok) throw new Error('index ' + r.status); return r.json(); });
    heroList = BUILD_INDEX.heroes || [];
    let want = 'live';
    try { want = localStorage.getItem('builds.channel') || 'live'; } catch (e) {}
    currentChannel = BUILD_INDEX.channels[want] ? want : 'live';
    await ensureData(currentChannel, currentLang);
    markChannel();
    if (window.__bootGrid) window.__bootGrid();
    if (window.__bootQuery) window.__bootQuery();
  } catch (e) {
    console.error(e);
    if (welcome) welcome.innerHTML = '데이터를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.';
  }
})();
</script>
<!-- 나열 카드 미리보기 -->
<div id="tcp-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:3100; overflow:auto; padding:16px;" onclick="if(event.target===this)closeTcPreview()">
  <div style="max-width:620px; margin:20px auto; background:#101f38; border:1px solid #233a5c; border-radius:12px; padding:14px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <b style="font-size:14px; color:#eaf1fa;">저장 이미지 미리보기</b>
      <button type="button" onclick="tcCapture('save')" style="background:#1758a8; border:none; color:#fff; border-radius:5px; padding:6px 12px; cursor:pointer; font-size:12px; font-weight:bold;">📸 저장</button>
      <button type="button" onclick="tcCapture('copy')" style="background:#1c7d4f; border:none; color:#fff; border-radius:5px; padding:6px 12px; cursor:pointer; font-size:12px; font-weight:bold;">📋 복사</button>
      <button type="button" onclick="closeTcPreview()" class="x-btn">✕</button>
    </div>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:#aaa;">배경 <input type="color" id="tcp-bg-color" oninput="onCardColorInput('bg', this.value)" style="width:44px; height:26px;"></label>
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:#aaa;">폰트 <input type="color" id="tcp-font-color" oninput="onCardColorInput('font', this.value)" style="width:44px; height:26px;"></label>
      <button type="button" onclick="setCardTheme('dark')" style="background:#0b0b0d; border:1px solid #445; color:#eee; border-radius:5px; padding:5px 10px; cursor:pointer; font-size:11px;">☾ Dark</button>
      <button type="button" onclick="setCardTheme('light')" style="background:#f3f6fb; border:1px solid #cdd9ea; color:#122036; border-radius:5px; padding:5px 10px; cursor:pointer; font-size:11px;">☀ Light</button>
    </div>
    <div id="tcp-wrap" style="overflow:hidden;"><div id="tcp-card"></div></div>
  </div>
</div>
</body>
