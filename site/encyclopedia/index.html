<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>영웅 도감 (위키 번역) · HotS Scrap</title>
<meta name="description" content="히어로즈 오브 더 스톰 영웅·기술·특성 도감 — HotS wiki 를 옮겨 정리">
<meta property="og:site_name" content="HotS Scrap">
<meta property="og:title" content="영웅 도감 (위키 번역) · HotS Scrap">
<meta property="og:description" content="히어로즈 오브 더 스톰 영웅·기술·특성 도감 — HotS wiki 를 옮겨 정리">
<link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
<!-- 범위 그림은 도감·범위 구경과 **같은 파일**이 그린다(다이얼 셋이 따라온다) -->
<script src="../shared/shape.js"></script>
<style>
:root {
  --p:#a333ff; --bg:#0b0b0d; --card:#16161a; --card2:#1c1c22; --blue:#00d4ff;
  --gold:#ffd700; --green:#3ddc84; --red:#ff5f5f; --gray:#8a8a95; --fs:14px;
  --q:#4aa3ff; --w:#ffb84a; --e:#4aff8f; --heroic:#ffd700; --trait:#c46bff; --z:#8a8a95; --active:#ff7b7b;
  /* 범위 그림(shared/shape.js)이 쓰는 색 — 적·아군·둘 다, 그리고 선·글자 */
  --foe:#ff7b6b; --ally:#5aa8ff; --both:#c79cf0; --self:#4fd1b5; --wiki:#c79cf0; --warn:#e0875b;
  --fg:#eaf1fa; --dim:#8fa2bd; --line:#233a5c; --line2:#2f4a72;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:#eee; font-family:"Malgun Gothic",-apple-system,sans-serif; font-size:var(--fs); }
a { color:var(--blue); }
#top-bar { background:#000; padding:8px 14px; border-bottom:1px solid #2a2a2e; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:500; }
#top-bar .title { font-weight:bold; color:var(--p); }
#top-bar .meta { color:#777; font-size:11px; }
.lang-btn, .set-btn { background:#222; color:#fff; border:1px solid var(--p); padding:5px 12px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:bold; margin-left:6px; }
  /* 손가락으로도 쓰는 기기(any-pointer:coarse)에서 누를 크기를 44px 로.
     ::after 띠로 넓히면 단추가 줄바꿈될 때 윗줄 띠가 아랫줄 단추를 덮어 엉뚱한 것이 눌린다.
     min-height 로 요소 자체를 키운다. */
  @media (any-pointer:coarse) {
    .lang-btn, .set-btn, .filter-chip { min-height:44px; display:inline-flex; align-items:center; }
  }

#layout { display:flex; min-height:calc(100vh - 42px); }
#sidebar { width:280px; flex-shrink:0; background:#131316; border-right:1px solid #2a2a2e; padding:12px; position:sticky; top:42px; height:calc(100vh - 42px); overflow-y:auto; }
.search-box { width:100%; padding:10px; background:#222; color:white; border:1px solid var(--p); border-radius:6px; font-size:14px; outline:none; margin-bottom:8px; }
.filter-row { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
.filter-chip { background:#222; border:1px solid #333; color:#aaa; padding:3px 8px; border-radius:12px; font-size:11px; cursor:pointer; }
.filter-chip.active { background:var(--p); color:#fff; border-color:var(--p); }
.hero-count { color:#666; font-size:11px; margin-bottom:6px; }
  /* 검색어가 걸린 자리 색 — 라이트/다크 양쪽에서 읽히게 따로 잡는다
     (금색 --gold 는 흰 바탕에서 3.7:1 이라 본문 기준 4.5:1 에 못 미친다) */
  :root { --hit: #8a6414; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hit: #f0c46a; } }
  :root[data-theme="dark"] { --hit: #f0c46a; }
.search-row { display:flex; gap:6px; align-items:stretch; margin-bottom:8px; }
.search-row .search-box { flex:1 1 auto; min-width:0; margin-bottom:0; }
.icon-btn { flex:0 0 auto; width:36px; border:1px solid var(--p); border-radius:6px;
            background:transparent; color:inherit; cursor:pointer; font-size:17px; line-height:1; }
.icon-btn:hover { background:rgba(127,127,127,.15); }
.search-show { width:100%; padding:7px; margin-bottom:8px; border:1px dashed var(--p); border-radius:6px;
               background:transparent; color:inherit; opacity:.75; cursor:pointer; font-size:12px; }
.search-show:hover { opacity:1; }
.search-show kbd { border:1px solid currentColor; border-radius:3px; padding:0 4px; font-size:11px; opacity:.8; }
#hero-list .hero-item mark { background:transparent; color:var(--hit); font-weight:700; }
#hero-list .hero-item.sel { background:rgba(127,127,127,.18); }
.hero-item { padding:8px 10px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.hero-item:hover { background:#222; }
.hero-item.active { background:var(--p); color:#fff; }
.hero-item .r { font-size:10px; color:#888; }
.hero-item.active .r { color:#eee; }

#main { flex:1; padding:16px 22px 60px; max-width:980px; }
#welcome { padding:60px 20px; text-align:center; color:#666; }

.settings-panel { position:fixed; top:50px; right:12px; background:#1c1c22; border:1px solid var(--p); border-radius:8px; padding:14px; width:260px; z-index:900; display:none; box-shadow:0 6px 24px rgba(0,0,0,0.5); }
.settings-panel h4 { margin:0 0 8px; color:var(--gold); font-size:13px; }
.settings-panel label { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.5px; color:#ddd; cursor:pointer; }
.settings-panel input[type=checkbox] { accent-color: var(--p); width:15px; height:15px; }
.settings-panel .hint { color:#777; font-size:10.5px; margin-top:8px; line-height:1.4; }

.hero-header { display:flex; gap:16px; align-items:flex-start; margin-bottom:16px; }
.portrait-img { width:96px; height:96px; border-radius:50%; border:2px solid var(--p); object-fit:cover; background:#000; flex-shrink:0; }
.hero-title-block h1 { margin:0; font-size:26px; }
.hero-title-block .subtitle { color:var(--gold); font-size:14px; margin-top:2px; }
.tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tag { background:#222; border:1px solid #333; padding:3px 9px; border-radius:12px; font-size:11px; color:#ccc; }
.tag.diff { border-color:var(--red); color:var(--red); }
.tag.rarity-Legendary { border-color:var(--gold); color:var(--gold); }
.tag.rarity-Epic { border-color:#c46bff; color:#c46bff; }
.tag.rarity-Rare { border-color:#4aa3ff; color:#4aa3ff; }

.section { background:var(--card); border:1px solid #262630; border-radius:10px; margin-bottom:14px; overflow:hidden; }
.section-head { padding:10px 14px; background:#1a1a20; border-bottom:1px solid #262630; font-weight:bold; color:var(--p); font-size:14px; display:flex; align-items:center; gap:6px; }
.section-body { padding:14px; }
.desc-text { line-height:1.6; color:#ccc; margin:0 0 8px; }
.desc-label { color:#888; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; margin-top:8px; }

.rating-row { display:flex; align-items:center; gap:10px; margin:6px 0; }
.rating-label { width:70px; color:#aaa; font-size:12px; flex-shrink:0; }
.rating-bar-bg { flex:1; background:#000; border-radius:6px; height:10px; overflow:hidden; }
.rating-bar-fill { height:100%; background:linear-gradient(90deg,var(--p),var(--blue)); border-radius:6px; }
.rating-val { width:28px; text-align:right; color:#ddd; font-size:12px; font-weight:bold; }

.level-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.track-container { flex:1; position:relative; }
.track-container input[type=range] {
  width:100%; display:block; -webkit-appearance:none; appearance:none;
  height:6px; border-radius:3px; background:#333; outline:none; margin:0;
}
.track-container input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:var(--gold); border:2px solid #000; cursor:pointer;
}
.track-container input[type=range]::-moz-range-thumb {
  width:16px; height:16px; border-radius:50%; background:var(--gold); border:2px solid #000; cursor:pointer;
}
.track-container input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:#333; }
.level-badge { background:#000; border:1px solid var(--gold); color:var(--gold); padding:3px 10px; border-radius:5px; font-weight:bold; font-size:12px; min-width:52px; text-align:center; }
.lv-step { background:#1a1a20; border:1px solid #333; color:#ddd; border-radius:4px; width:26px; height:26px; cursor:pointer; font-size:15px; line-height:1; flex-shrink:0; }
.lv-step:hover { border-color:var(--gold); color:var(--gold); }
.slider-wrapper { position:relative; margin-bottom:20px; }
.slider-ticks { position:relative; height:14px; margin-top:4px; }
.tick { font-size:10px; color:#666; position:absolute; top:0; transform:translateX(-50%); text-align:center; }
.tick::before { content:'|'; display:block; font-size:8px; margin-bottom:-2px; color:#444; }
.tick.highlight { color:var(--gold); font-weight:bold; }
.growth-total { color:#8fd3ff; font-size:0.8em; margin-left:4px; }

.stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
.stat-item { background:#111; padding:8px 10px; border-radius:6px; }
.stat-label { color:#888; font-size:11px; display:flex; justify-content:space-between; }
.stat-value { color:#fff; font-weight:bold; font-size:17px; margin-top:2px; }
.growth-tag { color:var(--green); }
.dps-tag { color:var(--gold); font-size:11px; margin-left:4px; }

.ability-group-title { font-size:12px; color:#888; text-transform:uppercase; letter-spacing:0.5px; margin:12px 0 6px; }
.ability-group-title:first-child { margin-top:0; }
.ability-item { display:flex; gap:10px; background:#111; padding:8px 10px; border-radius:8px; margin-bottom:6px; border-left:3px solid var(--gray); }
.ability-item.type-Q { border-left-color:var(--q); }
.ability-item.type-W { border-left-color:var(--w); }
.ability-item.type-E { border-left-color:var(--e); }
.ability-item.type-Heroic { border-left-color:var(--heroic); }
.ability-item.type-Trait { border-left-color:var(--trait); }
.ability-item.type-Z { border-left-color:var(--z); }
.ability-item.type-Active { border-left-color:var(--active); }
.ability-icon { width:36px; height:36px; border:1px solid #333; border-radius:6px; flex-shrink:0; background:#000; object-fit:contain; }
.ability-item.nested { margin-top:-2px; background:#0d0d10; border-left-style:dashed; border-left-color:#444; opacity:0.92; position:relative; }
.ability-item.nested::before { content:'↳'; position:absolute; left:-18px; top:8px; color:#555; font-size:14px; }
.link-badge { font-size:10px; padding:1px 7px; border-radius:4px; background:#1a2e1a; color:#7dd87d; border:1px solid #2f4f2f; }
.linked-talents { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.linked-talent-chip { display:flex; align-items:center; gap:4px; background:#000; border:1px solid #333; border-radius:12px; padding:4px 10px 4px 4px; font-size:10.5px; color:#9fd9ff; cursor:pointer; min-height:24px; -webkit-tap-highlight-color:rgba(255,215,0,0.3); }
.linked-talent-chip:hover, .linked-talent-chip:active { border-color:var(--gold); background:#1a1a00; }
.linked-talent-chip img { width:16px; height:16px; border-radius:3px; object-fit:contain; background:#111; }
.linked-talent-chip .lv { color:var(--gold); font-weight:bold; }
.ability-name-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.ability-type-badge { font-size:10px; padding:1px 6px; border-radius:4px; background:#000; color:#aaa; border:1px solid #333; }
.state-badge { font-size:10px; padding:1px 7px; border-radius:4px; border:1px solid #333; }
.state-badge.active { color:#3ddc84; border-color:#3ddc84; }
.state-badge.passive { color:#8a8a95; border-color:#555; }
.requires-note { display:inline-flex; align-items:center; gap:4px; background:#241a00; border:1px solid var(--gold); color:var(--gold); font-size:10.5px; padding:2px 8px; border-radius:10px; margin-top:6px; }
.ability-name { font-weight:bold; color:#fff; }
.ability-cd { color:var(--blue); font-size:11px; }
.ability-desc { color:#bbb; font-size:12.5px; margin-top:3px; line-height:1.5; }
.ability-charges { color:var(--gold); font-size:11px; }

.subgroup-title { font-weight:bold; color:var(--blue); font-size:13px; margin:14px 0 6px; padding-top:10px; border-top:1px dashed #333; }
.subgroup-title:first-child { margin-top:0; border-top:none; padding-top:0; }
.unit-card { background:#111; border:1px solid #262630; border-radius:8px; padding:10px; margin-bottom:10px; }
.unit-card-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.unit-card-head img { width:32px; height:32px; border-radius:5px; border:1px solid #333; background:#000; object-fit:contain; }
.unit-card-head .n { font-weight:bold; color:var(--gold); }
.unit-mini-stats { display:flex; gap:12px; color:#999; font-size:11px; margin-bottom:6px; flex-wrap:wrap; }

.talent-level-block { margin-bottom:14px; }
.talent-level-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.talent-level-num { background:var(--p); color:#fff; font-weight:bold; font-size:12px; padding:2px 9px; border-radius:12px; }
.talent-row { display:flex; gap:8px; flex-wrap:wrap; }
.talent-card { width:220px; background:#111; border:1px solid #262630; border-radius:8px; padding:8px; display:flex; gap:8px; transition:box-shadow 0.3s, border-color 0.3s; }
.talent-card.talent-highlight { border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,215,0,0.35); }
.talent-card img { width:34px; height:34px; border-radius:5px; border:1px solid #333; flex-shrink:0; background:#000; object-fit:contain; }
.talent-card .tn { font-weight:bold; font-size:12.5px; color:#fff; }
.talent-card .td { font-size:11px; color:#aaa; margin-top:2px; line-height:1.4; }

.chip-list { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:#111; border:1px solid #262630; padding:4px 10px; border-radius:6px; font-size:11.5px; color:#bbb; }
.tech-table { width:100%; border-collapse:collapse; font-size:12px; }
.tech-table td { padding:5px 8px; border-bottom:1px solid #222; color:#bbb; vertical-align:top; }
.tech-table td:first-child { color:#777; width:150px; white-space:nowrap; }

.hidden-section { display:none !important; }
.portrait-mini-grid { display:flex; flex-wrap:wrap; gap:10px; }
.portrait-mini { text-align:center; }
.portrait-mini img { width:64px; height:64px; object-fit:contain; border-radius:6px; border:1px solid #333; background:#000; }
.portrait-mini div { font-size:10px; color:#777; margin-top:3px; }

.home-intro { color:#888; font-size:13px; margin-bottom:18px; }
.home-role-section { margin-bottom:26px; }
.home-role-title { font-size:16px; font-weight:bold; color:var(--gold); border-bottom:1px solid #262630; padding-bottom:6px; margin-bottom:12px; display:flex; align-items:baseline; gap:8px; }
.home-role-count { font-size:11px; color:#666; font-weight:normal; }
.home-hero-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:14px; }
.home-hero-card { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; padding:6px; border-radius:8px; text-align:center; }
.home-hero-card:hover { background:#1a1a20; }
.home-hero-portrait { width:64px; height:64px; border-radius:50%; border:2px solid #333; object-fit:cover; background:#111; }
.home-hero-card:hover .home-hero-portrait { border-color:var(--p); }
.home-hero-name { font-size:11.5px; color:#ddd; line-height:1.3; }

/* ── 모바일 반응형 ── */
@media (max-width: 760px) {
  #top-bar { flex-wrap:wrap; gap:6px; padding:8px 10px; }
  #top-bar > div:last-child { display:flex; flex-wrap:wrap; gap:6px; }
  #top-bar .meta { display:block; width:100%; margin-top:2px; }
  .set-btn, .lang-btn { margin-left:0; padding:6px 10px; font-size:11.5px; }

  #layout { flex-direction:column; min-height:0; }
  #sidebar {
    width:100%; height:auto; max-height:none; position:relative; top:0;
    border-right:none; border-bottom:1px solid #2a2a2e;
  }
  #sidebar.collapsed #hero-list, #sidebar.collapsed .filter-row, #sidebar.collapsed .hero-count { display:none; }
  #sidebar-toggle { display:flex; }
  #main { max-width:100%; padding:14px 12px 60px; }

  .settings-panel { right:8px; left:8px; width:auto; max-width:none; top:auto; }
  .hero-header { flex-wrap:wrap; }
  .stat-grid { grid-template-columns:repeat(2,1fr); }
  .home-hero-grid { grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:10px; }
  .home-hero-portrait { width:56px; height:56px; }
  .talent-card { width:100%; }
}
#sidebar-toggle { display:none; align-items:center; justify-content:space-between; background:#1a1a20; padding:8px 10px; border-radius:6px; margin-bottom:8px; color:#ccc; font-size:12.5px; cursor:pointer; }<!--<<WIKI-FIELDS>>-->
.wiki-fields { margin-top:8px; border-top:1px dashed #33333c; padding-top:7px; }
.wiki-fields-head { color:var(--blue); font-size:10.5px; letter-spacing:0.5px;
  text-transform:uppercase; margin-bottom:5px; display:flex; align-items:center; gap:5px; }
.wiki-fields-head .src { color:#555; text-transform:none; letter-spacing:0; font-size:10px; }
.wiki-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:3px 10px; }
.wiki-row { display:flex; gap:6px; font-size:11.5px; line-height:1.45; min-width:0; }
.wiki-row .k { color:#7a7a88; flex-shrink:0; }
.wiki-row .v { color:#cfcfd8; word-break:break-word; }
.wiki-note { margin-top:6px; background:#101016; border-left:2px solid #33333c;
  border-radius:0 4px 4px 0; color:#9a9aa6; font-size:11px; line-height:1.55; }
/* 손가락으로도 누를 수 있게 넉넉히. list-style 을 지워야 iOS 사파리에서 화살표가 겹치지 않는다. */
.wiki-note > summary { padding:5px 8px; cursor:pointer; color:#7a7a88; font-size:10.5px;
  letter-spacing:0.4px; text-transform:uppercase; list-style:none; user-select:none;
  min-height:24px; display:flex; align-items:center; gap:5px;
  -webkit-tap-highlight-color:rgba(163,51,255,0.25); }
.wiki-note > summary::-webkit-details-marker { display:none; }
.wiki-note > summary::before { content:'▸'; color:#555; font-size:11px; }
.wiki-note[open] > summary::before { content:'▾'; }
.wiki-note > summary:hover { color:var(--blue); }
.wiki-note-body { padding:0 8px 7px 8px; }
.talent-card .wiki-fields { border-top-color:#2a2a33; }
.atk-tag { display:inline-block; background:#000; border:1px solid #333; color:#bbb;
  font-size:10.5px; padding:1px 7px; border-radius:10px; margin-right:4px; }
/* 좁은 화면에서 190px 짜리 열이 페이지를 밀어내지 않도록 한 줄로 떨군다 */
@media (max-width: 700px) {
  .wiki-grid { grid-template-columns:1fr; }
  .wiki-row { font-size:11px; }
}

/* ---- 범위 그림 ---- */
.aoe-open { display:inline-flex; align-items:center; gap:4px; background:#0d1a22;
  border:1px solid #1f4b5e; color:#7fd4f0; font-size:10.5px; padding:2px 8px;
  border-radius:10px; cursor:pointer; margin-left:auto; min-height:22px;
  -webkit-tap-highlight-color:rgba(0,212,255,0.3); }
.aoe-open:hover { border-color:var(--blue); color:#bdefff; }
.ability-icon.has-aoe, .talent-card img.has-aoe { cursor:pointer; border-color:#2c6d85; }
.ability-icon.has-aoe:hover, .talent-card img.has-aoe:hover { border-color:var(--blue); }

.aoe-modal { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:1000;
  display:none; align-items:center; justify-content:center; padding:16px; }
.aoe-modal.open { display:flex; }
.aoe-box { background:var(--card); border:1px solid var(--p); border-radius:10px;
  max-width:760px; width:100%; max-height:92vh; overflow:auto; }
.aoe-head { padding:10px 14px; border-bottom:1px solid #262630; display:flex;
  align-items:center; gap:8px; position:sticky; top:0; background:#1a1a20; }
.aoe-title { font-weight:bold; color:var(--p); font-size:14px; }
.aoe-sub { color:#777; font-size:11px; }
.aoe-close { margin-left:auto; background:#222; color:#fff; border:1px solid #444;

/* ── 위키 문서처럼 ─────────────────────────────────────────────────────────
   팬덤 위키가 깔끔한 까닭은 장식이 아니라 **뼈대**다 — 한 칸으로 흐르는 글, 제목 밑의
   가는 줄, 오른쪽 정보상자, 두 칸짜리 표, 넉넉한 여백. 카드·그림자·둥근 모서리를 걷고
   그 뼈대만 남긴다. 색은 **이미 있는 변수로만** 써서 다크·라이트 양쪽에 다 산다.
   (이 묶음은 맨 끝에 둔다 — 위의 옛 규칙을 덮어써야 하기 때문이다.) */
#main { max-width:1060px; padding:24px 28px 90px; font-size:14px; line-height:1.66; }
#hero-page h1 { font-size:27px; margin:0 0 2px; letter-spacing:-.3px; }
.hero-header { align-items:center; gap:18px; margin-bottom:10px; }
.subtitle { color:var(--dim); font-size:14px; }
.desc-text { color:var(--fg); opacity:.86; margin:0 0 10px; }
.desc-label { color:var(--dim); font-size:11px; letter-spacing:.6px; margin-top:12px; }

/* 문단 — 카드가 아니라 **문서의 절**이다 */
.section { background:transparent; border:0; border-radius:0; margin:0 0 30px; overflow:visible; }
.section-head { background:transparent !important; border:0 !important;
  border-bottom:2px solid var(--line) !important; border-radius:0;
  padding:0 0 7px; margin:0 0 14px; font-size:19px; font-weight:600;
  color:var(--fg) !important; letter-spacing:-.2px; }
.section-body { padding:0; }

/* 능력치 — 위키의 **정보상자**. 넓은 화면에서는 오른쪽에 세운다. */
.sec-stats .section-body, .sec-ratings .section-body { border:1px solid var(--line);
  border-radius:6px; overflow:hidden; background:var(--card2); }
.stat-grid { display:block; }
.stat-item { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  background:transparent; border-radius:0; border-bottom:1px solid var(--line);
  padding:7px 11px; }
.stat-item:last-child { border-bottom:0; }
.stat-label { display:block; color:var(--dim); font-size:12px; }
.stat-value { color:var(--fg) !important; font-size:14.5px; font-weight:600; margin:0;
  font-variant-numeric:tabular-nums; }
.rating-row { margin:0; padding:6px 11px; border-bottom:1px solid var(--line); }
.rating-row:last-child { border-bottom:0; }
.rating-label { color:var(--dim); }
.rating-bar-bg { background:var(--line); height:8px; }
/* 정보상자를 세우는 폭 — 옆 목록(280px)을 빼고도 글이 400px 는 남아야 읽힌다 */
@media (min-width:950px) {
  #hero-page { display:grid; grid-template-columns:minmax(0,1fr) 296px;
               column-gap:30px; align-items:start; }
  .sec-overview { grid-area:1 / 1 / 3 / 2; }
  .sec-ratings  { grid-area:1 / 2 / 2 / 3; }
  .sec-stats    { grid-area:2 / 2 / 3 / 3; }
  .sec-abilities, .sec-subunits, .sec-talents, .sec-portraits, .sec-extra { grid-column:1 / -1; }
}

/* 기술 — 카드가 아니라 **줄로 나뉜 항목**. 아이콘·이름·설명·세부 수치 차례. */

/* 특성 — 등급마다 가로로 늘어선 카드였다. **한 줄에 하나씩** 놓으면 설명이 다 보인다. */

.talent-level-head { border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:0; }

  margin-top:3px; }

/* 세부 필드 — 위키의 작은 표처럼 **이름 | 값** 두 칸. 기술·특성 모두 같은 꼴이다. */
.wiki-fields { border-top:0 !important; margin-top:8px; }

  margin-top:4px; }

/* '비고'(위키 주석) 상자는 색이 #101016 으로 박혀 있어 **밝은 쪽에서도 까맸다** —
   문서 꼴로 바꾸니 한가운데 검은 띠로 보인다. 변수로 돌려 양쪽에 맞춘다. */
.wiki-note { background:var(--card2); border-left:2px solid var(--line);
  color:var(--fg); opacity:.95; }
.wiki-note-body { color:var(--fg); opacity:.82; }
.wiki-note > summary { color:var(--dim); }
.wiki-note > summary::before { color:var(--dim); }
/* 묶음 표식은 네모 딱지가 아니라 **이름 앞의 작은 글씨**로 — 표가 조용해진다 */

// 이미지가 저장소 폴더마다 흩어져 있는 경우가 있어, 실패 시 다른 폴더를 순서대로 재시도한다.
// 그래도 모두 실패하면(백과사전 내 극소수 아이콘) 깨진 이미지 대신 자연스럽게 숨긴다.
function imgFallback(el) {
  const tried = (el.dataset.tried || '').split(',').filter(Boolean);
  const order = (el.dataset.order || '').split(',').filter(Boolean);
  const name = el.dataset.name;
  const next = order.find(f => !tried.includes(f));
  if (!next) { el.style.display = 'none'; return; }
  tried.push(next);
  el.dataset.tried = tried.join(',');
  el.src = FOLDER_URLS[next] + name;
}
function iconTag(name, cls, order) {
  if (!name) return '';
  order = order || ['at','un','hp'];
  const first = order[0];
  return `<img class="${cls}" src="${FOLDER_URLS[first]}${name}" loading="lazy" data-name="${name}" data-order="${order.join(',')}" data-tried="${first}" onerror="imgFallback(this)">`;
}

(function loadToggles() {
  try {

    if (saved) toggles = Object.assign(toggles, saved);
  } catch(e) {}
  document.querySelectorAll('.settings-panel input[type=checkbox]').forEach(cb => {

})();

function onToggleChange() {

function goToTalent(nameId) {
  if (!toggles.talents) {
    toggles.talents = true;
    const cb = document.querySelector('.settings-panel input[data-sec="talents"]');
    if (cb) cb.checked = true;
    localStorage.setItem('hots_enc_toggles', JSON.stringify(toggles));
    applyToggles();
  }
  setTimeout(() => {
    const el = document.getElementById('talent-' + nameId);
    if (!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.add('talent-highlight');
    setTimeout(() => el.classList.remove('talent-highlight'), 1600);
  }, 60);
}

const ROLE_ORDER_KO = ['전사','투사','근접 암살자','원거리 암살자','지원가','치유사'];

// 메인 화면: 역할군별로 초상화+이름을 쭉 나열. 사이드바 검색/필터와 별개로,
// 처음 들어왔을 때나 상단 타이틀(🏠)을 눌렀을 때 보여주는 진입 화면.
function renderHomePage() {
  const data = getActiveData();
  const groups = {};
  heroList.forEach(h => {
    const key = h.role || (currentLang==='ko'?'기타':'Other');
    (groups[key] = groups[key] || []).push(h);
  });
  const order = Object.keys(groups).sort((a,b) => {
    const ia = ROLE_ORDER_KO.indexOf(a), ib = ROLE_ORDER_KO.indexOf(b);
    return (ia===-1?99:ia) - (ib===-1?99:ib);
  });
  let html = `<div class="home-intro">${currentLang==='ko'?`영웅 ${heroList.length}명 · 역할군별로 살펴보세요.`:`${heroList.length} heroes · browse by role.`}</div>`;
  order.forEach(role => {
    const list = groups[role].slice().sort((a,b) => currentLang==='ko'
      ? a.name_ko.localeCompare(b.name_ko, 'ko')
      : a.name_en.localeCompare(b.name_en));
    html += `<div class="home-role-section">
      <div class="home-role-title">${role} <span class="home-role-count">${list.length}</span></div>
      <div class="home-hero-grid">`;
    list.forEach(h => {
      const hd = data[h.id];
      const img = (hd && hd.portraits) ? (hd.portraits.heroSelect || hd.portraits.draftScreen || hd.portraits.loading) : '';
      html += `<div class="home-hero-card" onclick="selectHero('${h.id}')">
        ${img?iconTag(img, 'home-hero-portrait', ['hp','un','at']):'<div class="home-hero-portrait"></div>'}
        <div class="home-hero-name">${currentLang==='ko'?h.name_ko:h.name_en}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('welcome').innerHTML = html;
}

function showHome() {
  currentHeroId = null;
  document.getElementById('hero-page').style.display = 'none';
  document.getElementById('welcome').style.display = 'block';
  document.getElementById('sidebar').classList.remove('collapsed');
  updateSidebarToggleLabel();
  const link = document.getElementById('builder-link');
  if (link) link.href = BUILDER_BASE_URL;
  renderHomePage();
  handleSearch(document.getElementById('hero-search').value);
}

function getChosung(str) {
  const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  let res = "";
  for (let i=0; i<str.length; i++) {
    let c = str.charCodeAt(i) - 44032;
    if (c >= 0 && c < 11172) res += cho[Math.floor(c/588)];
    else res += str.charAt(i);
  }
  return res;
}

function renderRoleFilters() {
  const roles = [...new Set(heroList.map(h => h.role).filter(Boolean))].sort();
  let html = `<div class="filter-chip ${activeRoleFilter===null?'active':''}" onclick="setRoleFilter(null)">전체</div>`;
  roles.forEach(r => {
    html += `<div class="filter-chip ${activeRoleFilter===r?'active':''}" onclick="setRoleFilter('${r}')">${r}</div>`;
  });
  document.getElementById('role-filters').innerHTML = html;
}
function setRoleFilter(r) {
  activeRoleFilter = r;
  renderRoleFilters();
  handleSearch(document.getElementById('hero-search').value);
}

/* 초성 검색은 공용 검색기(../shared/search.js)가 맡는다.
   글자를 더 칠수록 좁아진다: "ㅈㅈ" → 줄진 · "줄ㅈ" → 줄진 · "디바" → D.Va */
var searchHits = [], searchSel = -1, searchQuery = '';

function handleSearch(v) {
  searchQuery = v || '';
  var base = activeRoleFilter ? heroList.filter(function (h) { return h.role === activeRoleFilter; }) : heroList;
  searchHits = window.scrapSearch.filter(base, searchQuery, function (h) { return [h.name_ko, h.name_en]; });
  searchSel = -1;
  renderHeroListUI(searchHits);
}

function moveSel(d) {
  if (!searchHits.length) return;
  searchSel = (searchSel + d + searchHits.length) % searchHits.length;
  var items = document.querySelectorAll('#hero-list .hero-item');
  for (var i = 0; i < items.length; i++) items[i].classList.toggle('sel', i === searchSel);
  if (items[searchSel]) items[searchSel].scrollIntoView({ block: 'nearest' });
}

/* 검색창 접기 — 목록을 넓게 보고 싶을 때. 접어 둔 상태는 다음에 들어와도 그대로다. */
var ENC_HIDE_KEY = 'encyclopedia.searchHidden';
function setSearchHidden(hide, focus) {
  var row = document.getElementById('search-row'), show = document.getElementById('search-show');
  if (!row || !show) return;
  row.hidden = !!hide; show.hidden = !hide;
  try { localStorage.setItem(ENC_HIDE_KEY, hide ? '1' : '0'); } catch (e) {}
  if (!hide && focus) { var i = document.getElementById('hero-search'); if (i) { i.focus(); i.select(); } }
}
function initSearchBox() {
  var input = document.getElementById('hero-search');
  if (!input) return;
  input.addEventListener('input', function () { handleSearch(this.value); });
  input.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') {
      var pick = searchHits[searchSel >= 0 ? searchSel : 0];
      if (pick) { e.preventDefault(); selectHero(pick.id); }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      if (this.value) { this.value = ''; handleSearch(''); } else setSearchHidden(true);
    }
  });
  var hide = document.getElementById('search-hide');
  if (hide) hide.addEventListener('click', function () { setSearchHidden(true); });
  var show = document.getElementById('search-show');
  if (show) show.addEventListener('click', function () { setSearchHidden(false, true); });
  document.addEventListener('keydown', function (e) {
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); setSearchHidden(false, true); }
  });
  var saved = '0';
  try { saved = localStorage.getItem(ENC_HIDE_KEY) || '0'; } catch (e) {}
  setSearchHidden(saved === '1');
}

function renderHeroListUI(list) {
  document.getElementById('hero-count').innerText = `${list.length}명 표시 중 (전체 ${heroList.length}명)`;
  const S = window.scrapSearch, qq = searchQuery || '';
  document.getElementById('hero-list').innerHTML = list.length ? list.map(h => `
    <div class="hero-item ${h.id===currentHeroId?'active':''}" onclick="selectHero('${h.id}')">
      <span>${S.mark(currentLang==='ko'?h.name_ko:h.name_en, qq)}</span>
      <span class="r">${S.esc(h.role)}</span>
    </div>`).join("") : `<div class="hero-count" style="padding:10px 0">맞는 영웅이 없습니다</div>`;
}

function selectHero(id) {
  currentHeroId = id;
  currentLevel = 1;
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('hero-page').style.display = 'block';
  handleSearch(document.getElementById('hero-search').value);

function totalGrowthPct(scale, lv) {
  return (Math.pow(1 + (scale||0), lv) - 1) * 100;
}

// 데이터에는 "170 (+4% per level)"처럼 레벨 성장률이 고정 텍스트로 박혀 있고
// 실제 계산된 값이 아니다. 이를 파싱해서 현재 레벨 기준 실수치로 바꿔서 보여준다.
function processTooltip(t) {
  if (!t) return "";
  let p = t.replace(/<[^>]*>?/gm, "").replace(/\n/g, "<br>");
  p = p.replace(/(\d+(?:\.\d+)?)\s*\(\+(\d+(?:\.\d+)?)%\s*per level\)/g, (m, baseStr, rateStr) => {
    const base = parseFloat(baseStr);
    const rate = parseFloat(rateStr) / 100;
    const val = base * Math.pow(1 + rate, currentLevel);
    const decimals = (baseStr.indexOf('.') === -1) ? 0 : 1;
    const totalPct = totalGrowthPct(rate, currentLevel);
    const totalTxt = totalPct > 0 ? ` · Lv0${currentLang==='ko'?'대비':'→'} +${totalPct.toFixed(0)}%` : '';
    return `<strong>${val.toFixed(decimals)}</strong><span class="growth-tag">(+${(rate*100).toFixed(1)}%/Lv${totalTxt})</span>`;
  });
  return p;
}

function calcScaled(base, scale, lv) {
  return (base * Math.pow(1 + (scale||0), lv)).toFixed(0);
}

function abilityTypeClass(t) {
  if (['Q','W','E','Heroic','Trait','Z','Active'].includes(t)) return t;
  return 'Active';
}

// isActive:false 이거나 isPassive:true면 패시브, 그 외(대부분의 Q/W/E/궁극기)는 액티브로 간주한다.
function isPassiveAbility(a) {
  return a.isActive === false || a.isPassive === true;
}

// 데이터만으로는 유추할 수 없는 예외 케이스(특정 궁극기를 선택해야만 쓸 수 있는 하위 명령 등)를
// 수동으로 등록해두는 테이블 (능력nameId -> 부모능력 nameId + 설명 문구).
// 필요한 영웅이 더 있으면 여기에 항목만 추가하면 된다.
const MANUAL_REPARENT = {
  SamuroSelectSamuroPrime: { parent: 'SamuroIllusionMaster', note: {
    ko: "궁극기 '환영의 대가'를 선택해야 사용 가능", en: "Usable only when the 'Illusion Master' heroic is chosen" } },
  SamuroSelectAll: { parent: 'SamuroIllusionMaster', note: {
    ko: "궁극기 '환영의 대가'를 선택해야 사용 가능", en: "Usable only when the 'Illusion Master' heroic is chosen" } },
  TinkerFocusTurrets: { parent: 'TinkerRockItTurret', note: {
    ko: "설치된 '잘나가! 포탑'을 대상으로 사용", en: "Used together with deployed 'Rock-it! Turret's" } },
};

// 일부 서브 능력은 이름이 부모 스킬과 완전히 같아서(예: 리밍 '마인: 순수한 힘'의 '파열') 자동 매칭이
// 엉뚱한 특성('파열'이라는 이름의 레벨10 궁극기 선택지 자체)에 걸리기 쉽고, 또 이 기능을 실제로 여는
// 레벨20 보상 특성은 게임 데이터에 abilityTalentLinkIds가 비어 있어 자동 탐지가 아예 불가능하다.
// 이런 경우를 자식 nameId 기준으로 직접 등록해 부모를 지정하고, 표시 이름도 겹치지 않게 바꿔준다.
const MANUAL_CHILD_OVERRIDE = {
  WizardArchonPurePowerDisintegrate: { parent: 'WizardDisintegrate',
    displayName: { ko: '파열 (마인: 순수한 힘)', en: 'Disintegrate (Mine: Pure Power)' },
    note: { ko: "Lv20 '마인: 순수한 힘' 특성 필요", en: "Requires Lv20 talent 'Mine: Pure Power'" } },
};

// subAbilities의 키(예: "MedivhTransformRaven|MedivhTransformRaven|Z")는
// "부모능력nameId|부모버튼id|타입" 형식이라 첫 토큰이 부모 능력의 nameId와 일치한다.
// 이를 이용해 "취소/변형/연계 능력"을 원래 능력 카드 밑에 자식으로 붙여준다.
function buildSubMap(hData) {
  const map = {};
  (hData.subAbilities||[]).forEach(entry => {
    Object.keys(entry).forEach(key => {
      const parentNameId = key.split('|')[0];
      const cats = entry[key];
      Object.keys(cats).forEach(catKey => {
        cats[catKey].forEach(a => {
          (map[parentNameId] = map[parentNameId] || []).push(a);
        });
      });
    });
  });
  return map;
}

// 특성 중 abilityTalentLinkIds로 특정 스킬을 언급하는 경우, 그 스킬이
// "이 특성을 찍어야 강화/변경되는 스킬"이라는 뜻이므로 역방향 맵을 만들어 보여준다.
function buildTalentLinkMap(hData) {
  const map = {};
  Object.keys(hData.talents||{}).forEach(lv => {
    const lvNum = lv.replace(/\D/g,'');
    (hData.talents[lv]||[]).forEach(t => {
      (t.abilityTalentLinkIds||[]).forEach(linkId => {
        (map[linkId] = map[linkId] || []).push({level: lvNum, name: t.name, icon: t.icon, nameId: t.nameId});
      });
    });
  });
  return map;
}

// 부모 nameId가 실제 최상위 능력이 아닌 "고아" 연계그룹(예: 데스윙 하늘붕괴)은
// 자식 능력의 이름과 똑같은 이름을 가진 특성을 찾아서, 그 특성이 강화하는 능력 밑으로 옮겨 붙인다.
// 또한 MANUAL_REPARENT에 등록된 예외 케이스(사무로 등)도 함께 적용한다.
function resolveLinks(hData, subMap) {
  const skipTopLevel = new Set();
  const knownIds = new Set();
  const nameLookup = {};
  ['basic','heroic','trait','mount','activable','hearth','spray','voice'].forEach(k => {
    (hData.abilities[k]||[]).forEach(a => { knownIds.add(a.nameId); nameLookup[a.nameId] = a.name; });
  });

  // 1) 고아 연계그룹 -> 자식의 nameId가 어떤 특성의 abilityTalentLinkIds에 들어있는지 먼저 찾고
  //    (있다면 같은 특성이 가리키는 다른 '진짜' 능력이 실제 부모), 없으면 이름이 일치하는 특성으로 보조 추론.
  //    이렇게 하면 알라라크의 "번개 쇄도 강화"나 "2번째 궁극기(가학성 경유)"처럼 여러 단계로
  //    이어지는 연계도 하드코딩 없이 자동으로 정리된다.
  const allTalents = [];
  Object.keys(hData.talents||{}).forEach(lv => {
    const lvNum = lv.replace(/\D/g,'');
    (hData.talents[lv]||[]).forEach(t => allTalents.push({level: lvNum, name: t.name, linkIds: t.abilityTalentLinkIds||[]}));
  });
  Object.keys(subMap).forEach(parentNameId => {
    if (knownIds.has(parentNameId)) return; // 정상적인 경우, 손댈 필요 없음
    const children = subMap[parentNameId];
    const stillOrphan = [];
    children.forEach(child => {
      let target = null, matchedTalent = null;
      // 1-0) 수동 자식 오버라이드 (최우선)
      const override = MANUAL_CHILD_OVERRIDE[child.nameId];
      if (override) {
        (subMap[override.parent] = subMap[override.parent] || []).push(
          Object.assign({}, child, { _requiresNote: override.note, _displayName: override.displayName })
        );
        return;
      }
      // 1-a) nameId 직접 매칭 (가장 신뢰도 높음). 단, 이 자식 nameId를 언급하는 특성이 여러 개일 수 있고
      // (예: 데미지만 버프하는 무관한 특성들도 같이 걸려있는 경우) 그중 첫 번째가 우연히 엉뚱한 능력을
      // 가리킬 수 있어, 언급된 모든 특성에서 "다른 진짜 능력" 후보를 집계해 가장 많이 겹치는 것을 택한다.
      const referencing = allTalents.filter(t => t.linkIds.includes(child.nameId));
      if (referencing.length) {
        const tally = {};
        referencing.forEach(t => {
          t.linkIds.forEach(id => {
            if (id !== child.nameId && knownIds.has(id)) tally[id] = (tally[id]||0) + 1;
          });
        });
        const ranked = Object.keys(tally).sort((a,b) => tally[b]-tally[a]);
        if (ranked.length) {
          target = ranked[0];
          const candidates = referencing.filter(t => t.linkIds.includes(target));
          matchedTalent = candidates.reduce((best,t) => (parseInt(t.level) > parseInt(best.level) ? t : best), candidates[0]);
        }
      }
      // 1-b) 이름 문자열 매칭 (보조 수단). 단, 이름이 실제 능력과 완전히 같은 "궁극기 선택지 자체" 같은
      // 특성(예: 리밍 레벨10 '파열' - 그냥 궁극기 고르는 항목일 뿐 실제 강화 특성이 아님)은 제외한다.
      if (!target) {
        const abilityNames = new Set(Object.values(nameLookup));
        const t2 = allTalents.find(t => t.name === child.name && t.linkIds.length && !abilityNames.has(t.name));
        if (t2 && t2.linkIds[0]) { target = t2.linkIds[0]; matchedTalent = t2; }
      }
      if (target) {
        const note = {
          ko: `Lv${matchedTalent.level} '${matchedTalent.name}' 특성 필요`,
          en: `Requires Lv${matchedTalent.level} talent '${matchedTalent.name}'`
        };
        (subMap[target] = subMap[target] || []).push(Object.assign({}, child, {_requiresNote: note}));
      } else {
        stillOrphan.push(child);
      }
    });
    if (stillOrphan.length === 0) delete subMap[parentNameId];
    else subMap[parentNameId] = stillOrphan;
  });

  // 2) 수동 예외 테이블 적용
  Object.keys(MANUAL_REPARENT).forEach(nameId => {
    if (!knownIds.has(nameId)) return; // 이 영웅에게 해당 없음
    const rule = MANUAL_REPARENT[nameId];
    let found = null;
    ['basic','heroic','trait','mount','activable'].forEach(k => {
      (hData.abilities[k]||[]).forEach(a => { if (a.nameId === nameId) found = a; });
    });
    if (!found) return;
    const tagged = Object.assign({}, found, {_requiresNote: rule.note});
    (subMap[rule.parent] = subMap[rule.parent] || []).push(tagged);
    skipTopLevel.add(nameId);
  });

  return skipTopLevel;
}

function wikiEntryFor(item, heroId) {
  const rows = wikiFields.rows;
  if (item.buttonId && rows[item.buttonId]) return rows[item.buttonId];
  if (item.nameId && rows[item.nameId]) return rows[item.nameId];
  const norm = (item.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const aliased = wikiFields.alias[heroId + '|' + norm];
  return aliased ? rows[aliased] : null;
}

function renderWikiFields(item, heroId) {
  if (!toggles.wikifields) return '';
  const entry = wikiEntryFor(item, heroId);
  if (!entry) return '';
  const ko = currentLang === 'ko';
  const rows = (ko ? entry.ko : entry.en) || [];
  const note = ko ? (entry.noteKo || entry.noteEn) : entry.noteEn;
  if (!rows.length && !note) return '';

  // 마우스를 끌어서 방향을 정하는 스킬. 게임 XML 의 VectorRange 로 가려낸다.
  const drag = (attackTypes.drag || {})[item.buttonId];
  const dragRow = drag === undefined ? [] : [[
    ko ? '조준 방식' : 'Targeting',
    ko ? `드래그 조준 — 끌 수 있는 거리 ${drag}`
       : `Drag (vector) targeting — up to ${drag}`]];

  const cells = rows.concat(dragRow).map(r =>
    `<div class="wiki-row"><span class="k">${escapeWiki(r[0])}</span>` +
    `<span class="v">${escapeWiki(r[1])}</span></div>`).join('');
  // 비고는 길어서 기본으로 접어 둔다. <details> 는 PC·모바일 모두 기본 동작이라
  // 별도 스크립트 없이 눌러서 열린다.
  const noteHtml = note
    ? `<details class="wiki-note"><summary>${ko ? '비고' : 'Notes'}</summary>` +
      `<div class="wiki-note-body">${escapeWiki(note)}</div></details>` : '';

  const key = entry === wikiFields.rows[item.buttonId] ? item.buttonId : aoeKeyFor(item, heroId);
  const aoeButton = entry.geom
    ? `<button class="aoe-open" type="button">◎ ${ko ? '범위 보기' : 'Show area'}</button>` : '';

  return `<div class="wiki-fields"${entry.geom ? ` data-aoe="${key}"` : ''}>
    <div class="wiki-fields-head">📐 ${ko ? '위키 상세' : 'Wiki details'}
      <span class="src">heroesofthestorm.fandom</span>${aoeButton}</div>
    ${cells ? `<div class="wiki-grid">${cells}</div>` : ''}
    ${noteHtml}
  </div>`;
}

function aoeKeyFor(item, heroId) {
  const rows = wikiFields.rows;
  if (item.buttonId && rows[item.buttonId]) return item.buttonId;
  if (item.nameId && rows[item.nameId]) return item.nameId;
  const norm = (item.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  return wikiFields.alias[heroId + '|' + norm] || '';
}

><td class=\"ko\">퀘스트 / 보상</td><td class=\"note\"></td></tr></table></section><section class=\"gl-sec\"><h3 class=\"gl-h\">범위 그림 - 모양 <span class=\"gl-n\">5</span></h3><table class=\"gl-table\"><tr><th>원문</th><th>표기</th><th>설명</th></tr><tr><td class=\"en\">Circle</td><td class=\"ko\">원형</td><td class=\"note\">반경 하나로 그린다</td></tr><tr><td class=\"en\">Radial</td><td class=\"ko\">부채꼴</td><td class=\"note\">반경 + 각도. 꼭짓점이 시전자에 붙는다</td></tr><tr><td class=\"en\">Rectangle</td><td class=\"ko\">직사각형</td><td class=\"note\">너비 × 길이. 시전자에서 앞으로 뻗는다</td></tr><tr><td class=\"en\">Ring</td><td class=\"ko\">고리형</td><td class=\"note\">안쪽·바깥쪽 반경</td></tr><tr><td class=\"en\">hitbox 기반</td><td class=\"ko\">관통 경로</td><td class=\"note\">범위 형태가 없고 판정 상자만 있는 논타겟·돌진</td></tr></table></section><section class=\"gl-sec\"><h3 class=\"gl-h\">범위 그림 - 사거리가 없을 때 <span class=\"gl-n\">3</span></h3><table class=\"gl-table\"><tr><th>구분</th><th>표기</th><th>뜻</th></tr><tr><td class=\"en\">self</td><td class=\"ko\">자기 중심</td><td class=\"note\">시전자를 기준으로 터진다. 부채꼴은 정의상 여기 속한다</td></tr><tr><td class=\"en\">inherit</td><td class=\"ko\">부모 스킬을 따름</td><td class=\"note\">다른 스킬을 강화하는 특성</td></tr><tr><td class=\"en\">unstated</td><td class=\"ko\">위키에 없음</td><td class=\"note\">게임 데이터에도 제한값이 없다</td></tr></table></section>\n<div class=\"gl-foot\">\n  고치려면 <code>00_custom/glossary.json</code> 을 손보고 다시 빌드하면 된다.\n  아직 옮기지 않은 표현은 <code>07_localized/report.md</code> 에 빈도순으로 쌓인다.\n</div>\n";

function escapeWiki(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- 범위 그림 -----------------------------------------------------------
// 길이 값은 전부 같은 좌표계(SC2 월드 유닛)다. 위키의 unitRadius / range / radius
// 가 모두 게임 XML 값을 그대로 옮긴 것이라 영웅 반지름과 겹쳐 그려도 된다.
//
// 다만 사거리의 '기준점'은 스킬마다 다르다. XML 의 RangeUseCasterRadius 플래그가
// 중심에서 잴지 몸통 가장자리에서 잴지를 정한다. 그 오차가 곧 시전자 반지름이므로
// 시전자 원을 같이 그려서 눈으로 가늠할 수 있게 한다.

// 범위 도형이 차지하는 상자. 원점은 범위의 기준점, +x 는 시전 방향이다.
// 직사각형은 시전자에게서 앞으로 뻗는 빔이라 뒤쪽(-x)으로는 퍼지지 않는다.
// 갈래별 각도. 가운데를 0 으로 두고 좌우 대칭으로 벌린다.
// 겐지 수리검(10도, 3갈래) -> [-10, 0, 10]
function aoeSpreadAngles(g) {
  if (!g.spread) return [0];
  const {angle, count} = g.spread;
  return Array.from({length: count}, (_, i) => (i - (count - 1) / 2) * angle);
}

// 튕김 거리는 맞은 대상을 중심으로 재므로 범위 도형과 기준점이 다르다.
// 도형 계산을 건드리지 않고 바깥에서 한 겹 덧씌운다.
// 피해 범위(빨강)·시전 사거리(청록)와 한눈에 갈리는 색이어야 한다
const BOUNCE_TINT = '#c07cff';
// 시전자가 대상을 고르는 범위. 피해가 아니라 '누가 걸리나' 라 또 다른 색이다.
const SEARCH_TINT = '#ffb347';

// 조각이 놓이는 자리와 조각 자신의 길이는 다른 값이다.
//   at    - 기준점에서 이만큼 앞에 놓는다
//   range - 거기서 제 힘으로 이만큼 더 나간다 (관통 스킬)
// at 을 안 쓴 조각은 예전처럼 range 를 '놓이는 자리' 로 읽는다.
function aoePartAt(part) {
  return part.at !== undefined ? part.at : (part.range || 0);
}

// 조각을 제 기준점 둘레로 돌린 뒤 다시 감싸는 상자. 네 모서리를 돌려 본다.
function aoeSpin(box, deg) {
  if (!deg) return box;
  const rad = deg * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
  const xs = [], ys = [];
  for (const x of [box.l, box.r]) for (const y of [box.t, box.b]) {
    xs.push(x * cos - y * sin); ys.push(x * sin + y * cos);
  }
  return {l: Math.min(...xs), r: Math.max(...xs),
          t: Math.min(...ys), b: Math.max(...ys)};
}

function aoeShapeBox(g) {
  const box = aoeShapeBoxCore(g);
  if (!g.bounce) return box;
  const r = g.bounce;
  return {l: Math.min(box.l, -r), r: Math.max(box.r, r),
          t: Math.min(box.t, -r), b: Math.max(box.b, r)};
}

function aoeShapeBoxCore(g) {
  if (g.shape === 'bounce') return {l: 0, r: 0, t: 0, b: 0};
  if (g.parts) {
    // 여러 도형이 겹친 스킬. 각 조각을 제 자리에 놓고 전부 감싸는 상자를 구한다.
    const boxes = g.parts.map(part => {
      const box = aoeSpin(aoeShapeBoxCore(part), part.rotate), at = aoePartAt(part);
      const side = part.across || 0;   // 시전 방향과 직각으로 밀어 놓은 조각
      return {l: at + box.l, r: at + box.r, t: side + box.t, b: side + box.b};
    });
    return {l: Math.min(...boxes.map(b => b.l)), r: Math.max(...boxes.map(b => b.r)),
            t: Math.min(...boxes.map(b => b.t)), b: Math.max(...boxes.map(b => b.b))};
  }
  if (g.shape === 'skillshot') {
    // 시전자에서 앞으로 훑고 지나간 자리. 투사체는 시전자에서 생겨 앞으로만
    // 나가므로 뒤쪽은 맞지 않는다 - 앞으로 두께의 절반만 더 나간다.
    // 여러 갈래면 가장 벌어진 각도까지 품어야 한다.
    const reach = g.range || 0;
    const box = {l: 0, r: reach + g.depth / 2,
                 t: -g.width / 2, b: g.width / 2};
    const widest = Math.max(...aoeSpreadAngles(g).map(Math.abs));
    if (widest > 0) {
      const far = reach + g.depth / 2, rad = widest * Math.PI / 180;
      const side = far * Math.sin(rad) + g.width / 2;
      box.t = -side; box.b = side;
      box.r = Math.max(box.r, far * Math.cos(rad) + g.width / 2);
    }
    return box;
  }
  if (g.shape === 'ring') {
    if (!g.arc || g.arc >= 360) return {l: -g.outer, r: g.outer, t: -g.outer, b: g.outer};
    // 고리 부채꼴은 앞쪽 한 조각만 차지한다 (가로쉬 땅의 파괴자, 누더기 지면 강타)
    const half = g.arc * Math.PI / 360, side = g.outer * Math.sin(half);
    return {l: Math.min(0, g.outer * Math.cos(half)), r: g.outer, t: -side, b: side};
  }
  if (g.shape === 'trapezoid') {
    // 앞뒤 폭이 다른 사각형. 기준점에서 앞으로 뻗는다.
    return {l: 0, r: g.height,
            t: -Math.max(g.inner, g.outer) / 2, b: Math.max(g.inner, g.outer) / 2};
  }
  if (g.shape === 'triangle' || g.shape === 'equilateral') {
    // 한 변 길이로 그리는 정삼각형. 무게중심을 기준점에 두고 꼭짓점이 앞을 본다.
    const far = g.side / Math.sqrt(3);
    return {l: -far / 2, r: far, t: -g.side / 2, b: g.side / 2};
  }
  if (g.shape === 'polygon') {
    // 게임 XML 이 꼭짓점을 그대로 적어 둔 모양. 어림하지 않고 그 좌표로 그린다.
    const xs = g.points.map(p => p[0]), ys = g.points.map(p => p[1]);
    return {l: Math.min(...xs), r: Math.max(...xs),
            t: Math.min(...ys), b: Math.max(...ys)};
  }
  if (g.shape === 'grow')
    // 날아가며 커지는 판정. 끝에서 가장 크다.
    return {l: -g.from, r: g.travel + g.to, t: -g.to, b: g.to};
  if (g.shape === 'sweep') {
    // 밖으로 퍼져 나가는 부채꼴 띠. 다 퍼진 모습이 곧 부채꼴 하나다.
    const half = g.arc * Math.PI / 360, side = g.to * Math.sin(half);
    return {l: Math.min(0, g.to * Math.cos(half)), r: g.to, t: -side, b: side};
  }
  if (g.shape === 'blade' || g.shape === 'square')
    // 기준점을 가운데 두고 그린다 (직사각형 빔과 달리 앞으로 뻗지 않는다)
    return {l: -g.height / 2, r: g.height / 2, t: -g.width / 2, b: g.width / 2};
  if (g.shape === 'rectangle')
    // 끝이 열린 빔은 화살표와 글자가 더 붙으므로 상자를 조금 넉넉히 잡는다
    return {l: 0, r: g.height * (g.openEnded ? 1.35 : 1),
            t: -g.width / 2, b: g.width / 2};
  if (g.shape === 'radial') {
    if (g.arc >= 180) return {l: -g.radius, r: g.radius, t: -g.radius, b: g.radius};
    const half = g.arc * Math.PI / 360, reach = g.radius * Math.sin(half);
    return {l: Math.min(0, g.radius * Math.cos(half)), r: g.radius, t: -reach, b: reach};
  }
  const trail = g.repeat ? (g.repeat.count - 1) * g.repeat.spacing : 0;
  return {l: -g.radius, r: g.radius + trail, t: -g.radius, b: g.radius};
}


// 크기를 가늠할 기준자. 그림 전체가 들어가는 가장 작은 기준을 고른다.
// 작은 스킬은 레이너 평타(6.5) 원 안에서, 그보다 크면 해머 공성(11) 원까지 넓혀
// 본다. 영웅마다 사거리가 제각각이라 같은 자를 대야 비교가 된다.
function aoeReference(span) {
  const list = attackTypes.references || [];
  return list.find(r => r.range >= span) || list[list.length - 1] || null;
}

function aoeSvg(g, casterRadius, innerRadius) {
  const W = 660, pad = 44, maxH = 520;
  const reach = g.range || 0;

  // 범위가 어디에 놓이는가. 보통은 사거리 끝(시전 지점)이지만, 관통 스킬은
  // 시전자에서 시작해 앞으로 훑고 지나가므로 시전자에 붙는다.
  const anchor = g.shape === 'skillshot' ? 0 : reach;

  // 모든 그림을 위에서 내려다본 평면도로 그린다. 예전에는 사거리가 범위보다
  // 훨씬 길면 가로로 편 단면도로 바꿨는데, 그러면 크기 기준 원이 사라져
  // 어떤 스킬은 기준자가 보이고 어떤 스킬은 안 보였다. 같은 눈으로 봐야
  // 스킬끼리 비교가 되므로 배치를 하나로 통일한다.
  const shape = aoeShapeBox(g);
  const box = {l: -casterRadius, r: casterRadius, t: -casterRadius, b: casterRadius};
  if (reach > 0 && g.shape !== 'skillshot') {
    box.l = Math.min(box.l, -reach); box.r = Math.max(box.r, reach);
    box.t = Math.min(box.t, -reach); box.b = Math.max(box.b, reach);
  }
  box.l = Math.min(box.l, anchor + shape.l); box.r = Math.max(box.r, anchor + shape.r);
  box.t = Math.min(box.t, shape.t);          box.b = Math.max(box.b, shape.b);

  // 대상을 고르는 범위는 시전자 둘레라 원점을 기준으로 상자를 넓힌다
  if (g.search) {
    box.l = Math.min(box.l, -g.search); box.r = Math.max(box.r, g.search);
    box.t = Math.min(box.t, -g.search); box.b = Math.max(box.b, g.search);
  }

  // 기준 원도 들어가야 하므로 상자에 함께 넣는다
  const span = Math.max(Math.abs(box.l), box.r, Math.abs(box.t), box.b);
  const ref = aoeReference(span);
  if (ref) {
    box.l = Math.min(box.l, -ref.range); box.r = Math.max(box.r, ref.range);
    box.t = Math.min(box.t, -ref.range); box.b = Math.max(box.b, ref.range);
  }

  const wide = box.r - box.l, tall = box.b - box.t;
  const s = Math.min((W - pad * 2) / wide, (maxH - pad * 2) / tall, 62);
  const H = Math.max(tall * s + pad * 2, 200);
  const ox = pad - box.l * s, oy = (H - tall * s) / 2 - box.t * s;
  const ax = ox + anchor * s;   // 범위를 그릴 자리
  const tip = ox + reach * s;   // 사거리 끝

  const castable = reach > 0 && g.shape !== 'skillshot'
    ? `<circle cx="${ox}" cy="${oy}" r="${reach * s}" fill="#00d4ff" fill-opacity="0.07"
        stroke="#00d4ff" stroke-width="1.4" stroke-dasharray="7 5"/>` : '';
  // 시전자에서 범위까지 잇는 선. 예전에는 단면도에서만 사거리 숫자를 적었는데,
  // 이제 배치가 하나뿐이라 어느 그림에서나 같은 자리에 적는다.
  const spine = reach > 0 && g.shape !== 'skillshot'
    ? `<line x1="${ox}" y1="${oy}" x2="${tip}" y2="${oy}" stroke="#00d4ff" stroke-width="1.4"/>
       <text x="${(ox + tip) / 2}" y="${oy - 9}" text-anchor="middle" font-size="11.5"
        fill="#7fd4f0">${currentLang === 'ko' ? '사거리' : 'Range'} ${g.range}</text>` : '';

  const gauge = ref ? `<circle cx="${ox}" cy="${oy}" r="${ref.range * s}" fill="none"
      stroke="#8a8a95" stroke-width="1.2" stroke-dasharray="2 6"/>
    <text x="${ox}" y="${oy - ref.range * s - 7}" text-anchor="middle" font-size="11.5"
      fill="#8a8a95">${currentLang === 'ko' ? ref.ko : ref.en} ${ref.range}</text>` : '';

  // 시전자가 대상을 고르는 범위. 여기 걸린 적이 스킬에 휘말린다 (가로쉬 파쇄추)
  const search = g.search ? `<circle cx="${ox}" cy="${oy}" r="${g.search * s}"
      fill="${SEARCH_TINT}" fill-opacity="0.07" stroke="${SEARCH_TINT}" stroke-width="1.6"
      stroke-dasharray="3 4"/>
    <text x="${ox}" y="${oy + g.search * s + 14}" text-anchor="middle" font-size="11"
      fill="${SEARCH_TINT}">${currentLang === 'ko' ? '대상 인식' : 'search'} ${g.search}</text>` : '';

  // 특성이 늘려 준 만큼을 화살표로. 크기는 도형 중심에서 위로, 사거리는 시전자에서
  // 앞으로 재고, 늘기 전 크기는 흐린 점선 원으로 남긴다.
  const growth = (g.grew || []).map(step => {
    const dim = `<circle cx="%CX%" cy="${oy}" r="${step.from * s}" fill="none"
        stroke="${GROWTH_TINT}" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.45"/>`;
    const tag = `${step.from} → ${step.to}`;
    if (step.field === 'range') {
      // 사거리는 시전자 둘레로 자라므로 원도 시전자 중심이다
      return dim.replace('%CX%', ox) +
        aoeArrow(ox + step.from * s, oy + 15, ox + step.to * s, oy + 15, tag);
    }
    return dim.replace('%CX%', ax) +
      aoeArrow(ax, oy - step.from * s, ax, oy - step.to * s, tag);
  }).join('');

  return `<svg width="100%" viewBox="0 0 ${W} ${Math.round(H)}" xmlns="http://www.w3.org/2000/svg">
    ${aoeGrid(W, H, s, ox, oy)}
    ${gauge}
    ${search}
    ${castable}
    ${spine}
    ${aoeShape(g, ax, oy, s)}
    ${growth}
    ${aoeCaster(ox, oy, casterRadius * s, (innerRadius || 0) * s)}
    ${aoeScale(s, H, ref)}
  </svg>`;
}

const AOE_NO_RANGE = {
  self: {ko: '자기 중심 — 시전자를 기준으로 터진다', en: 'Centered on the caster'},
  inherit: {ko: '강화하는 스킬의 사거리를 그대로 따른다', en: 'Inherits the modified ability\'s range'},
  unstated: {ko: '위키에 사거리가 적혀 있지 않다 (게임 데이터에도 제한값이 없다)',
             en: 'No range stated on the wiki (the game data sets no limit either)'},
};

const PART_COLORS = ["#ff5f5f", "#ffb84a", "#4aa3ff"];

function aoeShape(g, x, y, s, nested) {
  const core = aoeShapeCore(g, x, y, s, nested);
  if (!g.bounce) return core;
  // 점선에 옅은 채움 - 피해가 들어가는 자리가 아니라 '여기까지 튄다' 는 뜻이다.
  return `<circle cx="${x}" cy="${y}" r="${g.bounce * s}" fill="${BOUNCE_TINT}"
      fill-opacity="0.08" stroke="${BOUNCE_TINT}" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${x}" y="${y - g.bounce * s - 6}" text-anchor="middle" font-size="11"
      fill="${BOUNCE_TINT}">${currentLang === 'ko' ? '튕김' : 'bounce'} ${g.bounce}</text>
    ${core}`;
}

// nested 는 재귀 깊이다. g.depth(투사체 두께)와 이름이 겹치면 안 된다 -
// 예전에 depth 로 두었다가 g.depth 를 가려 모서리 반경이 NaN 으로 나갔다.
function aoeShapeCore(g, x, y, s, nested) {
  if (g.shape === 'bounce') return '';
  if (g.parts) {
    // 조각마다 색을 달리해 겹친 자리를 구분한다.
    return g.parts.map((part, i) => {
      const px = x + aoePartAt(part) * s, py = y + (part.across || 0) * s;
      const spin = part.rotate
        ? ` transform="rotate(${part.rotate} ${px} ${py})"` : '';
      // 같은 효과를 여러 조각으로 쪼갠 경우(티리엘 강타의 원 5개)는 색을 지정해
      // 한 덩어리로 읽히게 한다. 안 주면 조각마다 색을 돌려 구분한다.
      return `<g opacity="0.9"${spin}>${aoeShapeCore(
        Object.assign({}, part, {_color: part.color || PART_COLORS[i % 3]}),
        px, py, s, (nested || 0) + 1)}</g>`;
    }).join('');
  }
  const tint = g._color || '#ff5f5f';
  const fill = `fill="${tint}" fill-opacity="0.28" stroke="${tint}" stroke-width="2"`;
  if (g.shape === 'skillshot') {
    // 훑고 지나간 자리를 채우고, 투사체 자체의 판정 상자는 도착점에 점선으로.
    // 여러 갈래로 나가는 스킬(겐지 수리검)은 갈래마다 같은 경로를 돌려 그린다.
    // at 을 쓴 조각은 놓이는 자리가 따로 있으므로 range 는 온전히 '나아간 길이' 다
    const reach = (nested && g.at === undefined ? 0 : (g.range || 0)) * s,
          half = g.width * s / 2,
          thick = g.depth * s;
    const lane = `<rect x="0" y="${-half}" width="${reach + thick / 2}"
        height="${g.width * s}" rx="${Math.min(half, thick / 2)}" ${fill}/>
      <rect x="${reach - thick / 2}" y="${-half}" width="${thick}"
        height="${g.width * s}" fill="none" stroke="#ffd700" stroke-width="1.5"
        stroke-dasharray="4 3"/>`;
    return aoeSpreadAngles(g).map(a =>
      `<g transform="translate(${x} ${y}) rotate(${a})">${lane}</g>`).join('');
  }
  if (g.shape === 'ring' && g.arc && g.arc < 360) {
    // 고리에서 각도만큼 잘라낸 조각. 바깥 호를 따라갔다가 안쪽 호로 되돌아온다.
    const half = g.arc * Math.PI / 360, ro = g.outer * s, ri = g.inner * s;
    const big = g.arc > 180 ? 1 : 0;
    const p = (r, a) => `${x + r * Math.cos(a)} ${y + r * Math.sin(a)}`;
    return `<path d="M ${p(ri, -half)} L ${p(ro, -half)}
      A ${ro} ${ro} 0 ${big} 1 ${p(ro, half)} L ${p(ri, half)}
      A ${ri} ${ri} 0 ${big} 0 ${p(ri, -half)} Z" ${fill}/>`;
  }
  if (g.shape === 'ring') {
    return `<path d="M ${x - g.outer * s} ${y} a ${g.outer * s} ${g.outer * s} 0 1 0 ${g.outer * s * 2} 0
      a ${g.outer * s} ${g.outer * s} 0 1 0 ${-g.outer * s * 2} 0 Z
      M ${x - g.inner * s} ${y} a ${g.inner * s} ${g.inner * s} 0 1 1 ${g.inner * s * 2} 0
      a ${g.inner * s} ${g.inner * s} 0 1 1 ${-g.inner * s * 2} 0 Z" fill-rule="evenodd" ${fill}/>`;
  }
  if (g.shape === 'triangle' || g.shape === 'equilateral') {
    // 정삼각형. 무게중심에서 세 꼭짓점까지가 한 변/√3 이고, 한 꼭짓점이 앞을 본다.
    const far = g.side * s / Math.sqrt(3);
    const points = [0, 120, 240].map(a => {
      const rad = a * Math.PI / 180;
      return `${x + far * Math.cos(rad)},${y + far * Math.sin(rad)}`;
    }).join(' ');
    return `<polygon points="${points}" ${fill}/>`;
  }
  if (g.shape === 'trapezoid') {
    const near = g.inner * s / 2, far = g.outer * s / 2, len = g.height * s;
    return `<polygon points="${x},${y - near} ${x + len},${y - far}
      ${x + len},${y + far} ${x},${y + near}" ${fill}/>`;
  }
  if (g.shape === 'square') {
    return `<rect x="${x - g.height * s / 2}" y="${y - g.width * s / 2}"
      width="${g.height * s}" height="${g.width * s}" ${fill}/>`;
  }
  if (g.shape === 'polygon') {
    // 꼭짓점을 그대로 잇는다. 기준점이 원점이고 +x 가 시전 방향이다.
    return `<polygon points="${g.points.map(p =>
      `${x + p[0] * s},${y + p[1] * s}`).join(' ')}" ${fill}/>`;
  }
  if (g.shape === 'sweep') {
    // 시전자에게서 밖으로 퍼져 나가는 부채꼴 띠. 어느 한 순간에는 두께 thickness
    // 인 띠 하나뿐이고, 그게 from 에서 to 까지 나아간다 (안두인 응징).
    const steps = 9, half = g.arc * Math.PI / 360;
    const band = (outer) => {
      const inner = Math.max(outer - g.thickness, 0);
      const ro = outer * s, ri = inner * s, big = g.arc > 180 ? 1 : 0;
      const p = (r, a) => `${x + r * Math.cos(a)} ${y + r * Math.sin(a)}`;
      return `M ${p(ri, -half)} L ${p(ro, -half)}
        A ${ro} ${ro} 0 ${big} 1 ${p(ro, half)} L ${p(ri, half)}
        A ${ri} ${ri} 0 ${big} 0 ${p(ri, -half)} Z`;
    };
    let out = '';
    for (let i = 0; i <= steps; i++) {
      const outer = g.from + (g.to - g.from) * i / steps;
      out += `<path d="${band(outer)}" fill="${tint}" fill-opacity="0.12" stroke="none"/>`;
    }
    // 다 지나간 자리 전체를 테두리로 둘러 어디까지 닿는지 보인다
    const far = g.to * s;
    const edge = (a) => `${x + far * Math.cos(a)} ${y + far * Math.sin(a)}`;
    return out + `<path d="M ${x} ${y} L ${edge(-half)}
      A ${far} ${far} 0 ${g.arc > 180 ? 1 : 0} 1 ${edge(half)} Z"
      fill="none" stroke="${tint}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  }
  if (g.shape === 'grow') {
    // 날아가며 판정이 커지는 투사체. 같은 원을 여러 번 겹쳐 그려 "점점 커진다" 를
    // 보인다. over 까지 커지고 그 뒤로는 그대로다 (리밍 비전 보주).
    const steps = 16;
    let out = '';
    for (let i = 0; i <= steps; i++) {
      const at = g.travel * i / steps;
      const grown = g.from + (g.to - g.from) * Math.min(at / g.over, 1);
      out += `<circle cx="${x + at * s}" cy="${y}" r="${grown * s}"
        fill="${tint}" fill-opacity="0.13" stroke="none"/>`;
    }
    // 가장 커진 뒤의 테두리만 실선으로 남겨 어디까지 굵어지는지 보이게 한다
    const end = g.travel * s, big = g.to * s;
    out += `<path d="M ${x} ${y - g.from * s}
        L ${x + Math.min(g.over, g.travel) * s} ${y - big} L ${x + end} ${y - big}
        M ${x} ${y + g.from * s}
        L ${x + Math.min(g.over, g.travel) * s} ${y + big} L ${x + end} ${y + big}"
      fill="none" stroke="${tint}" stroke-width="1.6"/>`;
    return out;
  }
  if (g.shape === 'blade') {
    // 양 끝이 뾰족한 베기 자국. 가운데 flat 만큼은 폭이 그대로고 거기서부터
    // 양 끝까지 삼각형으로 좁아진다 (겐지 폭렬참). 기준점이 한가운데다.
    const far = g.height * s / 2, mid = g.flat * s / 2, half = g.width * s / 2;
    return `<polygon points="${x - far},${y} ${x - mid},${y - half}
      ${x + mid},${y - half} ${x + far},${y} ${x + mid},${y + half}
      ${x - mid},${y + half}" ${fill}/>`;
  }
  if (g.shape === 'rectangle') {
    // 폭 x 길이. 길이는 시전 방향으로 뻗으므로 기준점에서 오른쪽으로 그린다.
    const box = `<rect x="${x}" y="${y - g.width * s / 2}"
      width="${g.height * s}" height="${g.width * s}" ${fill}/>`;
    if (!g.openEnded) return box;
    // 끝이 정해지지 않은 빔. 먼 쪽 테두리를 지우고 화살표로 이어 붙인다.
    const far = x + g.height * s, half = g.width * s / 2;
    return `${box}
      <rect x="${far - 3}" y="${y - half - 2}" width="6" height="${g.width * s + 4}"
        fill="#1a1a22"/>
      <line x1="${far - 4}" y1="${y}" x2="${far + 22}" y2="${y}" stroke="${tint}"
        stroke-width="2" stroke-dasharray="5 4"/>
      <polygon points="${far + 22},${y} ${far + 14},${y - 5} ${far + 14},${y + 5}"
        fill="${tint}"/>
      <text x="${far + 26}" y="${y + 4}" font-size="11" fill="${tint}">${
        currentLang === 'ko' ? '조준한 곳까지' : 'to wherever aimed'}</text>`;
  }
  if (g.shape === 'radial') {
    const half = g.arc * Math.PI / 360, r = g.radius * s;
    const x1 = x + r * Math.cos(-half), y1 = y + r * Math.sin(-half);
    const x2 = x + r * Math.cos(half), y2 = y + r * Math.sin(half);
    return `<path d="M ${x} ${y} L ${x1} ${y1} A ${r} ${r} 0 ${g.arc > 180 ? 1 : 0} 1 ${x2} ${y2} Z" ${fill}/>`;
  }
  if (g.repeat) {
    // 시전 지점이 첫 발이고, 나머지는 같은 방향으로 간격만큼 더 나간다.
    return Array.from({length: g.repeat.count}, (_, i) => {
      const cx = x + i * g.repeat.spacing * s;
      return `<circle cx="${cx}" cy="${y}" r="${g.radius * s}" ${fill}/>` +
        `<text x="${cx}" y="${y + 4}" text-anchor="middle" font-size="11"
          fill="#ffd9d9" fill-opacity="0.85">${i + 1}</text>`;
    }).join('');
  }
  return `<circle cx="${x}" cy="${y}" r="${g.radius * s}" ${fill}/>`;
}

// 시전자. 충돌 반지름과 피격 반지름이 다른 영웅(디아블로 1.19 / 0.94 등)은 둘 다
// 그린다. 중심은 같으므로 어느 쪽을 보든 격자 교차점에 놓인다.
function aoeCaster(x, y, r, inner) {
  const hit = inner && Math.abs(inner - r) > 0.01
    ? `<circle cx="${x}" cy="${y}" r="${Math.max(inner, 1.5)}" fill="none"
        stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>` : '';
  return `<circle cx="${x}" cy="${y}" r="${Math.max(r, 2)}" fill="#eee" fill-opacity="0.5"
      stroke="#fff" stroke-width="1.5"/>${hit}
    <path d="M ${x - 4} ${y} H ${x + 4} M ${x} ${y - 4} V ${y + 4}" stroke="#fff"
      stroke-width="1" opacity="0.9"/>`;
}

// 격자는 시전자에 맞춰 깐다. 시전자 원의 중심이 격자 교차점에 정확히 놓여야
// 거기서부터 몇 칸인지 눈으로 셀 수 있다.
function aoeGrid(W, H, s, ox, oy) {
  // 1단위 격자가 너무 촘촘하면 눈이 아프므로 간격이 12px 밑으로 내려가면 5단위로 넓힌다
  const step = s < 12 ? s * 5 : s;
  const dx = ((ox % step) + step) % step, dy = ((oy % step) + step) % step;
  return `<defs><pattern id="aoegrid" width="${step}" height="${step}"
      patternUnits="userSpaceOnUse" patternTransform="translate(${dx} ${dy})">
      <path d="M ${step} 0 H 0 V ${step}" fill="none" stroke="#3a3a46" stroke-width="0.5"/>
    </pattern></defs>
    <rect width="${W}" height="${H}" fill="url(#aoegrid)"/>`;
}

// 특성으로 범위가 늘어난 자리. 늘기 전 크기를 흐린 점선으로 남기고 그 사이를
// 화살표로 이어 "여기서 여기까지 늘었다" 를 한눈에 보인다.
const GROWTH_TINT = '#7ee787';

function aoeArrow(x1, y1, x2, y2, label) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 6) return '';                 // 너무 짧으면 화살촉만 뭉쳐 지저분하다
  const ux = dx / len, uy = dy / len, head = Math.min(7, len / 2);
  // 화살촉은 진행 방향으로 삼각형 하나. marker 를 쓰면 defs 이름이 겹칠 수 있다.
  const bx = x2 - ux * head, by = y2 - uy * head;
  const tip = `${bx - uy * head * 0.5},${by + ux * head * 0.5}
               ${x2},${y2} ${bx + uy * head * 0.5},${by - ux * head * 0.5}`;
  // 세로로 자란 것은 화살촉 바깥에 적는다 - 가운데에 적으면 도형 테두리에 겹친다.
  // 가로(사거리)는 이미 시전선 아래 빈 자리라 가운데가 읽기 좋다.
  const upright = Math.abs(uy) > Math.abs(ux);
  const tx = upright ? x2 : (x1 + x2) / 2;
  const ty = upright ? y2 + uy * 12 + 4 : (y1 + y2) / 2 + 15;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${GROWTH_TINT}"
      stroke-width="2"/>
    <polygon points="${tip}" fill="${GROWTH_TINT}"/>
    <text x="${tx}" y="${ty}" text-anchor="middle" font-size="11"
      fill="${GROWTH_TINT}">${label}</text>`;
}

// 아래쪽 눈금자. 기준 사거리가 있으면 그 길이만큼 재서 이름과 값을 붙인다.
function aoeScale(s, H, ref) {
  const ko = currentLang === 'ko';
  const px = ref ? ref.range * s : (s < 12 ? 10 : 5) * s;
  const label = ref ? `${ko ? ref.ko : ref.en} ${ko ? '사거리' : 'range'}(${ref.range})`
                    : `${s < 12 ? 10 : 5} ${ko ? '단위' : 'units'}`;
  const y = H - 16, x = 14;
  return `<line x1="${x}" y1="${y}" x2="${x + px}" y2="${y}" stroke="#ddd" stroke-width="2"/>
    <line x1="${x}" y1="${y - 5}" x2="${x}" y2="${y + 5}" stroke="#ddd" stroke-width="2"/>
    <line x1="${x + px}" y1="${y - 5}" x2="${x + px}" y2="${y + 5}" stroke="#ddd" stroke-width="2"/>
    <text x="${x + px + 8}" y="${y + 4}" font-size="12" fill="#ddd">${label}</text>`;
}

function openAoe(buttonId, heroId) {
  const entry = wikiFields.rows[buttonId];
  if (!entry || !entry.geom) return;
  const g = entry.geom, ko = currentLang === 'ko';
  const hero = getActiveData()[currentHeroId] || {};
  const casterRadius = hero.radius || 0.625;
  const rows = (ko ? entry.ko : entry.en) || [];
  const name = aoeNameOf(buttonId) || buttonId;

  const facts = [
    g.parts ? [ko ? '겹친 도형' : 'Parts',
               g.parts.map(x => x.label || x.shape).join(' + ')] : null,
    g.search ? [ko ? '대상 인식 범위' : 'Search radius',
                g.search + (ko ? ' — 이 안의 적을 골라 끌어들인다'
                               : ' around the caster — picks the target')] : null,
    g.bounce ? [ko ? '튕김 반경' : 'Bounce reach',
                (ko ? '맞은 대상에서 ' : 'Up to ') + g.bounce +
                (ko ? ' 안의 다음 대상으로 튄다' : ' from the target it hit')] : null,
    g.note ? [ko ? '설명' : 'Note', g.note] : null,
    g.src === 'upgrade' ? [ko ? '출처' : 'Source',
                           ko ? `이 특성을 찍었을 때의 ${g.upgradeOfKo} 범위`
                              : `${g.upgradeOf} area with this talent taken`] : null,
    g.src === 'manual' ? [ko ? '출처' : 'Source',
                          ko ? '손으로 넣은 값 (위키 데이터로는 그릴 수 없음)'
                             : 'Hand-authored (not derivable from the wiki)'] : null,
    [ko ? '범위 형태' : 'Shape',
     g.shape === 'skillshot' ? (ko ? '관통 경로 (판정 상자 기준)' : 'Skillshot path (from hitbox)')
                             : g.label],
    g.shape === 'skillshot'
      ? [ko ? '판정 폭 × 두께' : 'Hitbox width × depth', g.width + ' × ' + g.depth] : null,
    g.shapeNote === 'arc'
      ? [ko ? '도형 보정' : 'Shape corrected',
         ko ? '위키는 Circle 로 적었지만 각도가 있어 부채꼴로 그림'
            : 'Wiki says Circle but an arc is given, so drawn as a cone'] : null,
    g.repeat ? [ko ? '연속 폭발' : 'Repeat',
                (ko ? '%d회 · 간격 %s' : '%d hits · %s apart')
                  .replace('%d', g.repeat.count).replace('%s', g.repeat.spacing)] : null,
    [ko ? '시전자 충돌 반지름' : 'Caster radius', casterRadius.toFixed(3)],
    g.range != null ? [ko ? '시전 사거리' : 'Range', String(g.range)] : null,
    g.global ? [ko ? '시전 사거리' : 'Range', ko ? '전역' : 'Global'] : null,
    g.noRange ? [ko ? '시전 사거리' : 'Range',
                 (ko ? '없음 · ' : 'None · ') + AOE_NO_RANGE[g.noRange][ko ? 'ko' : 'en']] : null,
  ].filter(Boolean).concat(rows.filter(r => /반경|각도|너비|높이|판정|Radius|Arc|Width|Height|Hitbox/.test(r[0])));

  document.getElementById('aoe-title').textContent = name;
  document.getElementById('aoe-sub').textContent =
    ko ? '게임 단위 실척 · 격자 1칸 = 1단위' : 'To scale in game units · 1 grid = 1 unit';
  document.getElementById('aoe-body').innerHTML =
    aoeSvg(g, casterRadius, hero.innerRadius) +
    `<div class="aoe-legend">
      <span><i class="aoe-key" style="background:#eee"></i>${ko ? '시전자' : 'Caster'}${
        hero.innerRadius && Math.abs(hero.innerRadius - casterRadius) > 0.01
          ? (ko ? ' (실선 충돌 · 점선 피격)' : ' (solid = collision, dashed = hitbox)') : ''}</span>
      ${g.range ? `<span><i class="aoe-key" style="background:#00d4ff;opacity:0.5"></i>${
        ko ? '시전 가능 영역' : 'Castable area'}</span>` : ''}
      <span><i class="aoe-key" style="background:#ff5f5f"></i>${ko ? '피해 범위' : 'Area of effect'}</span>
      ${g.shape === 'skillshot' ? `<span><i class="aoe-key" style="background:#ffd700"></i>${
        ko ? '투사체 판정 상자' : 'Projectile hitbox'}</span>` : ''}
      <span><i class="aoe-key" style="background:#8a8a95"></i>${
        ko ? '크기 기준자' : 'Size gauge'}</span>
    </div>
    <div class="aoe-grid-facts wiki-grid" style="margin-top:10px;">${
      facts.map(f => `<div class="wiki-row"><span class="k">${escapeWiki(f[0])}</span>` +
        `<span class="v">${escapeWiki(f[1])}</span></div>`).join('')}</div>
    <div class="aoe-note">${ko
      ? '<b>기준점 주의.</b> 사거리를 시전자 중심에서 재는지 몸통 가장자리에서 재는지는 ' +
        '스킬마다 다르다(게임 XML 의 RangeUseCasterRadius). 차이는 위 시전자 원의 반지름만큼이다. ' +
        '기본 공격 사거리는 서로의 몸통을 빼고 잰다.'
      : '<b>Reference point.</b> Whether range is measured from the caster\'s center or its ' +
        'edge varies per ability (RangeUseCasterRadius in the game XML). The difference is the ' +
        'caster circle drawn above. Basic attack range is measured edge to edge.'}</div>`;
  document.getElementById('aoe-modal').classList.add('open');
}

function aoeNameOf(buttonId) {
  const hero = getActiveData()[currentHeroId];
  if (!hero) return null;
  let found = null;
  const scan = list => (list || []).forEach(a => { if (a.buttonId === buttonId) found = a.name; });
  Object.values(hero.abilities || {}).forEach(scan);
  Object.values(hero.talents || {}).forEach(scan);
  (hero.subAbilities || []).forEach(s => Object.values(s).forEach(
    groups => Object.values(groups).forEach(scan)));
  return found;
}

function closeAoe() { document.getElementById('aoe-modal').classList.remove('open'); }

// 아이콘을 눌러도 열리게 한다. 카드가 다시 그려져도 살아 있도록 위임으로 붙인다.
document.addEventListener('click', e => {
  const card = e.target.closest && e.target.closest('.ability-item, .talent-card');
  if (!card) return;
  const holder = card.querySelector('.wiki-fields[data-aoe]');
  if (!holder) return;
  if (e.target.tagName === 'IMG' || e.target.closest('.aoe-open')) {
    openAoe(holder.getAttribute('data-aoe'), currentHeroId);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAoe(); });

function attackTypeStats(h) {
  const ko = currentLang === 'ko';
  const list = attackTypes.heroes[h.hyperlinkId];
  // 무기가 하위 유닛에만 있는 영웅(길 잃은 바이킹)도 평타 광역은 보여줘야 한다
  if (!list || !list.length) return attackAoeStat(h, ko);
  const many = list.length > 1;
  return list.map((a, i) => {
    const parts = [
      ko ? (a.melee ? '근접' : '원거리') : (a.melee ? 'Melee' : 'Ranged'),
      ko ? (a.missile ? '투사체' : '즉발') : (a.missile ? 'Projectile' : 'Instant'),
    ];
    if (a.talentSplash) parts.push(ko ? '광역 가능(특성)' : 'Splash via talent');
    const splash = (attackTypes.attackAoe || {})[h.hyperlinkId];
    if (splash) parts.push(ko ? '광역 평타' : 'Cleaving attack');
    return {
      l: (ko ? '공격 유형' : 'Attack type') + (many ? ` ${i + 1}` : ''),
      v: parts.map(p => `<span class="atk-tag">${p}</span>`).join(''),
      g: 0,
    };
  }).concat(attackAoeStat(h, ko));
}

// 평타 자체가 광역인 영웅은 그 모양과 크기를 한 줄 더 붙인다.
function attackAoeStat(h, ko) {
  const splash = (attackTypes.attackAoe || {})[h.hyperlinkId];
  if (!splash) return [];
  const size = splash.shape === 'radial'
    ? `${ko ? '부채꼴' : 'Cone'} ${splash.radius} · ${splash.arc}${ko ? '도' : '°'}`
    : `${ko ? '직사각형' : 'Rect'} ${splash.width} × ${splash.height}`;
  const who = splash.unit ? ` (${splash.unit})` : '';
  return [{
    l: (ko ? '평타 광역' : 'Attack area'),
    v: `<span class="atk-tag">${size}</span>` +
       `<span style="color:#7a7a88;font-size:11px">${(splash.label || '') + who}</span>`,
    g: 0,
  }];
}

function renderAbilityGroup(list, labelKo, labelEn, subMap, talentLinkMap, skipTopLevel, transformNote) {
  if (!list || list.length===0) return "";
  skipTopLevel = skipTopLevel || new Set();
  const visible = list.filter(a => !skipTopLevel.has(a.nameId));
  if (visible.length===0) return "";
  let html = `<div class="ability-group-title">${currentLang==='ko'?labelKo:labelEn}</div>`;
  visible.forEach(a => html += renderAbilityItem(a, subMap, talentLinkMap, false, null, transformNote));
  return html;
}

// 부모를 찾지 못한 연계 능력(드문 경우)은 별도로 모아서 보여준다.
function renderOrphanSubAbilities(hData, subMap) {
  const parentIds = new Set();
  ['basic','heroic','trait','mount','activable','hearth','spray','voice'].forEach(k => {
    (hData.abilities[k]||[]).forEach(a => parentIds.add(a.nameId));
  });
  let html = "";
  Object.keys(subMap).forEach(parentNameId => {
    if (parentNameId.startsWith('__used_')) return;
    if (parentIds.has(parentNameId)) return;
    subMap[parentNameId].forEach(a => html += renderAbilityItem(a, {}, {}, false));
  });
  if (!html) return "";
  return `<div class="ability-group-title">${currentLang==='ko'?'기타 연계 능력':'Other Linked Abilities'}</div>` + html;
}

function renderHeroUnits(hData) {

  let html = `<div class="subgroup-title">${currentLang==='ko'?'하위 유닛':'Hero Units'}</div>`;
  hData.heroUnits.forEach(entry => {
    Object.keys(entry).forEach(unitId => {
      const u = entry[unitId];
      const img = (u.portraits && (u.portraits.targetInfo||u.portraits.minimap)) || '';
      html += `<div class="unit-card">
        <div class="unit-card-head">
          ${img?iconTag(img, '', ['un','hp','at']):''}
          <span class="n">${u.name||unitId}</span>

        <div class="unit-mini-stats">
          ${u.life?`<span>HP ${Math.round(u.life.amount)}</span>`:''}
          ${u.radius?`<span>Radius ${u.radius}</span>`:''}
          ${u.speed?`<span>Speed ${u.speed}</span>`:''}
          ${u.sight?`<span>Sight ${u.sight}</span>`:''}
        </div>`;
      if (u.abilities) {
        // 유닛 자체도 취소/연계 서브 능력(subAbilities)을 가질 수 있어(예: 라그나로스 화산 심장부의
        // '돌아가기 취소') 메인 영웅과 동일한 방식으로 자체 subMap을 만들어 중첩 표시한다.
        const unitSubMap = buildSubMap(u);
        ['basic','heroic','trait','mount','activable'].forEach(k => {
          if (u.abilities[k]) u.abilities[k].forEach(a => html += renderAbilityItem(a, unitSubMap, {}, false));

function renderTalents(hData) {
  const lvs = Object.keys(hData.talents).filter(l => hData.talents[l].length>0)

  // ---- abilities ----
  const subMap = buildSubMap(h);

  if (voiceSprayHtml) abilitiesHtml += `<div class="sec-voicespray">${voiceSprayHtml}</div>`;

  extraHtml += `<div class="subgroup-title">${currentLang==='ko'?'기술 정보':'Technical Info'}</div>

  const page = `

      <div class="section-head">🗂️ ${currentLang==='ko'?'스킨 · 보이스 · 기술정보':'Skins / Voice / Technical'}</div>
      <div class="section-body">${extraHtml}</div>
    </div>
  `;
  document.getElementById('hero-page').innerHTML = page;
  applyToggles();
}
