<script>
/* ── 제원은 **도감 자료**에서 받아 쓴다 ───────────────────────────────────
   예전에는 이 자리에 옛 파서가 뽑은 제원 2.1MB 가 박혀 있었다 — 재사용 0.0625초
   (연타 잠금), 원형 반경 500(무제한 표식), 사거리 70(날값), 그리고 칸 이름의 절반이
   `신규 필드 — HealResponse.HealTypes[…]` 꼴이라 2026-08 에 아예 안 그리기로 했었다.
   지금 쓰는 것은 `hots_xml` 해석기가 뽑은 **도감과 같은 자료**다:

       data/herodex/index.json     눈금·판 번호 (6KB, 한 번)
       data/herodex/<영웅>.json     그 영웅의 기술·특성 상세 (30KB, 고를 때 하나)

   박아 두지 않으니 도감을 갱신하면 이 화면도 **저절로 따라간다**. */
const XDEX = new Map();          // 영웅 id → 자료(없으면 null)
let XMETA = null;                // {기준, build}
let XS_ITEM = {};                // 지금 영웅의 기술·특성 id → 항목
/* 칸 → [묶음, 색]. 묶음 이름과 색은 아래 용어 사전(XS_GLOSS)과 같은 것을 쓴다. */
const XS_GRP = {};
[[['유형', '영향', '속성'], '유형·대상', '#b08ff5'],
 [['성장'], '성장', '#6cc4a1'],
 [['지정', '사거리', '최소 사거리', '기준', '끌기 범위', '유지 사거리', '전거리',
   '도형거리', '거리 근거', '모임 범위', '조준 방식'], '사거리·조준', '#4fb477'],
 [['시전 시간', '모으는 시간', '모으기', '휩쓰는 시간', '도는 시간'], '시전·경직', '#e0b341'],
 [['범위', '반지름', '너비', '높이', '각도', '히트박스', '아군 범위', '아군 반지름',
   '나오는 범위', '빼는 대상', '피해 범위', '안쪽 너비', '바깥 너비', '뿌리는 구역',
   '찾는 반지름', '찾는 대상', '모양', '자리 패턴', '연속 판정', '둘러싼 수', '갈래 수',
   '갈래 간격', '나란히', '벌어지는 반지름', '나오는 자리', '최소 대상', '고르는 차례',
   '도는 꼴', '도는 개수', '도는 바퀴', '휩쓰는 쪽', '휩쓰는 꼴', '휩쓰는 차례'],
  '범위 판정', '#c85c8e'],
 [['틱 속도', '갱신 틱'], '주기·틱', '#9a6ee0'],
 [['피해', '회복', '틱당 피해', '총 피해', '조건부 피해', '보정', '아군이 주는 피해',
   '특성 전'], '피해·치유', '#e06055'],
 [['투사체 속도', '밀침 속도', '밀침 지속', '밀리는 거리', '질주 속도', '질주 거리',
   '돌진 거리', '속도 바뀜', '속도가 다른 까닭', '튕기는 거리', '튕기는 횟수', '오는 방향'],
  '투사체·이동', '#4cc3d9'],
 [['지속', '효과'], '지속 효과', '#d98e4a'],
 [['소환'], '소환·생성', '#8fbf6a']
].forEach(([ks, t, c]) => ks.forEach(k => { XS_GRP[k] = [t, c]; }));
/* 그림·그래프는 표가 아니라 그림으로 보여 준다. '틱 속도(날것)' 는 다듬은 것과 겹친다. */
const XS_HIDE = new Set(['도형', '그래프', '틱 속도(날것)']);

async function xdexMeta() {
  if (XMETA) return XMETA;
  try {
    const r = await fetch('../data/herodex/index.json', { cache: 'no-cache' });
    XMETA = r.ok ? await r.json() : {};
  } catch (e) { XMETA = {}; }
  return XMETA;
}
async function xdexHero(id) {
  if (!id) return null;
  if (XDEX.has(id)) return XDEX.get(id);
  /* **없는 영웅은 아예 안 부른다.** 백과에는 공생체·은신 발리라처럼 영웅 칸을 가진
     딸린 유닛이 있는데, 도감에는 그런 파일이 없어 404 가 콘솔에 찍혔다.
     목록(index.json)에 있는 id 만 받는다 — 요청도 콘솔 오류도 안 생긴다. */
  const meta = await xdexMeta();
  const known = (meta.heroes || []).some(h => h && h.id === id);
  if (!known) { XDEX.set(id, null); return null; }
  let v = null;
  try {
    const r = await fetch('../data/herodex/' + encodeURIComponent(id) + '.json',
                          { cache: 'no-cache' });
    if (r.ok) v = await r.json();
  } catch (e) { v = null; }
  XDEX.set(id, v);                       // 없는 영웅도 적어 둔다 — 두 번 묻지 않게
  return v;
}
/* 값이 목록이면 사람이 읽게 잇고, 꾸러미면 적지 않는다(그림 쪽에서 쓴다). */
function xsVal(v) {
  if (v == null || v === '') return '';
  if (Array.isArray(v)) return v.every(x => typeof x !== 'object') ? v.join(' ~ ') : '';
  if (typeof v === 'object') return '';
  return String(v);
}
function xsSpecRows(w) {
  const out = [];
  for (const k in (w || {})) {
    if (XS_HIDE.has(k) || k.charAt(0) === '_') continue;
    const v = xsVal(w[k]);
    if (!v) continue;
    const g = XS_GRP[k] || ['기타', '#77736a'];
    out.push([k, v, '', g[0], g[1]]);
  }
  return out;
}
/* 피해·소환은 **줄마다** 적혀 있다 — 표 밑에 한 줄로 요약한다. */
function xsDmgLine(it) {
  const d = (it['피해'] || []).filter(r => r && r['피해량'] != null)
    .map(r => r['피해량'] + (r['성장'] ? ' ' + r['성장'] : ''));
  return d.length ? '<div class="xs-dmg">피해 ' + xsEsc(d.join(' · ')) + '</div>' : '';
}
function xsSumLine(it) {
  const u = (it['소환'] || []).filter(r => r && r['유닛']).map(r =>
    r['유닛'] + (r['마리 수'] > 1 ? ' ×' + r['마리 수'] : ''));
  return u.length ? '<div class="xs-sum">소환 ' + xsEsc(u.join(' · ')) + '</div>' : '';
}
/* 카드가 그려질 때는 자료가 아직 없을 수 있다(받아 오는 중) — 자리만 잡아 두고
   `xsFill` 이 나중에 채운다. 영웅을 바꾸면 자리도 같이 새로 그려진다. */
function xsSlot(id, kind) {
  return id ? '<div class="xs-slot" data-xs="' + xsEsc(id) + '" data-k="' + kind + '"></div>' : '';
}
/* 특성은 '위키식' 이 비어 있는 것이 많다 — 대신 **무엇을 얼마로 바꾸는지**가 적혀 있다.
   그게 특성에서 제일 쓸모 있는 수치다. 기술·특성 모두 게임이 제 툴팁에 박아 둔 수치도
   같이 적는다 — 틀리면 바로 드러나는 **맞춰 볼 값**이다. */
function xsExtraRows(it) {
  const out = [];
  if (it['강화']) out.push(['강화하는 기술', it['강화'], '', '조건·게이팅', '#8d99ae']);
  (it['바뀌는 값'] || []).forEach(v => {
    const t = xsVal(v);
    if (t) out.push(['바뀌는 값', t, '', '조건·게이팅', '#8d99ae']);
  });
  ['퀘스트', '보상 갈래'].forEach(k => {
    const t = xsVal(it[k]);
    if (t) out.push([k, t, '', '조건·게이팅', '#8d99ae']);
  });
  const tip = (it['툴팁 수치'] || []).filter(x => x && x['칸'] != null)
    .map(x => x['칸'] + ' ' + x['값'] + (x['단위'] || ''));
  if (tip.length) out.push(['게임 툴팁 수치', tip.join(' · '), '게임이 설명글에 박아 둔 값',
                            '조건·게이팅', '#8d99ae']);
  return out;
}
/* **표는 하나다.** 기술 밑에 '위키 상세' 와 '게임 원본 제원' 이 따로 서면 어느 쪽을
   봐야 하는지부터 헷갈린다. 자리는 위키 상세 하나로 두고 **그 안을 우리 값으로 채운다**.
   우리 자료가 없는 기술은 위키 값이 그대로 남는다(지우지 않는다). */
function xsFillBox(el, it) {
  const w = it['위키식'] || {};
  const rows = xsSpecRows(w).concat(xsExtraRows(it));
  const fig = ((w['도형'] || []).length || w['그래프']) ? true : false;
  if (!rows.length && !fig) return;
  const ko = currentLang === 'ko';
  const 판 = (XMETA && XMETA.build) ? ' · 판 ' + XMETA.build : '';
  /* 자리는 **바로 앞 형제**다 — 카드 속틀에서 `renderWikiFields` 바로 뒤에 찍어 두었다.
     안쪽에 딸린 기술이 또 있어서 `querySelector` 로 찾으면 남의 표를 집는다. */
  let box = el.previousElementSibling;
  if (box && !box.classList.contains('wiki-fields')) box = null;
  if (!box) {                               // 위키에 없던 기술 — 표를 새로 세운다
    box = document.createElement('div');
    box.className = 'wiki-fields';
    box.innerHTML = '<div class="wiki-fields-head"></div>';
    el.appendChild(box);
  }
  const head = box.querySelector('.wiki-fields-head');
  if (head) {
    head.innerHTML = '📐 ' + (ko ? '상세 제원' : 'Details')
      + '<span class="src">' + (ko ? '게임 원본 XML' : 'game XML') + xsEsc(판) + '</span>'
      + (fig ? '<button class="aoe-open" type="button">◎ '
             + (ko ? '범위 보기' : 'Show area') + '</button>' : '');
  }
  if (fig) box.setAttribute('data-aoe', it.id);   // 아이콘·단추를 누르면 우리 그림이 열린다
  /* **비고는 위키 글이다.** 표를 우리 값으로 갈아 끼웠으니, 바로 밑의 주석까지 게임
     원본에서 나온 것처럼 읽히면 안 된다 — 어디서 온 글인지 제목에 적어 둔다. */
  const nsum = box.querySelector('.wiki-note > summary');
  if (nsum && !nsum.dataset.src) {
    nsum.dataset.src = '1';
    nsum.append(' · heroesofthestorm.fandom');
  }
  let grid = box.querySelector('.wiki-grid');
  if (!grid) {
    grid = document.createElement('div');
    grid.className = 'wiki-grid';
    box.insertBefore(grid, box.querySelector('.wiki-note'));
  }
  /* **비용과 재사용이 맨 위**다 — 표에서 제일 자주 찾는 수다. 위키 표도 그랬다.
     (카드 머리의 '재사용 대기시간: 8초' 와 겹치지만, 표는 모아 보는 자리다.) */
  const cost = [];
  if (it['마나'] != null) cost.push(['소모 자원', String(it['마나'])]);
  if (it['재사용 대기시간'] != null) cost.push(['재사용 대기시간', it['재사용 대기시간'] + '초']);
  if (it['충전 개수'] != null) cost.push(['충전', it['충전 개수'] + '회']);
  if (it['연타 제한'] != null) cost.push(['연타 제한', it['연타 제한'] + '초']);
  const extra = [];
  const d = (it['피해'] || []).filter(r => r && r['피해량'] != null)
    .map(r => r['피해량'] + (r['성장'] ? ' ' + r['성장'] : ''));
  if (d.length && !w['피해']) extra.push(['피해', d.join(' · ')]);
  const u = (it['소환'] || []).filter(r => r && r['유닛'])
    .map(r => r['유닛'] + (r['마리 수'] > 1 ? ' ×' + r['마리 수'] : ''));
  if (u.length && !w['소환']) extra.push(['소환', u.join(' · ')]);
  grid.innerHTML = cost.concat(rows.map(r => [r[0], r[1]]), extra).map(r =>
    '<div class="wiki-row"><span class="k">' + xsEsc(r[0]) + '</span>'
    + '<span class="v">' + xsEsc(r[1]) + '</span></div>').join('');
}
/* 영웅 자료를 받아 빈 자리를 채운다. 못 받으면 **아무것도 안 적는다**(지어내지 않는다). */
async function xsFill() {
  const slots = document.querySelectorAll('.xs-slot:not([data-done])');
  if (!slots.length) return;
  const id = currentHeroId;
  const [h] = await Promise.all([xdexHero(id), xdexMeta()]);
  if (id !== currentHeroId) return;            // 그 사이에 다른 영웅으로 갔다
  XS_ITEM = {};
  if (h) {
    (h['기술'] || []).forEach(a => { if (a.id) XS_ITEM[a.id] = a; });
    (h['특성'] || []).forEach(t => { if (t.id) XS_ITEM[t.id] = t; });
  }
  document.querySelectorAll('.xs-slot:not([data-done])').forEach(el => {
    el.setAttribute('data-done', '1');
    const it = XS_ITEM[el.getAttribute('data-xs')];
    if (it) xsFillBox(el, it);
  });
}

      '<span class="xsg-n">스킬 ' + c.a.length + ' · 특성 ' + c.tl.length +
      '</span></summary>' +
      (c.src ? '<div class="xsg-src">XML 근거: ' + xsEsc(c.src) + '</div>' : '') +
      xsSkChips(c.a, '스킬') + xsSkChips(c.tl, '특성') + '</details>';
  });
  h += '<div class="xsg-h4">필드 표기 대응 (위키 상세 = XML 제원, 통일 표기)</div>' +
    '<table class="xs-table"><tr><th>통일 표기</th><td><b>이전 우리 표기</b>' +
    ' — XML 근거 — 관측 행수</td></tr>' +
    XS_GLOSS.rowsrc.map(r =>
      '<tr><th>' + xsEsc(r[0]) + '</th><td>' + xsEsc(r[1]) +
      ' — <span style="color:#9ab0c4">' + xsEsc(r[2]) + '</span>' +
      (r[3] ? ' — ' + r[3] + '행' : '') + '</td></tr>').join('') + '</table>';
  return h;
}
function xsFgColor(tag) {
  for (const k in XML_SPECS.a) {
    for (const r of (XML_SPECS.a[k].r || []))
      if (r[3] === tag) return r[4];
  }
  return '#8f8b81';
}
function xsEnsureGloss() {
  const page = document.getElementById('hero-page');
  if (!document.getElementById('xsg-anchor')) {
    const div = document.createElement('div');
    div.id = 'xsg-anchor';
    div.innerHTML = xsGlossHtml();
    (page.querySelector('.section') || page).appendChild(div);
  }
}
function xsGloss(term) {
  showGlossary();
  setTimeout(() => {
    xsEnsureGloss();
    const el = document.getElementById('xsg-' + xsSlug(term));
    if (el) {
      el.open = true;
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      document.querySelectorAll('.xsg-item.hl')
        .forEach(x => x.classList.remove('hl'));
      el.classList.add('hl');
    }
  }, 60);
}
function xsJump(hid, nid, name) {
  selectHero(hid);
  setTimeout(() => {
    let el = document.getElementById('talent-' + nid);
    if (!el) {
      const nm = [...document.querySelectorAll('#hero-page .ability-name')]
        .find(x => x.textContent.trim() === name);
      el = nm && nm.closest('.ability-item');
    }
    if (el) {
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      el.classList.add('xs-flash');
      setTimeout(() => el.classList.remove('xs-flash'), 1800);
    }
  }, 150);
}
document.addEventListener('click', e => {
  const sk = e.target.closest('.xsg-sk');
  if (sk) xsJump(sk.dataset.h, sk.dataset.i, sk.dataset.n);
});
function xsRows(rows) {
  return '<table class="xs-table">' + rows.map(r => {
    const cell = r[5]
      ? r[5].map(pc => '<span class="xs-pchip" style="--c:' + pc[1] +
          '" onclick="event.stopPropagation();xsGloss(\'' + pc[0] +
          '\')">' + pc[0] + '</span>').join('')
      : r[1];
    return '<tr><th>' +
      (r[3] ? '<span class="xs-fg" style="--c:' + r[4] +
        '" onclick="event.stopPropagation();xsGloss(\'' + r[3] + '\')">' +
        r[3] + '</span>' : '') +
      r[0] + '</th><td>' + cell +
      (r[2] ? ' <span class="xs-note">' + r[2] + '</span>' : '') +
      '</td></tr>';
  }).join('') + '</table>';
}
/* 표는 **위에 하나**뿐이다. 여기서는 '어느 항목인지' 만 적어 두고(자리표),
   `xsFill` 이 그 카드의 '상세 제원' 표를 우리 값으로 채운다. 아래에 따로 표를
   세우지 않는다 — 같은 기술에 표가 둘이면 어느 쪽을 봐야 할지 헷갈린다. */
function xsAbil(nameId, buttonId) {
  return xsSlot(nameId || buttonId, 'a');
}
function xsTal(nameId) {
  return xsSlot(nameId, 't');
}
/* 영웅 화면은 레벨을 바꿔도 다시 그려진다 — 그때마다 빈 자리를 채운다. */
(function () {
  const _render = window.renderHeroPage;
  window.renderHeroPage = function (keepScroll) {
    _render(keepScroll);
    xsFill();
  };
})();

/* **범위 그림은 도감과 같은 것으로.** 우리 자료에 도형이 있으면 `shared/shape.js` 가
   그린다(다이얼 셋 — 방향·겨냥·끌기 — 이 그대로 따라온다). 없으면 예전 그림으로. */
(function () {
  const _aoeWiki = window.openAoe;
  window.openAoe = function (buttonId, heroId) {
    const it = XS_ITEM[buttonId];
    const w = it && it['위키식'];
    if (!w || !((w['도형'] || []).length || w['그래프'])) return _aoeWiki(buttonId, heroId);
    const hero = XDEX.get(currentHeroId) || null;
    const meta = XMETA || {};
    document.getElementById('aoe-title').textContent = it['이름'] || buttonId;
    document.getElementById('aoe-sub').textContent =
      '게임 원본 XML · 격자 1칸 = 1단위' + (meta.build ? ' · 판 ' + meta.build : '');
    document.getElementById('aoe-body').innerHTML =
      window.hotsShape.svg(w, { hero: hero, yard: (meta['기준'] || {}) })
      + window.hotsShape.graph(w)
      + xsRows(xsSpecRows(w)) + xsDmgLine(it) + xsSumLine(it);
    document.getElementById('aoe-modal').classList.add('open');
  };
})();

// ---- hero-split: 영웅마다 나눈 자료(hero/<id>.json — pipeline/steps/split_encyclopedia.py) ----------
// 기술·특성·위키 상세 칸은 영웅을 열 때 그 영웅 것만 받는다. 그리는 함수(renderHeroPage)를 감싸
// 아직 안 받은 영웅이면 받은 뒤에 그린다 — 나머지 코드는 예전처럼 dataKO·wikiFields 를 바로 읽는다.
(function () {
  const got = {}, wait = {};
  function load(id) {
    if (got[id] || !dataKO[id] || dataKO[id].talents) return Promise.resolve();
    return wait[id] = wait[id] || fetch('hero/' + encodeURIComponent(id) + '.json')
      .then(r => r.ok ? r.json() : {}).catch(() => ({})).then(p => {
        const w = p.wiki || {}; delete p.wiki;
        Object.assign(dataKO[id], p);
        Object.entries(w).forEach(([k, r]) => {             // XML 범위 그림이 먼저 깔아 둔 칸은 그림만 살린다
          const cur = wikiFields.rows[k];
          wikiFields.rows[k] = cur && cur.geom && !r.geom ? Object.assign({}, r, {geom: cur.geom}) : r;
        });
        got[id] = true;
      });
  }
  const real = renderHeroPage;
  renderHeroPage = function (keepScroll) {
    const id = currentHeroId;
    if (!id || got[id] || !dataKO[id] || dataKO[id].talents) return real(keepScroll);
    const box = document.getElementById('hero-page');
    if (box && !keepScroll) box.innerHTML = '<p style="padding:24px;opacity:.7">불러오는 중…</p>';
    load(id).then(() => { if (currentHeroId === id) real(keepScroll); });
  };
})();

// ---- 뒤로 가기: 화면 전환을 히스토리에 쌓는다 --------------------------
(function () {
  const _sel = window.selectHero, _glo = window.showGlossary;
  let navDepth = 0;
  window.selectHero = function (id) {
    history.pushState({xsHero: id}, ''); navDepth++;
    _sel(id);
  };
  window.showGlossary = function () {
    history.pushState({xsGloss: 1}, ''); navDepth++;
    _glo();
  };
  window.addEventListener('popstate', e => {
    const st = e.state || {};
    if (st.xsHero) _sel(st.xsHero);
    else if (st.xsGloss) _glo();
    else {                                   // 홈 화면 복원
      currentHeroId = null;
      document.getElementById('hero-page').style.display = 'none';
      document.getElementById('welcome').style.display = '';
      window.scrollTo(0, 0);
    }
  });
  const b = document.createElement('button');
  b.id = 'xs-back';
  b.textContent = '← 이전';
  b.onclick = () => history.back();
  document.body.appendChild(b);
  // ?hero=<id> 로 들어오면 그 영웅을 바로 연다 — 위키 영웅 문서 맨 위 '번역본' 링크가 이 주소를 쓴다
  const want = new URLSearchParams(location.search).get('hero');
  if (want && typeof dataKO !== 'undefined' && dataKO[want]) {
    const go = () => { history.replaceState({xsHero: want}, ''); _sel(want); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  }
})();
</script>

<script src="../shared/scrap.js" defer></script>
