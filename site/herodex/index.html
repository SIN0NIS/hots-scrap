<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영웅 도감 · HotS Scrap</title>
<link rel="icon" href="../shared/favicon.svg">
<script src="../shared/search.js"></script>
<script src="../shared/shape.js"></script>
<script src="../shared/scrap.js" defer></script>
<style>
  :root {
    --bg:#f3f6fb; --card:#ffffff; --card2:#eef2f8; --line:#cdd9ea; --line2:#b6c6de;
    --fg:#122036; --dim:#5d6d84; --blue:#1758a8; --gold:#a97e1f; --gold-line:#d7b45c;
    --hit:#8a6414; --wiki:#7a3fb0; --warn:#b1562a; --foe:#c0392b; --ally:#1758a8; --both:#7a3fb0; --self:#17806d; --shadow:0 1px 3px rgba(18,32,54,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
      --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268; --gold-line:#8a6d2f;
      --hit:#f0c46a; --wiki:#c79cf0; --warn:#e0875b; --foe:#ff7b6b; --ally:#5aa8ff; --both:#c79cf0; --self:#4fd1b5; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
    --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268; --gold-line:#8a6d2f;
    --hit:#f0c46a; --wiki:#c79cf0; --warn:#e0875b; --foe:#ff7b6b; --ally:#5aa8ff; --both:#c79cf0; --self:#4fd1b5; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 14px 60px; display:flex; gap:14px;
          align-items:flex-start; }
  h1 { margin:0 0 4px; font-size:22px; } h1 .s { color:var(--gold); }
  .sub { margin:0 0 12px; color:var(--dim); font-size:13px; line-height:1.6; word-break:keep-all; }

  /* ── 영웅 목록 ─────────────────────────── */
  aside { width:200px; flex:0 0 200px; position:sticky; top:8px; }
  #q { width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
       background:var(--card); color:var(--fg); font-family:inherit; font-size:13px; }
  #list { margin-top:8px; max-height:calc(100vh - 110px); overflow:auto; background:var(--card);
          border:1px solid var(--line); border-radius:11px; padding:5px; box-shadow:var(--shadow); }
  #list button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--fg);
                 font:inherit; font-size:13.5px; padding:6px 9px; border-radius:7px; cursor:pointer; }
  #list button:hover { background:var(--card2); }
  #list button.on { background:var(--blue); color:#fff; }
  #list mark { background:none; color:var(--hit); font-weight:700; }

  /* ── 본문 ─────────────────────────────── */
  main { flex:1; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:13px 15px; margin-bottom:11px; box-shadow:var(--shadow); }
  .slot { display:inline-block; min-width:34px; padding:2px 8px; border-radius:7px; background:var(--blue);
          color:#fff; font-size:12px; font-weight:700; text-align:center; margin-right:8px; }
  .slot.d { background:#7a5bbd; } .slot.z { background:#2f8f6f; }
  .slot.r { background:var(--gold); color:#2a2104; } .slot.x { background:#5d6d84; }
  .nm { font-size:17px; font-weight:700; }
  .ico { width:40px; height:40px; border-radius:9px; border:1px solid var(--line2);
         vertical-align:middle; margin-right:9px; background:var(--card2); }
  .tico { width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
          vertical-align:middle; margin-right:7px; background:var(--card2); }
  .face { width:52px; height:52px; border-radius:11px; border:1px solid var(--line2);
          vertical-align:middle; margin-right:10px; background:var(--card2); }
  .hhead { display:flex; align-items:center; gap:2px; margin:0 0 2px; }
  .id { color:var(--dim); font-size:11.5px; margin-left:6px; }
  /* 비율 옆에 붙는 절대값 — 눈에 띄되 원래 값보다 조용하게 */
  /* 절대값 덧붙임 — 통째로 nowrap 이면 '(기본 68 → 81.6 · +13.6 / …)' 가 400px 한 줄이 되어
     폰에서 문서 전체를 옆으로 밀었다(레이너·라그나로스 등 21명). 항목 하나만 덩어리로 두고
     ' / ' 사이에서 접는다 */
  .abs { color:var(--dim); font-size:11.5px; margin-left:5px; }
  .abs > span { display:inline-block; max-width:100%; }   /* 칸보다 긴 항목(피닉스 167px)만 안에서 접힌다 */
  .desc { color:var(--dim); font-size:13.5px; margin:6px 0 9px; line-height:1.65; word-break:keep-all; }
  /* 메모 — 로컬에서만 뜬다. 이상한 걸 그 자리에 적어 두고 한꺼번에 내보낸다 */
  .mm { float:right; border:1px solid var(--line2); background:var(--card2); color:var(--dim);
        border-radius:7px; font:inherit; font-size:11px; padding:1px 7px; cursor:pointer; margin-left:6px; }
  .mm.on { border-color:var(--warn); color:var(--warn); }
  .mmbox { width:100%; box-sizing:border-box; margin-top:5px; min-height:48px; resize:vertical;
           border:1px solid var(--warn); border-radius:8px; background:var(--card2); color:var(--fg);
           font:inherit; font-size:12px; padding:6px 8px; }
  .mmhit { border-left:3px solid var(--warn); padding-left:7px; }
  /* 체크 — 글 안 쓰고 **한 번 눌러 표시만** 한다. 둘러보다 걸리는 걸 빨리 찍어 두는 용도 */
  .ck { float:right; border:1px solid var(--line2); background:var(--card2); color:var(--dim);
        border-radius:7px; font:inherit; font-size:11px; padding:1px 7px; cursor:pointer; margin-left:6px; }
  .ck.on { border-color:var(--warn); color:var(--warn); background:var(--warn-bg, transparent); }
  td.k[data-rk], .chip[data-rk] { cursor:pointer; }
  td.k[data-rk]:hover, .chip[data-rk]:hover { color:var(--warn); }
  td.k.ckon { color:var(--warn); font-weight:700; }
  td.k.ckon::before { content:"⚠ "; }
  td.k.ckon ~ td { background:var(--card2); }
  .chip.ckon { border-color:var(--warn); color:var(--warn); }
  .chip.ckon::before { content:"⚠ "; }
  /* 특성 강화 줄은 **글자가 곧 단추다** — 누르면 그 특성 자리로 간다.
     (메모 ⚠ 는 줄 끝의 작은 단추로 옮겼다 — 한 자리에 두 가지를 겹칠 수 없다.) */
  .up1 .t { cursor:pointer; }
  .up1 .t:hover .tnm, .up1 .t:focus-visible .tnm { color:var(--blue); text-decoration:underline; }
  .up1 .t:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:5px; }
  .rck { flex:0 0 auto; border:1px solid var(--line2); background:var(--card2); color:var(--dim);
         border-radius:6px; font:inherit; font-size:11px; line-height:1; padding:3px 5px;
         cursor:pointer; }
  .rck.ckon { border-color:var(--warn); color:var(--warn); }
  /* 특성의 '… 강화' — 그 특성이 키우는 기술 자리로 */
  .upgo { cursor:pointer; }
  .upgo:hover, .upgo:focus-visible { text-decoration:underline; }
  /* **왔던 자리로 돌아가는 단추.** 오른쪽 아래는 메모 바 자리라 왼쪽 아래에 띄운다. */
  #goback { position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
            z-index:99997; display:none; max-width:min(62vw, 320px); overflow:hidden;
            white-space:nowrap; text-overflow:ellipsis; border:1px solid var(--blue);
            border-radius:999px; background:var(--card2, var(--bg)); color:var(--blue);
            font:inherit; font-size:12.5px; padding:7px 13px; cursor:pointer;
            box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #goback.on { display:block; }
  #goback:hover { background:var(--blue-soft); }
  /* 좁은 화면에서는 메모 바가 아래를 가로질러 깔린다 — 그 위로 올린다 */
  @media (max-width:560px) {
    body.memoon #goback { bottom:calc(env(safe-area-inset-bottom, 0px) + 58px); }
  }
  #mmlist { position:fixed; right:14px; bottom:52px; z-index:99999; max-height:62vh; overflow:auto;
            width:min(420px, 92vw); background:var(--card); border:1px solid var(--line2);
            border-radius:12px; padding:10px 12px; box-shadow:var(--shadow); font-size:12.5px; }
  #mmlist h4 { margin:0 0 7px; font-size:12.5px; }
  #mmlist a { display:block; padding:3px 0; color:var(--fg); text-decoration:none; border-bottom:1px solid var(--line2); }
  #mmlist a:hover { color:var(--warn); }
  #mmlist .mrow { border-bottom:1px solid var(--line2); padding:4px 0; }
  #mmlist .mrow a { border:0; padding:1px 0; }
  #mmlist .mnote { width:100%; box-sizing:border-box; margin-top:3px; border:1px solid var(--line2);
                   border-radius:6px; background:var(--card2); color:var(--fg); font:inherit;
                   font-size:11.5px; padding:3px 6px; }
  #mmlist .mnote:focus { border-color:var(--warn); outline:none; }
  #mmlist .w { color:var(--warn); }
  #mmlist .n { color:var(--dim); }
  #mmbar { position:fixed; right:14px; bottom:14px; z-index:99998; display:flex; gap:6px;
           align-items:center; background:var(--card); border:1px solid var(--line2);
           border-radius:999px; padding:6px 10px; box-shadow:var(--shadow); font-size:12px; }
  #mmbar button { border:1px solid var(--line2); background:var(--card2); color:var(--fg);
                  border-radius:999px; font:inherit; font-size:12px; padding:3px 10px; cursor:pointer;
                  white-space:nowrap; }
  /* 폰 폭에서 '모아보/기'·'비우/기' 처럼 한 글자씩 떨어졌다 — 글자는 접지 않고 여백을 줄인다 */
  #mmbar #mmn { white-space:nowrap; }
  @media (max-width:420px) {
    #mmbar { right:8px; left:8px; justify-content:center; gap:4px; padding:5px 6px; }
    #mmbar button { padding:3px 8px; }
  }
  /* 기본 틀과 **특성이 더하는 것**을 눈으로 갈라 둔다 */
  .mode { display:inline-block; margin-right:5px; padding:1px 7px; border-radius:999px;
          border:1px solid var(--gold-line); color:var(--gold); font-size:11px; }
  .wep { margin:-4px 0 10px; font-size:12px; color:var(--fg); }
  .wep > b { color:var(--gold); font-weight:400; margin-right:6px; }
  .wep > div { color:var(--dim); }
  .qch { margin:4px 0; font-size:12px; color:var(--dim); }
  .qch > b { color:var(--gold); font-weight:400; }
  .qch b { color:var(--fg); }
  .acc { color:var(--hit); font-size:11px; margin-top:2px; }
  .per { color:var(--warn); font-size:11px; }
  .tipv { margin:4px 0 6px; }
  .tipv > b { display:block; font-size:11px; color:var(--dim); font-weight:400; margin-bottom:3px; }
  .tipv .chip b { color:var(--blue); }
  .ups { margin-top:8px; border-top:1px dashed var(--line2); padding-top:6px; }
  .ups > b { display:block; font-size:11px; color:var(--dim); font-weight:400; margin-bottom:4px; }
  .up1 { display:flex; gap:6px; align-items:flex-start; padding:3px 0; }
  .up1 img { width:22px; height:22px; border-radius:5px; flex-shrink:0; }
  .up1 .t { font-size:12px; }
  .up1 .lv { color:var(--gold); font-size:11px; margin-right:5px; white-space:nowrap; }
  .up1 .d { color:var(--hit); }
  /* 범위 그림(.fig·.cap·.c-*) 생김새는 ../shared/shape.css 에 있다 */
  .menu { display:flex; gap:4px; }
  .menu a { text-decoration:none; color:var(--dim); font-size:13px; padding:4px 12px;
            border:1px solid var(--line); border-radius:999px; background:var(--card); }
  .menu a.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:999px;
          padding:2px 10px; font-size:12.5px; }
  /* 칩이 글 줄을 따라 흘러서 '이동 속도 / 4.75' 처럼 칩 한가운데서 쪼개졌다.
     한 덩이(inline-block)로 두면 칩째로 다음 줄로 가고, 화면보다 긴 문장 칩만 안에서 접힌다
     (nowrap 으로 묶으면 그 긴 칩이 화면을 594px 로 밀어낸다) */
  .chip { display:inline-block; max-width:100%; box-sizing:border-box; word-break:keep-all;
          margin:1px 0; }
  .chip b { color:var(--hit); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  /* 긴 줄(거리별 감쇠·내부 이름)이 표를 가로로 밀어내지 않게 — 칸 안에서 접는다 */
  table { table-layout:fixed; }
  td { padding:3px 7px 3px 0; vertical-align:top; word-break:break-word; }
  td.k { color:var(--blue); font-weight:700; width:92px; overflow-wrap:anywhere;
         word-break:keep-all; }   /* '속도가 다른 까닭' 처럼 긴 이름은 접어 준다 */
  tr.minor { display:none; } .card.open tr.minor { display:table-row; }
  tr.minor td.k { color:var(--dim); font-weight:400; }
  td.src { color:var(--dim); font-size:11px; text-align:right; width:130px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  body.noid td.src { display:none; }
  /* 범위 그림은 **기본으로 접어 둔다.** 기술마다 한 장씩 들어가 목록이 길어지는데,
     표를 훑어 읽을 때는 거의 안 본다. 오른쪽 위 단추로 켠다(켠 상태는 기억해 둔다). */
  body.nofig .fig { display:none; }
  /* 기술 → 그 기술을 바꾸는 특성으로 데려가는 단추 */
  .goup { margin-left:auto; flex:0 0 auto; border:1px solid var(--line); border-radius:6px;
          background:var(--card2, var(--bg)); color:var(--dim); cursor:pointer;
          font:inherit; font-size:11px; line-height:1; padding:3px 7px; }
  .goup:hover { color:var(--blue); border-color:var(--blue); }
  @keyframes gohl { 0%,100% { background:transparent; } 25%,60% { background:var(--blue-soft); } }
  .hl { animation:gohl 1.4s ease; border-radius:10px; }
  .more { margin-top:6px; font-size:12px; padding:3px 10px; border-radius:7px; cursor:pointer;
          border:1px solid var(--line); background:var(--card2); color:var(--dim); font-family:inherit; }
  .lv { color:var(--gold); font-weight:700; }
  .talent { border-left:2px solid var(--line); padding-left:10px; margin:9px 0; }
  .talent .tn { font-weight:700; font-size:14.5px; }
  .up { color:var(--blue); font-size:12px; margin-left:6px; }
  .tdesc { color:var(--dim); font-size:12.5px; margin:3px 0 0; line-height:1.6; word-break:keep-all; }
  /* 위의 table-layout:fixed 를 물려받으면 width:auto 표는 칸 이름이 32px 로 쪼그라들어
     '보/정'·'유/형' 처럼 한 글자씩 세로로 섰다 — 이 표는 내용대로 칸을 나눈다
     (값 칸은 td 의 break-word 가 접어 주므로 옆으로 넘치지 않는다) */
  table.tt { width:auto; max-width:100%; margin-top:4px; table-layout:auto; }
  table.tt td { padding:1px 12px 1px 0; font-size:12.5px; }
  table.tt td.k { color:var(--dim); font-weight:400; width:auto; overflow-wrap:normal; }
  /* ↑ anywhere 면 칸의 최소 폭이 한 글자라 표가 이 칸을 짜부라뜨린다 — 낱말은 지킨다 */
  table.tt td.chg { color:var(--hit); }
  .wikirow { color:var(--wiki); } .warnrow { color:var(--warn); }
  .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .btn { font-family:inherit; font-size:12.5px; color:var(--dim); background:var(--card2);
         border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; }
  .slot.alt { background:transparent; color:var(--dim); border:1px dashed var(--line2); }
  .formblock { border:1px solid var(--line); border-radius:12px; padding:10px 12px 4px;
               margin:12px 0; background:var(--card2); }
  .formhead { color:var(--fg); font-size:13px; font-weight:700; margin-bottom:8px;
              display:flex; align-items:baseline; gap:8px; }
  .formhead .cnt { color:var(--dim); font-size:11.5px; font-weight:400; }
  /* 딸린 기술·다른 모습의 같은 자리 — 한 칸 들여 위아래를 보인다 */
  .card.sub { margin-left:16px; border-left:3px solid var(--line2); }
  .btn.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  @media (any-pointer:coarse) { #list button, .more, .btn { min-height:44px; } }
  @media (max-width:820px) {
    .wrap { flex-direction:column; }
    aside { width:100%; flex:none; position:static; }
    #list { max-height:170px; }
  }
  /* ── 영웅 고르는 첫 화면 ──────────────────────────────────────────────
     들어오자마자 D.Va 가 펼쳐져 있으면 "여기가 어디지" 가 된다. 위키 번역본처럼
     **얼굴을 깔아 두고 눌러 들어가게** 한다. 역할군 색은 통계 보기와 같은 값이다. */
  :root { --r-tank:#4c86ff; --r-bruiser:#15a0a0; --r-healer:#35a853;
          --r-support:#9a6ad8; --r-melee:#e2564a; --r-ranged:#d9478f; }
  .hgrp { margin:0 0 7px; display:flex; align-items:baseline; gap:7px; font-size:15px;
          font-weight:700; }
  .hgrp .dot { width:9px; height:9px; border-radius:50%; background:var(--rc,var(--dim)); }
  .hgrp .n { color:var(--dim); font-size:12px; font-weight:400; }
  .hgrid { display:grid; gap:9px; margin:0 0 18px;
           grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); }
  .hcard { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--rc,var(--line2));
           border-radius:11px; padding:9px 6px 8px; cursor:pointer; font:inherit; color:inherit;
           display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;
           box-shadow:var(--shadow); }
  .hcard:hover { border-color:var(--blue); border-top-color:var(--rc,var(--blue)); }
  .hcard img { width:56px; height:56px; border-radius:50%; background:var(--card2);
               border:2px solid var(--rc,var(--line2)); object-fit:cover; }
  .hcard .hn { font-size:12.5px; font-weight:600; line-height:1.3; word-break:keep-all; }
  .hcard .hc { font-size:10.5px; color:var(--dim); }
  @media (max-width:560px) { .hgrid { grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); }
    .hcard img { width:48px; height:48px; } }
  .back { display:none; }
  body.home .back { display:none; }
  body:not(.home) .back { display:inline-block; }
  body.home #figs, body.home #ids, body.home #meta { display:none; }
  /* ── 위키 문서처럼 ───────────────────────────────────────────────────────
     백과(encyclopedia)에 입힌 그 꼴을 여기에도 둔다 — 한 칸으로 흐르는 글, 제목 밑의
     가는 줄, 오른쪽 정보상자, 두 칸짜리 표, 줄로만 나뉘는 목록. 카드·그림자·둥근

  if (RATIO_KEYS.includes(k) && typeof v === 'number')
    return (v > 0 ? '+' : '') + (Math.round(v * 1000) / 10) + '%';
  /* **속이 또 사전인 칸**은 그냥 찍으면 `[object Object]` 가 된다 —

  let s2 = `${v.무엇에} ${v.단위} ${per > 0 ? '+' : ''}${per}`;

      const y = Math.max(base + x * per, floor);

/* 한국어 영웅 이름 → 목록에 있는 내부 이름 (모아보기에서 건너뛸 때 쓴다) */

function memoExport() {

    .sort((x, y) => (x.영웅 + x.id).localeCompare(y.영웅 + y.id));

/* **모습이 둘인 영웅은 칸을 나눠 보여 준다.** 디바는 메카 모드의 Q·W·E·R 과

        모습이고 조종사일 때는 탈것을 못 탄다 — 메카 쪽이 맞다. 다만 모드 없는 쪽이

function modeBlocks(list) {
  const groups = [];
  list.forEach((a, i) => {
    const m = a.모드 || '';
    const g = groups.find(x => x.m === m);
    if (g) g.list.push([i, a]); else groups.push({ m, list: [[i, a]] });
  });
  // ① 모드 없는 묶음이 앞이 아니면 첫 묶음에 합친다(합친 뒤 원래 차례로 되돌린다)
  const bare = groups.findIndex(g => !g.m);
  if (bare > 0) {
    groups[0].list = groups[0].list.concat(groups[bare].list).sort((x, y) => x[0] - y[0]);
    groups.splice(bare, 1);
  }
  // ③ 묶을 만한가 — 두 묶음 이상이 저마다 기술 두 장 넘게 있을 때만
  if (groups.length < 2 || groups.filter(g => g.list.length > 1).length < 2)
    return list.map(a => abilityHTML(a)).join('');

  let out = '';
  for (const g of groups) {
    const items = g.list.map(x => x[1]);
    // ② 궁극기 번호를 이 묶음 안에서 다시 센다
    const rs = items.filter(a => /^R\d*$/.test(a.칸));
    const num = new Map(rs.map((a, i) => [a, rs.length > 1 ? 'R' + (i + 1) : 'R']));
    const title = g.m ? `${esc(g.m)} 모드` : '평소 모습';
    out += `<div class="formblock"><div class="formhead">${title}`
         + `<span class="cnt">기술 ${items.length}개</span></div>`
         + items.map(a => abilityHTML(a, { slot: num.get(a), 묶음: true })).join('')
         + `</div>`;
  }
  return out;
}

/* ── 비율에 절대값을 붙인다 ───────────────────────────────────────────────
   특성은 "피해 +70%" 처럼 **비율만** 적어 둔다. 그것만 보면 얼마가 느는지 모른다 —
   기본값이 자료에 있으니 셈해서 같이 보인다(기본 59 → 100.3 · +41.3).
   기본값을 못 찾으면 **아무것도 덧붙이지 않는다.** 지어낸 수를 적느니 비율만 두는 게 낫다. */
const 숫자 = v => { const m = /-?\d+(?:\.\d+)?/.exec(String(v == null ? '' : v)); return m ? Number(m[0]) : null; };
const 깔끔 = n => Math.round(n * 100) / 100;

function 기본수(기술, 칸) {
  if (!기술) return null;
  if (칸 === '피해') {
    const r = (기술.피해 || []).filter(x => x && x.피해량 != null);
    if (!r.length) return null;
    return 숫자(r.map(x => x.피해량).sort((a, b) => 숫자(b) - 숫자(a))[0]);
  }
  if (칸 === '회복' || 칸 === '치유') {
    for (const x of (기술.회복 || [])) {
      const v = x['생명력 회복량'] != null ? x['생명력 회복량'] : x['마나 회복량'];
      if (v != null) return 숫자(v);
    }
  }
  return null;
}

/* `강화` 는 `"[E] 눈부신 방패"` 꼴이다 — 칸 표식을 떼고 이름으로 찾는다. */
function 키우는기술(t) {
  const nm = String(t['강화'] || '').replace(/^\[[^\]]*\]\s*/, '').trim();
  if (!nm || !HERO) return null;
  return (HERO.기술 || []).find(a => a.이름 === nm) || null;
}

/* **어느 값에 붙는 보정인가**는 갈래가 말해 준다.
     `피해 +70%`   키우는 기술의 피해에 붙는다(열성의 섬광 → 눈부신 방패 59)
     `중첩당 40%`  그 특성이 제 손으로 주는 피해에 붙는다(신성한 격노 제 피해 15)
   섞어 쓰면 규탄의 55 로 신성한 격노를 셈하는 거짓말이 된다. */
function 절대값(보정글, 기술, 제것) {
  if (!보정글 || (!기술 && !제것)) return '';
  const 덧 = [];
  for (const c of String(보정글).split(' · ')) {
    let m = /^(피해|회복|치유)\s*([+-])(\d+(?:\.\d+)?)%$/.exec(c.trim());
    if (m) {
      const 기본 = 기본수(기술, m[1]) != null ? 기본수(기술, m[1]) : 숫자(제것);
      if (기본 == null) continue;
      const 몫 = 기본 * Number(m[3]) / 100 * (m[2] === '-' ? -1 : 1);
      덧.push(`기본 ${깔끔(기본)} → ${깔끔(기본 + 몫)} · ${몫 >= 0 ? '+' : ''}${깔끔(몫)}`);
      continue;
    }
    // 중첩으로 쌓이는 것 — 한 겹과 끝까지 쌓았을 때를 둘 다 적는다
    m = /^중첩당\s*(\d+(?:\.\d+)?)%(?:\s*\(최대\s*(\d+(?:\.\d+)?)%\))?$/.exec(c.trim());
    if (m) {
      // 중첩은 **제 피해**에 쌓인다 — 없으면 키우는 기술의 피해로 본다
      const 기본 = 제것 != null ? 숫자(제것) : 기본수(기술, '피해');
      if (기본 == null) continue;
      const 한겹 = 기본 * Number(m[1]) / 100;
      /* **터진 천장으로 '끝까지' 를 적지 않는다.** `최대 327675%` 는 누산기의 느슨한
         천장이지 실제 상한이 아니다 — 그대로 곱하면 20만짜리 피해가 적힌다. */
      const 끝 = m[2] && Number(m[2]) < 1000 ? 깔끔(기본 * Number(m[2]) / 100) : null;
      덧.push(끝 != null
        ? `기본 ${깔끔(기본)} · 한 겹 +${깔끔(한겹)} · 끝까지 +${끝}`
        : `기본 ${깔끔(기본)} · 한 겹 +${깔끔(한겹)}`);
    }
  }
  return 덧.length ? ` <span class="abs">(${덧.map(x => `<span>${esc(x)}</span>`).join(' / ')})</span>` : '';
}

function talentHTML(t) {
  const ti = t.id || t.이름;
  const rows = (t.퀘스트 ? `<tr><td class="k chg${ckC('특성칸', ti, '퀘스트')}"`
      + `${ckA('특성칸', ti, '퀘스트', (t.이름 || '') + ' / 퀘스트')}>퀘스트</td>`
      + `<td>${esc(t.퀘스트)}</td></tr>` : '')
    // 바뀌는 값은 줄마다 다른 칸이라 **몇 번째 줄인지**까지 열쇠에 담는다

      `<tr><td class="k chg${ckC('특성칸', ti, '바뀌는 값#' + i)}"`
      + `${ckA('특성칸', ti, '바뀌는 값#' + i, (t.이름 || '') + ' / ' + v)}>바뀌는 값</td>`
      + `<td>${esc(v)}</td></tr>`).join('')
    + Object.entries(t.위키식 || {}).filter(([k]) => !FIGKEY.includes(k)).map(([k, v]) =>
      `<tr><td class="k${ckC('특성칸', ti, k)}"${ckA('특성칸', ti, k, (t.이름 || '') + ' / ' + k)}>${esc(k)}</td>`
      // **비율만 적힌 보정에는 절대값을 같이 보인다** — 키우는 기술의 기본값으로 셈한다
      + `<td><b>${esc(v)}</b>`
      + (k === '보정' ? 절대값(v, 키우는기술(t), (t.위키식 || {})['피해']) : '')
      + `</td></tr>`).join('')
    + (t.위키 ? `<tr><td class="k wikirow">⌁ 위키</td><td class="wikirow">`
        + Object.entries(t.위키).filter(([k]) => k !== '출처').map(([k, v]) => `${esc(k)} ${esc(v)}`).join(' · ')
        + `</td></tr>` : '')
    + (t.예외 ? `<tr><td class="k warnrow">⚠ 예외</td><td class="warnrow">${esc(t.예외)}</td></tr>` : '');
  return `<div class="talent" data-zi="${esc(t.id || t.이름)}"><div>`
    + `<img class="tico" src="${imgUrl('abilitytalents', t.아이콘)}" alt="" `
    + `loading="lazy"><span class="tn">${esc(t.이름)}</span>`
    /* **거꾸로도 간다** — 특성에서 그 특성이 키우는 기술 자리로.
       기술을 못 찾으면(이름이 어긋나면) 누를 수 없는 글자로 그냥 둔다. */
    + (t.강화 ? (키우는기술(t)
        ? `<span class="up upgo" data-go="${esc(키우는기술(t).id)}" role="button" tabindex="0"`
          + ` title="누르면 그 기술 자리로">${esc(t.강화)} 강화</span>`
        : `<span class="up">${esc(t.강화)} 강화</span>`) : '')
    + memoBtn('특성', t.id || t.이름, t.이름) + `</div>`
    + (t.설명 ? `<div class="tdesc">${esc(t.설명)}</div>` : '')
    + tipHTML(t['툴팁 수치'], t.id || t.이름, t.이름)
    + (rows ? `<table class="tt">${rows}</table>` : '') + shapeSVG(t.위키식) + `</div>`;
}
/* 평타 — 사거리·주기·공격력·근접인지 원거리인지. 특성·퀘스트를 **전부 끈** 기본값이다. */
function weaponHTML(ws) {
  if (!ws || !ws.length) return '';
  const rows = ws.map((w, wi) => {
    const bits = [w.방식,
                  w.사거리 != null ? `사거리 ${w.사거리}` : '',
                  w.공격력 != null ? `공격력 ${w.공격력}` : '',
                  w.주기 != null ? `주기 ${w.주기}초 (초당 ${w['초당 공격']}회)` : '',
                  w.부채꼴 ? `부채꼴 ${w.부채꼴}도` : '',
                  w.스플래시 ? `스플래시 반지름 ${w.스플래시}` : ''].filter(Boolean);
    // 평타도 조각마다 따로 찍을 수 있어야 한다(사거리는 맞는데 주기가 틀릴 수 있다)
    return '<div>' + bits.map((b2, bi) =>
      `<span class="chip${ckC('평타', wi, bi)}"${ckA('평타', wi, bi, '평타 / ' + b2)}>${esc(b2)}</span>`
    ).join('') + '</div>';
  }).join('');
  return `<div class="wep"><b>평타</b>${rows}</div>`;
}
/* ── 크게 보기 ────────────────────────────────────────────────────────────
   큰 판·다이얼·설명 자리는 **shared/shape.js** 가 가진다(범위 구경도 같은 것을 쓴다).
   여기서는 "이 그림이 무엇인가" 만 대 준다 — 자료는 이미 손에 있으니 설명도 바로 준다.
   `data-zi` 는 기술 카드와 특성 칸에 달아 둔 **그 항목의 id** 다. */
function wireZoom() {
  window.hotsShape.크게(fig => {
    const host = fig.closest('[data-zi]');
    if (!host || !HERO) return null;
    const tal = host.classList.contains('talent');
    const x = (tal ? HERO.특성 : HERO.기술).find(v => (v.id || v.이름) === host.dataset.zi);
    if (!x) return null;
    return {
      '꼬리표': tal ? `<span class="slot lv">${esc(x.레벨 || '?')}레벨</span>`
              : `<span class="slot ${slotClass(x.칸)}">${esc(x.칸 || '')}</span>`,
      '앞말': tal && x.강화 ? x.강화 + ' 강화' : '',
      '이름': x.이름 || '',
      '영웅': HERO.영웅 || '',
      '링크': 'shapes.html?hero=' + encodeURIComponent(cur || ''),
      '링크글': '범위 구경 ↗',
      '설명': x.설명 || null,
      '칸들': Object.entries(x.위키식 || {}).filter(([k]) => !FIGKEY.includes(k))
                .map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join(''),
    };
  });
}

function render(h) {
  HERO = h;
  // 본문을 갈아엎으면 돌아갈 자리가 사라진다 — 단추도 같이 치운다
  if (typeof 돌아갈곳 !== 'undefined') { 돌아갈곳.length = 0; 돌아가기칸(); }
  // 크게 보기로 **옮겨 가 있는 그림**이 있으면 먼저 돌려놓는다 — 본문을 갈아엎으면
  // 돌려놓을 자리(주석 마디)가 사라져 그림이 큰 판에 갇힌다.
  if (window.hotsShape.크게중()) window.hotsShape.크게끄기();
  /* **능력치는 칩이 아니라 정보상자다.** 위키 문서가 그렇듯 이름 | 값 줄로 세워 두면
     훑어 읽힌다(칩은 줄바꿈 자리가 제멋대로라 눈이 걸린다). 메모 열쇠는 그대로 둔다. */
  const base = Object.entries(h.기본).filter(([k, v]) => v != null && k !== '평타')
      .map(([k, v]) => `<div class="srow"><span class="sk${ckC('기본', '영웅', k)}"`
         + `${ckA('기본', '영웅', k, '기본 / ' + k)}>${esc(k)}</span>`
         + `<span class="sv">${esc(v)}</span></div>`).join('');
  const meta = (INDEX || []).find(x => x.id === cur) || {};
  const tags = [meta.역할, h.기술 ? h.기술.length + '기술' : '', h.특성 ? h.특성.length + '특성' : '']
      .filter(Boolean).map(t => `<span class="htag">${esc(t)}</span>`).join('');
  let out = `<div class="hhead"><img class="face" src="${imgUrl('heroportraits', h.초상화)}" alt="">`
    + `<div><h2 style="margin:0">${esc(h.영웅)}</h2><div class="htags">${tags}</div></div></div>`
    + `<div class="hbody"><div class="hmain">`
    + `<section class="sec"><h3 class="sec-h">기술</h3>${modeBlocks(h.기술)}</section>`;
  let lv = null, tal = '';
  for (const t of h.특성) {
    if (t.레벨 !== lv) {
      if (lv !== null) tal += '</div>';
      lv = t.레벨;
      tal += `<div class="tlv"><div class="lvh">${esc(lv || '?')}레벨</div>`;
    }
    tal += talentHTML(t);
  }
  if (lv !== null) tal += '</div>';
  out += `<section class="sec"><h3 class="sec-h">특성</h3>${tal}</section></div>`
    + `<aside class="hside"><section class="sec"><h3 class="sec-h">능력치</h3>`
    + `<div class="statbox">${base}</div>${weaponHTML(h.기본.평타)}</section></aside></div>`;
  $('#body').innerHTML = out;
  if (MEMO_ON) {
    $('#body').querySelectorAll('.mm.on, .ck.on').forEach(b2 => {
      const host = b2.closest('.card, .talent');
      if (host) host.classList.add('mmhit');
    });
    memoBar();
  }
  $('#meta').textContent = h.자료;
  wireZoom();                       // 그림 안의 ⤢ 를 꺼내 준다(한 번만 걸린다)
  window.scrollTo(0, 0);
}
/* ── 영웅 고르는 첫 화면 ──────────────────────────────────────────────────
   들어오자마자 첫 영웅(D.Va)이 펼쳐져 있으면 "여기가 어디지" 가 된다. 위키 번역본처럼
   **얼굴을 역할군으로 깔아 두고** 눌러 들어가게 한다. 자료는 이미 받아 둔 목록
   (`index.json`)에 다 있다 — 얼굴·역할군·기술 수·특성 수. 요청이 더 늘지 않는다. */
const ROLES = ['전사', '투사', '근접 암살자', '원거리 암살자', '치유사', '지원가'];
const RC = { '전사': 'var(--r-tank)', '투사': 'var(--r-bruiser)', '치유사': 'var(--r-healer)',
             '지원가': 'var(--r-support)', '근접 암살자': 'var(--r-melee)',
             '원거리 암살자': 'var(--r-ranged)' };

function renderHome(v) {
  cur = null;
  document.body.classList.add('home');
  [...document.querySelectorAll('#list button')].forEach(b => b.classList.remove('on'));
  // 검색창은 **옆 목록과 얼굴판을 같이** 거른다 — 고르는 화면에서 옆 목록만 좁아지면
  // 눈이 가 있는 쪽(얼굴판)은 그대로라 "검색이 안 먹네" 로 읽힌다.
  const hit = (v || '').trim()
    ? window.scrapSearch.filter(INDEX, v, h => [h.name, h.id]) : INDEX;
  const by = new Map();
  for (const h of hit) {
    const r = ROLES.includes(h.역할) ? h.역할 : '그 밖';
    if (!by.has(r)) by.set(r, []);
    by.get(r).push(h);
  }
  const order = ROLES.filter(r => by.has(r)).concat(by.has('그 밖') ? ['그 밖'] : []);
  if (!order.length) { $('#body').innerHTML = '<p class="sub">찾는 영웅이 없습니다.</p>'; return; }
  $('#body').innerHTML = order.map(r => {
    const col = RC[r] ? ` style="--rc:${RC[r]}"` : '';
    return `<h2 class="hgrp"${col}><span class="dot"></span>${esc(r)}`
      + `<span class="n">${by.get(r).length}명</span></h2>`
      + `<div class="hgrid">` + by.get(r).map(h =>
          `<button type="button" class="hcard scrap-tap" data-id="${esc(h.id)}"${col}>`
          + `<img src="${imgUrl('heroportraits', h.초상화)}" alt="" loading="lazy">`
          + `<span class="hn">${esc(h.name)}</span>`
          + `<span class="hc">기술 ${h.기술 || 0} · 특성 ${h.특성 || 0}</span></button>`).join('')
      + `</div>`;
  }).join('');
  $('#meta').textContent = '';
  window.scrollTo(0, 0);
}

function goHome() {
  if (window.hotsShape.크게중()) window.hotsShape.크게끄기();
  history.replaceState(null, '', './');
  renderHome($('#q').value);
}

async function pick(id, push) {
  document.body.classList.remove('home');
  cur = id;
  [...document.querySelectorAll('#list button')].forEach(b => b.classList.toggle('on', b.dataset.id === id));
  if (!CACHE.has(id)) {
    $('#body').innerHTML = '<p class="sub">불러오는 중…</p>';
    // 영웅 자료도 목록과 같은 이유로 '바뀌었냐' 고 물어보고 받는다. 안 바뀌었으면 304 라
    // 본문을 안 받는다 — 올린 변경이 10분 동안 안 보이는 일을 막는다.
    const r = await fetch(`../data/herodex/${id}.json`, { cache: 'no-cache' });
    if (!r.ok) { $('#body').innerHTML = '<p class="sub">자료를 불러오지 못했습니다.</p>'; return; }
    CACHE.set(id, await r.json());
  }
  render(CACHE.get(id));
  if (push) history.replaceState(null, '', `?hero=${encodeURIComponent(id)}`);
}
function renderList(v) {
  const hit = window.scrapSearch.filter(INDEX, v, h => [h.name, h.id]);
  $('#list').innerHTML = hit.map(h =>
      `<button data-id="${esc(h.id)}" class="${h.id === cur ? 'on' : ''}">`
      + window.scrapSearch.mark(h.name, v) + `</button>`).join('')
    || '<div class="sub" style="padding:8px">없습니다</div>';
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b) pick(b.dataset.id, true);
});
$('#body').addEventListener('click', e => {
  const b = e.target.closest('.hcard[data-id]');
  if (b) pick(b.dataset.id, true);
});
$('#home').addEventListener('click', goHome);
$('#q').addEventListener('input', e => {
  renderList(e.target.value);
  if (document.body.classList.contains('home')) renderHome(e.target.value);
});
$('#body').addEventListener('click', e => {
  const b = e.target.closest('.more');
  if (!b) return;
  const card = b.closest('.card');
  card.classList.toggle('open');
  b.textContent = card.classList.contains('open') ? '원자료 접기'
    : b.textContent.replace('접기', '보기');
});
$('#ids').addEventListener('click', () => document.body.classList.toggle('noid'));
/* ── 기술 ↔ 특성 오가기 ────────────────────────────────────────────────────
   같은 화면 안에 있으므로 옮겨 가는 게 아니라 **그 자리로 데려가고 잠깐 밝힌다**
   — 어디로 갔는지 보이게. 그리고 **왔던 자리로 돌아가는 단추**를 띄운다:
   긴 영웅은 화면이 길어서, 보고 나서 기술까지 되올라가는 것이 일이다. */
const 돌아갈곳 = [];                     // 여러 번 뛰어다녀도 차례로 되짚어 간다
function 자리찾기(id) {
  const q = CSS.escape(id);
  return document.querySelector(`.card[data-zi="${q}"], .talent[data-zi="${q}"]`);
}
function 밝히기(el) {
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('hl');
  void el.offsetWidth;                 // 애니메이션을 다시 틀려면 한 번 끊어야 한다
  el.classList.add('hl');
}
function 자리이름(el) {
  const n = el.querySelector(':scope > div > .nm, :scope > div > .tn');
  return n ? n.textContent.trim() : (el.dataset.zi || '');
}
/* '…로/으로' — 받침이 없거나 ㄹ 이면 '로' 다(방패로 · 징벌로 · 규탄으로). */
function 로으로(w) {
  const t = String(w || '');
  const c = t.charCodeAt(t.length - 1);
  if (!(c >= 0xac00 && c <= 0xd7a3)) return '로';
  const j = (c - 0xac00) % 28;
  return (j === 0 || j === 8) ? '로' : '으로';
}
function 돌아가기칸() {
  const b = document.getElementById('goback');
  if (!b) return;
  const 끝 = 돌아갈곳[돌아갈곳.length - 1];
  b.classList.toggle('on', !!끝);
  if (끝) b.textContent = `← ${끝.이름}${로으로(끝.이름)} 돌아가기`;
}
function 뛰기(id, 시작) {
  const el = 자리찾기(id);
  if (!el) return;
  const 집 = 시작 && 시작.closest('.card[data-zi], .talent[data-zi]');
  if (집 && 집 !== el) {
    // **같은 자리를 거듭 쌓지 않는다** — 한 기술에서 특성 넷을 차례로 봐도 돌아갈 곳은 하나다
    const 끝 = 돌아갈곳[돌아갈곳.length - 1];
    if (!끝 || 끝.id !== 집.dataset.zi) 돌아갈곳.push({ id: 집.dataset.zi, 이름: 자리이름(집) });
  }
  밝히기(el);
  돌아가기칸();
}
$('#body').addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  뛰기(b.getAttribute('data-go'), b);
});
/* 글자를 눌러서 가는 자리는 **글쇠로도** 가야 한다(탭으로 짚고 엔터·스페이스). */
$('#body').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest('[data-go][role="button"]');
  if (!b) return;
  e.preventDefault();
  뛰기(b.getAttribute('data-go'), b);
});
const 돌아가기단추 = document.createElement('button');
돌아가기단추.id = 'goback';
돌아가기단추.type = 'button';
돌아가기단추.title = '왔던 자리로';
돌아가기단추.addEventListener('click', () => {
  const 곳 = 돌아갈곳.pop();
  돌아가기칸();
  if (!곳) return;
  const el = 자리찾기(곳.id);
  if (el) 밝히기(el);
});
document.body.appendChild(돌아가기단추);
if (MEMO_ON) document.body.classList.add('memoon');   // 메모 바를 피해 앉으려고
/* 범위 그림 켜고 끄기. 앱 격리 규약대로 열쇠는 `herodex.` 로 시작한다. */
const FIG_KEY = 'herodex.figs';
function figsPaint() {
  const on = !document.body.classList.contains('nofig');
  $('#figs').textContent = on ? '범위 숨기기' : '범위 보이기';
  $('#figs').classList.toggle('on', on);
}
$('#figs').addEventListener('click', () => {

    document.body.classList.contains('nofig') ? '0' : '1'); } catch (e) {}

});
/* 체크 — **한 번 누르면 ⚠, 다시 누르면 해제**. 글을 안 써도 되니 둘러보며 빨리 찍는다.
   ⑴ 기술·특성 오른쪽의 ⚠ 단추 ⑵ 표의 칸 이름(피해·범위 …) ⑶ 특성 강화 줄. */
$('#body').addEventListener('click', e => {
  const btn = e.target.closest('.ck');
  if (btn) {
    const on = ckToggle(btn.dataset.ck, btn.dataset.nm, btn, 'on');
    btn.textContent = '⚠' + (on ? ' 이상' : '');
    const host = btn.closest('.card, .talent');
    if (host) host.classList.toggle('mmhit', on || host.querySelector(':scope > .mmbox'));
    return;
  }
  // **열쇠가 붙은 칸이면 어디든** 누르는 대로 켜고 끈다 — 칩이든 표의 칸 이름이든.
  const cell = e.target.closest('[data-rk]');
  if (!cell) return;
  ckToggle(cell.dataset.rk, cell.dataset.nm, cell,
           cell.classList.contains('up1') ? 'ckrow' : 'ckon');
});
/* 메모 단추 → 그 자리에 적는 칸. 적는 대로 이 브라우저에 저장한다(서버가 없어도 된다). */
$('#body').addEventListener('click', e => {
  const b2 = e.target.closest('.mm');
  if (!b2) return;
  const key = b2.dataset.mm, host = b2.closest('.card, .talent');
  let box = host.querySelector(':scope > .mmbox');
  if (box) { box.remove(); return; }
  box = document.createElement('textarea');
  box.className = 'mmbox';
  box.placeholder = '이상한 점을 적어 두세요 (적는 대로 저장됩니다)';
  box.value = (MEMO[key] && MEMO[key].메모) || '';
  box.addEventListener('input', () => {
    MEMO[key] = { 이름: b2.dataset.nm, 메모: box.value };
    if (!box.value.trim()) delete MEMO[key];
    memoSave();
    const has = !!box.value.trim();
    b2.classList.toggle('on', has);
    b2.textContent = has ? '메모 있음' : '메모';
    host.classList.toggle('mmhit', has);
    memoBar();
  });
  host.appendChild(box);
  box.focus();
});
/* 이미지 저장소가 아직 안 채운 아이콘은 **깨진 그림** 대신 빈 칸으로 둔다.
   (이미 난 404 를 가리는 것이라 요청이 늘지 않는다 — 폴백으로 다시 부르지 않는다) */
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.src !== BLANK) t.src = BLANK;
}, true);

(async function boot() {
  document.body.classList.add('noid');     /* 내부 이름은 필요할 때만 */
  /* **범위는 기본으로 펴 둔다.** 이 도감의 알맹이가 그림인데 접어 두면, 처음 온 사람은
     — 특히 머리의 단추가 눈에 잘 안 띄는 손전화에서는 — 범위가 아예 없는 줄 안다.
     한 영웅에 많아야 열다섯 장이라 펴 둬도 무겁지 않다. 접은 적이 있으면 그 뜻을 따른다. */
  let figOn = '1';
  try { figOn = localStorage.getItem(FIG_KEY) || '1'; } catch (e) {}
  if (figOn !== '1') document.body.classList.add('nofig');
  figsPaint();
  const [r, ri] = await Promise.all([
    fetch('../data/herodex/index.json', { cache: 'no-cache' }),
    fetch('../images/index.json', { cache: 'no-cache' }).catch(() => null),
  ]);
  const d = await r.json();
  INDEX = d.heroes;
  YARD = d.기준 || {};          /* 범위 그림에 깔 눈금 */
  if (ri && ri.ok) {
    const im = await ri.json();
    LOCAL = new Set(im.files || []);
    MISS = new Set(im.missing || []);
  }
  renderList('');
  // **주소에 영웅이 없으면 고르는 화면이다.** 예전에는 첫 영웅을 펼쳐 놓아서,
  // 들어온 사람이 "왜 D.Va 가 떠 있지" 하고 멈췄다.
  const qs = new URLSearchParams(location.search), want = qs.get('hero'), at = qs.get('at');
  if (INDEX.some(h => h.id === want)) {
    await pick(want, false);
    // 통계 보기에서 값 한 줄을 누르고 왔으면 그 기술·특성으로 데려가 잠깐 밝힌다
    const el = at && 자리찾기(at);
    // 막 열린 화면이라 부드럽게 굴리지 않고 바로 그 자리로 — 그림·글꼴이 자리 잡은 뒤에
    if (el) setTimeout(() => { el.scrollIntoView({ block: 'center' }); 밝히기(el); }, 80);
  }
  else renderHome();
})();
</script>
