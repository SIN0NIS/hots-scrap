<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영웅 도감 · HotS Scrap</title>
<link rel="icon" href="../shared/favicon.svg">
<script src="../shared/search.js"></script>
<script src="../shared/scrap.js" defer></script>
<style>
  :root {
    --bg:#f3f6fb; --card:#ffffff; --card2:#eef2f8; --line:#cdd9ea; --line2:#b6c6de;
    --fg:#122036; --dim:#5d6d84; --blue:#1758a8; --gold:#a97e1f; --gold-line:#d7b45c;
    --hit:#8a6414; --wiki:#7a3fb0; --warn:#b1562a; --shadow:0 1px 3px rgba(18,32,54,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
      --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268; --gold-line:#8a6d2f;
      --hit:#f0c46a; --wiki:#c79cf0; --warn:#e0875b; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
    --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268; --gold-line:#8a6d2f;
    --hit:#f0c46a; --wiki:#c79cf0; --warn:#e0875b; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 14px 60px; display:flex; gap:14px;
          align-items:flex-start; }
  h1 { margin:0 0 4px; font-size:22px; } h1 .s { color:var(--gold); }
  .sub { margin:0 0 12px; color:var(--dim); font-size:13px; line-height:1.6; }

  /* ── 영웅 목록 ─────────────────────────── */
  aside { width:200px; flex:0 0 200px; position:sticky; top:8px; }
  #q { width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
       background:var(--card); color:var(--fg); font-family:inherit; font-size:13px; }
  #list { margin-top:8px; max-height:calc(100vh - 110px); overflow:auto; background:var(--card);
          border:1px solid var(--line); border-radius:11px; padding:5px; box-shadow:var(--shadow); }
  #list button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--fg);
                 font:inherit; font-size:13.5px; padding:6px 9px; border-radius:7px; cursor:pointer; }
  #list button:hover { background:var(--card2); }
  #list button.on { background:var(--blue); color:#fff; }
  #list mark { background:none; color:var(--hit); font-weight:700; }

  /* ── 본문 ─────────────────────────────── */
  main { flex:1; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:13px 15px; margin-bottom:11px; box-shadow:var(--shadow); }
  .slot { display:inline-block; min-width:34px; padding:2px 8px; border-radius:7px; background:var(--blue);
          color:#fff; font-size:12px; font-weight:700; text-align:center; margin-right:8px; }
  .slot.d { background:#7a5bbd; } .slot.z { background:#2f8f6f; }
  .slot.r { background:var(--gold); color:#2a2104; } .slot.x { background:#5d6d84; }
  .nm { font-size:17px; font-weight:700; }
  .ico { width:40px; height:40px; border-radius:9px; border:1px solid var(--line2);
         vertical-align:middle; margin-right:9px; background:var(--card2); }
  .tico { width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
          vertical-align:middle; margin-right:7px; background:var(--card2); }
  .face { width:52px; height:52px; border-radius:11px; border:1px solid var(--line2);
          vertical-align:middle; margin-right:10px; background:var(--card2); }
  .hhead { display:flex; align-items:center; gap:2px; margin:0 0 2px; }
  .id { color:var(--dim); font-size:11.5px; margin-left:6px; }
  .desc { color:var(--dim); font-size:13.5px; margin:6px 0 9px; line-height:1.65; word-break:keep-all; }
  /* 메모 — 로컬에서만 뜬다. 이상한 걸 그 자리에 적어 두고 한꺼번에 내보낸다 */
  .mm { float:right; border:1px solid var(--line2); background:var(--card2); color:var(--dim);
        border-radius:7px; font:inherit; font-size:11px; padding:1px 7px; cursor:pointer; margin-left:6px; }
  .mm.on { border-color:var(--warn); color:var(--warn); }
  .mmbox { width:100%; box-sizing:border-box; margin-top:5px; min-height:48px; resize:vertical;
           border:1px solid var(--warn); border-radius:8px; background:var(--card2); color:var(--fg);
           font:inherit; font-size:12px; padding:6px 8px; }
  .mmhit { border-left:3px solid var(--warn); padding-left:7px; }
  #mmbar { position:fixed; right:14px; bottom:14px; z-index:99998; display:flex; gap:6px;
           align-items:center; background:var(--card); border:1px solid var(--line2);
           border-radius:999px; padding:6px 10px; box-shadow:var(--shadow); font-size:12px; }
  #mmbar button { border:1px solid var(--line2); background:var(--card2); color:var(--fg);
                  border-radius:999px; font:inherit; font-size:12px; padding:3px 10px; cursor:pointer; }
  /* 기본 틀과 **특성이 더하는 것**을 눈으로 갈라 둔다 */
  .tipv { margin:4px 0 6px; }
  .tipv > b { display:block; font-size:11px; color:var(--dim); font-weight:400; margin-bottom:3px; }
  .tipv .chip b { color:var(--blue); }
  .ups { margin-top:8px; border-top:1px dashed var(--line2); padding-top:6px; }
  .ups > b { display:block; font-size:11px; color:var(--dim); font-weight:400; margin-bottom:4px; }
  .up1 { display:flex; gap:6px; align-items:flex-start; padding:3px 0; }
  .up1 img { width:22px; height:22px; border-radius:5px; flex-shrink:0; }
  .up1 .t { font-size:12px; }
  .up1 .lv { color:var(--gold); font-size:11px; margin-right:4px; }
  .up1 .d { color:var(--hit); }
  /* 범위 그림 — 한 칸이 게임 거리 1 이다 */
  .fig { margin:7px 0 2px; }
  .fig svg { display:block; max-width:100%; height:auto; border:1px solid var(--line);
             border-radius:8px; background:var(--card2); }
  .fig .cap { color:var(--dim); font-size:11px; margin-top:3px; line-height:1.7; }
  .fig .cap b { font-weight:400; }
  .c-hero { color:var(--hit); } .c-rng { color:var(--gold); }
  .c-area { color:var(--blue); } .c-yard { color:var(--wiki); } .c-hit { color:var(--warn); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:999px;
          padding:2px 10px; font-size:12.5px; }
  .chip b { color:var(--hit); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td { padding:3px 7px 3px 0; vertical-align:top; }
  td.k { color:var(--blue); font-weight:700; white-space:nowrap; width:92px; }
  tr.minor { display:none; } .card.open tr.minor { display:table-row; }
  tr.minor td.k { color:var(--dim); font-weight:400; }
  td.src { color:var(--dim); font-size:11px; text-align:right; white-space:nowrap; }
  body.noid td.src { display:none; }
  .more { margin-top:6px; font-size:12px; padding:3px 10px; border-radius:7px; cursor:pointer;
          border:1px solid var(--line); background:var(--card2); color:var(--dim); font-family:inherit; }
  .lv { color:var(--gold); font-weight:700; }
  .talent { border-left:2px solid var(--line); padding-left:10px; margin:9px 0; }
  .talent .tn { font-weight:700; font-size:14.5px; }
  .up { color:var(--blue); font-size:12px; margin-left:6px; }
  .tdesc { color:var(--dim); font-size:12.5px; margin:3px 0 0; line-height:1.6; word-break:keep-all; }
  table.tt { width:auto; margin-top:4px; }
  table.tt td { padding:1px 12px 1px 0; font-size:12.5px; }
  table.tt td.k { color:var(--dim); font-weight:400; width:auto; }
  table.tt td.chg { color:var(--hit); }
  .wikirow { color:var(--wiki); } .warnrow { color:var(--warn); }
  .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .btn { font-family:inherit; font-size:12.5px; color:var(--dim); background:var(--card2);
         border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; }
  @media (any-pointer:coarse) { #list button, .more, .btn { min-height:44px; } }
  @media (max-width:820px) {
    .wrap { flex-direction:column; }
    aside { width:100%; flex:none; position:static; }
    #list { max-height:170px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <input id="q" placeholder="영웅 검색 (한글·영문·초성)" autocomplete="off">
    <div id="list"></div>
  </aside>
  <main>
    <div class="top">
      <h1>영웅 <span class="s">도감</span></h1>
      <button class="btn" id="ids" type="button">내부 이름</button>
      <span class="id" id="meta"></span>
    </div>
    <p class="sub">게임 원본 XML 에서 직접 뽑은 기술·특성 상세입니다. 숫자는 모두 자료에서 계산한 값이고,
      자료로 풀리지 않는 자리는 <span style="color:var(--wiki)">⌁ 위키</span> 로 메우거나
      <span style="color:var(--warn)">⚠ 예외</span> 로 남겼습니다.</p>
    <div id="body"></div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const FIGKEY = ['도형', '도형거리'];   // 표가 아니라 그림으로 보여 주는 칸
const LIST = ['피해','회복','범위','투사체','재사용 조정','지속 효과','거는 효과'];
/* 알약(칩)에는 **비용 쪽만** — 사거리·시전 시간 따위는 아래 속성 표에 더 정확하게 들어 있다
   (칩은 날값이라 '무제한(500)' 같은 표식이 그대로 나온다) */
const SKIP = ['이름','칸','id','설명','위키식','위키','예외','아이콘','특성 강화','툴팁 수치',
              '사거리','시전 시간','마무리 시간','대상','이동 거리(추정)','부채꼴','최소 사거리'];
let INDEX = [], cur = null, HERO = null, YARD = {};   // YARD = 비교용 눈금(레이너 평타·해머 공성)   // HERO = 지금 펼친 영웅(그림이 히트박스를 가져다 쓴다)
/* 아이콘은 이미지 저장소(Pages)가 내준다. 여기 임시본이 있으면 그걸, 어디에도 없으면 **안 부른다**
   (무료 호스팅이라 404 를 아이콘 수만큼 내면 안 된다 — `images/index.json` 을 먼저 받아 안다) */
const CDN = 'https://sin0nis.github.io/images/';
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
let LOCAL = new Set(), MISS = new Set();
function imgUrl(dir, name) {
  if (!name) return BLANK;
  const key = dir + '/' + name;
  if (MISS.has(key)) return BLANK;
  return LOCAL.has(key) ? '../images/' + key : CDN + key;
}
const CACHE = new Map();          /* 한 번 받은 영웅은 다시 받지 않는다 */

function slotClass(s) {
  return s === 'D' ? 'd' : s === 'Z' ? 'z' : /^R/.test(s) ? 'r' : /액티브/.test(s) ? 'x' : '';
}
/* 이동 속도·공격 속도 같은 칸은 자료에 **비율**로 적힌다(-0.25 = 25% 느려짐).
   숫자 그대로 보이면 '0.25 만큼 느려진다' 로 읽히니 퍼센트로 옮긴다. */
const RATIO_KEYS = ['이동 속도', '공격 속도', '일반 공격 피해량', '기술 피해량',
                    '최소 이동 속도', '최대 이동 속도'];
function fmtVal(k, v) {
  if (RATIO_KEYS.includes(k) && typeof v === 'number')
    return (v > 0 ? '+' : '') + (Math.round(v * 1000) / 10) + '%';
  return v;
}
function rowText(r) {
  return Object.entries(r).filter(([k, v]) => k !== '출처' && v != null)
    .map(([k, v]) => `${esc(k)} <b>${esc(fmtVal(k, v))}</b>`).join(' · ');
}
/* ── 범위를 격자 위에 그린다 ─────────────────────────────────────────
   약속: **원점이 영웅, 위쪽이 앞, 한 칸이 거리 1**. 영웅 히트박스(Unit Radius)를 원점에 먼저
   그려 두면 '반지름 4' 가 몸 몇 개 분량인지 눈으로 가늠된다.
   부채꼴·다각형은 영웅에게서 뻗어 나가고(자리 '원점'), 원·고리·직사각형은 기술이 떨어지는
   자리에 생긴다(자리 '착지' = 사거리만큼 앞). 그 구분은 자료가 들고 온다. */
function shapeSVG(w) {
  const gs = (w || {})['도형'];
  if (!gs || !gs.length) return '';
  let d = typeof w['도형거리'] === 'number' ? w['도형거리'] : 0;
  // 사거리가 전역급이면(한조 용의 화살) 격자가 수십 칸이 돼 정작 범위가 안 보인다.
  // 그럴 때는 **범위만** 제자리에 그리고, 사거리는 글로만 적는다.
  const farCast = d > 30 ? d : 0;
  if (farCast) d = 0;
  const hr = (HERO && HERO.기본 && HERO.기본.반지름) || 0.6875;
  let x0 = -hr, x1 = hr, y0 = -hr, y1 = hr;
  const put = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
  const arcPts = (R, A, cy) => {
    const pts = [], half = Math.min(A, 360) / 2;
    for (let t = -half; t <= half + 0.01; t += 5)
      pts.push([R * Math.sin(t * Math.PI / 180), cy + R * Math.cos(t * Math.PI / 180)]);
    return pts;
  };
  gs.forEach(g => {
    // 쓸고 가는 판정은 영웅에게서 출발한다(기술이 떨어지는 자리가 아니다)
    const at = (g.자리 === '원점' || g.쓸기) ? 0 : d;
    if (g.꼴 === '다각형' || g.꼴 === '자리들') (g.점 || []).forEach(p => put(p[0], p[1]));
    else if (g.꼴 === '부채꼴') { put(0, at); arcPts(g.반지름, g.각도, at).forEach(p => put(p[0], p[1])); }
    else if (g.꼴 === '이동') { put(0, 0); put(0, g.거리); }
    else if (g.꼴 === '직사각형') {
      if (g.자리 === '원점' && !g.쓸기) { put(-g.가로 / 2, 0); put(g.가로 / 2, g.세로); }
      else { put(-g.가로 / 2, at - g.세로 / 2); put(g.가로 / 2, at + (g.쓸기 || 0) + g.세로 / 2); }
    } else if (g.날아감) {
      // 굵기가 그대로 날아가는 원은 '작은' 이 없다 — 그대로 빼면 NaN 이 돼 그림이 통째로 깨진다
      const r0 = (g.작은 === undefined ? g.반지름 : g.작은);
      put(-g.반지름, -r0); put(g.반지름, g.날아감 + g.반지름);
    }
    else { put(-g.반지름, at - g.반지름); put(g.반지름, at + g.반지름); }
  });
  if (d > 0) { put(0, d); put(-d, 0); put(d, 0); put(0, -d); }   // 시전 사거리는 **사방으로** 미친다
  // 눈금은 **기술이 차지하는 만큼만** 깐다. 반지름 1 짜리 기술에 해머 공성 11 까지 그리면
  // 격자가 깨알이 돼 정작 그 기술이 안 보인다. 그래서 '기술이 미치는 거리' 를 먼저 재고,
  // 그보다 큰 눈금은 **가장 작은 것 하나만** 남긴다(그것조차 없으면 비교할 게 없으니까).
  let own = Math.max(hr, Math.abs(x0), x1, Math.abs(y0), y1);
  const ys = Object.entries(YARD).sort((a, b) => a[1] - b[1]);
  const limit = Math.max(own, ys.length ? ys[0][1] : 0);
  const yard = ys.filter(([, r]) => r <= limit);
  yard.forEach(([, r]) => { put(-r, -r); put(r, r); });
  x0 = Math.floor(x0 - 0.7); x1 = Math.ceil(x1 + 0.7);
  y0 = Math.floor(y0 - 0.7); y1 = Math.ceil(y1 + 0.7);
  const wu = x1 - x0, hu = y1 - y0;
  if (wu > 90 || hu > 90) return '';          // 지도 전체급은 격자로 보여 봐야 의미가 없다
  const S = Math.max(5, Math.min(24, 300 / Math.max(wu, hu)));
  const W = wu * S, H = hu * S;
  const px = x => (x - x0) * S, py = y => (y1 - y) * S;
  let grid = '';
  for (let x = x0; x <= x1; x++)
    grid += `<line x1="${px(x)}" y1="0" x2="${px(x)}" y2="${H}" stroke="var(--line)" stroke-width="${x === 0 ? 1.4 : 0.6}"/>`;
  for (let y = y0; y <= y1; y++)
    grid += `<line x1="0" y1="${py(y)}" x2="${W}" y2="${py(y)}" stroke="var(--line)" stroke-width="${y === 0 ? 1.4 : 0.6}"/>`;
  let body = '';
  // 눈금 — '이 범위가 레이너 평타보다 넓나?' 를 눈으로 재라고 깔아 둔다.
  // 너무 옅으면 안 보이고 너무 진하면 정작 기술 범위를 가린다. 선은 가늘게, 대신 이름표를 붙인다.
  yard.forEach(([k, r]) => {
    body += `<circle cx="${px(0)}" cy="${py(0)}" r="${r * S}" fill="none" stroke="var(--wiki)" `
          + `stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>`;
    if (py(r) > 9)
      body += `<text x="${px(0) + 4}" y="${py(r) - 3}" font-size="9" fill="var(--wiki)" `
            + `opacity=".85">${esc(k)} ${r}</text>`;
  });
  // 시전 사거리 — 어디까지 찍을 수 있나(영웅 중심). 공격 범위는 그 **끝**에 그린다.
  if (d > 0)
    body += `<circle cx="${px(0)}" cy="${py(0)}" r="${d * S}" fill="none" stroke="var(--gold)" `
          + `stroke-width="1.2" stroke-dasharray="5 4"/>`
          + `<line x1="${px(0)}" y1="${py(0)}" x2="${px(0)}" y2="${py(d)}" stroke="var(--gold)" `
          + `stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`;
  gs.forEach(g => {
    const at = (g.자리 === '원점' || g.쓸기) ? 0 : d;
    const fill = g.직격
      ? 'fill="var(--warn)" fill-opacity=".22" stroke="var(--warn)" stroke-width="1.4"'
      : 'fill="var(--blue)" fill-opacity=".16" stroke="var(--blue)" stroke-width="1.4"';
    if (g.꼴 === '자리들') {

      const pts = (g.점 || []).map(p => px(p[0]) + ',' + py(p[1]));

            + `stroke="var(--blue)" stroke-width="1.2" stroke-dasharray="5 3"/>`;
      (g.점 || []).forEach((p, i) => {
        body += `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="4" fill="var(--blue)"/>`
              + `<text x="${px(p[0]) + 6}" y="${py(p[1]) - 5}" font-size="9" fill="var(--blue)">${i + 1}</text>`;
      });

    else if (g.꼴 === '부채꼴') {
      const pts = arcPts(g.반지름, g.각도, at).map(p => px(p[0]) + ',' + py(p[1]));
      body += `<polygon points="${px(0)},${py(at)} ${pts.join(' ')}" ${fill}/>`;
      if (g.띠) {
        // 두께가 일정한 띠가 바깥으로 밀려 나가는 기술(안두인 응징) — 어느 한 순간에
        // 맞는 것은 **이 띠**다. 끝이 호라는 게 여기서 보인다. 연한 부채꼴은 지나간 자리.
        const outer = arcPts(g.반지름, g.각도, at);
        const inner = arcPts(Math.max(g.반지름 - g.띠, 0.01), g.각도, at).reverse();

              + `fill="var(--blue)" fill-opacity=".30" stroke="var(--blue)" stroke-width="1.6"/>`;
      }

      // 발밑에서 끝까지 깔리는 빔(디바 딱콩! 1.25 x 15) — 가운데에 놓지 않는다
      body += `<rect x="${px(-g.가로 / 2)}" y="${py(g.세로)}" width="${g.가로 * S}" `
            + `height="${g.세로 * S}" ${fill}/>`;
    } else if (g.꼴 === '직사각형') {
      const run = g.쓸기 || 0;
      body += `<rect x="${px(-g.가로 / 2)}" y="${py(at + run + g.세로 / 2)}" width="${g.가로 * S}" `
            + `height="${(g.세로 + run) * S}" ${fill}/>`;
      if (run)   // 출발할 때의 판정 상자를 한 번 더 그려 '얼마짜리 상자가 쓸고 가는지' 보이게
        body += `<rect x="${px(-g.가로 / 2)}" y="${py(at + g.세로 / 2)}" width="${g.가로 * S}" `

              + `stroke-dasharray="4 3"/>`;
    }
    else if (g.꼴 === '고리')
      body += `<circle cx="${px(0)}" cy="${py(at)}" r="${g.반지름 * S}" ${fill}/>`

            + `stroke="var(--blue)" stroke-width="1"/>`;
    else if (g.날아감) {
      // 날아가는 원 — 지나간 자리를 띠로 그린다. 굵기가 그대로면 곧은 띠,
      // 커지면(리밍 보주·안두인 응징) 넓어지는 띠다. '바로 앞에서 맞아도 터진다' 가 여기서 보인다.
      const r0 = (g.작은 === undefined ? g.반지름 : g.작은), r1 = g.반지름, D = g.날아감;
      body += `<polygon points="${px(-r0)},${py(0)} ${px(r0)},${py(0)} `
            + `${px(r1)},${py(D)} ${px(-r1)},${py(D)}" fill="var(--blue)" fill-opacity=".10" `
            + `stroke="var(--blue)" stroke-width="1" stroke-dasharray="4 3"/>`;

        body += `<circle cx="${px(0)}" cy="${py(at)}" r="${g.작은 * S}" fill="none" `

  });
  // 방향이 있는 기술은 **화살표**로 어디로 가는지 보여 준다 — 날아가는 거리,
  // 없으면 부채꼴·다각형이 뻗은 길이만큼.

  gs.forEach(g => {

    if (!g.쓸기 && !g.날아감 && g.자리 === '원점')
      arrow = Math.max(arrow, g.꼴 === '부채꼴' ? g.반지름
                            : g.꼴 === '다각형' ? Math.max(...(g.점 || [[0, 0]]).map(p => p[1])) : 0);

    body += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1 + hd}" stroke="var(--fg)" `
          + `stroke-width="1.3" opacity=".5"/>`
          + `<polygon points="${x},${y1} ${x - hd * 0.6},${y1 + hd} ${x + hd * 0.6},${y1 + hd}" `
          + `fill="var(--fg)" opacity=".5"/>`;
  }
  body += `<circle cx="${px(0)}" cy="${py(0)}" r="${hr * S}" fill="var(--hit)" fill-opacity=".55" `
        + `stroke="var(--hit)" stroke-width="1"/>`;
  body += `<text x="4" y="${H - 5}" font-size="10" fill="var(--hit)">hitbox r ${hr}</text>`;
  const names = gs.map(g => g.꼴 === '자리들' ? `${(g.점 || []).length}곳` :
                             g.쓸기 ? `${g.꼴} ${g.가로} 폭이 ${g.쓸기} 를 지나감` :
                             (g.날아감 && g.작은) ? `날아가며 커지는 ${g.꼴}(${g.작은}→${g.반지름})` :
                             g.날아감 ? `${g.꼴} 반지름 ${g.반지름}이 ${g.날아감} 을 지나감` :
                             g.작은 ? `커지는 ${g.꼴}(최소 ${g.작은} · 최대 ${g.반지름})` :
                             g.띠 ? `${g.꼴} ${g.각도}도 · 두께 ${g.띠} 띠가 ${g.반지름} 까지 밀려 남` :
                             g.꼴 === '이동' ? `${g.거리} 이동(판정 없음)` :
                             g.직격 ? `${g.꼴}(직격)` : g.꼴)
                 .filter((v, i, z) => z.indexOf(v) === i).join(' · ');
  const cap = [`한 칸 = 거리 1 · 위쪽이 앞`,
               `<b class="c-hero">●</b> 영웅 히트박스 ${hr}`,
               d > 0 ? `<b class="c-rng">◌</b> 시전 사거리 ${d}` : '',
               farCast ? `시전 사거리 ${farCast} 은 너무 멀어 격자에 안 그림` : '',
               `<b class="c-area">■</b> 공격 범위 ${esc(names)}`,
               gs.some(g => g.직격) ? `<b class="c-hit">■</b> 주황은 한 명만 맞는 직격` : '',
               yard.map(([k, r]) => `<b class="c-yard">⌁</b> ${esc(k)} ${r}`).join(' · ')]
              .filter(Boolean).join(' · ');
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" `
       + `aria-label="범위 그림"><g>${grid}</g>${body}</svg><div class="cap">${cap}</div></div>`;
}
/* 기술 하나에 특성이 넷씩 붙는다. 다 적용된 **최종 모습**만 보면 어느 특성이 무엇을
   바꿨는지 사라지므로, 위의 표는 **특성 안 찍은 기본 틀**로 두고 여기서 특성별로

/* ── 메모 ────────────────────────────────────────────────────────────────
   보면서 이상한 것을 **그 자리에** 적어 두고, 한꺼번에 내보내 고치는 데 쓴다.
   공개 사이트에는 안 띄운다(로컬 파일이나 개발 서버에서만). 적은 것은 이 브라우저

const MEMO_KEY = 'herodex-memo';

function memoSave() { try { localStorage.setItem(MEMO_KEY, JSON.stringify(MEMO)); } catch (e) {} }
function memoCount() { return Object.keys(MEMO).filter(k => (MEMO[k].메모 || '').trim()).length; }
function memoBtn(kind, id, name) {

function memoBar() {

function memoExport() {
  const rows = Object.entries(MEMO)
    .filter(([, v]) => (v.메모 || '').trim())
    .map(([k, v]) => { const p = k.split('|');
      return { 영웅: p[0], 갈래: p[1], id: p[2], 이름: v.이름 || '', 메모: v.메모.trim() }; });

  const b2 = e.target.closest('.mm');
  if (!b2) return;
  const key = b2.dataset.mm, host = b2.closest('.card, .talent');
  let box = host.querySelector(':scope > .mmbox');
  if (box) { box.remove(); return; }
  box = document.createElement('textarea');
  box.className = 'mmbox';
  box.placeholder = '이상한 점을 적어 두세요 (적는 대로 저장됩니다)';
  box.value = (MEMO[key] && MEMO[key].메모) || '';
  box.addEventListener('input', () => {
    MEMO[key] = { 이름: b2.dataset.nm, 메모: box.value };
    if (!box.value.trim()) delete MEMO[key];
    memoSave();
    const has = !!box.value.trim();
    b2.classList.toggle('on', has);
    b2.textContent = has ? '메모 있음' : '메모';
    host.classList.toggle('mmhit', has);
    memoBar();
  });
  host.appendChild(box);
  box.focus();
});
/* 이미지 저장소가 아직 안 채운 아이콘은 **깨진 그림** 대신 빈 칸으로 둔다.
   (이미 난 404 를 가리는 것이라 요청이 늘지 않는다 — 폴백으로 다시 부르지 않는다) */
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.src !== BLANK) t.src = BLANK;
}, true);

(async function boot() {
  document.body.classList.add('noid');     /* 내부 이름은 필요할 때만 */
  const [r, ri] = await Promise.all([
    fetch('../data/herodex/index.json', { cache: 'no-cache' }),
    fetch('../images/index.json', { cache: 'no-cache' }).catch(() => null),
  ]);
  const d = await r.json();
  INDEX = d.heroes;
  YARD = d.기준 || {};          /* 범위 그림에 깔 눈금 */
  if (ri && ri.ok) {
    const im = await ri.json();
    LOCAL = new Set(im.files || []);
    MISS = new Set(im.missing || []);
  }
  renderList('');
  const want = new URLSearchParams(location.search).get('hero');
  pick(INDEX.some(h => h.id === want) ? want : INDEX[0].id, false);
})();
</script>
</body>
