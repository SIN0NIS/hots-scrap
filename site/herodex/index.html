<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영웅 도감 · HotS Scrap</title>
<link rel="icon" href="../shared/favicon.svg">
<script src="../shared/search.js"></script>
<script src="../shared/scrap.js" defer></script>
<style>
  :root {
    --bg:#f3f6fb; --card:#ffffff; --card2:#eef2f8; --line:#cdd9ea; --line2:#b6c6de;
    --fg:#122036; --dim:#5d6d84; --blue:#1758a8; --gold:#a97e1f; --gold-line:#d7b45c;
    --hit:#8a6414; --wiki:#7a3fb0; --warn:#b1562a; --shadow:0 1px 3px rgba(18,32,54,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
      --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268; --gold-line:#8a6d2f;
      --hit:#f0c46a; --wiki:#c79cf0; --warn:#e0875b; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
    --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268; --gold-line:#8a6d2f;
    --hit:#f0c46a; --wiki:#c79cf0; --warn:#e0875b; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 14px 60px; display:flex; gap:14px;
          align-items:flex-start; }
  h1 { margin:0 0 4px; font-size:22px; } h1 .s { color:var(--gold); }
  .sub { margin:0 0 12px; color:var(--dim); font-size:13px; line-height:1.6; }

  /* ── 영웅 목록 ─────────────────────────── */
  aside { width:200px; flex:0 0 200px; position:sticky; top:8px; }
  #q { width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
       background:var(--card); color:var(--fg); font-family:inherit; font-size:13px; }
  #list { margin-top:8px; max-height:calc(100vh - 110px); overflow:auto; background:var(--card);
          border:1px solid var(--line); border-radius:11px; padding:5px; box-shadow:var(--shadow); }
  #list button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--fg);
                 font:inherit; font-size:13.5px; padding:6px 9px; border-radius:7px; cursor:pointer; }
  #list button:hover { background:var(--card2); }
  #list button.on { background:var(--blue); color:#fff; }
  #list mark { background:none; color:var(--hit); font-weight:700; }

  /* ── 본문 ─────────────────────────────── */
  main { flex:1; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:13px 15px; margin-bottom:11px; box-shadow:var(--shadow); }
  .slot { display:inline-block; min-width:34px; padding:2px 8px; border-radius:7px; background:var(--blue);
          color:#fff; font-size:12px; font-weight:700; text-align:center; margin-right:8px; }
  .slot.d { background:#7a5bbd; } .slot.z { background:#2f8f6f; }
  .slot.r { background:var(--gold); color:#2a2104; } .slot.x { background:#5d6d84; }
  .nm { font-size:17px; font-weight:700; }
  .ico { width:40px; height:40px; border-radius:9px; border:1px solid var(--line2);
         vertical-align:middle; margin-right:9px; background:var(--card2); }
  .tico { width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
          vertical-align:middle; margin-right:7px; background:var(--card2); }
  .face { width:52px; height:52px; border-radius:11px; border:1px solid var(--line2);
          vertical-align:middle; margin-right:10px; background:var(--card2); }
  .hhead { display:flex; align-items:center; gap:2px; margin:0 0 2px; }
  .id { color:var(--dim); font-size:11.5px; margin-left:6px; }
  .desc { color:var(--dim); font-size:13.5px; margin:6px 0 9px; line-height:1.65; word-break:keep-all; }
  /* 범위 그림 — 한 칸이 게임 거리 1 이다 */
  .fig { margin:7px 0 2px; }
  .fig svg { display:block; max-width:100%; height:auto; border:1px solid var(--line);
             border-radius:8px; background:var(--card2); }
  .fig .cap { color:var(--dim); font-size:11px; margin-top:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:999px;
          padding:2px 10px; font-size:12.5px; }
  .chip b { color:var(--hit); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td { padding:3px 7px 3px 0; vertical-align:top; }
  td.k { color:var(--blue); font-weight:700; white-space:nowrap; width:92px; }
  tr.minor { display:none; } .card.open tr.minor { display:table-row; }
  tr.minor td.k { color:var(--dim); font-weight:400; }
  td.src { color:var(--dim); font-size:11px; text-align:right; white-space:nowrap; }
  body.noid td.src { display:none; }
  .more { margin-top:6px; font-size:12px; padding:3px 10px; border-radius:7px; cursor:pointer;
          border:1px solid var(--line); background:var(--card2); color:var(--dim); font-family:inherit; }
  .lv { color:var(--gold); font-weight:700; }
  .talent { border-left:2px solid var(--line); padding-left:10px; margin:9px 0; }
  .talent .tn { font-weight:700; font-size:14.5px; }
  .up { color:var(--blue); font-size:12px; margin-left:6px; }
  .tdesc { color:var(--dim); font-size:12.5px; margin:3px 0 0; line-height:1.6; word-break:keep-all; }
  table.tt { width:auto; margin-top:4px; }
  table.tt td { padding:1px 12px 1px 0; font-size:12.5px; }
  table.tt td.k { color:var(--dim); font-weight:400; width:auto; }
  table.tt td.chg { color:var(--hit); }
  .wikirow { color:var(--wiki); } .warnrow { color:var(--warn); }
  .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .btn { font-family:inherit; font-size:12.5px; color:var(--dim); background:var(--card2);
         border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; }
  @media (any-pointer:coarse) { #list button, .more, .btn { min-height:44px; } }
  @media (max-width:820px) {
    .wrap { flex-direction:column; }
    aside { width:100%; flex:none; position:static; }
    #list { max-height:170px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <input id="q" placeholder="영웅 검색 (한글·영문·초성)" autocomplete="off">
    <div id="list"></div>
  </aside>
  <main>
    <div class="top">
      <h1>영웅 <span class="s">도감</span></h1>
      <button class="btn" id="ids" type="button">내부 이름</button>
      <span class="id" id="meta"></span>
    </div>
    <p class="sub">게임 원본 XML 에서 직접 뽑은 기술·특성 상세입니다. 숫자는 모두 자료에서 계산한 값이고,
      자료로 풀리지 않는 자리는 <span style="color:var(--wiki)">⌁ 위키</span> 로 메우거나
      <span style="color:var(--warn)">⚠ 예외</span> 로 남겼습니다.</p>
    <div id="body"></div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const FIGKEY = ['도형', '도형거리'];   // 표가 아니라 그림으로 보여 주는 칸
const LIST = ['피해','회복','범위','투사체','재사용 조정','지속 효과','거는 효과'];
/* 알약(칩)에는 **비용 쪽만** — 사거리·시전 시간 따위는 아래 속성 표에 더 정확하게 들어 있다
   (칩은 날값이라 '무제한(500)' 같은 표식이 그대로 나온다) */
const SKIP = ['이름','칸','id','설명','위키식','위키','예외','아이콘',
              '사거리','시전 시간','마무리 시간','대상','이동 거리(추정)','부채꼴','최소 사거리'];
let INDEX = [], cur = null, HERO = null;   // HERO = 지금 펼친 영웅(그림이 히트박스를 가져다 쓴다)
/* 아이콘은 이미지 저장소(Pages)가 내준다. 여기 임시본이 있으면 그걸, 어디에도 없으면 **안 부른다**
   (무료 호스팅이라 404 를 아이콘 수만큼 내면 안 된다 — `images/index.json` 을 먼저 받아 안다) */
const CDN = 'https://sin0nis.github.io/images/';
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
let LOCAL = new Set(), MISS = new Set();
function imgUrl(dir, name) {
  if (!name) return BLANK;
  const key = dir + '/' + name;
  if (MISS.has(key)) return BLANK;
  return LOCAL.has(key) ? '../images/' + key : CDN + key;
}
const CACHE = new Map();          /* 한 번 받은 영웅은 다시 받지 않는다 */

function slotClass(s) {
  return s === 'D' ? 'd' : s === 'Z' ? 'z' : /^R/.test(s) ? 'r' : /액티브/.test(s) ? 'x' : '';
}
function rowText(r) {
  return Object.entries(r).filter(([k, v]) => k !== '출처' && v != null)
    .map(([k, v]) => `${esc(k)} <b>${esc(v)}</b>`).join(' · ');
}
/* ── 범위를 격자 위에 그린다 ─────────────────────────────────────────
   약속: **원점이 영웅, 위쪽이 앞, 한 칸이 거리 1**. 영웅 히트박스(Unit Radius)를 원점에 먼저
   그려 두면 '반지름 4' 가 몸 몇 개 분량인지 눈으로 가늠된다.
   부채꼴·다각형은 영웅에게서 뻗어 나가고(자리 '원점'), 원·고리·직사각형은 기술이 떨어지는
   자리에 생긴다(자리 '착지' = 사거리만큼 앞). 그 구분은 자료가 들고 온다. */
function shapeSVG(w) {
  const gs = (w || {})['도형'];
  if (!gs || !gs.length) return '';
  const d = typeof w['도형거리'] === 'number' ? w['도형거리'] : 0;
  const hr = (HERO && HERO.기본 && HERO.기본.반지름) || 0.6875;
  let x0 = -hr, x1 = hr, y0 = -hr, y1 = hr;
  const put = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
  const arcPts = (R, A, cy) => {
    const pts = [], half = Math.min(A, 360) / 2;
    for (let t = -half; t <= half + 0.01; t += 5)
      pts.push([R * Math.sin(t * Math.PI / 180), cy + R * Math.cos(t * Math.PI / 180)]);
    return pts;
  };
  gs.forEach(g => {
    const at = g.자리 === '원점' ? 0 : d;
    if (g.꼴 === '다각형') (g.점 || []).forEach(p => put(p[0], p[1]));
    else if (g.꼴 === '부채꼴') { put(0, at); arcPts(g.반지름, g.각도, at).forEach(p => put(p[0], p[1])); }
    else if (g.꼴 === '직사각형') { put(-g.가로 / 2, at - g.세로 / 2); put(g.가로 / 2, at + g.세로 / 2); }
    else { put(-g.반지름, at - g.반지름); put(g.반지름, at + g.반지름); }
  });
  if (d > 0) put(0, d);
  x0 = Math.floor(x0 - 0.7); x1 = Math.ceil(x1 + 0.7);
  y0 = Math.floor(y0 - 0.7); y1 = Math.ceil(y1 + 0.7);
  const wu = x1 - x0, hu = y1 - y0;
  if (wu > 90 || hu > 90) return '';          // 지도 전체급은 격자로 보여 봐야 의미가 없다
  const S = Math.max(5, Math.min(24, 300 / Math.max(wu, hu)));
  const W = wu * S, H = hu * S;
  const px = x => (x - x0) * S, py = y => (y1 - y) * S;
  let grid = '';
  for (let x = x0; x <= x1; x++)
    grid += `<line x1="${px(x)}" y1="0" x2="${px(x)}" y2="${H}" stroke="var(--line)" stroke-width="${x === 0 ? 1.4 : 0.6}"/>`;
  for (let y = y0; y <= y1; y++)
    grid += `<line x1="0" y1="${py(y)}" x2="${W}" y2="${py(y)}" stroke="var(--line)" stroke-width="${y === 0 ? 1.4 : 0.6}"/>`;
  let body = '';
  if (d > 0)
    body += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(0)}" y2="${py(d)}" stroke="var(--dim)" `
          + `stroke-width="1" stroke-dasharray="3 3"/>`;
  gs.forEach(g => {
    const at = g.자리 === '원점' ? 0 : d;
    const fill = 'fill="var(--blue)" fill-opacity=".16" stroke="var(--blue)" stroke-width="1.4"';
    if (g.꼴 === '다각형')
      body += `<polygon points="${(g.점 || []).map(p => px(p[0]) + ',' + py(p[1])).join(' ')}" ${fill}/>`;
    else if (g.꼴 === '부채꼴') {
      const pts = arcPts(g.반지름, g.각도, at).map(p => px(p[0]) + ',' + py(p[1]));
      body += `<polygon points="${px(0)},${py(at)} ${pts.join(' ')}" ${fill}/>`;
    } else if (g.꼴 === '직사각형')
      body += `<rect x="${px(-g.가로 / 2)}" y="${py(at + g.세로 / 2)}" width="${g.가로 * S}" `
            + `height="${g.세로 * S}" ${fill}/>`;
    else if (g.꼴 === '고리')
      body += `<circle cx="${px(0)}" cy="${py(at)}" r="${g.반지름 * S}" ${fill}/>`
            + `<circle cx="${px(0)}" cy="${py(at)}" r="${g.안쪽 * S}" fill="var(--card2)" `
            + `stroke="var(--blue)" stroke-width="1"/>`;
    else
      body += `<circle cx="${px(0)}" cy="${py(at)}" r="${g.반지름 * S}" ${fill}/>`;
  });
  body += `<circle cx="${px(0)}" cy="${py(0)}" r="${hr * S}" fill="var(--hit)" fill-opacity=".55" `
        + `stroke="var(--hit)" stroke-width="1"/>`;
  const names = gs.map(g => g.꼴).filter((v, i, z) => z.indexOf(v) === i).join(' · ');
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" `
       + `aria-label="범위 그림"><g>${grid}</g>${body}</svg>`
       + `<div class="cap">한 칸 = 거리 1 · 위쪽이 앞 · 가운데 노란 원이 영웅 히트박스(반지름 ${hr})`
       + (d > 0 ? ` · 점선은 사거리 ${d}` : '') + ` · ${esc(names)}</div></div>`;
}
function abilityHTML(a) {
  const chips = Object.entries(a).filter(([k, v]) =>
      !SKIP.includes(k) && !LIST.includes(k) && v != null && typeof v !== 'object')
    .map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join('');
  let rows = Object.entries(a.위키식 || {}).filter(([k]) => !FIGKEY.includes(k)).map(([k, v]) =>
      `<tr><td class="k">${esc(k)}</td><td colspan="2"><b>${esc(v)}</b></td></tr>`).join('');
  let minor = '';
  for (const k of LIST) for (const r of (a[k] || []))
    minor += `<tr class="minor"><td class="k">${esc(k)}</td><td>${rowText(r)}</td>`
           + `<td class="src">${esc(r.출처 || '')}</td></tr>`;
  if (a.위키) rows += `<tr><td class="k wikirow">⌁ 위키</td><td colspan="2" class="wikirow">`
      + Object.entries(a.위키).filter(([k]) => k !== '출처').map(([k, v]) => `${esc(k)} ${esc(v)}`).join(' · ')
      + (a.위키.출처 ? ` <a href="${esc(a.위키.출처)}" target="_blank" rel="noopener">출처</a>` : '') + `</td></tr>`;
  if (a.예외) rows += `<tr><td class="k warnrow">⚠ 예외</td><td colspan="2" class="warnrow">${esc(a.예외)}</td></tr>`;
  const n = (minor.match(/<tr/g) || []).length;
  return `<div class="card">
      <div><img class="ico" src="${imgUrl('abilitytalents', a.아이콘)}" alt="" loading="lazy">`
      + `<span class="slot ${slotClass(a.칸)}">${esc(a.칸)}</span><span class="nm">${esc(a.이름)}</span>
           <span class="id">${esc(a.id)}</span></div>
      ${a.설명 ? `<div class="desc">${esc(a.설명)}</div>` : ''}
      <div class="chips">${chips}</div>
      ${rows || minor ? `<table>${rows}${minor}</table>` : ''}
      ${shapeSVG(a.위키식)}
      ${n ? `<button class="more" type="button">원자료 ${n}줄 보기</button>` : ''}
    </div>`;
}
function talentHTML(t) {
  const rows = (t['바뀌는 값'] || []).map(v =>
      `<tr><td class="k chg">바뀌는 값</td><td>${esc(v)}</td></tr>`).join('')
    + Object.entries(t.위키식 || {}).filter(([k]) => !FIGKEY.includes(k)).map(([k, v]) =>
      `<tr><td class="k">${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join('')
    + (t.위키 ? `<tr><td class="k wikirow">⌁ 위키</td><td class="wikirow">`
        + Object.entries(t.위키).filter(([k]) => k !== '출처').map(([k, v]) => `${esc(k)} ${esc(v)}`).join(' · ')
        + `</td></tr>` : '')
    + (t.예외 ? `<tr><td class="k warnrow">⚠ 예외</td><td class="warnrow">${esc(t.예외)}</td></tr>` : '');
  return `<div class="talent"><div><img class="tico" src="${imgUrl('abilitytalents', t.아이콘)}" alt="" `
    + `loading="lazy"><span class="tn">${esc(t.이름)}</span>`
    + (t.강화 ? `<span class="up">${esc(t.강화)} 강화</span>` : '') + `</div>`
    + (t.설명 ? `<div class="tdesc">${esc(t.설명)}</div>` : '')
    + (rows ? `<table class="tt">${rows}</table>` : '') + shapeSVG(t.위키식) + `</div>`;
}
function render(h) {
  HERO = h;
  const base = Object.entries(h.기본).filter(([, v]) => v != null)
      .map(([k, v]) => `${esc(k)} <b>${esc(v)}</b>`).join(' · ');
  let out = `<div class="hhead"><img class="face" src="${imgUrl('heroportraits', h.초상화)}" alt="">`
    + `<h2 style="margin:0">${esc(h.영웅)}</h2></div><p class="sub">${base}</p>`;
  out += h.기술.map(abilityHTML).join('');
  let lv = null;
  for (const t of h.특성) {
    if (t.레벨 !== lv) {
      if (lv !== null) out += '</div>';
      lv = t.레벨;
      out += `<div class="card"><div class="nm lv">${esc(lv || '?')}레벨 특성</div>`;
    }
    out += talentHTML(t);
  }
  if (lv !== null) out += '</div>';
  $('#body').innerHTML = out;
  $('#meta').textContent = h.자료;
  window.scrollTo(0, 0);
}
async function pick(id, push) {
  cur = id;
  [...document.querySelectorAll('#list button')].forEach(b => b.classList.toggle('on', b.dataset.id === id));
  if (!CACHE.has(id)) {
    $('#body').innerHTML = '<p class="sub">불러오는 중…</p>';
    const r = await fetch(`../data/herodex/${id}.json`);
    if (!r.ok) { $('#body').innerHTML = '<p class="sub">자료를 불러오지 못했습니다.</p>'; return; }
    CACHE.set(id, await r.json());
  }
  render(CACHE.get(id));
  if (push) history.replaceState(null, '', `?hero=${encodeURIComponent(id)}`);
}
function renderList(v) {
  const hit = window.scrapSearch.filter(INDEX, v, h => [h.name, h.id]);
  $('#list').innerHTML = hit.map(h =>
      `<button data-id="${esc(h.id)}" class="${h.id === cur ? 'on' : ''}">`
      + window.scrapSearch.mark(h.name, v) + `</button>`).join('')
    || '<div class="sub" style="padding:8px">없습니다</div>';
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b) pick(b.dataset.id, true);
});
$('#q').addEventListener('input', e => renderList(e.target.value));
$('#body').addEventListener('click', e => {
  const b = e.target.closest('.more');
  if (!b) return;
  const card = b.closest('.card');
  card.classList.toggle('open');
  b.textContent = card.classList.contains('open') ? '원자료 접기'
    : b.textContent.replace('접기', '보기');
});
$('#ids').addEventListener('click', () => document.body.classList.toggle('noid'));
/* 이미지 저장소가 아직 안 채운 아이콘은 **깨진 그림** 대신 빈 칸으로 둔다.
   (이미 난 404 를 가리는 것이라 요청이 늘지 않는다 — 폴백으로 다시 부르지 않는다) */
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.src !== BLANK) t.src = BLANK;
}, true);

(async function boot() {
  document.body.classList.add('noid');     /* 내부 이름은 필요할 때만 */
  const [r, ri] = await Promise.all([
    fetch('../data/herodex/index.json', { cache: 'no-cache' }),
    fetch('../images/index.json', { cache: 'no-cache' }).catch(() => null),
  ]);
  const d = await r.json();
  INDEX = d.heroes;
  if (ri && ri.ok) {
    const im = await ri.json();
    LOCAL = new Set(im.files || []);
    MISS = new Set(im.missing || []);
  }
  renderList('');
  const want = new URLSearchParams(location.search).get('hero');
  pick(INDEX.some(h => h.id === want) ? want : INDEX[0].id, false);
})();
</script>
</body>
</html>
