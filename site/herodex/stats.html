<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통계 보기 · 영웅 도감 · HotS Scrap</title>
<meta name="description" content="히어로즈 오브 더 스톰 게임 원본에서 읽히는 모든 항목의 카탈로그 — 고른 항목을 줄 세우고 그래프로 보기">
<link rel="icon" href="../shared/favicon.svg">
<script src="../shared/scrap.js" defer></script>
<style>
  /* 색은 도감·범위 구경과 **같은 값**이다. */
  :root {
    --bg:#f3f6fb; --card:#ffffff; --card2:#eef2f8; --line:#cdd9ea; --line2:#b6c6de;
    --fg:#122036; --dim:#5d6d84; --blue:#1758a8; --gold:#a97e1f;
    --hit:#8a6414; --warn:#b1562a; --bar:#7aa6dd; --bar2:#1758a8; --shadow:0 1px 3px rgba(18,32,54,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
      --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268;
      --hit:#f0c46a; --warn:#e0875b; --bar:#3d6ea8; --bar2:#5aa8ff; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --line2:#2f4a72;
    --fg:#eaf1fa; --dim:#8fa2bd; --blue:#5aa8ff; --gold:#e8c268;
    --hit:#f0c46a; --warn:#e0875b; --bar:#3d6ea8; --bar2:#5aa8ff; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif; }
  .wrap { max-width:1320px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:20px; margin:0; }
  .top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .menu { display:flex; gap:4px; flex-wrap:wrap; }
  .menu a { text-decoration:none; color:var(--dim); font-size:13px; padding:4px 12px;
            border:1px solid var(--line); border-radius:999px; background:var(--card); }
  .menu a.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .sub { color:var(--dim); font-size:12.5px; margin:0 0 12px; line-height:1.7; }
  .dropsum { color:var(--warn); }
  .tools { position:sticky; top:0; z-index:5; background:var(--bg);
           padding:8px 0 10px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
  .row:last-child { margin-bottom:0; }
  .lab { color:var(--dim); font-size:12px; min-width:40px; }
  .pill, .tab { border:1px solid var(--line); background:var(--card); color:var(--dim);
                border-radius:999px; font:inherit; font-size:12px; padding:3px 11px; cursor:pointer; }
  .pill.on, .tab.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  @media (any-pointer:coarse) { .pill, .tab { min-height:44px; } }
  input[type=search] { flex:1; min-width:150px; border:1px solid var(--line2); border-radius:9px;
                       background:var(--card); color:var(--fg); font:inherit; font-size:13px; padding:6px 9px; }

  /* ── 주제별 묶음 ──────────────────────────────────────────── */
  .topic { margin:0 0 16px; }
  .topic > h2 { font-size:14px; margin:0 0 7px; display:flex; align-items:baseline; gap:8px; }
  .topic > h2 span { color:var(--dim); font-size:11.5px; font-weight:400; }
  .grid { display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .f { border:1px solid var(--line); border-radius:11px; background:var(--card);
       padding:8px 10px 9px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
       font:inherit; color:inherit; width:100%; }
  .f:hover { border-color:var(--line2); background:var(--card2); }
  .f h3 { margin:0 0 2px; font-size:13.5px; display:flex; align-items:baseline; gap:6px; }
  .f h3 .cov { color:var(--dim); font-size:11px; margin-left:auto; font-weight:400; }
  .mini { display:flex; align-items:flex-end; gap:2px; height:22px; margin:5px 0 2px; }
  .mini i { flex:1; background:var(--bar); border-radius:2px 2px 0 0; min-height:1px; }
  .line { color:var(--dim); font-size:11.5px; }
  .drop { color:var(--warn); font-size:11px; margin-top:3px; }

  /* ── 고른 칸 보기 ─────────────────────────────────────────── */
  .pane { position:fixed; inset:0; background:rgba(8,16,30,.55); z-index:40;
          display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:700px) { .pane { align-items:center; padding:24px; } }
  .box { background:var(--bg); border:1px solid var(--line2); border-radius:14px 14px 0 0;
         width:100%; max-width:860px; max-height:92vh; display:flex; flex-direction:column; }
  @media (min-width:700px) { .box { border-radius:14px; max-height:86vh; } }
  .bhead { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  .bhead h2 { margin:0 0 3px; font-size:16px; display:flex; align-items:baseline; gap:8px; }
  .bhead .x { margin-left:auto; border:1px solid var(--line); background:var(--card); color:var(--dim);
              border-radius:8px; font:inherit; font-size:13px; padding:2px 10px; cursor:pointer; }
  .bbody { overflow:auto; padding:10px 14px 16px; }
  .chart { display:flex; align-items:flex-end; gap:2px; height:120px; margin:10px 0 4px;
           border-bottom:1px solid var(--line); }
  .chart i { flex:1; background:var(--bar2); border-radius:3px 3px 0 0; min-height:2px; }
  .chart i:hover { filter:brightness(1.25); }
  .rank { width:100%; border-collapse:collapse; font-size:12.5px; }
  .rank td { padding:3px 6px; border-bottom:1px solid var(--line); }
  .rank td.i { color:var(--dim); width:34px; text-align:right; }
  .rank td.h { width:84px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank td.b { width:38%; }
  .rank td.b span { display:block; height:8px; background:var(--card2); border-radius:4px; overflow:hidden; }
  .rank td.b i { display:block; height:100%; background:var(--bar); }
  .rank td.v { width:84px; text-align:right; font-weight:600; white-space:nowrap; }
  .more { display:block; width:100%; margin-top:8px; border:1px solid var(--line); background:var(--card);
          color:var(--dim); border-radius:9px; font:inherit; font-size:12.5px; padding:6px; cursor:pointer; }

  /* ── 영웅 수치표 ───────────────────────────────────────────── */
  .tscroll { overflow-x:auto; border:1px solid var(--line); border-radius:11px; background:var(--card); }
  table.ht { border-collapse:collapse; width:100%; font-size:12.5px; }
  .ht th, .ht td { padding:5px 9px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
  .ht th { position:sticky; top:0; background:var(--card2); cursor:pointer; user-select:none; font-weight:600; }
  .ht th:first-child, .ht td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
  .ht th:first-child { background:var(--card2); z-index:2; }
  .ht tbody tr:hover td { background:var(--card2); }
  .ht th.sorted { color:var(--blue); }
  .note { color:var(--dim); font-size:12px; margin:8px 0 0; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>통계 보기</h1>
    <nav class="menu"><a class="scrap-tap" href="./">영웅별</a><a class="scrap-tap" href="shapes.html">범위 구경</a><a class="scrap-tap on" href="stats.html">통계 보기</a></nav></div>
  <p class="sub" id="sub">자료를 읽는 중…</p>

  <div class="tools">
    <div class="row">
      <button class="tab on" data-tab="칸">항목 고르기</button>
      <button class="tab" data-tab="영웅">영웅 수치표</button>
    </div>
    <div class="row" id="filters"><span class="lab">주제</span><span id="topics"></span></div>
    <div class="row" id="searchrow">
      <input type="search" id="q" placeholder="항목 찾기 (사거리·피해·재사용…)">
      <button class="pill" id="onlynum">줄 세울 수 있는 것만</button>
    </div>
  </div>

  <div id="catalog"></div>
  <div id="herotab" hidden>
    <div class="tscroll"><table class="ht" id="htab"></table></div>
    <p class="note">머리글을 누르면 그 칸으로 줄을 세웁니다. 값은 게임 원본에서 그대로 읽은 것입니다.</p>
  </div>
</div>

<script>
/* 통계 보기 — 게임 원본에서 **읽히는 항목이 무엇무엇인지** 주제별로 늘어놓고,
   고른 항목을 **줄 세우거나 그래프**로 본다.

   자료는 둘로 나뉜다.
     · `stats.json`      요약(150KB) — 들어오자마자 받는다
     · `stats-rows.json` 값 목록(828KB) — **칸을 처음 열 때만** 받는다
   다 합치면 38,335줄이라 처음부터 받게 하면 공짜 호스팅에 과하다. */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
const fmt = v => {
  const n = num(v);
  if (n === null) return esc(v);
  const r = Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 1000) / 1000;
  return r.toLocaleString('ko-KR');
};

/* **주제로 묶는다.** 자료를 만든 갈래(기술·위키식·원자료…)는 어디서 읽었나이지
   무엇에 대한 값인가가 아니다. 고르는 사람에게는 뒤쪽이 필요하다. */
const TOPIC = [
  ['영웅 수치',   f => f.갈래 === '기본' || f.갈래 === '평타'],
  ['비용과 시간', f => /재사용|연타 제한|시전 시간|마무리 시간|충전|마나|분노|고철|광기|취기|기력|탄약|에너지|자원|생명력 소모|처음 지연/.test(f.이름)],
  ['날아가는 것', f => /투사체|날아가|튕기는|질주|밀침|밀리는|가속도|오는 방향|이동 거리/.test(f.이름)],
  ['거리와 크기', f => /사거리|반지름|너비|높이|각도|히트박스|도형거리|끌기 범위|나오는 범위|부채꼴|가로|세로|크기|안쪽|바깥|뿌리는 구역|자리 패턴|나란히|둘러싼|연속 판정|방향/.test(f.이름)],
  ['피해와 회복', f => /피해|회복|성장|흡수|틱|보호막|치유/.test(f.이름)],
  ['소환',        f => /소환|나오는|마리|유닛/.test(f.이름)],
  ['효과와 지속', f => /지속|주기|간격|반복|이동 속도|공격 속도|방어력|기절|감속|중첩|기술 추가|상태|보정|효과|커지는|부른 횟수|단계/.test(f.이름)],
  ['누구에게',    f => /대상|영향|지정|고르는 차례|찾는|최대 대상|빼는/.test(f.이름)],
  ['퀘스트와 특성', f => /퀘스트|보상|레벨|강화|툴팁 수치|예외/.test(f.이름)],
  ['분류와 이름', f => /유형|속성|범위|기준|종류|모양|방식|갈래|칸$|모드|탈것|이름/.test(f.이름)],
  ['이어진 기술', f => /이어짐|이어받음|딸린 곳|같은 칸/.test(f.이름)],
  ['그 밖',       () => true],
];
const topicOf = f => (TOPIC.find(([, t]) => t(f)) || ['그 밖'])[0];

let DB = null, ROWS = null, TAB = '칸', TOPIC_ON = new Set(), ONLYNUM = false, OPEN = null, SHOW = 60;

/* ── 항목 카드 ─────────────────────────────────────────────── */
function card(f) {
  let mini = '';
  if (f.막대) {
    const hi = Math.max(...f.막대.수, 1);
    mini = `<div class="mini">${f.막대.수.map(n =>
      `<i style="height:${Math.max(1, Math.round(n / hi * 22))}px"></i>`).join('')}</div>`;
  }
  const line = f.꼴 === '수' && f.요약
    ? `${fmt(f.요약.최소)} ~ ${fmt(f.요약.최대)} · 중앙 <b>${fmt(f.요약.중앙)}</b>`
    : (f.값 && f.값.length ? `${f['값 수']}가지 · 으뜸 <b>${esc(f.값[0][0])}</b> ${f.값[0][1]}` : '');
  return `<button class="f" data-k="${esc(f.열쇠)}"><h3>${esc(f.이름)}`
       + `<span class="cov">${f.수}개 · ${Math.round(f.덮음 * 100)}%</span></h3>`
       + mini + `<div class="line">${line}</div>`
       + (f['뺀 것'] ? `<div class="drop">뺀 값 ${f['뺀 것'].reduce((a, b) => a + b[1], 0)}개</div>` : '')
       + `</button>`;
}

function drawCatalog() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const keep = DB.칸.filter(f =>
       (!TOPIC_ON.size || TOPIC_ON.has(topicOf(f)))
    && (!ONLYNUM || f.꼴 === '수')
    && (!q || f.이름.toLowerCase().includes(q)));
  const by = new Map();
  for (const f of keep) { const t = topicOf(f); if (!by.has(t)) by.set(t, []); by.get(t).push(f); }
  document.getElementById('catalog').innerHTML = keep.length
    ? TOPIC.map(([t]) => by.has(t)
        ? `<section class="topic"><h2>${esc(t)}<span>${by.get(t).length}가지</span></h2>`
          + `<div class="grid">${by.get(t).map(card).join('')}</div></section>` : '').join('')
    : `<p class="note">걸리는 항목이 없습니다.</p>`;
  document.getElementById('sub').innerHTML =
    `게임 원본에서 읽히는 항목 <b>${DB.칸.length}</b>가지 가운데 <b>${keep.length}</b>가지 · `
  + `영웅 ${DB['센 것'].영웅} · 기술 ${DB['센 것'].기술} · 특성 ${DB['센 것'].특성}`
  + (DB.자료 ? ` · 자료 ${esc(DB.자료)}` : '')
  + (DB['뺀 것'] && DB['뺀 것'].length
      ? `<br><span class="dropsum">정상 게임에서 만날 수 없는 값 `
        + `<b>${DB['뺀 것'].reduce((a, b) => a + b[1], 0)}개</b>는 빼고 셌습니다 — `
        + DB['뺀 것'].map(([w, n]) => `${esc(w)} ${n}`).join(' · ') + `</span>` : '');
}

/* ── 고른 항목 — 줄 세우기와 그래프 ──────────────────────────── */
let ASC = false;
async function openField(key) {
  const f = DB.칸.find(x => x.열쇠 === key);
  if (!f) return;
  OPEN = f; SHOW = 60;
  if (!ROWS) {
    paint('<p class="note">값 목록을 받는 중…</p>');
    ROWS = await fetch('../data/herodex/stats-rows.json').then(r => r.json());
  }
  paint();
}

function paint(busy) {
  const f = OPEN;
  let html = `<div class="pane" id="pane"><div class="box">`
    + `<div class="bhead"><h2>${esc(f.이름)}`
    + `<span class="cov" style="color:var(--dim);font-size:12px;font-weight:400">${esc(topicOf(f))} · ${f.수}개</span>`
    + `<button class="x" id="close">닫기</button></h2>`;
  if (!busy) {
    const w = f.꼴 === '수' ? ['큰 값부터', '작은 값부터'] : ['많은 것부터', '적은 것부터'];
    html += `<div class="row"><button class="pill ${ASC ? '' : 'on'}" data-sort="desc">${w[0]}</button>`
          + `<button class="pill ${ASC ? 'on' : ''}" data-sort="asc">${w[1]}</button></div>`;
  }
  html += `</div><div class="bbody">`;
  if (busy) { html += busy; }
  else {
    const raw = (ROWS.칸[f.열쇠] || []).slice();
    const numeric = f.꼴 === '수';
    /* **말 칸은 값별로 몇 개인지가 알맹이다.** 글자순으로 늘어놓으면 "치유, 이동: 돌진"
       이 세 줄 이어질 뿐 아무것도 안 보인다. 값마다 세어 그 수로 줄을 세운다. */
    if (!numeric) {
      const cnt = new Map();
      for (const [, v] of raw) cnt.set(String(v), (cnt.get(String(v)) || 0) + 1);
      const list = [...cnt.entries()].sort((a, b) => ASC ? a[1] - b[1] : b[1] - a[1]);
      const hi = Math.max(...list.map(x => x[1]), 1);
      html += `<div class="chart">${list.slice(0, 60).map(([v, n]) =>
        `<i style="height:${Math.max(2, Math.round(n / hi * 118))}px" title="${esc(v)} ${n}개"></i>`).join('')}</div>`
        + `<div class="line">값 ${list.length}가지 · ${ASC ? '적은' : '많은'} 것부터</div>`
        + `<table class="rank">` + list.slice(0, SHOW).map(([v, n], i) =>
            `<tr><td class="i">${i + 1}</td><td colspan="2">${esc(v)}</td>`
          + `<td class="b"><span><i style="width:${Math.round(n / hi * 100)}%"></i></span></td>`
          + `<td class="v">${n}개</td></tr>`).join('') + `</table>`;
      if (list.length > SHOW) html += `<button class="more" id="more">${list.length - SHOW}가지 더 보기</button>`;
      html += `</div></div></div>`;
      const old0 = document.getElementById('pane');
      if (old0) old0.remove();
      document.body.insertAdjacentHTML('beforeend', html);
      return;
    }
    raw.sort((a, b) => ASC ? a[1] - b[1] : b[1] - a[1]);
    if (raw.length > 1) {
      const vals = raw.map(r => r[1]), hi = Math.max(...vals, 1), n = Math.min(60, vals.length);
      html += `<div class="chart">${vals.slice(0, n).map(v =>
        `<i style="height:${Math.max(2, Math.round(Math.abs(v) / hi * 118))}px" title="${fmt(v)}"></i>`).join('')}</div>`
        + `<div class="line">앞에서 ${n}개 · ${ASC ? '작은' : '큰'} 값부터</div>`;
    }
    const hi = numeric ? Math.max(...raw.map(r => Math.abs(r[1])), 1) : 1;
    html += `<table class="rank">` + raw.slice(0, SHOW).map(([ei, v], i) => {
      const e = ROWS.대상[ei] || ['', '', ''];
      // 영웅 수치는 이름 칸이 늘 '기본 수치' 라 군더더기다 — 영웅 이름만 남긴다
      const who = e[1] === '기본 수치' ? '' : e[1];
      return `<tr><td class="i">${i + 1}</td><td class="h">${esc(e[0])}</td><td>${esc(who)}</td>`
        + (numeric ? `<td class="b"><span><i style="width:${Math.round(Math.abs(v) / hi * 100)}%"></i></span></td>` : `<td></td>`)
        + `<td class="v">${fmt(v)}</td></tr>`;
    }).join('') + `</table>`;
    if (raw.length > SHOW) html += `<button class="more" id="more">${raw.length - SHOW}개 더 보기</button>`;
  }
  html += `</div></div></div>`;
  const old = document.getElementById('pane');
  if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', html);
}

/* ── 영웅 수치표 ───────────────────────────────────────────── */
let SORT = { k: '생명력', asc: false };
function drawHeroes() {
  const keys = [];
  for (const h of DB.영웅) for (const k of Object.keys(h)) if (k !== 'id' && !keys.includes(k)) keys.push(k);
  const rows = DB.영웅.slice().sort((a, b) => {
    const nx = num(a[SORT.k]), ny = num(b[SORT.k]);
    if (nx !== null && ny !== null) return SORT.asc ? nx - ny : ny - nx;
    return SORT.asc ? String(a[SORT.k] ?? '').localeCompare(String(b[SORT.k] ?? ''), 'ko')
                    : String(b[SORT.k] ?? '').localeCompare(String(a[SORT.k] ?? ''), 'ko');
  });
  document.getElementById('htab').innerHTML =
      `<thead><tr>${keys.map(k =>
        `<th data-k="${esc(k)}" class="${k === SORT.k ? 'sorted' : ''}">${esc(k)}${k === SORT.k ? (SORT.asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.map(h => `<tr>${keys.map(k =>
        `<td>${h[k] == null ? '<span style="color:var(--dim)">–</span>' : fmt(h[k])}</td>`).join('')}</tr>`).join('')}</tbody>`;
  document.getElementById('sub').innerHTML =
    `영웅 <b>${DB.영웅.length}</b>명의 기본 수치 — 게임 원본에 적힌 그대로입니다`
  + (DB.자료 ? ` · 자료 ${esc(DB.자료)}` : '');
}

function draw() {
  const cat = TAB === '칸';
  document.getElementById('catalog').hidden = !cat;
  document.getElementById('herotab').hidden = cat;
  document.getElementById('filters').style.display = cat ? '' : 'none';
  document.getElementById('searchrow').style.display = cat ? '' : 'none';
  cat ? drawCatalog() : drawHeroes();
}

fetch('../data/herodex/stats.json').then(r => r.json()).then(d => {
  DB = d;
  const ts = TOPIC.map(([t]) => t).filter(t => d.칸.some(f => topicOf(f) === t));
  document.getElementById('topics').innerHTML = ts.map(t =>
    `<button class="pill" data-t="${esc(t)}">${esc(t)} ${d.칸.filter(f => topicOf(f) === t).length}</button>`).join(' ');
  draw();
}).catch(e => { document.getElementById('sub').textContent = '자료를 못 읽었습니다: ' + e; });

document.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) { TAB = t.dataset.tab; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); draw(); return; }
  const tp = e.target.closest('[data-t]');
  if (tp) { const k = tp.dataset.t; TOPIC_ON.has(k) ? TOPIC_ON.delete(k) : TOPIC_ON.add(k); tp.classList.toggle('on'); drawCatalog(); return; }
  if (e.target.id === 'onlynum') { ONLYNUM = !ONLYNUM; e.target.classList.toggle('on', ONLYNUM); drawCatalog(); return; }
  const f = e.target.closest('.f[data-k]');
  if (f) { openField(f.dataset.k); return; }
  const s = e.target.closest('[data-sort]');
  if (s) { ASC = s.dataset.sort === 'asc'; SHOW = 60; paint(); return; }
  if (e.target.id === 'more') { SHOW += 200; paint(); return; }
  if (e.target.id === 'close' || e.target.id === 'pane') { document.getElementById('pane')?.remove(); OPEN = null; return; }
  const th = e.target.closest('.ht th[data-k]');
  if (th) { const k = th.dataset.k; SORT = { k, asc: SORT.k === k ? !SORT.asc : false }; drawHeroes(); }
});
document.getElementById('q').addEventListener('input', () => { if (TAB === '칸') drawCatalog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('pane')?.remove(); OPEN = null; } });
</script>
</body>
</html>
