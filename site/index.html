<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HotS Scrap</title>
<link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
<style>
  /* 허브 전용 스타일 — 앱 폴더에는 관여하지 않는다 */
  :root { --bg:#0e1116; --card:#161b24; --line:#232b38; --fg:#e6ebf2; --dim:#8b96a5; --accent:#6cb2ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fa; --card:#ffffff; --line:#dde3ea; --fg:#1a2230; --dim:#5b6675; --accent:#1a6fd4; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Malgun Gothic","Segoe UI",sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:48px 20px; }
  h1 { margin:0 0 6px; font-size:28px; }
  .sub { color:var(--dim); margin:0 0 8px; }
  .build { color:var(--dim); font-size:13px; margin-bottom:32px; }
  .build b { color:var(--accent); }
  .grid { display:flex; flex-direction:column; gap:10px; }
  a.card { display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line);
           border-radius:10px; padding:16px 20px; text-decoration:none; color:inherit; transition:border-color .15s; }
  a.card:hover { border-color:var(--accent); }
  .card h2 { margin:0; font-size:17px; white-space:nowrap; }
  .card p { margin:0; margin-left:auto; color:var(--dim); font-size:13px; line-height:1.5; text-align:right; }
  .tag { display:inline-block; flex-shrink:0; font-size:11px; color:var(--dim);
         border:1px solid var(--line); border-radius:99px; padding:2px 8px; }
  @media (max-width: 560px) {
    a.card { flex-wrap:wrap; }
    .card p { margin-left:0; text-align:left; width:100%; }
  }
  .tag.heavy { color:#d9a441; border-color:#d9a441; }
  .planned { opacity:.5; pointer-events:none; }
  .err { color:#d97070; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="display:flex;align-items:center;gap:10px;"><picture><source srcset="shared/logo_light.svg" media="(prefers-color-scheme: dark)"><img src="shared/logo.svg" alt="" style="height:32px;width:32px;display:block;"></picture>HotS Scrap
    <a href="https://github.com/SIN0NIS/hots-scrap" target="_blank" rel="noopener" title="GitHub 저장소"
       style="margin-left:auto;font-size:13px;font-weight:normal;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 14px;">🔗 GitHub</a>
  </h1>
  <p class="sub">Salvaging every scrap of the Storm — heroes, builds &amp; replays.</p>
  <p class="build" id="build">데이터 버전 확인 중…</p>
  <div class="grid" id="grid"></div>
  <p style="margin-top:40px;font-size:11px;color:var(--dim);line-height:1.6;">
    비영리 팬 프로젝트 — Heroes of the Storm™ 및 관련 자산의 권리는 Blizzard Entertainment 에 있습니다.<br>
    Non-commercial fan project. All game assets © Blizzard Entertainment.
  </p>
</div>
<script>
// 허브는 apps.json / latest.json 만 읽는다. 앱 코드에는 관여하지 않는다.
(async () => {
  try {
    const latest = await fetch('data/latest.json').then(r => r.json());
    document.getElementById('build').innerHTML = '데이터 버전: <b>build ' + latest.build + '</b>' +
      (latest.updated ? ' · ' + latest.updated + ' 업데이트' : '');
  } catch (e) {
    document.getElementById('build').textContent = '데이터 버전 정보를 읽지 못했습니다';
  }
  try {
    const reg = await fetch('apps.json').then(r => r.json());
    const grid = document.getElementById('grid');
    for (const app of reg.apps) {
      const a = document.createElement('a');
      a.className = 'card' + (app.status === 'planned' ? ' planned' : '');
      a.href = app.path;
      a.innerHTML = '<h2>' + app.name + '</h2>' +
        '<span class="tag' + (app.requires === 'heavy' ? ' heavy' : '') + '">' +
        (app.requires === 'heavy' ? '로컬 자산 필요' : '바로 사용') +
        (app.status === 'planned' ? ' · 준비 중' : '') + '</span>' +
        '<p>' + app.desc + '</p>';
      grid.appendChild(a);
    }
  } catch (e) {
    document.getElementById('grid').innerHTML = '<p class="err">apps.json 을 읽지 못했습니다: ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
