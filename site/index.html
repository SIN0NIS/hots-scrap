<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HotS Scrap</title>
<link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
<style>
  /* ── HotS 팔레트: 남색(넥서스) · 흰색 · 황금 ─────────────────────
     라이트가 기본(:root), 다크는 media + data-theme 로 겹쳐 쓴다.   */
  :root {
    --bg:#f3f6fb;            /* 옅은 청백 */
    --bg-glow:radial-gradient(1200px 500px at 50% -10%, #dbe7f7 0%, transparent 60%);
    --card:#ffffff;
    --line:#cdd9ea;
    --fg:#122036;            /* 짙은 남색 글자 */
    --dim:#5d6d84;
    --blue:#1758a8;          /* 히오스 UI 블루 */
    --blue-soft:#e8f0fb;
    --gold:#a97e1f;          /* 황금 (라이트에선 진하게) */
    --gold-line:#d7b45c;
    --bar:#0b1526;           /* 전역 바 톤과 동일 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1526;          /* 넥서스 심연 남색 */
      --bg-glow:radial-gradient(1200px 500px at 50% -10%, #14294a 0%, transparent 60%);
      --card:#101f38;
      --line:#233a5c;
      --fg:#eaf1fa;
      --dim:#8fa2bd;
      --blue:#5aa8ff;
      --blue-soft:#132b4d;
      --gold:#e8c268;        /* 황금 (다크에선 밝게) */
      --gold-line:#8a6d2f;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1526;
    --bg-glow:radial-gradient(1200px 500px at 50% -10%, #14294a 0%, transparent 60%);
    --card:#101f38;
    --line:#233a5c;
    --fg:#eaf1fa;
    --dim:#8fa2bd;
    --blue:#5aa8ff;
    --blue-soft:#132b4d;
    --gold:#e8c268;
    --gold-line:#8a6d2f;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); background-image:var(--bg-glow); background-repeat:no-repeat;
         color:var(--fg); font-family:"Malgun Gothic","Segoe UI",sans-serif; min-height:100vh; }
  /* 배경 워터마크 — 빈 공간에 은은한 큰 로고 */
  body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.05;
                 background:url("shared/logo.svg") center/72vmin no-repeat; }
  /* 다크에서도 파일을 하나만 쓴다 — 5% 투명도라 색을 뒤집는 것으로 충분하다 (요청 1개 절약) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body::before { filter:invert(1); }
  }
  :root[data-theme="dark"] body::before { filter:invert(1); }
  .wrap { max-width:880px; margin:0 auto; padding:48px 20px; }

  /* 타이틀 줄 */
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .head img { height:34px; width:34px; display:block; }
  h1 { margin:0; font-size:28px; letter-spacing:0.5px; }
  h1 .s { color:var(--gold); }
  /* 로고는 파일 두 개를 받는 대신 안에 박아 두고 색만 바꾼다 (요청 2개 절약) */
  :root { --logo-1:#4f463d; --logo-2:#332e29; --logo-3:#221d1a; }
  .head svg.logo { height:34px; width:34px; flex:0 0 auto; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --logo-1:#e2d8ca; --logo-2:#bdb1a1; --logo-3:#948877; }
  }
  :root[data-theme="dark"] { --logo-1:#e2d8ca; --logo-2:#bdb1a1; --logo-3:#948877; }

  .headbtn { white-space:nowrap; font-size:13px; color:var(--dim); text-decoration:none; border:1px solid var(--line);
             border-radius:99px; padding:5px 14px; background:var(--card); cursor:pointer;
             font-family:inherit; transition:border-color .15s, color .15s; }
  .headbtn:hover { border-color:var(--gold-line); color:var(--gold); }
  /* 손가락으로도 쓰는 기기(any-pointer:coarse)에서 누를 크기를 44px 로.
     ::after 띠로 넓히면 단추가 줄바꿈될 때 윗줄 띠가 아랫줄 단추를 덮어 엉뚱한 것이 눌린다.
     min-height 로 요소 자체를 키운다. */
  @media (any-pointer:coarse) {
    .headbtn { min-height:44px; display:inline-flex; align-items:center; }
  }
  #themeBtn { margin-left:auto; }

  .sub { color:var(--dim); margin:10px 0 6px; font-size:15px; }
  .build { color:var(--dim); font-size:13px; margin:0 0 30px; }
  .build b { color:var(--blue); }
  .build .date { color:var(--gold); }

  /* 앱 목록 — 1줄 1앱 */
  .grid { display:flex; flex-direction:column; gap:10px; }
  a.card { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
           border-left:3px solid var(--gold-line); border-radius:10px; padding:16px 20px;
           text-decoration:none; color:inherit; transition:border-color .15s, transform .1s; }
  a.card:hover { border-color:var(--gold); border-left-color:var(--gold); transform:translateX(2px); }
  .card h2 { margin:0; font-size:17px; white-space:nowrap; color:var(--blue); }
  .card p { margin:0; margin-left:auto; color:var(--dim); font-size:13px; line-height:1.5; text-align:right; }
  .card .when { display:block; margin-top:3px; font-size:11.5px; color:var(--dim); opacity:.85; letter-spacing:.01em; }
  .card .when b { font-weight:600; color:var(--blue); }
  .check { text-align:center; margin:-6px 0 22px; font-size:12.5px; color:var(--dim); }
  .check b { font-weight:600; }
  .check a { color:inherit; }
  .tag { display:inline-block; flex-shrink:0; font-size:11px; color:var(--gold);
         border:1px solid var(--gold-line); border-radius:99px; padding:2px 8px; }
  .planned { opacity:.5; pointer-events:none; }
  .err { color:#d97070; }

  .foot { margin-top:40px; font-size:11px; color:var(--dim); line-height:1.6;
          border-top:1px solid var(--line); padding-top:16px; }
  @media (max-width:560px) {
    a.card { flex-wrap:wrap; }
    .card p { margin-left:0; text-align:left; width:100%; }
    h1 { font-size:21px; white-space:nowrap; }
    .head svg.logo { height:26px; width:26px; }
    .headbtn { font-size:12px; padding:4px 10px; }
    .wrap { padding:28px 14px; }
  }
  /* 아주 좁은 폰(320px) — 제목과 단추가 한 줄에 못 들어간다. 단추만 아랫줄로 내린다. */
  @media (max-width:380px) {
    .head h1 { flex:1 1 auto; }
    .head .headbtn:first-of-type { margin-left:auto; }
    .wrap { padding:24px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" class="logo" aria-hidden="true">
    <defs>
    <linearGradient id="hublogo-metal" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="var(--logo-1)"/>
    <stop offset="45%" stop-color="var(--logo-2)"/>
    <stop offset="100%" stop-color="var(--logo-3)"/>
    </linearGradient>
    <filter id="hublogo-rust" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="4" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" result="rustcol"
    values="0.9 0.4 0 0 0.12
    0.45 0.25 0 0 0.06
    0.15 0.1 0 0 0.03
    0 0 0 1.1 -0.60"/>
    <feComposite in="rustcol" in2="SourceGraphic" operator="in" result="clipped"/>
    <feBlend in="clipped" in2="SourceGraphic" mode="normal" result="blended"/>
    <feTurbulence type="fractalNoise" baseFrequency="3.2" numOctaves="3" seed="4" result="grain"/>
    <feColorMatrix in="grain" type="matrix" result="graina"
    values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.4  0 0 0 0.35 0"/>
    <feComposite in="graina" in2="SourceGraphic" operator="in" result="grainclip"/>
    <feBlend in="grainclip" in2="blended" mode="overlay"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <g id="screw">
    <path d="M -80.0,-96.0 L -22.0,-96.0 L 28.0,-46.0 L 41.0,-29.0 L 54.0,-46.0 L 67.0,-29.0 L 80.0,-46.0 L 93.0,-29.0 L 106.0,-46.0 L 119.0,-29.0 L 132.0,-46.0 L 145.0,-29.0 L 158.0,-46.0 L 171.0,-29.0 L 184.0,-46.0 L 197.0,-29.0 L 210.0,-46.0 L 223.0,-29.0 L 236.0,-46.0 L 249.0,-29.0 L 262.0,-46.0 L 276.0,-38.0 L 340.0,0 L 276.0,38.0 L 262.0,46.0 L 249.0,29.0 L 236.0,46.0 L 223.0,29.0 L 210.0,46.0 L 197.0,29.0 L 184.0,46.0 L 171.0,29.0 L 158.0,46.0 L 145.0,29.0 L 132.0,46.0 L 119.0,29.0 L 106.0,46.0 L 93.0,29.0 L 80.0,46.0 L 67.0,29.0 L 54.0,46.0 L 41.0,29.0 L 28.0,46.0 L -22.0,96.0 L -80.0,96.0 Z" fill="url(#hublogo-metal)"/>
    <path d="M -22.0,-90.0 L -22.0,90.0"
    stroke="#0f0c0a" stroke-opacity="0.45" stroke-width="6" fill="none"/>
    <path d="M -64.0,-78.0 L -64.0,78.0"
    stroke="#0f0c0a" stroke-opacity="0.30" stroke-width="5" fill="none"/>
    </g>
    </defs>
    <g filter="url(#shadow)">
    <g filter="url(#hublogo-rust)">
    <path d="M 970,500 L 735,907 L 265,907 L 30,500 L 265,93 L 735,93 Z"
    fill="none" stroke="url(#hublogo-metal)" stroke-width="34" stroke-linejoin="round"/>
    <path d="M 908,500 L 704,853 L 296,853 L 92,500 L 296,147 L 704,147 Z"
    fill="none" stroke="url(#hublogo-metal)" stroke-width="7" stroke-linejoin="round"/>
    <g transform="rotate(0 500 500)">
    <g transform="translate(500,500) rotate(-38) translate(-215,-140) scale(0.78)"><use href="#screw"/></g>
    </g>
    <g transform="rotate(120 500 500)">
    <g transform="translate(500,500) rotate(-38) translate(-215,-140) scale(0.78)"><use href="#screw"/></g>
    </g>
    <g transform="rotate(240 500 500)">
    <g transform="translate(500,500) rotate(-38) translate(-215,-140) scale(0.78)"><use href="#screw"/></g>
    </g>
    </g>
    </g>
    </svg>
    <h1>HotS <span class="s">Scrap</span></h1>
    <button id="themeBtn" class="headbtn" title="다크/라이트 전환">◐ 테마</button>
    <a class="headbtn" href="https://github.com/SIN0NIS/hots-scrap" target="_blank" rel="noopener" title="GitHub 저장소">🔗 GitHub</a>
  </div>
  <p class="sub">Salvaging every scrap of the Storm — heroes, builds &amp; replays.</p>
  <p class="build" id="build">데이터 버전 확인 중…</p>
  <p class="check" id="check"></p>
  <div id="admin" hidden></div>
  <div class="grid" id="grid"></div>
  <p class="foot">
    비영리 팬 프로젝트 — Heroes of the Storm™ 및 관련 자산의 권리는 Blizzard Entertainment 에 있습니다.<br>
    Non-commercial fan project. All game assets © Blizzard Entertainment.
  </p>
</div>
<script>
/* 테마 토글 — localStorage('scrap.theme') 은 사이트 전역 공유 (앱 전역 바에서도 바꿀 수 있다) */
(function () {
  var KEY = 'scrap.theme';
  function apply(t) {
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    var eff = t || ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = eff === 'light' ? '☀ Light' : '☾ Dark';
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY) || localStorage.getItem('hub.theme'); } catch (e) {}
  apply(saved);
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    if (!cur) cur = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  });
})();

/* 허브는 data/hub.json 하나만 읽는다 (전에는 apps.json + latest.json 둘이었다 — 요청을 하나로 줄였다).
   hub.json 은 pipeline/steps/build_status.py 가 apps.json + 자료 파일에서 만든다.
   못 읽으면 예전 방식(apps.json)으로 되돌아간다. */
(async () => {
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* 자동 점검 시각 — GitHub Actions 는 UTC 로 돈다.
     6시간마다 UTC 00:10 · 06:10 · 12:10 · 18:10 (한국 09:10 · 15:10 · 21:10 · 03:10).
     보는 사람의 시간대로 바꿔 보여 준다. */
  function checkTimes() {
    var now = new Date();
    var last = new Date(now);
    last.setUTCMinutes(10, 0, 0);
    last.setUTCHours(Math.floor(now.getUTCHours() / 6) * 6);
    if (last > now) last = new Date(last.getTime() - 6 * 3600e3);
    return { last: last, next: new Date(last.getTime() + 6 * 3600e3) };
  }
  function hhmm(d) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  var reg = null, fellBack = false;
  try {
    reg = await fetch('data/hub.json').then(function (r) { if (!r.ok) throw 0; return r.json(); });
  } catch (e) {
    try { reg = await fetch('apps.json').then(function (r) { return r.json(); }); fellBack = true; } catch (e2) {}
  }

  var buildEl = document.getElementById('build');
  if (reg && reg.build) {
    buildEl.innerHTML = '데이터 버전: <b>build ' + esc(reg.build) + '</b>' +
      (reg.updated ? ' · <span class="date">' + esc(reg.updated) + ' 업데이트</span>' : '');
  } else if (fellBack) {
    try {
      var lt = await fetch('data/latest.json').then(function (r) { return r.json(); });
      buildEl.innerHTML = '데이터 버전: <b>build ' + esc(lt.build) + '</b>' +
        (lt.updated ? ' · <span class="date">' + esc(lt.updated) + ' 업데이트</span>' : '');
    } catch (e) { buildEl.textContent = '데이터 버전 정보를 읽지 못했습니다'; }
  } else {
    buildEl.textContent = '데이터 버전 정보를 읽지 못했습니다';
  }

  // 가장 최근에 뭔가 갱신된 시기 한 줄 — 언제 것인지만 알면 되니 날짜까지만 적는다
  var newest = '';
  if (reg && reg.apps) {
    for (var j = 0; j < reg.apps.length; j++) {
      var u = reg.apps[j].updatedAt;
      if (u && u > newest) newest = u;
    }
  }
  var t = checkTimes();
  document.getElementById('check').innerHTML =
    (newest ? '마지막 업데이트 <b>' + esc(newest.slice(0, 10)) + '</b> · ' : '') +
    '새 패치가 났는지 <b>6시간마다</b> 자동으로 확인합니다 (다음 ' + hhmm(t.next) + ') ' +
    '<a href="https://github.com/SIN0NIS/hots-scrap/actions/workflows/update-patchnotes.yml" target="_blank" rel="noopener">기록 보기</a>';

  var grid = document.getElementById('grid');
  if (!reg || !reg.apps) {
    grid.innerHTML = '<p class="err">앱 목록을 읽지 못했습니다</p>';
    return;
  }
  for (var i = 0; i < reg.apps.length; i++) {
    var app = reg.apps[i];
    var a = document.createElement('a');
    a.className = 'card' + (app.status === 'planned' ? ' planned' : '');
    a.href = app.path;
    // 카드에는 '무엇을 기준으로 만든 자료인지'만 적는다.
    // 갱신 날짜를 앱마다 늘어놓으면 기록처럼 보여서, 가장 최근 것만 위에 한 줄로 둔다.
    var when = app.note ? '<span class="when">' + esc(app.note) + '</span>' : '';
    a.innerHTML = '<h2>' + esc(app.name) + '</h2>' +
      '<span class="tag">' +
      (app.requires === 'heavy' ? '로컬 자산 필요' : '바로 사용') +
      (app.status === 'planned' ? ' · 준비 중' : '') + '</span>' +
      '<p>' + esc(app.desc) + when + '</p>';
    grid.appendChild(a);
  }
})();

/* ───────── 나만 쓰는 수동 갱신 ─────────
   6시간을 안 기다리고 지금 바로 갱신을 돌린다. 공개 사이트라 '숨긴 단추'만으로는 못 막으므로,
   **내 GitHub 토큰이 이 브라우저에 저장돼 있을 때만** 단추가 보이고 동작한다.
   토큰은 localStorage 에만 있고(이 브라우저 밖으로 안 나간다), 사이트는 전부 정적이라
   보내는 곳은 api.github.com 뿐이다. 남의 브라우저에는 이 줄이 아예 그려지지 않는다.

   처음 한 번: 주소 끝에 #admin 을 붙여 연다 → 토큰을 넣고 저장.
   토큰은 fine-grained PAT 로 저장소 두 개(hots-scrap, images)에 **Actions: Read and write** 만 주면 된다.
   잃어버리거나 남이 알게 되면 GitHub 에서 그 토큰만 지우면 끝이다. */
(function () {
  var KEY = 'scrap.gh';
  var JOBS = [
    { repo: 'SIN0NIS/hots-scrap', wf: 'update-patchnotes.yml', name: '패치 자료' },
    { repo: 'SIN0NIS/images', wf: 'pick-icons.yml', name: '아이콘' }
  ];
  var box = document.getElementById('admin');
  var esc2 = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function tok() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function hdr() {
    return { Authorization: 'Bearer ' + tok(), Accept: 'application/vnd.github+json',
             'X-GitHub-Api-Version': '2022-11-28' };
  }
  if (!tok() && location.hash !== '#admin') return;     // 남에게는 없는 것과 같다

  box.hidden = false;
  box.style.cssText = 'margin:-6px 0 14px;font-size:12px;color:var(--dim,#5d6d84);line-height:1.8';
  var S = 'font:inherit;padding:5px 10px;border-radius:7px;border:1px solid var(--line,#cdd9ea);cursor:pointer;background:transparent;color:inherit';

  function setup(msg) {
    box.innerHTML = '<b>수동 갱신 설정</b> — GitHub 토큰을 이 브라우저에만 저장합니다.<br>'
      + '<input id="adm-t" type="password" placeholder="github_pat_..." autocomplete="off" '
      + 'style="font:inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--line,#cdd9ea);width:min(320px,70vw)"> '
      + '<button id="adm-save" style="' + S + '">저장</button> '
      + '<span id="adm-msg">' + (msg || '') + '</span><br>'
      + '<span style="opacity:.8">fine-grained 토큰에 <b>hots-scrap</b>·<b>images</b> 두 저장소의 '
      + '<b>Actions: Read and write</b> 권한만 주면 됩니다.</span>';
    document.getElementById('adm-save').onclick = async function () {
      var v = document.getElementById('adm-t').value.trim();
      var m = document.getElementById('adm-msg');
      if (!v) { m.textContent = '토큰을 넣어 주세요'; return; }
      m.textContent = '확인 중…';
      try { localStorage.setItem(KEY, v); } catch (e) {}
      try {
        // 진짜 쓸 수 있는 토큰인지 먼저 본다 — 아니면 저장해 두지 않는다
        var r = await fetch('https://api.github.com/repos/SIN0NIS/hots-scrap/actions/workflows', { headers: hdr() });
        if (!r.ok) throw new Error(r.status === 401 ? '토큰이 잘못됐습니다' : ('권한이 모자랍니다 (' + r.status + ')'));
        panel('저장했습니다.');
      } catch (e) {
        try { localStorage.removeItem(KEY); } catch (e2) {}
        m.textContent = '✗ ' + e.message;
      }
    };
  }

  function panel(msg) {
    box.innerHTML = '<button id="adm-run" style="' + S + ';border-color:var(--gold-line,#d7b45c)">⟳ 지금 갱신</button> '
      + '<span id="adm-msg">' + esc2(msg || '6시간을 기다리지 않고 바로 확인합니다.') + '</span> '
      + '<button id="adm-out" style="' + S + ';opacity:.6">토큰 지우기</button>';
    document.getElementById('adm-out').onclick = function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      setup('지웠습니다.');
    };
    document.getElementById('adm-run').onclick = run;
  }

  async function run() {
    var btn = document.getElementById('adm-run'), m = document.getElementById('adm-msg');
    btn.disabled = true;
    var started = {};
    try {
      for (var i = 0; i < JOBS.length; i++) {
        var j = JOBS[i];
        // 지금 무엇이 마지막 실행인지 적어 둔다 — 새로 시작된 것을 가려내려고
        var prev = await lastRun(j);
        started[j.repo + '/' + j.wf] = prev ? prev.id : 0;
        var r = await fetch('https://api.github.com/repos/' + j.repo + '/actions/workflows/' + j.wf + '/dispatches',
          { method: 'POST', headers: hdr(), body: JSON.stringify({ ref: 'main' }) });
        if (r.status !== 204) throw new Error(j.name + ' 시작 실패 (' + r.status + ')');
      }
    } catch (e) {
      m.textContent = '✗ ' + e.message; btn.disabled = false; return;
    }
    var t0 = Date.now(), state = JOBS.map(function () { return '대기'; });
    for (var n = 0; n < 45; n++) {                       // 8초마다, 최대 6분쯤 지켜본다
      await new Promise(function (ok) { setTimeout(ok, 8000); });
      var lines = [], done = 0;
      for (var k = 0; k < JOBS.length; k++) {
        var job = JOBS[k];
        if (state[k] === '끝' || state[k] === '실패') {   // 끝난 것은 더 묻지 않는다(요청 아끼기)
          done++; lines.push(job.name + ' ' + state[k]); continue;
        }
        var cur = await lastRun(job);
        var fresh = cur && cur.id !== started[job.repo + '/' + job.wf];
        state[k] = !fresh ? '대기' : (cur.status !== 'completed' ? '도는 중'
          : (cur.conclusion === 'success' ? '끝' : '실패'));
        if (state[k] === '끝' || state[k] === '실패') done++;
        lines.push(job.name + ' ' + state[k]);
      }
      m.textContent = lines.join(' · ') + ' (' + Math.round((Date.now() - t0) / 1000) + '초)';
      if (done === JOBS.length) {
        m.innerHTML = lines.join(' · ') + ' — <a href="javascript:location.reload()">새로고침</a> 하면 반영된 것이 보입니다';
        btn.disabled = false;
        return;
      }
    }
    m.textContent = '아직 도는 중입니다. 잠시 뒤 새로고침해 보세요.';
    btn.disabled = false;
  }

  async function lastRun(j) {
    try {
      var r = await fetch('https://api.github.com/repos/' + j.repo + '/actions/workflows/' + j.wf
        + '/runs?per_page=1', { headers: hdr() });
      if (!r.ok) return null;
      var d = await r.json();
      return (d.workflow_runs || [])[0] || null;
    } catch (e) { return null; }
  }

  if (tok()) panel(); else setup();
})();
</script>
</body>
</html>
