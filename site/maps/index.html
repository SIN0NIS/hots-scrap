<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="히오스 전장 15곳 — 목표물 규칙·맵 흐름·주기·보상과 효과·성장 한계, 게임 원본 자료 기준">
<link rel="icon" href="../shared/favicon.svg">
<script src="../shared/scrap.js" defer></script>
<title>전장 도감 · HotS Scrap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 판: 위에 전장 고르개와 시간 손잡이가 붙박이로 머물고, 아래로 절이 흐른다.
   배치 그림이 이 글의 주인공이라 제일 위에 크게 둔다. */
:root {
  --bg:#eef2f8; --panel:#ffffff; --line:#cfd9e8; --line2:#b7c5da;
  --fg:#17233a; --dim:#5e6e88; --faint:#8a99b2;
  --gold:#9a7212; --gold-soft:#f3e6c4; --order:#1f62c0; --chaos:#c0402c; --neu:#7b879b;
  --grow:#0f7a63; --grow-soft:#d7eee8; --shade:#e6ecf5;
  --field:#e4eaf4; --zone:#dae3f0; --zoneline:#c6d4e8; --lane:#8aa0bd; --spot:#7a3fb0;
  --body:'IBM Plex Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0c1423; --panel:#121d31; --line:#22334f; --line2:#2e4264;
  --fg:#e8eefb; --dim:#95a6c2; --faint:#6e7f9c;
  --gold:#e3c070; --gold-soft:#2a2414; --order:#5a9eff; --chaos:#ff7b64; --neu:#8b99b0;
  --grow:#4fd3b0; --grow-soft:#10302a; --shade:#0a1526;
  --field:#0f1e36; --zone:#16294a; --zoneline:#24395d; --lane:#5b7aa8; --spot:#c79cf0;
  color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0c1423; --panel:#121d31; --line:#22334f; --line2:#2e4264;
  --fg:#e8eefb; --dim:#95a6c2; --faint:#6e7f9c;
  --gold:#e3c070; --gold-soft:#2a2414; --order:#5a9eff; --chaos:#ff7b64; --neu:#8b99b0;
  --grow:#4fd3b0; --grow-soft:#10302a; --shade:#0a1526;
  --field:#0f1e36; --zone:#16294a; --zoneline:#24395d; --lane:#5b7aa8; --spot:#c79cf0;
  color-scheme:dark;
}
html { height:100%; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:var(--body); line-height:1.65;
       height:100%; margin:0; overflow:hidden; }

/* 앱 화면 — 머리(전장·시간) 아래로 지도 3 : 설명 1. 설명은 닫거나(지도만) 넓힌다(설명만). */
.app { height:100%; display:flex; flex-direction:column; }
.bar { flex:0 0 auto; background:var(--bg); border-bottom:1px solid var(--line);
       padding-inline:16px; padding-block:8px 7px; }
.barrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.barrow h1 { flex:1 1 auto; min-width:0; }
.views { display:flex; gap:4px; flex:0 0 auto; }
/* 넓은 화면 — 제목 · 시간 손잡이 · 보기 버튼을 한 줄에, 전장 고르개는 그 아래 한 줄 */
@media (min-width:900px) {
  .bar { display:grid; grid-template-columns:auto minmax(220px,1fr) auto; grid-template-areas:"t s v" "p p p";
         column-gap:16px; align-items:center; }
  .barrow { display:contents; }
  .barrow h1 { grid-area:t; margin:0; }
  .views { grid-area:v; }
  .bar .slide { grid-area:s; margin-top:0; }
  .bar .picker { grid-area:p; margin-top:6px; }
}
.vb { font-size:12px; color:var(--dim); background:var(--panel); border:1px solid var(--line);
      border-radius:7px; padding:3px 9px; min-height:30px; cursor:pointer; white-space:nowrap; }
.vb[aria-pressed="true"] { background:var(--gold-soft); border-color:var(--gold); color:var(--gold); font-weight:700; }
.stage { flex:1 1 auto; min-height:0; display:grid;
         grid-template-columns:minmax(0,3fr) minmax(300px,1fr); }
.app[data-side="closed"] .stage { grid-template-columns:minmax(0,1fr); }
.app[data-side="closed"] .side { display:none; }
.app[data-side="full"] .stage { grid-template-columns:minmax(0,1fr); }
.app[data-side="full"] .mapcol { display:none; }
.mapcol { position:relative; min-width:0; min-height:0; background:var(--shade);
          border-right:1px solid var(--line); overflow:hidden; }
.mapview { position:absolute; inset:0; }
.bigmap { width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none; }
.bigmap.drag { cursor:grabbing; }
.bigmap [data-l] { transition:opacity .15s; }
.bigmap.no-bld [data-l="bld"], .bigmap.no-obj [data-l="obj"], .bigmap.no-camp [data-l="camp"],
.bigmap.no-fac [data-l="fac"], .bigmap.no-lbl .lbls { display:none; }
.bigmap .mk2 { cursor:pointer; outline:none; }
.bigmap .halo { fill:none; stroke:none; }
.bigmap .mk2.hl .halo { fill:rgba(255,255,255,.18); stroke:#fff; stroke-width:1.6;
                        animation:깜빡 1s ease-in-out infinite; }
@keyframes 깜빡 { 50% { stroke-opacity:.15; fill-opacity:.05; } }
.mapctl { position:absolute; right:12px; bottom:12px; display:grid; gap:6px; }
.layers { position:absolute; left:12px; top:12px; right:120px; bottom:12px; display:flex; flex-wrap:wrap; align-items:flex-start;
          align-content:flex-start; gap:5px; pointer-events:none; }
.layers > * { pointer-events:auto; }
.layers .kbrk { flex:0 0 100%; height:0; pointer-events:none; }
.mbtn, .chip { font:600 12px var(--body); color:var(--fg); background:var(--panel); border:1px solid var(--line2);
               border-radius:8px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.18); }
.mbtn { width:38px; height:38px; font-size:18px; line-height:1; }
.mbtn.wide { width:auto; padding:0 9px; font-size:12px; }
.chip { padding:4px 9px; min-height:30px; }
.chip[aria-pressed="false"] { color:var(--faint); background:var(--bg); text-decoration:line-through; }
.kchip[aria-expanded="true"] { background:var(--gold-soft); border-color:var(--gold); }
/* 기호판 — 지도 왼쪽 위, 단추 줄 아래. 이 전장 지도에 나온 아이콘만, 누르면 지도에서 깜빡인다 */
.mapkey { box-sizing:border-box; flex:0 1 280px; max-width:100%; overflow-x:hidden; max-height:calc(100% - 40px); overflow:auto; background:var(--panel);
          border:1px solid var(--line2); border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,.25); padding:6px 8px; font-size:12px; }
.mapkey h4 { margin:4px 2px 3px; font-size:10.5px; color:var(--dim); font-weight:700; letter-spacing:.4px; }
.mapkey .kli { box-sizing:border-box; display:flex; align-items:center; gap:7px; width:100%; min-height:28px; text-align:left; background:none; border:0;
               border-radius:6px; padding:2px 4px; font:inherit; color:var(--fg); cursor:pointer; }
.mapkey .kli:hover, .mapkey .kli.on { background:var(--gold-soft); }
.mapkey .kli.static { cursor:default; background:none; }
.mapkey .kli img { width:20px; height:20px; flex:0 0 auto; border-radius:50%; }
.mapkey .kli img.o { box-shadow:0 0 0 2px var(--order); } .mapkey .kli img.c { box-shadow:0 0 0 2px var(--chaos); }
.mapkey .kn { margin-left:auto; padding-left:6px; color:var(--dim); font:500 11px var(--mono); }
.mapkey .kt { min-width:0; overflow-wrap:anywhere; }
.mapkey .kfoot { margin:5px 2px 2px; color:var(--dim); font-size:11px; line-height:1.45; }
.sideopen { position:absolute; right:12px; top:12px; display:none; }
.app[data-side="closed"] .sideopen { display:block; }
.maphint { position:absolute; left:12px; bottom:12px; font-size:11.5px; color:#fff;
           background:rgba(0,0,0,.45); border-radius:6px; padding:2px 8px; pointer-events:none; }
.side { min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--bg);
        container-type:inline-size; }
.sidehead { flex:0 0 auto; display:flex; gap:6px; align-items:center; padding:7px 10px 7px 12px;
            border-bottom:1px solid var(--line); background:var(--bg); }
.jump { flex:1 1 auto; min-width:0; display:flex; gap:4px; overflow-x:auto; scrollbar-width:thin; }
.jump a { flex:0 0 auto; font-size:12px; color:var(--dim); text-decoration:none; border:1px solid var(--line);
          border-radius:999px; padding:2px 9px; background:var(--panel); white-space:nowrap; }
.jump a:hover { color:var(--gold); border-color:var(--gold); }
.sidebtns { display:flex; gap:4px; flex:0 0 auto; }
.sidebtns .mbtn { width:32px; height:32px; font-size:15px; box-shadow:none; }
.sidebody { flex:1 1 auto; min-height:0; overflow:auto; overflow-anchor:none; padding-inline:16px; padding-block:0 40px;
            scroll-behavior:smooth; }
.sideinner { max-width:1100px; margin:0 auto; }
.sidebody h2:first-child { margin-top:14px; }
@media (max-width:760px) {
  .stage { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(230px,46%) minmax(0,1fr); }
  .app[data-side="closed"] .stage, .app[data-side="full"] .stage { grid-template-rows:minmax(0,1fr); }
  .mapcol { border-right:0; border-bottom:1px solid var(--line); }
  .vb .vt { display:none; }
  .bar h1 span { display:none; }
  .bar h1 { margin:0; }
  .layers { right:12px; top:8px; left:8px; bottom:8px; }
  .layers .chip { font-size:11px; padding:2px 7px; min-height:26px; }
  .mapkey { flex-basis:calc(100% - 88px); max-height:calc(100% - 34px); }
  .maphint { display:none; }
}
.bar h1 { font-size:18px; font-weight:700; margin:0 0 6px; letter-spacing:-.3px; }
.bar h1 span { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
.picker { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
.mp { flex:0 0 auto; font-size:12.5px; color:var(--dim); background:var(--panel);
      border:1px solid var(--line); border-radius:999px; padding:4px 12px; cursor:pointer;
      min-height:32px; white-space:nowrap; }
.mp:hover { border-color:var(--gold); color:var(--gold); }
.mp[aria-pressed="true"] { background:var(--gold-soft); border-color:var(--gold); color:var(--gold);
                           font-weight:700; }
.slide { display:flex; align-items:center; gap:8px; margin-top:7px; }
.step { flex:0 0 auto; width:36px; height:32px; border-radius:8px; cursor:pointer;
        border:1px solid var(--line2); background:var(--panel); color:var(--gold);
        font-family:var(--mono); font-size:18px; line-height:1; }
.step:disabled { opacity:.4; cursor:default; }
input[type=range] { flex:1; min-width:0; accent-color:var(--gold); height:24px; margin:0; }
.tm { font-family:var(--mono); font-size:15px; font-weight:600; color:var(--gold);
      font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }

h2 { font-size:17px; font-weight:700; margin:26px 0 10px; padding-bottom:6px;
     border-bottom:2px solid var(--line); display:flex; align-items:baseline; gap:8px; }
h2 .cnt { font-family:var(--mono); font-size:12px; color:var(--faint); font-weight:400; }
.note { color:var(--dim); font-size:12.5px; margin:0 0 10px; }
.cols { display:grid; gap:16px; }
@media (min-width:900px) { .cols { grid-template-columns:minmax(0,1fr) 290px; align-items:start; } }
.mapfig { width:100%; height:auto; border:1px solid var(--line); border-radius:10px;
          background:var(--field); display:block; }
.leg { display:flex; flex-wrap:wrap; gap:9px; margin-top:7px; font-size:11.5px; color:var(--dim); }
.leg span { display:inline-flex; align-items:center; gap:4px; }
.leg i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.k-order { background:var(--order); } .k-chaos { background:var(--chaos); }
.k-neu { background:var(--neu); } .k-lane { background:var(--lane); }
.k-camp { border:2px dashed var(--gold); border-radius:50%; }
.k-spot { border:2px solid var(--spot); transform:rotate(45deg); }
.statbox { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
.srow { display:flex; justify-content:space-between; gap:10px; padding:6px 11px;
        border-bottom:1px solid var(--line); font-size:13px; }
.srow:last-child { border-bottom:0; }
.sk { color:var(--dim); font-size:12.5px; }
.sv { font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; }
.gim { border-bottom:1px solid var(--line); padding:9px 0; }
.gim:last-child { border-bottom:0; }
.gt { font-weight:700; } .gd { margin:2px 0 0; color:var(--fg); opacity:.85; font-size:13.5px; }

table.wt { width:100%; border-collapse:separate; border-spacing:0; border:1px solid var(--line);
      border-radius:8px; overflow:hidden; font-size:12.5px; }
.wt th { background:var(--panel); color:var(--dim); font-weight:600; text-align:left;
         padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
.wt td { padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
.wt tr:last-child td { border-bottom:0; }
.wt .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.dimid { display:none !important; }   /* 게임 내부 이름·근거 줄 — 화면에 안 낸다 */
.chead > div { min-width:0; }
.rh { font-size:14px; font-weight:700; margin:16px 0 6px; color:var(--gold);
      display:flex; align-items:baseline; gap:7px; }
.useat { font-size:11.5px; color:var(--dim); }
/* 순서도 — 한 줄에 한 단계, 동시 단계는 한 상자, 사이는 아래 화살표 */
.flow { display:grid; gap:0; }
.fs { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
.fhead { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.fno { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--panel);
       background:var(--gold); border-radius:4px; padding:0 6px; }
.fname { font-size:14.5px; }
.fwhen { font-size:12px; border-radius:4px; padding:1px 7px; margin-left:auto; white-space:nowrap; }
.fwhen.time { color:var(--order); border:1px solid var(--order); }
.fwhen.cond { color:var(--grow); border:1px solid var(--grow); }
.fbody { font-size:13px; margin-top:5px; }
.ffoot { display:flex; gap:8px; align-items:baseline; justify-content:space-between;
         flex-wrap:wrap; margin-top:5px; }
.fpar { border:1.5px dashed var(--line2); border-radius:11px; padding:8px; display:grid; gap:7px; }
.fparh { font-size:11.5px; color:var(--dim); font-weight:600; letter-spacing:.3px; }
.farrow { text-align:center; color:var(--faint); font-size:15px; line-height:1.5; }
.frep { border:1px dashed var(--gold); border-radius:9px; padding:8px 12px; font-size:13px;
        color:var(--gold); background:var(--gold-soft); }
@media (max-width:420px) { .fwhen { margin-left:0; } }
.judge { font-size:11.5px; border-radius:3px; padding:1px 6px; white-space:nowrap; }
.judge.ok { color:var(--grow); border:1px solid var(--grow); background:var(--grow-soft); }
.judge.bad { color:var(--chaos); border:1px solid var(--chaos); }
.judge.warn { color:var(--gold); border:1px solid var(--gold); }
.found { border:1px solid var(--grow); background:var(--grow-soft); border-radius:9px;
         padding:8px 12px; margin:0 0 10px; font-size:13px; }
.foundh { font-size:11.5px; font-weight:700; color:var(--grow); letter-spacing:.3px; margin-bottom:3px; }
.found ul, .cg ul { margin:0; padding-left:18px; display:grid; gap:3px; }
details.common { margin-top:14px; background:var(--panel); border:1px solid var(--line);
                 border-radius:10px; padding:9px 12px; }
details.common summary { cursor:pointer; font-weight:700; font-size:14px; color:var(--gold); }
details.common[open] summary { margin-bottom:6px; }
.cg { margin-top:12px; display:grid; gap:6px; font-size:13px; min-width:0; }
.cgh { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.wt tr.here td { background:var(--gold-soft); }
/* 규칙서 — 자리 그림 + "하면 → 된다" */
.rmap .lane { stroke:var(--lane); opacity:.35; }
.mk text { font:700 6.2px var(--body); fill:var(--bg); text-anchor:middle; dominant-baseline:central; }
/* 렌더 위 이름표 — 사진 위라 흰 글씨에 검은 테(두 테마 같은 모양) */
.mapfig .lbl, .bigmap .lbl { font:700 5.2px var(--body); fill:#fff; stroke:rgba(0,0,0,.85); stroke-width:1.3px;
               paint-order:stroke; text-anchor:middle; dominant-baseline:central; }
.lic { width:22px; height:22px; flex:0 0 auto; border-radius:50%; }
/* 좁은 화면에서는 규칙서 지도를 크게 펼쳐 옆으로 밀어 본다 — 이름표가 읽히게 */
.rwrap { min-width:0; } .rhint { display:none; }
@media (max-width:560px) { .rwrap { overflow-x:auto; border-radius:10px; }
  .rwrap .rmap { width:640px; max-width:none; }
  .rhint { display:block; text-align:center; font-size:11.5px; color:var(--faint); margin-top:4px; } }
.lic.o { box-shadow:0 0 0 2px var(--order); } .lic.c { box-shadow:0 0 0 2px var(--chaos); }
.leg .lic { width:18px; height:18px; }
.rleg { display:grid; gap:6px; font-size:13px; min-width:0; }
.rleg .li { display:flex; gap:7px; align-items:center; width:100%; text-align:left; font:inherit; font-size:13px;
            color:var(--fg); background:none; border:1px solid transparent; border-radius:8px; padding:3px 6px;
            cursor:pointer; }
.rleg .li:hover { border-color:var(--line2); background:var(--panel); }
.rleg .li.on { border-color:var(--gold); background:var(--gold-soft); }
.rleg .li.static { cursor:default; } .rleg .li.static:hover { border-color:transparent; background:none; }
.rleg .li.flash { animation:번쩍 1.2s ease-out; }
@keyframes 번쩍 { 0% { background:var(--gold-soft); border-color:var(--gold); } }
.rleg .lt { min-width:0; }
.badge { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px;
         padding:0 5px; border-radius:11px; font-size:11.5px; font-weight:700; color:var(--bg);
         flex:0 0 auto; }
.rnote { margin:8px 0 0; padding-left:18px; display:grid; gap:4px; font-size:13px; }
.itg { border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
.it { display:grid; grid-template-columns:minmax(0,38%) minmax(0,1fr); gap:10px; padding:7px 12px;
      border-bottom:1px solid var(--line); font-size:13.5px; }
.it:last-child { border-bottom:0; }
.it .if { color:var(--dim); font-weight:500; }
.it .then { color:var(--fg); }
.it .then::before { content:"→ "; color:var(--gold); font-weight:700; }
.itsrc { margin:5px 2px 0; }
@media (max-width:560px) { .it { grid-template-columns:1fr; gap:2px; } }
/* 사이드바 폭(1/4)에 맞춘다 — 화면 폭이 아니라 사이드바 폭으로 */
@container (max-width:520px) { .it { grid-template-columns:1fr; gap:2px; } .fwhen { margin-left:0; } }
.wt a { color:var(--order); }
.tbl { overflow-x:auto; }

.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr)); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 13px;
        min-width:0; }
.chead { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
.pic { width:46px; height:46px; flex:0 0 auto; border-radius:8px; background:var(--shade);
       border:1px solid var(--line); object-fit:cover; }
.nm { font-weight:700; font-size:14.5px; line-height:1.25; }
.tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:3px; }
.tag { font-size:10.5px; color:var(--dim); border:1px solid var(--line2); border-radius:3px;
       padding:0 5px; }
.tag.up { color:var(--grow); border-color:var(--grow); background:var(--grow-soft); }
.tag.fix { color:var(--faint); }
.tag.trans { color:var(--gold); border-color:var(--gold); margin-left:5px; }
.rows { display:grid; gap:5px; }
.row { display:grid; grid-template-columns:66px minmax(0,1fr); gap:8px; align-items:baseline;

const 꼴 = { core:['별',7.5], hall:['네모',5], keep:['네모',4.2], fort:['네모',3.4],
  tower:['원',2], watchtower:['세모',2.6], objective:['마름모',3.4], well:['원',1.4],
  healer:['원',1.8], gate:['네모',1.6], wall:['네모',1.2], other:['원',1] };
const 흐림 = new Set(['wall', 'other', 'gate']);
const 편색 = s => s === '질서' ? 'var(--order)' : s === '혼돈' ? 'var(--chaos)' : 'var(--neu)';
const 팀말 = s => s === '질서' ? 'order' : s === '혼돈' ? 'chaos' : 'neutral';
const 팀이름 = s => s === '질서' ? '블루팀' : s === '혼돈' ? '레드팀' : s;   // 화면에는 색으로 부른다
// 뷰어 KIND 표의 반지름 — 아이콘 한 변은 반지름 × 1.7 × 2
const 건물아이콘 = { core:['core',3.2], keep:['town',2.3], fort:['town',1.9], tower:['tower',1.1],
                    well:['well',1.2], watchtower:['watchtower',1.9] };
const 자리한변 = { 캠프:6.8, 보스:6.8, 시설:6.8 };     // 그 밖(목표물)은 7
const 자리색 = { 목표:'var(--gold)', 반납:'var(--spot)', 캠프:'var(--grow)', 보스:'var(--grow)', 시설:'var(--neu)',
                질서:'var(--order)', 혼돈:'var(--chaos)' };
function 바탕그림(키, W, H) {
  const B = BASES[키];
  return B && B.w === W && B.h === H
    ? `<image id="baseimg" href="${B.그림}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>` : '';
}
function 기호(쓴, 앞) {
  return '<defs>' + [...쓴].filter(n => ICONS[n]).map(n =>
    `<symbol id="${앞}-${n}" viewBox="0 0 64 64"><image width="64" height="64" href="${ICONS[n]}"/></symbol>`).join('') + '</defs>';
}
function 아이콘놓기(앞, 이름, x, y, z, 제목) {
  return `<use href="#${앞}-${이름}" x="${x - z / 2}" y="${y - z / 2}" width="${z}" height="${z}">`
    + (제목 ? `<title>${esc(제목)}</title>` : '') + `</use>`;
}
function 배치그림(b, 키) {
  const m = b.맵 || {};
  const W = +m.가로 || 0, H = +m.세로 || 0;
  if (!W || !H) return '';
  const fy = y => H - y;
  const 밑 = 바탕그림(키, W, H);
  let s = `<svg class="mapfig" viewBox="0 0 ${W} ${H}" role="img" aria-label="배치">` + 밑;
  if (밑) {
    // 렌더 위에 건물 → 캠프·시설·목표물 아이콘(이름표 없이). 작은 것을 나중에 그려 가리지 않게.
    const 쓴 = new Set();
    let 몸 = '';
    const 정렬 = [...(b.구조물 || [])].filter(st => 건물아이콘[st.종류])
      .sort((a, c) => 건물아이콘[c.종류][1] - 건물아이콘[a.종류][1]);
    for (const st of 정렬) {
      const [n0, r] = 건물아이콘[st.종류];
      const n = `${n0}__${팀말(st.편)}`;
      if (!ICONS[n]) continue;
      쓴.add(n);
      몸 += 아이콘놓기('b', n, st.x, fy(st.y), r * 1.7 * 2, `${st.종류이름} · ${팀이름(st.편)}`);
    }
    const K = (BOOK.전장 || {})[키];
    for (const p of (K && K.자리) || []) {
      if (!p.아이콘 || !ICONS[p.아이콘] || p.아이콘.startsWith('watchtower')) continue;   // 감시탑은 건물 쪽에서 그렸다
      쓴.add(p.아이콘);
      몸 += 아이콘놓기('b', p.아이콘, p.x, fy(p.y), 자리한변[p.갈래] || 7, p.이름);
    }
    return s + 기호(쓴, 'b') + 몸 + '</svg>';
  }
  for (const z of b.구역 || [])
    s += `<rect x="${Math.min(z.x1,z.x2)}" y="${fy(Math.max(z.y1,z.y2))}" `
       + `width="${Math.abs(z.x2-z.x1)}" height="${Math.abs(z.y2-z.y1)}" fill="var(--zone)" `
       + `stroke="var(--zoneline)" stroke-width=".5"/>`;
  for (const l of b.라인 || [])
    s += `<polyline points="${(l.경로||[]).map(p => `${p[0]},${fy(p[1])}`).join(' ')}" fill="none" `
       + `stroke="var(--lane)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`;
  const 정렬 = [...(b.구조물 || [])].sort((a, c) => (꼴[a.종류]?.[1]||1) - (꼴[c.종류]?.[1]||1));
  for (const st of 정렬) {
    const [k, r] = 꼴[st.종류] || ['원', 1.4];
    const c = 편색(st.편), x = st.x, y = fy(st.y);
    const op = 흐림.has(st.종류) ? .3 : .95;
    const t = `<title>${esc(st.종류이름)} · ${esc(팀이름(st.편))}</title>`;
    if (k === '네모') s += `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" fill="${c}" opacity="${op}">${t}</rect>`;
    else if (k === '마름모') s += `<polygon points="${x},${y-r} ${x+r},${y} ${x},${y+r} ${x-r},${y}" fill="${c}" opacity="${op}">${t}</polygon>`;
    else if (k === '세모') s += `<polygon points="${x},${y-r} ${x+r},${y+r*.8} ${x-r},${y+r*.8}" fill="${c}" opacity="${op}">${t}</polygon>`;
    else if (k === '별') s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="var(--fg)" stroke-width="1" opacity="${op}">${t}</circle>`;
    else s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${op}">${t}</circle>`;

    s += `<circle cx="${c.x}" cy="${fy(c.y)}" r="${c.크기 || 3}" fill="none" stroke="var(--gold)" `

  for (const p of b.지점 || [])
    s += `<polygon points="${p.x},${fy(p.y)-3} ${p.x+3},${fy(p.y)} ${p.x},${fy(p.y)+3} ${p.x-3},${fy(p.y)}" `
       + `fill="none" stroke="var(--spot)" stroke-width="1.6"><title>${esc(p.이름)}</title></polygon>`;
  for (const sp of b['시작 자리'] || [])
    s += `<circle cx="${sp.x}" cy="${fy(sp.y)}" r="1.1" fill="${편색(sp.편 === 'order' ? '질서' : '혼돈')}"/>`;

}
function 배치범례(키) {

      <span><i class="k-neu"></i>중립</span><span><i class="k-lane"></i>라인</span>

/* ── 자리 묶음 — 같은 이름·아이콘은 한 줄. 큰 지도의 표시와 사이드바 범례가 같은 번호(g)를 쓴다 */
function 자리묶음(K) {
  const 묶 = [];

/* ── 큰 지도 — 바탕 렌더 + 건물 + 목표물·캠프·시설 + 이름표를 한 장에. 층(data-l)마다 켜고 끈다 */

/* ── 사이드바: 자리(범례 + 자리 고르는 규칙) — 줄을 누르면 지도에서 그 자리가 깜빡인다 */

/* ── 사이드바: 규칙서 — "하면 → 된다" */

/* ── 한 전장 그리기 */
let 고른 = MAPS.전장[0].키;

              ['라인', (b.라인||[]).length], ['구조물', (b.구조물||[]).length],

    .filter(([, v]) => v != null && v !== 0 && v !== '')

    + `<p class="note">${esc(CROSS.말)} 출처: <a href="${X.출처}" target="_blank" rel="noopener">`

function 보상속(키) { return (보상표[키] ? 보상표[키]() : []).map(보상카드).join(''); }
function 보상절(m) {
  if (!보상표[m.키]) return '';
  return `<h2 id="s-보상">보상과 효과<span class="cnt" id="rwdt"></span></h2>`
    + `<p class="note">목표물을 얻는 법 → 받는 것 → 그것이 하는 일. 값은 위 시간(⏱) 기준이고, 자라는 값은 <b>지금 값 · 처음(0급)보다 · 지난 급(1분 전)보다</b>를 같이 적습니다. 범위로 정해지는 보상은 표로 — 지금에 해당하는 줄이 칠해집니다.</p>`
    + `<div class="rwd" id="rwd" data-k="${m.키}">${보상속(m.키)}</div>`;
}
function 보상갱신() {
  const e = document.getElementById('rwd'), t = document.getElementById('rwdt');
  if (t) t.textContent = `⏱ ${시각글(흐른)} · ${급of(흐른)}급`;
  if (e) e.innerHTML = 보상속(e.dataset.k);
}

/* ══ 성장 한계 — 급 시계(scalingTicks)는 어느 전장이든 60에서 멈추지만, 몸마다 승급 표가 끝나는 급이 다르다.
   표가 끝나는 급 = 그 표에서 값이 마지막으로 바뀌는 칸(make_objs.py 와 같은 셈). 61칸 표는 60에서 잘린다 ══ */
const 성장끝 = {
  dragonshire: [['용기사', 60, 'DragonKnightScaling']],
  infernalshrines: [['신단 수호자', 30, 'CursedShrineMinionScaling'], ['징벌자', 31, 'MercLanerPunisherScaling']],
  gardenofterror: [['정원 공포', 36, 'GardenTerrorScaling'], ['과성장 식물', 60, 'HauntedWoodsOvergrowthPlantScaling']],
  skytemple: [['사원 수호자', 31, 'TempleGuardianScaling'], ['사원 한 발', 60, 'LuxoriaTempleScaling']],
  tombofthespiderqueen: [['거미 수호자', 60, 'SpectralMinionScaling']],
  battlefieldofeternity: [['불멸자', 60, 'DuelBossLanerScaling'], ['이긴 경험치', 60, '분 상한 60']],
  alteracpass: [['수용소 수비병', 31, 'AVCapturePointDefenderScaling'], ['기병', 60, 'SuperCavalryScaling']],
  volskaya: [['수호자', 60, 'VolskayaVehicleScaling']],
  hauntedmines: [['뼈 골렘', 26, 'UnderworldSummonedBossScaling'], ['지하 광부·무덤 골렘', 44, 'UnderworldMinion/BossScaling']],
  braxisholdout: [['저그 무리', 30, 'Zerg*Scaling']],
};
const 핵끝 = { alteracpass: 20, towersofdoom: 0 };       // 알터랙은 자기 핵 표(20급), 파멸의 탑 핵은 안 자란다(생명 40)
const 끝없음 = { dragonshire: '용기사 지속(30초마다 +1초)', volskaya: '수호자 지속(20초마다 +1초)', warheadjunction: '핵 피해(분마다 +70)' };
function 한계목록(키) {
  const 핵 = 키 in 핵끝 ? 핵끝[키] : 21;
  return [...(핵 ? [['핵', 핵, 키 === 'alteracpass' ? 'CoreScaling(알터랙)' : 'CoreScaling']] : []),
          ['하수인', 31, 'Footman·Ranged·Wizard·CatapultMinionScaling'], ...(성장끝[키] || []),
          ['라인 용병', 60, '*LanerScaling · *MercScaling']].sort((a, b) => a[1] - b[1]);
}
function 한계그리기(키) {
  const 판 = document.getElementById('rstops'), tm = document.getElementById('tm');
  const 목 = 한계목록(키), 묶 = [];
  for (const [이름, 급] of 목) {
    const 앞 = 묶[묶.length - 1];
    if (앞 && 급 - 앞.급 <= 3) { 앞.이름.push(이름); 앞.끝 = 급; }
    else 묶.push({ 급, 끝: 급, 이름: [이름] });
  }
  if (판) 판.innerHTML = 묶.map(g => `<span class="rsp${g.급 >= 60 ? ' end' : ''}" style="left:${(100 * g.급 / 60).toFixed(2)}%" `
    + `title="${g.이름.join(' · ')} — ${g.급 === g.끝 ? g.급 : `${g.급}~${g.끝}`}급에서 성장이 멈춘다"><i></i>${g.급 >= 60 ? '60 끝' : g.급 === g.끝 ? g.급 : `${g.급}·${g.끝}`}<em> ${esc(g.이름.join('·'))}</em></span>`).join('');
  겹침정리();
  if (tm) tm.title = `성장 급 = 흐른 분(0:00~0:59 는 0급). 급 시계는 60에서 멈춤.\n이 전장 성장 멈춤: ${목.map(([n, g]) => `${n} ${g}급`).join(' · ')}`
    + (끝없음[키] ? `\n시간 식으로 오르는 것(60분 넘어도 오름): ${끝없음[키]}` : '');
}
function 겹침정리() {
  const 판 = document.getElementById('rstops');
  if (!판) return;
  const 칸 = [...판.querySelectorAll('.rsp')];
  칸.forEach(s => { const e = s.querySelector('em'); if (e) e.classList.toggle('off', s.classList.contains('end')); });
  for (let i = 0; i < 칸.length - 1; i++) {
    const a = 칸[i].getBoundingClientRect(), b = 칸[i + 1].getBoundingClientRect();
    if (a.right + 4 > b.left) { const e = 칸[i].querySelector('em'); if (e) e.classList.add('off'); }
  }
  for (let i = 1; i < 칸.length; i++) {        // 이름을 숨겨도 앞 것과 겹치면 뒤 것 이름도 숨긴다
    const a = 칸[i - 1].getBoundingClientRect(), b = 칸[i].getBoundingClientRect();
    if (a.right + 4 > b.left) { const e = 칸[i].querySelector('em'); if (e) e.classList.add('off'); }
  }
}
if (window.ResizeObserver) new ResizeObserver(() => 겹침정리()).observe(document.getElementById('rstops'));
function 한계절(키) {
  const L = 급of(흐른);
  return `<div class="lim"><div class="limh">성장 한계 <span>급(= 흐른 분)마다 오르다 멈추는 곳 — 위 시간 눈금의 ▲</span></div><div class="limr">`
    + 한계목록(키).map(([이름, 급]) => `<span class="lmi${L >= 급 ? ' done' : ''}" data-lv="${급}"><b>${급}급</b> ${esc(이름)}</span>`).join('')
    + `</div><p>급 시계는 어느 전장이든 <b>60급(60:00)</b>에서 멈춘다. 캠프 수비병은 종류마다 다르다 — 기사·공성 거인·우두머리 등은 31급, 화염기갑병·대천사 캠프는 60급.`
    + (끝없음[키] ? ` 급이 아니라 시간 식으로 오르는 <b>${esc(끝없음[키])}</b>은 60분을 넘어도 계속 오른다.` : '')
    + (키 === 'towersofdoom' ? ' 이 전장 핵은 생명 40으로 자라지 않는다.' : '') + `</p></div>`;
}
function 한계갱신() {
  const L = 급of(흐른);
  document.querySelectorAll('.lim .lmi').forEach(e => e.classList.toggle('done', L >= +e.dataset.lv));
}

그리기();
