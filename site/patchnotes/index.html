    const moved = T.filter(i => F.get(i).lvN > 0), rewritten = T.filter(i => F.get(i).rewrites > 0);
    const tuned = T.filter(i => { const f = F.get(i); return f.tunes && !f.rewrites; });
    const row = (k, arr, cls, note) => `<div class="row"><div class="k">${k}</div><div class="v">${arr.length
      ? arr.map(i => tchip(i, cls, note(F.get(i), i))).join('') : '<span class="none">없음</span>'}</div></div>`;
    return `<div class="tsum"><h4>특성이 어떻게 바뀌었나 <span style="font-weight:400;font-size:12px;color:var(--dim)">${B[0].date} ~ ${B[B.length - 1].date} 사이 · 지금 이 영웅의 특성 ${T.length}개 기준</span></h4>
      ${row('생긴 특성', added, 'add', f => f.addedAt)}
      ${row('사라진 특성', removed, 'rm', f => f.removedAt)}
      ${row('레벨 이동', moved, 'mv', f => f.lvSeq.join(' → ') + '레벨')}
      ${row('효과가 바뀜', rewritten, '', f => `설명 고쳐 씀 ${f.rewrites}번`)}
      ${row('수치만 조정', tuned, '', f => `${f.tunes}번`)}
      <div class="row"><div class="k">그대로</div><div class="v"><span class="none">${T.filter(i => F.get(i).quiet).length}개는 처음 나온 뒤로 한 번도 바뀌지 않았습니다.</span></div></div></div>`;
  }
  function itemCard(it, B) {
    const f = itemFacts(it, B), segs = it.segments;
    if (f.quiet) return '';   // 한 번도 안 바뀐 것만 접는다 (신설·삭제는 카드로 남긴다)
    const icon = it.icon ? `<img src="${ICON}${it.icon}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';
    const life = (f.added || f.removed) ? `<span class="lv">${B[it.first].date.slice(0, 7)} ~ ${f.removed ? B[it.last].date.slice(0, 7) : '현재'}</span>` : '';
    let body = '';
    if (f.lvN) body += glineHTML('특성 레벨', '', B, it.levels, 0, 'lvl', it.last, it.first);
    if (f.cdN) body += glineHTML('재사용 대기시간(초)', '', B, it.cooldown, 0, '', it.last, it.first);
    if (f.enN) body += glineHTML(it.energyLabel || '자원', '', B, it.energy, 0, '', it.last, it.first);
    segs.forEach((sg, si) => {
      const lines = sg.slots.filter(sl => changes(sl.values) > 0)
        .map(sl => glineHTML(sl.label, '', B, sl.values, sg.from, 'seg', it.last, it.first)).join('');
      const head = segs.length > 1 ? `<div class="sh">${esc(sg.name)} <span class="rng">${si + 1}번째 설명 · ${B[sg.from].date.slice(0, 7)} ~ ${B[sg.to].date.slice(0, 7)}</span></div>` : '';
      const text = `<details><summary>설명 원문${segs.length > 1 ? ' (이때)' : ''}</summary><div>${esc(sg.textLast || sg.text)}</div></details>`;
      body += `<div class="gseg">${head}${text}${lines || (segs.length > 1 ? '<div class="gnone">이때는 수치가 그대로였습니다</div>' : '')}</div>`;
    });
    const tags = [];
    if (f.added) tags.push(`<span class="lv" style="color:var(--ins)">${f.addedAt} 생김</span>`);
    if (f.removed) tags.push(`<span class="lv" style="color:var(--del)">${f.removedAt} 사라짐</span>`);
    if (f.rewrites) tags.push(`<span class="lv">효과 바뀜 ${f.rewrites}번</span>`);
    if (!body) body = `<div class="gnone">${f.added && f.removed ? '있는 동안 수치가 바뀐 적은 없습니다.' : f.added ? '생긴 뒤로 수치가 바뀐 적은 없습니다.' : '사라질 때까지 수치가 바뀐 적은 없습니다.'}</div>`;
    return `<div class="gcard"><div class="gh">${icon}${esc(it.name)}<span class="lv">${it.kind === 'talent' ? it.level + '레벨' : esc(it.type)}</span>${life}${tags.join('')}</div>${body}</div>`;
  }
  function seriesHTML(sr) {
    if (!sr) return '';
    const B = sr.builds;
    const STAT = { life: '최대 생명력', regen: '생명력 재생', damage: '일반 공격력', period: '공격 주기(초)', range: '사거리', speed: '이동 속도' };
    let out = '';
    // 1) 영웅 능력치
    const st = Object.entries(sr.stats).filter(([k, v]) => changes(v) > 0);
    out += `<div class="gcat"><h4>영웅 능력치</h4><span class="c">${st.length ? `${st.length}가지가 바뀜` : '바뀐 것 없음'}</span></div>`;
    out += st.length ? `<div class="gcard">${st.map(([k, v]) => glineHTML(STAT[k] || k, '', B, v, 0)).join('')}</div>`
                     : '<div class="gnone">공개된 빌드 사이에 능력치 변화가 없습니다.</div>';
    // 2) 기본 기술
    const ab = sr.items.filter(i => i.kind === 'ability');
    const abCards = ab.map(i => itemCard(i, B)).filter(Boolean);
    const abQuiet = ab.filter(i => itemFacts(i, B).quiet);
    const abNow = ab.filter(i => i.last === B.length - 1), abPast = ab.length - abNow.length;
    out += `<div class="gcat"><h4>기본 기술</h4><span class="c">지금 ${abNow.length}개${abPast ? ` · 예전에 있던 ${abPast}개` : ''} · 그중 ${abCards.length}개가 바뀜</span></div>`;
    out += abCards.join('') || '<div class="gnone">기술 수치 변화가 없습니다.</div>';
    if (abQuiet.length) out += `<div class="gnone">한 번도 안 바뀜: ${abQuiet.map(i => esc(i.name)).join(', ')}</div>`;
    // 3) 레벨별 특성
    const tl = sr.items.filter(i => i.kind === 'talent');
    out += talentSummary(sr);
    [1, 4, 7, 10, 13, 16, 20].forEach(lv => {
      const g = tl.filter(i => i.level === lv);
      if (!g.length) return;
      const now = g.filter(i => i.last === B.length - 1), past = g.filter(i => i.last < B.length - 1);
      const cards = g.map(i => itemCard(i, B)).filter(Boolean);
      const quiet = g.filter(i => itemFacts(i, B).quiet);
      out += `<div class="gcat"><h4>${lv}레벨 특성</h4><span class="c">지금 ${now.length}개${past.length ? ` · 예전에 있던 ${past.length}개` : ''} · 그중 ${cards.length}개가 바뀜</span></div>`;
      out += cards.join('');
      if (quiet.length) out += `<div class="gnone">한 번도 안 바뀜: ${quiet.map(i => esc(i.name)).join(', ')}</div>`;
    });
    const etc = tl.filter(i => ![1, 4, 7, 10, 13, 16, 20].includes(i.level));
    if (etc.length) {
      const cards = etc.map(i => itemCard(i, B)).filter(Boolean);
      if (cards.length) out += `<div class="gcat"><h4>그 밖의 특성</h4><span class="c">${cards.length}개</span></div>` + cards.join('');
    }
    const upc = G.color === 'kr' ? '빨강' : G.color === 'us' ? '초록' : '파랑';
    const dnc = G.color === 'us' ? '빨강' : G.color === 'kr' ? '파랑' : '빨강';
    const ax = G.xmode === 'patch' ? '값이 바뀐 패치만 한 칸씩' : G.xmode === 'time' ? '날짜에 비례해' : '빌드마다 한 칸씩';
    const dir = G.dir === 'asc' ? '왼쪽이 과거, 오른쪽이 최신' : '왼쪽이 최신, 오른쪽이 과거';
    const val = G.val === 'pct' ? '세로축은 기간 첫값 대비 %' : '세로축은 실제 값';
    return `<div class="gsec ${esc(G.color)}"><h3 style="margin:6px 0 4px;font-size:16px">수치가 어떻게 바뀌었나 <span style="font-weight:400;font-size:12px;color:var(--dim)">${B[0].date} ~ ${B[B.length - 1].date} 라이브 빌드 ${B.length}개 · 가로축은 ${ax}(${dir}) · ${val} · 오를 때 ${upc}, 내릴 때 ${dnc} · 선 끝의 × 는 사라진 시점, → 는 효과 설명이 바뀐 시점</span></h3>${gctlHTML(B)}${out}</div>`;
  }

  // 특성 변천도: 행 = 현재 능력치·기술·특성(+삭제된 것), 열 = 데이터 diff 가 있는 패치(오래된 순)
  const ICON = 'https://sin0nis.github.io/images/abilitytalents/';
  function chartHTML(doc) {
    if (!doc || !doc.current) return '';
    const cols = doc.entries.filter(e => e.data).slice().reverse();
    if (!cols.length) return '';
    const marks = {}, names = {}, lastLevel = {};
    cols.forEach((e, ci) => e.data.changes.forEach(c => {
      const id = c.type === 'stat' ? 'stat:' + c.field : c.type === 'rename' ? 'stat:name' : c.id;
      let cls, sym, title;
      if (c.type === 'talent_added' || c.type === 'ability_added') { cls = 'add'; sym = '+'; title = '신규' + (c.level ? ` (${c.level}레벨)` : ''); }
      else if (c.type === 'talent_removed' || c.type === 'ability_removed') { cls = 'rm'; sym = '×'; title = '삭제' + (c.level ? ` (${c.level}레벨)` : ''); }
      else if (c.type === 'stat') { cls = 'chg'; sym = '●'; title = `${c.field}: ${fmt(c.before)} → ${fmt(c.after)}`; }
      else if (c.type === 'rename') { cls = 'chg'; sym = '●'; title = `이름: ${c.before} → ${c.after}`; }
      else {
        const lv = (c.changes || []).find(f => f.field === 'level');
        if (lv) { cls = 'mv'; sym = '↑↓'; title = `${lv.before}레벨 → ${lv.after}레벨` + ((c.changes.length > 1) ? ' + ' + c.changes.filter(f => f.field !== 'level').map(f => FIELD[f.field] || f.field).join(', ') : ''); }
        else { cls = 'chg'; sym = '●'; title = (c.changes || []).map(f => FIELD[f.field] || f.field).join(', ') + ' 변경'; }
      }
      (marks[id] = marks[id] || {})[ci] = { cls, sym, title: `${e.date} ${e.version || ''}\n${title}` };
      if (c.name) names[id] = c.name;
      if (c.level) lastLevel[id] = c.level;
    }));
    const cur = doc.current;
    const curIds = new Set(cur.abilities.map(a => a.id).concat(cur.talents.map(t => t.id)));
    const statRows = Object.keys(marks).filter(k => k.startsWith('stat:')).map(k => ({ id: k, name: { 'stat:life': '생명력', 'stat:energy': '자원', 'stat:speed': '이동 속도', 'stat:weapons': '일반 공격', 'stat:name': '이름' }[k] || k }));
    const gone = Object.keys(marks).filter(k => !k.startsWith('stat:') && !curIds.has(k)).map(k => ({ id: k, name: names[k] || k, level: lastLevel[k], gone: true }));
    const groups = [];
    if (statRows.length) groups.push({ name: '능력치', rows: statRows });
    groups.push({ name: '기술', rows: cur.abilities });
    [1, 4, 7, 10, 13, 16, 20].forEach(l => { const rs = cur.talents.filter(t => t.level === l); if (rs.length) groups.push({ name: `${l}레벨 특성`, rows: rs }); });
    if (gone.length) groups.push({ name: '삭제된 특성·기술', rows: gone.sort((a, b) => (a.level || 0) - (b.level || 0)) });
    const head = `<tr><th class="rowh">항목 \\ 패치</th>${cols.map(e => `<th class="col ${e.isPtr ? 'ptr' : ''}" title="${esc(e.title)}"><span>${e.date}${e.isPtr ? ' PTR' : ''}</span></th>`).join('')}</tr>`;
    const rowsHTML = groups.map(g => `<tr class="grp"><th colspan="${cols.length + 1}">${esc(g.name)}</th></tr>` + g.rows.map(r => {
      const cells = cols.map((e, ci) => { const m = (marks[r.id] || {})[ci]; return `<td class="c">${m ? `<span class="m ${m.cls}" title="${esc(m.title)}" data-go="e-${e.date}-${e.build || 0}">${m.sym}</span>` : ''}</td>`; }).join('');
      const icon = r.icon ? `<img src="${ICON}${r.icon}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';
      const lv = r.gone && r.level ? `<span class="lv">${r.level}레벨</span>` : (r.type && !r.level ? `<span class="lv">${esc(r.type)}</span>` : '');
      return `<tr><th class="rowh ${r.gone ? 'gone' : ''}" title="${esc(r.name)}">${icon}${esc(r.name)}${lv}</th>${cells}</tr>`;
    }).join('')).join('');
    return `<h3 style="margin:6px 0 6px;font-size:16px">특성 변천도 <span style="font-weight:400;font-size:12px;color:var(--dim)">현재 기준 ${esc(cur.build)} · 데이터 diff 가 있는 패치 ${cols.length}개 (2019년 10월~)</span></h3>
      <div class="chart-wrap"><table class="chart"><thead>${head}</thead><tbody>${rowsHTML}</tbody></table></div>
      <div class="legend"><span class="m add">+</span> 신규 <span class="m rm">×</span> 삭제 <span class="m mv">↑↓</span> 레벨 이동 <span class="m chg">●</span> 수치·설명 변경 · 칸을 누르면 아래 해당 패치로 이동, 올리면 요약</div>`;
  }


  // ---------- 달력·통계 ----------
  // 하위 유닛은 본체로 합쳐서 센다(공생체→아바투르, 은신 발리라→발리라).
  const MERGE = { AbathurSymbiote: 'Abathur', ValeeraStealthed: 'Valeera' };
  const mainHero = h => MERGE[h] || h;
  const dnum = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
  const wslot = s => Math.min(4, ((+s.slice(8, 10) - 1) / 7) | 0);   // 0~4 = 1~7일, 8~14일 … (요일이 아니다)
  const kgrp = r => channelOf(r) === 'ptr' ? 'ptr'
    : (r.kind === 'balance' || r.kind === 'hotfix') ? 'bal'
      : r.kind === 'data' ? 'dat' : 'pat';
  const KG = { pat: '본 패치', bal: '밸런스·긴급 수정', dat: '데이터 변경', ptr: '테스트 서버' };
  const med = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y), n = b.length, h = n >> 1; return n % 2 ? b[h] : (b[h - 1] + b[h]) / 2; };
  const d1 = v => v == null ? '—' : String(Math.round(v * 10) / 10);
  const ymd = s => `${+s.slice(0, 4)}년 ${+s.slice(5, 7)}월 ${+s.slice(8, 10)}일`;
  const ymTxt = k => `${+k.slice(0, 4)}년 ${+k.slice(5, 7)}월`;
  const mIdx = k => +k.slice(0, 4) * 12 + +k.slice(5, 7);
  const addM = (k, n) => { let y = +k.slice(0, 4), m = +k.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return `${y}-${String(m + 1).padStart(2, '0')}`; };
  const WD = ['일', '월', '화', '수', '목', '금', '토'], WORD = [1, 2, 3, 4, 5, 6, 0];

  let CAL = null;
  function calData() {
    if (CAL) return CAL;
    const all = [...INDEX].sort((a, b) => a.date < b.date ? -1 : 1);   // 오래된 순
    const live = all.filter(r => channelOf(r) === 'live');
    const ptr = all.filter(r => channelOf(r) === 'ptr');
    const lds = [...new Set(live.map(r => r.date))];
    const gaps = lds.slice(1).map((d, i) => ({ n: dnum(d) - dnum(lds[i]), from: lds[i], to: d }));
    const now = new Date();
    const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const startM = all[0].date.slice(0, 7);
    const lastM = all[all.length - 1].date.slice(0, 7), todayM = today.slice(0, 7);
    const endM = lastM > todayM ? lastM : todayM;
    const months = [];
    for (let k = startM; k <= endM; k = addM(k, 1)) months.push(k);
    const years = [...new Set(months.map(k => k.slice(0, 4)))];
    const ysum = {};
    years.forEach(y => {
      const rs = all.filter(r => r.date.slice(0, 4) === y);
      const g = gaps.filter(x => x.to.slice(0, 4) === y).map(x => x.n);   // 간격은 뒤쪽 회차의 연도로 센다
      const inRange = months.filter(k => k.slice(0, 4) === y && k <= lastM);
      const act = inRange.filter(k => all.some(r => r.date.slice(0, 7) === k)).length;
      ysum[y] = {
        n: rs.length, live: rs.filter(r => channelOf(r) === 'live').length,
        ptr: rs.filter(r => channelOf(r) === 'ptr').length, cyc: med(g),
        maxGap: g.length ? Math.max(...g) : null, act, of: inRange.length,
        kinds: { pat: rs.filter(r => kgrp(r) === 'pat').length, bal: rs.filter(r => kgrp(r) === 'bal').length,
          dat: rs.filter(r => kgrp(r) === 'dat').length, ptr: rs.filter(r => kgrp(r) === 'ptr').length },
        avgHero: rs.length ? rs.reduce((a, r) => a + r.heroes.length, 0) / rs.length : 0,
      };
    });
    const lag = [], lagBy = {};
    ptr.forEach(p => {
      const nx = lds.find(d => d > p.date);
      if (!nx) return;
      const n = dnum(nx) - dnum(p.date);
      lag.push(n);
      lagBy[p.date] = { n, to: nx };
    });
    years.forEach(y => {
      ysum[y].lag = med(ptr.filter(r => r.date.slice(0, 4) === y).map(r => (lagBy[r.date] || {}).n).filter(v => v != null));
    });
    const wd = { live: Array(7).fill(0), ptr: Array(7).fill(0) }, wdNew = Array(7).fill(0);
    all.forEach(r => {
      const w = new Date(dnum(r.date) * 864e5).getUTCDay();
      wd[channelOf(r)][w]++;
      if (r.date >= '2023-09-01') wdNew[w]++;
    });
    const hc = {}, bc = {};
    all.forEach(r => {
      [...new Set(r.heroes.map(mainHero))].forEach(h => { hc[h] = (hc[h] || 0) + 1; });
      r.battlegrounds.forEach(b => { bc[b] = (bc[b] || 0) + 1; });
    });
    const roles = {};
    Object.entries(hc).forEach(([h, n]) => {
      const rl = (HEROES[h] || {}).role;
      if (!rl) return;
      roles[rl] = roles[rl] || { n: 0, heroes: 0 };
      roles[rl].n += n; roles[rl].heroes++;
    });
    CAL = {
      all, live, ptr, lds, gaps, months, years, ysum, lag, lagBy, wd, wdNew, hc, bc, roles,
      today, todayM, startM, lastM, endM, lastLive: lds[lds.length - 1],
      sinceLast: dnum(today) - dnum(lds[lds.length - 1]),
      recentMed: med(gaps.slice(-12).map(g => g.n)),
      medGap: med(gaps.map(g => g.n)),
      within14: gaps.filter(g => g.n <= 14).length,
      maxGap: gaps.slice().sort((a, b) => b.n - a.n)[0],
    };
    return CAL;
  }

  function calTiles(C, mUrl) {
    const late = C.recentMed != null && C.sinceLast > C.recentMed;
    const pct = Math.round(C.within14 / C.gaps.length * 100);
    return `<div class="cal-tiles">
      <div class="cal-tile"><div class="v ${late ? 'late' : 'ontime'}">${C.sinceLast}일째</div>
        <div class="d">오늘 <b>${ymd(C.today)}</b> 기준입니다. 마지막 회차는 ${ymd(C.lastLive)}이고, 최근 12번 중앙값은 ${d1(C.recentMed)}일입니다. 이 숫자는 화면을 열 때마다 다시 셉니다. 그 중앙값보다 늦어지면 <span style="color:var(--del);font-weight:700">붉게</span> 보입니다.</div></div>
      <div class="cal-tile"><div class="v">보통 ${d1(C.medGap)}일</div>
        <div class="d">라이브 ${C.lds.length}회 사이 ${C.gaps.length}번을 잰 중앙값입니다.</div></div>
      <div class="cal-tile"><div class="v">2주 안에 ${pct}%</div>
        <div class="d">${C.gaps.length}번 가운데 ${C.within14}번이 14일 안에 이어졌습니다.</div></div>
      <div class="cal-tile"><div class="v">가장 긴 공백 ${C.maxGap.n}일</div>
        <div class="d"><a href="${mUrl(C.maxGap.to.slice(0, 7))}">${ymd(C.maxGap.from)} → ${ymd(C.maxGap.to)}</a></div></div>
    </div>`;
  }

  // 3개월 이상 연속 공백만 띠로 묶는다. 연도 경계에서 토막 내고 화살표로 잇는다.
  function calRuns(C, byM) {
    const runs = [];
    let cur = null;
    C.months.forEach(k => {
      const empty = !(byM[k] || []).length && k !== C.todayM;
      if (empty) { if (cur) cur.b = k; else cur = { a: k, b: k }; }
      else if (cur) { runs.push(cur); cur = null; }
    });
    if (cur) runs.push(cur);
    return runs.map(r => ({ ...r, n: mIdx(r.b) - mIdx(r.a) + 1 })).filter(r => r.n >= 3);
  }

  function calBands(runs, y) {
    return runs.filter(r => y >= r.a.slice(0, 4) && y <= r.b.slice(0, 4)).map(r => {
      const head = y === r.a.slice(0, 4), tail = y === r.b.slice(0, 4);
      const m0 = head ? +r.a.slice(5, 7) : 1, m1 = tail ? +r.b.slice(5, 7) : 12;
      const label = head && tail ? `${r.n}개월 공백` : head ? `${r.n}개월 공백 ▶` : tail ? `▶ ${+r.b.slice(5, 7)}월까지` : '▶';
      const tip = `${ymTxt(r.a)}부터 ${ymTxt(r.b)}까지 ${r.n}개월, 회차가 하나도 없습니다`;
      return `<div class="cal-gap" style="grid-column:${m0 + 1} / ${m1 + 2}" title="${esc(tip)}">${label}</div>`;
    });
  }

  function calGrid(C, shown, sel, mUrl) {
    const byM = {}, allByM = {};
    shown.forEach(r => { (byM[r.date.slice(0, 7)] = byM[r.date.slice(0, 7)] || []).push(r); });
    C.all.forEach(r => { (allByM[r.date.slice(0, 7)] = allByM[r.date.slice(0, 7)] || []).push(r); });
    const runs = calRuns(C, allByM);   // 공백은 거르개와 무관하게 전체 기준으로 잡는다
    const legend = `<div class="lg">
      <span><i class="rnd pat"></i>본 패치</span><span><i class="rnd bal"></i>밸런스·긴급 수정</span>
      <span><i class="rnd dat"></i>데이터 변경만</span><span><i class="hollow"></i>테스트 서버</span>
      <span><i class="dens"></i>본 서버 3건 이상인 달</span><span><i class="band"></i>3개월 이상 공백(전체 기준)</span></div>`;
    let out = `<div class="cal"><div class="cal-top"><div class="cal-ttl">패치 달력</div>${legend}</div><div class="cal-hd"><span></span>${
      Array.from({ length: 12 }, (_, i) => `<span>${i + 1}<span class="mo">월</span></span>`).join('')}<span class="sumh">연 요약</span></div>`;
    C.years.forEach(y => {
      const cells = [];
      for (let m = 1; m <= 12; m++) {
        const k = `${y}-${String(m).padStart(2, '0')}`;
        const list = (byM[k] || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
        const col = ` style="grid-column:${m + 1}"`;
        if (k < C.startM || k > C.endM) { cells.push(`<span class="cal-c void"${col}></span>`); continue; }
        if (!list.length) {
          const whole = (allByM[k] || []).length;
          if (k === C.todayM && !whole) {
            const cx = ((+C.today.slice(8, 10) - 1) / 31 * 100).toFixed(0);
            cells.push(`<span class="cal-c now" style="grid-column:${m + 1};--cx:${cx}%" title="${esc(`오늘은 ${ymd(C.today)}입니다. 마지막 회차로부터 ${C.sinceLast}일째입니다.`)}"></span>`);
          } else {
            const t = whole ? `${ymTxt(k)} · 전체 ${whole}건이지만 조건에 맞는 회차는 없습니다` : `${ymTxt(k)} · 회차 없음`;
            cells.push(`<span class="cal-c empty"${col} title="${esc(t)}"></span>`);
          }
          continue;
        }
        const ln = list.filter(r => channelOf(r) === 'live').length;
        const dcls = ln >= 5 ? ' d3' : ln === 4 ? ' d2' : ln === 3 ? ' d1' : '';
        const cnt = {};
        list.forEach(r => { const g = kgrp(r); cnt[g] = (cnt[g] || 0) + 1; });
        const tip = `${ymTxt(k)} · ${list.length}건` + Object.keys(KG).filter(g => cnt[g]).map(g => ` · ${KG[g]} ${cnt[g]}`).join('');
        const seen = [0, 0, 0, 0, 0];
        const dots = list.map(r => {
          const x = wslot(r.date), row = Math.min(seen[x]++, 3);
          const on = sel.s === patchKey(r) ? ' sel' : '';
          return `<span class="dot k-${kgrp(r)}${on}" style="--x:${x};--y:${row}" data-k="${patchKey(r)}" title="${esc(r.date + ' ' + r.title)}"></span>`;
        }).join('');
        cells.push(`<a class="cal-c${dcls}${sel.m === k ? ' on' : ''}"${col} href="${mUrl(k)}" data-m="${k}" title="${esc(tip)}">${dots}</a>`);
      }
      const S = C.ysum[y];
      const stip = `${y}년 · ${S.n}건 가운데 라이브는 ${S.live}건입니다. 라이브 회차 사이 간격의 중앙값 ${d1(S.cyc)}일, 그해 최장 공백 ${S.maxGap == null ? '없음' : S.maxGap + '일'}.`;
      const sum = `<a class="cal-sum${sel.m === y ? ' on' : ''}" href="${mUrl(y)}" title="${esc(stip)}"><b>${S.n}건</b><br>라이브 ${S.live} · 테스트 ${S.ptr}<br>주기 ${d1(S.cyc)}일 · 활성 ${S.act}/${S.of}</a>`;
      out += `<div class="cal-y"><a class="cal-yl" href="${mUrl(y)}">${y}</a>${cells.join('')}${sum}${calBands(runs, y).join('')}</div>`;
    });
    return out + '</div>';
  }

  function calAxis(C) {
    const T0 = dnum(C.all[0].date), SPAN = dnum(C.today) - T0;
    const pos = d => (dnum(d) - T0) / SPAN * 100;
    const big = C.gaps.filter(g => g.n >= 60).sort((a, b) => b.n - a.n);
    let out = '<div class="cal-axis">';
    C.years.slice(1).forEach(y => { out += `<i class="yr" style="left:${pos(y + '-01-01').toFixed(2)}%"></i>`; });
    big.forEach(g => {
      const w = g.n / SPAN * 100;
      const style = `left:${pos(g.from).toFixed(2)}%;width:${w.toFixed(2)}%`;
      out += `<i class="gap" style="${style}" title="${esc(`${ymd(g.from)}부터 ${ymd(g.to)}까지 ${g.n}일 공백`)}"></i>`;
      if (w > 4) out += `<i class="lb" style="${style}">${g.n}일</i>`;
    });
    out += `<i class="tail" style="left:${pos(C.lastLive).toFixed(2)}%;width:${(C.sinceLast / SPAN * 100).toFixed(2)}%" title="${esc(`마지막 회차 이후 ${C.sinceLast}일째`)}"></i></div>`;
    return out + `<p class="cal-note">${ymd(C.all[0].date)}부터 오늘까지 ${SPAN.toLocaleString('ko-KR')}일을 실제 길이 그대로 편 띠입니다.
      빗금은 60일 넘게 아무 회차도 없던 ${big.length}개 구간이고, 그중 가장 큰 ${big[0].n}일 하나가 띠 전체의 ${(big[0].n / SPAN * 100).toFixed(1)}%를 혼자 차지합니다.
      오른쪽 끝 옅은 꼬리가 지금 기다리는 중인 ${C.sinceLast}일입니다.</p>`;
  }

  function stRow(key, segs, right, max, tip) {
    const bar = segs.filter(x => x[1] > 0).map(x => `<i class="${x[0]}" style="width:${(x[1] / max * 100).toFixed(2)}%"></i>`).join('');
    return `<div class="st-row"${tip ? ` title="${esc(tip)}"` : ''}><div class="k">${key}</div><div class="st-bar">${bar}</div><div class="v">${right}</div></div>`;
  }

  const lgHTML = items => `<div class="lg">${items.map(([c, t]) => `<span><i class="${c}"></i>${t}</span>`).join('')}</div>`;
  const stHead = (title, legend, cap) => `<div class="st-hd"><h3>${title}</h3>${legend}</div><p class="cap">${cap}</p>`;

  function calStats(C) {
    let out = '';
    const KLG = [['pat', '본 패치'], ['bal', '밸런스·긴급 수정'], ['dat', '데이터 변경만'], ['ptr', '테스트 서버']];

    const maxN = Math.max(...C.years.map(y => C.ysum[y].n));
    out += `<div class="st">` + stHead('연도별 패치 횟수', lgHTML(KLG),
      `막대 길이는 그해 전체 회차 수이고, 색은 종류별 내역입니다. 회차 수만 보면 안 됩니다. ${(() => { const S = C.ysum['2024']; return `2024년은 ${S.n}건이지만 그중 ${S.ptr}건이 테스트 서버라 본 서버에 반영된 것은 ${S.live}건뿐입니다.`; })()}`)
      + C.years.map(y => {
        const S = C.ysum[y];
        return stRow(y, [['pat', S.kinds.pat], ['bal', S.kinds.bal], ['dat', S.kinds.dat], ['ptr', S.kinds.ptr]], `<b>${S.n}</b>건`, maxN,
          `${y}년 · 본 패치 ${S.kinds.pat} · 밸런스와 긴급 수정 ${S.kinds.bal} · 데이터 변경만 ${S.kinds.dat} · 테스트 서버 ${S.kinds.ptr}`);
      }).join('') + '</div>';

    const maxC = Math.max(...C.years.map(y => C.ysum[y].cyc || 0));
    out += `<div class="st">` + stHead('연도별 패치 주기', lgHTML([['one', '본 서버 회차 사이 간격의 중앙값(일)']]),
      '막대가 길수록 다음 패치까지 오래 걸렸다는 뜻입니다. 간격은 뒤쪽 회차의 연도로 셉니다.')
      + C.years.map(y => {
        const S = C.ysum[y];
        return stRow(y, [['one', S.cyc || 0]], `<b>${d1(S.cyc)}</b>일`, maxC,
          `${y}년 중앙 간격 ${d1(S.cyc)}일 · 그해 최장 공백 ${S.maxGap == null ? '없음' : S.maxGap + '일'}`);
      }).join('') + '</div>';

    const mxw = Math.max(...C.wd.live, ...C.wd.ptr);
    out += `<div class="st">` + stHead('요일별 배포 횟수', lgHTML([['one', '본 서버'], ['two', '테스트 서버']]),
      '달력 칸 안의 가로 위치는 날짜라서 요일을 보여주지 못합니다. 요일 쏠림은 여기서만 보입니다. 막대 아래 숫자는 본 서버와 테스트 서버 순입니다.')
      + `<div class="st-wd">` + WORD.map(i => `<div class="c"><div class="bars">
        <i class="one" style="height:${(C.wd.live[i] / mxw * 62).toFixed(1)}px" title="${esc(`${WD[i]}요일 본 서버 ${C.wd.live[i]}회`)}"></i>
        <i class="two" style="height:${(C.wd.ptr[i] / mxw * 62).toFixed(1)}px" title="${esc(`${WD[i]}요일 테스트 서버 ${C.wd.ptr[i]}회`)}"></i>
      </div><div class="lb"><b>${WD[i]}</b><br>${C.wd.live[i]}·${C.wd.ptr[i]}</div></div>`).join('') + `</div>
      <p class="cap after">본 서버 ${C.live.length}회 가운데 ${C.wd.live[4]}회(${Math.round(C.wd.live[4] / C.live.length * 100)}%)가 목요일이었고, 일요일에 나온 본 서버 회차는 ${C.wd.live[0]}회입니다.
      테스트 서버는 화요일에 몰렸습니다. ${C.ptr.length}회 가운데 ${C.wd.ptr[2]}회입니다. 화요일에 올리고 목요일에 반영하는 순서였습니다.
      2023년 9월 부활 뒤 ${C.wdNew.reduce((a, b) => a + b, 0)}회는 ${WORD.filter(i => C.wdNew[i]).map(i => `${WD[i]} ${C.wdNew[i]}`).join(' · ')}로 흩어졌습니다.</p></div>`;

    const B = [[0, 7, '1주 안'], [8, 14, '2주 안'], [15, 21, '3주 안'], [22, 30, '한 달 안'], [31, 60, '두 달 안'], [61, 1e9, '두 달 넘게']];
    const bn = B.map(b => C.lag.filter(v => v >= b[0] && v <= b[1]).length);
    const mxb = Math.max(...bn);
    const lagYears = C.years.filter(y => C.ysum[y].lag != null);
    const mxl = Math.max(...lagYears.map(y => C.ysum[y].lag));
    out += `<div class="st">` + stHead('테스트 서버 반영 기간', lgHTML([['two', '테스트 서버 회차 수'], ['dens', '연도별 중앙값(일)']]),
      `테스트 서버에 올라온 회차가 그 뒤 첫 본 서버 회차까지 걸린 날입니다. ${C.lag.length}건을 쟀고 중앙값은 ${d1(med(C.lag))}일, 가장 짧은 것은 ${Math.min(...C.lag)}일, 가장 오래 걸린 것은 ${Math.max(...C.lag)}일입니다. 회차마다의 값은 아래 목록과 패치 목록의 카드에 적어 두었습니다.`)
      + B.map((b, i) => stRow(b[2], [['two', bn[i]]], `<b>${bn[i]}</b>건`, mxb,
        `${b[2]} · ${b[0]}일에서 ${b[1] === 1e9 ? '그 이상' : b[1] + '일'} · ${bn[i]}건`)).join('')
      + `<p class="cap after">연도별 중앙값입니다. 초기에는 일주일이면 넘어왔지만 뒤로 갈수록 길어집니다.</p>`
      + lagYears.map(y => stRow(y, [['dens', C.ysum[y].lag]], `<b>${d1(C.ysum[y].lag)}</b>일`, mxl,
        `${y}년 테스트 서버 회차 ${C.ysum[y].ptr}건 · 본 서버 반영까지 중앙값 ${d1(C.ysum[y].lag)}일`)).join('') + '</div>';

    const hs = Object.entries(C.hc).filter(([h]) => HEROES[h]).sort((a, b) => b[1] - a[1]);
    out += `<div class="st">` + stHead('영웅별 패치 횟수', lgHTML([['one', '이름이 오른 회차 수']]),
      `패치 노트나 데이터 변경에 이름이 오른 회차 수입니다. 영웅 ${hs.length}명 가운데 상위 20명이고, 누르면 그 영웅 이력으로 갑니다.`)
      + hs.slice(0, 20).map(([h, n]) => stRow(`<a href="?view=hero&id=${h}">${heroImg(h)}${esc(heroName(h))}</a>`, [['one', n]], `<b>${n}</b>회`, hs[0][1],
        `${heroName(h)} · ${n}회`)).join('') + '</div>';

    const rs = Object.entries(C.roles).map(([r, v]) => [r, v.n / v.heroes, v.heroes, v.n]).sort((a, b) => b[1] - a[1]);
    out += `<div class="st">` + stHead('역할군별 평균 패치 횟수', lgHTML([['one', '영웅 한 명당 평균 회차 수']]),
      '역할군마다 영웅 수가 달라 총합으로는 비교가 안 됩니다. 영웅 한 명이 평균 몇 회 손질을 받았는지로 봅니다.')
      + rs.map(([r, avg, hn, tot]) => stRow(esc(ROLE[r] || r), [['one', avg]], `<b>${d1(avg)}</b>회`, rs[0][1],
        `${ROLE[r] || r} · 영웅 ${hn}명 · 총 ${tot}회 · 영웅당 평균 ${d1(avg)}회`)).join('') + '</div>';

    const bs = Object.entries(C.bc).sort((a, b) => b[1] - a[1]);
    out += `<div class="st">` + stHead('전장별 패치 횟수', lgHTML([['one', '이름이 오른 회차 수']]),
      `공식 노트에 이름이 오른 회차 수입니다. 전장 ${bs.length}곳 전부이고, 누르면 그 전장 이력으로 갑니다.`)
      + bs.map(([b, n]) => stRow(`<a href="?view=bg&id=${b}">${esc(bgName(b))}</a>`, [['one', n]], `<b>${n}</b>회`, bs[0][1], `${bgName(b)} · ${n}회`)).join('') + '</div>';

    const mxa = Math.max(...C.years.map(y => C.ysum[y].avgHero));
    out += `<div class="st">` + stHead('회차당 평균 영웅 수', lgHTML([['one', '한 회차에 이름이 오른 영웅 수']]),
      '그해 회차마다 이름이 오른 영웅 수의 평균입니다. 2022년까지는 조금씩 자주 고쳤고, 2023년 부활 뒤로는 한 번에 몰아서 고칩니다.')
      + C.years.map(y => stRow(y, [['one', C.ysum[y].avgHero]], `<b>${d1(C.ysum[y].avgHero)}</b>명`, mxa,
        `${y}년 · 회차 ${C.ysum[y].n}건 · 회차당 평균 ${d1(C.ysum[y].avgHero)}명`)).join('') + '</div>';
    return out;
  }

  function calList(C, shown, sel) {
    const isYear = sel.m.length === 4;
    const rows = shown.filter(r => r.date.slice(0, isYear ? 4 : 7) === sel.m).sort((a, b) => a.date < b.date ? 1 : -1);
    const head = isYear ? `${sel.m}년` : ymTxt(sel.m);
    const cap = `<div class="ph"><h3>${head} · ${rows.length}건</h3>${
      isYear ? '' : `<a class="btn" href="?view=cal&m=${sel.m.slice(0, 4)}">${sel.m.slice(0, 4)}년 전체 보기</a>`}</div>`;
    if (!rows.length) return cap + '<div class="empty">이 기간에는 조건에 맞는 회차가 없습니다.</div>';
    return cap + rows.map(r => rowHTML(r).replace('class="row"', `class="row${sel.s === patchKey(r) ? ' sel' : ''}"`)).join('');
  }

  function renderCal() {
    const C = calData(), p = q(), f = cur();
    const sel = { m: p.get('m') || C.lastM, s: p.get('s') || '' };
    const shown = C.all.filter(r =>
      (!f.ch || channelOf(r) === f.ch)
      && (!f.src || sourceOf(r) === f.src)
      && (!f.q || (r.title || '').toLowerCase().includes(f.q.toLowerCase())));
    const mUrl = m => '?' + new URLSearchParams(Object.entries({ view: 'cal', m, ch: f.ch, src: f.src, q: f.q }).filter(([, x]) => x)).toString();
    const lnk = (k, v, label) => {
      const on = ((k === 'ch' ? f.ch : f.src) || '') === v ? ' class="on"' : '';
      const o = { view: 'cal', m: sel.m, ch: f.ch, src: f.src, q: f.q };
      o[k] = v;
      const u = new URLSearchParams(Object.entries(o).filter(([, x]) => x));
      return `<a href="?${u.toString()}"${on}>${label}</a>`;
    };
    app.innerHTML = headHTML('cal')
      + `<p class="sub">${ymd(C.all[0].date)}부터 ${ymd(C.all[C.all.length - 1].date)}까지 ${C.all.length}회를 달력 한 장에 놓았습니다.
        칸 안 가로 위치는 그달 1일부터 말일까지이고, 칸을 누르면 그달 회차가 아래에 펼쳐집니다.
        넓은 화면에서는 점 하나를 눌러 그 회차를 바로 짚을 수 있습니다.</p>`
      + calTiles(C, mUrl)
      + `<p class="cal-note">칸 안 가로 위치는 그달 1일에서 말일까지이며 <b>요일과는 관계가 없습니다</b>.
        요일 쏠림은 아래 <b>요일별 배포 횟수</b>에서 따로 봅니다.</p>
      <div class="filters"><span class="grp"><span class="lbl">채널</span>
        ${lnk('ch', '', '전체')}${lnk('ch', 'live', '라이브')}${lnk('ch', 'ptr', '테스트 서버')}</span>
        <span class="grp"><span class="lbl">출처</span>
        ${lnk('src', '', '전체')}${lnk('src', 'official', '공식 한글')}${lnk('src', 'translated', 'Claude 번역')}${lnk('src', 'data', '데이터')}</span></div>`
      + ((f.ch || f.src || f.q) ? `<p class="cal-note">거르개가 걸려 있어 달력의 점은 조건에 맞는 ${shown.length}건만 보입니다.
        공백 띠와 연 요약, 아래 통계는 언제나 전체 ${C.all.length}건 기준입니다.</p>` : '')
      + calGrid(C, shown, sel, mUrl)
      + calAxis(C)
      + `<div class="cal-panel">${calList(C, shown, sel)}</div>`
      + calStats(C)
      + creditsHTML();
    // 칸·점 누르기는 전체를 다시 그리지 않는다(render 가 맨 위로 스크롤하기 때문에)
    const grid = app.querySelector('.cal');
    if (grid) {
      grid.addEventListener('click', e => {
        const cell = e.target.closest('a.cal-c');
        if (!cell) return;
        e.preventDefault();
        const dot = e.target.closest('.dot');
        sel.m = cell.dataset.m;
        sel.s = dot ? dot.dataset.k : '';
        app.querySelectorAll('a.cal-c.on, .cal-sum.on').forEach(el => el.classList.remove('on'));
        app.querySelectorAll('.cal-c .dot.sel').forEach(el => el.classList.remove('sel'));
        cell.classList.add('on');
        if (dot) dot.classList.add('sel');
        app.querySelector('.cal-panel').innerHTML = calList(C, shown, sel);
        const u = new URL(location.href);
        u.searchParams.set('m', sel.m);
        if (sel.s) u.searchParams.set('s', sel.s); else u.searchParams.delete('s');
        history.replaceState(null, '', u);
      });
    }
  }

  // ---------- 전장 목록 / 이력 ----------
  function renderBgs() {
    const count = {};
    INDEX.forEach(r => r.battlegrounds.forEach(b => { count[b] = (count[b] || 0) + 1; }));
    const ids = Object.keys(BGS).sort((a, b) => bgName(a).localeCompare(bgName(b), 'ko'));
    app.innerHTML = headHTML('bgs') + `<p class="sub">전장을 고르면 그 전장이 언급된 공식 노트 항목을 시간순으로 봅니다.</p>
      <div class="grid-h">${ids.map(b => count[b]
        ? `<a href="?view=bg&id=${b}"><span>${esc(bgName(b))}</span><span class="n">${count[b]}</span></a>`
        : `<a style="opacity:.5;cursor:default" title="이 전장은 패치 노트에 따로 언급된 적이 없습니다"><span>${esc(bgName(b))}</span><span class="n">0</span></a>`).join('')}</div>` + creditsHTML();
  }
  async function renderBg(id) {
    let doc = null;
    try { doc = await getJSON(`battlegrounds/${id}.json`); } catch (e) {}
    const entries = doc ? doc.entries : [];
    if (!doc) console.info('전장 기록 없음:', id);
    const body = entries.map(e => `<div class="ent"><h3><a href="?v=${e.date}${e.build ? '&b=' + e.build : ''}">${e.date}</a>${badges({ ...e, official: 1 })}<span style="font-weight:400;font-size:13px;color:var(--dim)">${esc(e.title)}</span></h3>
      ${e.translated ? `<div class="trnote" style="margin:0 0 8px"><b class="tag">번역</b> <span>한국어 공식판이 없어 영어 원문을 <b>${esc(e.translated.by || 'Claude')}</b> 가 번역한 내용입니다. <a href="?v=${e.date}${e.build ? '&b=' + e.build : ''}&tab=en">영어 원문 보기</a></span></div>` : ''}
      ${e.official.map(o => `<div class="box"><div class="lab">${e.translated ? 'Claude 번역' : '공식 한글 노트'} · ${esc(o.section)}</div><div class="official">${o.html}</div></div>`).join('')}</div>`).join('');
    app.innerHTML = headHTML('bgs') + `<a id="pn-back" href="?view=bgs">← 전장 목록</a><div class="hero-head"><div><h2>${esc(bgName(id))}</h2><div class="d">공식 노트 ${entries.length}건</div></div></div>
      <div class="hist">${body || '<div class="empty">이 전장은 패치 노트에 따로 언급된 적이 없습니다. 영웅 변경 안에 섞여 있을 수 있습니다.</div>'}</div>${creditsHTML()}`;
  }

  function creditsHTML() {
    return `<div class="credits"><h4>자료 출처와 수록 범위</h4><dl>
      <dt>공식 한글 노트</dt><dd>블리자드 뉴스 한국어판에서 모았습니다(2017년 1월~). 본문의 권리는 Blizzard Entertainment 에 있으며, 각 노트에 원문 링크를 둡니다.</dd>
      <dt>Claude 번역</dt><dd>한국어 공식판이 없는 회차만, 블리자드 <b>영어 원문</b>을 Claude 가 옮겼습니다(2016년 9월~). 공식 번역이 아니며 노트마다 고지·원문 링크·영어 원문 탭을 함께 둡니다.</dd>
      <dt>데이터 변경점</dt><dd>게임 파일에서 뽑은 수치 비교입니다. <a href="https://github.com/HeroesToolChest/heroes-data" target="_blank" rel="noopener">HeroesToolChest/heroes-data</a> · <a href="https://github.com/HeroesToolChest/heroes-data2" target="_blank" rel="noopener">heroes-data2</a> (MIT), 2019년 10월(2.47.2) 이후 빌드만 있습니다.</dd>
      <dt>구성 참고</dt><dd>영문 아카이브 <a href="https://nexus-patch-notes.github.io/" target="_blank" rel="noopener">Nexus Patch Notes</a> 의 구성(패치 목록·영웅별 이력)을 참고했습니다. 그 사이트의 글과 코드는 가져오지 않았고, 이 페이지의 내용은 블리자드 원문과 게임 데이터에서 직접 만들었습니다.</dd>
      </dl><div class="warn">블리자드 뉴스 아카이브에 남아 있는 가장 오래된 글이 2016년 9월이라, 2014~2016년 상반기 패치는 싣지 못했습니다.<br>
      이 사이트는 <b>Blizzard Entertainment 와 아무 관계가 없는 개인 팬 아카이브</b>입니다. Heroes of the Storm 및 관련 자료의 권리는 Blizzard Entertainment 에 있으며, 이 사이트는 어떤 수익도 내지 않고 권리자의 요청이 있으면 즉시 내리겠습니다.</div></div>`;
  }

  // 블리자드 원문에 상대 경로로 들어온 그림은 여기서 못 받는다(현재 1건). 깨진 아이콘 대신 감춘다.
  function hideBrokenImages() {
    app.querySelectorAll('.official img, .body img').forEach(i => {
      const hide = () => { i.style.display = 'none'; };
      if (i.complete && !i.naturalWidth) hide(); else i.addEventListener('error', hide, { once: true });
    });
  }

  async function render() {
    const p = q();
    window.scrollTo(0, 0);
    if (p.get('v')) return renderDetail(p.get('v')).then(hideBrokenImages);
    const view = p.get('view') || 'list';
    if (view === 'cal') return renderCal();
    if (view === 'heroes') return renderHeroes();
    if (view === 'hero') return renderHero(p.get('id')).then(hideBrokenImages);
    if (view === 'bgs') return renderBgs();
    if (view === 'bg') return renderBg(p.get('id')).then(hideBrokenImages);
    try { sessionStorage.setItem('patchnotes.list', p.toString()); } catch (e) {}
    renderList();
  }

  (async function init() {
    try {
      [INDEX, HEROES, BGS] = await Promise.all([getJSON('index.json'), getJSON('heroes.json'), getJSON('battlegrounds.json')]);
      render();
    } catch (e) {
      app.innerHTML = `<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`;
    }
  })();
})();
</script>
</body>
</html>
