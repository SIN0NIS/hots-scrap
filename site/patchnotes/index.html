<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패치 기록 · HotS Scrap</title>
<link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
<link rel="stylesheet" href="../shared/scrap.css">
<style>
  /* scrap-theme: 공통 토큰(--scrap-*) 위에 이 앱만의 값 — 허브(index.html)와 같은 팔레트·폭·카드 양식 */
  :root { --bg:var(--scrap-bg); --card:var(--scrap-card); --card2:var(--scrap-card2); --line:var(--scrap-line); --fg:var(--scrap-fg);
          --dim:var(--scrap-dim); --blue:var(--scrap-blue); --blue-soft:var(--scrap-blue-soft); --gold:var(--scrap-gold); --gold-line:var(--scrap-gold-line);
          --bg-glow:radial-gradient(1200px 500px at 50% -10%, #dbe7f7 0%, transparent 60%);
          --new:#c2410c; --del:#b91c1c; --del-bg:#fee2e2; --ins:#15803d; --ins-bg:#dcfce7; --purple:#6d28d9; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-glow:radial-gradient(1200px 500px at 50% -10%, #14294a 0%, transparent 60%); --new:#ffb070; --del:#ff9b9b; --del-bg:#4a1d1d; --ins:#8ee0a4; --ins-bg:#143d22; --purple:#c4a5ff; } }
  :root[data-theme="dark"] { --bg-glow:radial-gradient(1200px 500px at 50% -10%, #14294a 0%, transparent 60%); --new:#ffb070; --del:#ff9b9b; --del-bg:#4a1d1d; --ins:#8ee0a4; --ins-bg:#143d22; --purple:#c4a5ff; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); background-image:var(--bg-glow); background-repeat:no-repeat; color:var(--fg);
         font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,-apple-system,sans-serif;
         font-size:14px; line-height:1.55; min-height:100vh; }
  /* 화살표·기호만 기호 글꼴로 (숫자·한글 서체는 그대로 두려고 범위를 좁힌다) */
  @font-face { font-family:PnSym; src:local("Segoe UI Symbol"),local("Apple Symbols"),local("Noto Sans Symbols 2");
               unicode-range:U+2190-21FF,U+2200-22FF,U+2500-259F,U+25A0-25FF,U+2600-26FF,U+2B00-2BFF; }
  body { font-family:PnSym,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,-apple-system,sans-serif; }
  h1 .en { font-size:13px; color:var(--dim); font-weight:400; letter-spacing:0; margin-left:10px; }
  a { color:var(--blue); }
  .wrap { max-width:880px; margin:0 auto; padding:28px 20px 60px; }
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  h1 { margin:0; font-size:28px; letter-spacing:0.5px; } h1 .s { color:var(--gold); }
  .sub { color:var(--dim); font-size:13px; margin:2px 0 14px; }
  .nav { display:flex; gap:6px; margin:0 0 14px; flex-wrap:wrap; position:sticky; top:0; z-index:50; background:var(--bg); padding:8px 0; border-bottom:1px solid var(--line); }
  #pn-back { position:fixed; left:12px; bottom:12px; z-index:99; text-decoration:none; font-size:13px; border-radius:99px; padding:9px 14px; background:var(--card); color:var(--fg); border:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.25); }
  body { padding-bottom:64px; }  /* 고정 버튼이 마지막 내용을 가리지 않게 */
  @media (max-width:600px) { #pn-back { left:8px; bottom:8px; padding:7px 12px; font-size:12px; opacity:.95; } }
  #pn-back:hover { border-color:var(--gold-line); color:var(--gold); }
  /* 특성 변천도 */
  .chart-wrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:12px; background:var(--card); margin:0 0 6px; }
  table.chart { border-collapse:separate; border-spacing:0; font-size:12px; }
  .chart th, .chart td { border-bottom:1px solid var(--line); padding:3px 6px; white-space:nowrap; }
  .chart thead th { position:sticky; top:0; background:var(--card2); z-index:2; }
  .chart th.rowh { position:sticky; left:0; background:var(--card); z-index:1; text-align:left; font-weight:400; min-width:180px; max-width:240px; overflow:hidden; text-overflow:ellipsis; }
  .chart thead th.rowh { z-index:3; background:var(--card2); }
  .chart th.col { font-weight:400; color:var(--dim); font-size:11px; padding:6px 3px; }
  .chart th.col span { display:inline-block; writing-mode:vertical-rl; transform:rotate(180deg); }
  .chart th.col.ptr span { color:#8b5cf6; }
  .chart td.c { text-align:center; min-width:28px; }
  .chart .m { display:inline-block; width:20px; height:20px; line-height:20px; border-radius:4px; font-size:12px; font-weight:700; cursor:pointer; }
  .m.add { background:var(--ins-bg); color:var(--ins); } .m.rm { background:var(--del-bg); color:var(--del); } .m.chg { background:var(--blue-soft); color:var(--blue); } .m.mv { background:rgba(139,92,246,.18); color:var(--purple); }
  .chart tr.grp th { background:var(--card2); color:var(--gold); font-weight:700; position:sticky; left:0; }
  .chart .rowh img { width:18px; height:18px; vertical-align:middle; margin-right:5px; border-radius:3px; background:var(--card2); }
  .chart .rowh .lv { color:var(--dim); font-size:10px; margin-left:4px; }
  .chart .rowh.gone { color:var(--dim); text-decoration:line-through; }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--dim); margin:0 0 16px; flex-wrap:wrap; align-items:center; }
  /* 수치 그래프 */
  .gsec { margin:6px 0 22px; }
  .gcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:0 0 10px; }
  .gcard .gh { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:700; }
  .gcard .gh img { width:26px; height:26px; border-radius:5px; background:var(--card2); }
  .gcard .gh .lv { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:0 5px; font-weight:400; }
  .gseg { margin:8px 0 2px; }
  .gseg .sh { font-size:13px; color:var(--gold); font-weight:700; }
  .gseg .sh .rng { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
  .gseg details { font-size:12px; color:var(--dim); margin:2px 0 4px; } .gseg summary { cursor:pointer; }
  .gseg details div { white-space:pre-wrap; color:var(--fg); margin-top:4px; }
  .gline { display:grid; grid-template-columns:150px minmax(0,1fr); gap:8px; align-items:center; padding:6px 0; border-top:1px dashed var(--line); }
  .gline .gl { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gline .gl b { display:block; color:var(--fg); font-weight:700; font-size:13px; }
  .gline .gwrap { width:100%; overflow:hidden; }
  .gline svg { display:block; max-width:100%; }
  .gline .ln { fill:none; stroke:var(--blue); stroke-width:2; stroke-linejoin:round; }
  .gline .ln.seg { stroke:var(--gold); }
  .gline .dot { fill:var(--card); stroke:var(--blue); stroke-width:1.5; } .gline .dot.chg { fill:var(--blue); }
  .gline .ln.seg + g .dot, .gline .seg .dot { stroke:var(--gold); } .gline .seg .dot.chg { fill:var(--gold); }
  .gline .dot.chg.up, .gline .seg .dot.chg.up { fill:var(--upc); stroke:var(--upc); } .gline .dot.chg.dn, .gline .seg .dot.chg.dn { fill:var(--dnc); stroke:var(--dnc); }
  .gline .ax { stroke:var(--line); stroke-width:1; } .gline .grid { stroke:var(--line); stroke-width:1; stroke-dasharray:2 3; opacity:.7; }
  .gline .tk { font-size:10px; fill:var(--dim); } .gline .ty { font-size:10px; fill:var(--dim); }
  .gline .vl { font-size:10px; fill:var(--fg); font-weight:700; paint-order:stroke; stroke:var(--card); stroke-width:3px; stroke-linejoin:round; }
  .gsec { --upc:#2f81f7; --dnc:#e5484d; }          /* 기본: 상승 파랑, 하락 빨강 */
  .gsec.kr { --upc:#e5484d; --dnc:#2f81f7; }       /* 주식식: 상승 빨강, 하락 파랑 */
  .gsec.us { --upc:#16a34a; --dnc:#dc2626; }       /* 서양식: 상승 초록, 하락 빨강 */
  :root[data-theme="dark"] .gsec { --upc:#5aa8ff; --dnc:#ff6b6b; } :root[data-theme="dark"] .gsec.kr { --upc:#ff6b6b; --dnc:#5aa8ff; } :root[data-theme="dark"] .gsec.us { --upc:#4ade80; --dnc:#ff6b6b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gsec { --upc:#5aa8ff; --dnc:#ff6b6b; } :root:not([data-theme="light"]) .gsec.kr { --upc:#ff6b6b; --dnc:#5aa8ff; } :root:not([data-theme="light"]) .gsec.us { --upc:#4ade80; --dnc:#ff6b6b; } }
  .gline .ln.up { stroke:var(--upc); } .gline .ln.dn { stroke:var(--dnc); } .gline .ln.flat { stroke:var(--dim); opacity:.75; }
  .gline .up { fill:var(--upc); } .gline .dn { fill:var(--dnc); }
  .gline .jump { stroke-width:3; stroke-linecap:round; } .gline .jump.up { stroke:var(--upc); } .gline .jump.dn { stroke:var(--dnc); }
  .gline .zero { stroke:var(--dim); stroke-width:1; stroke-dasharray:4 3; }
  .gl .up { color:var(--upc); font-weight:700; } .gl .dn { color:var(--dnc); font-weight:700; }
  .gline .gl .sum { white-space:normal; line-height:1.4; }
  .gline .tk.rot { text-anchor:end; }
  .gline .tk.cur { font-weight:700; fill:var(--gold); }
  .chglist { grid-column:1 / -1; list-style:none; margin:2px 0 0; padding:0; font-size:12px; display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--dim); }
  .chglist li { display:inline-flex; gap:6px; align-items:baseline; white-space:nowrap; }
  .chglist .d { color:var(--fg); font-variant-numeric:tabular-nums; } .chglist .v { font-size:11px; opacity:.8; }
  .chglist .ar { color:var(--fg); }
  .chglist li.more { cursor:pointer; text-decoration:underline dotted; }
  .gline .hit { fill:transparent; }
  .gline .hit:hover { fill:var(--blue-soft); opacity:.5; }
  .gctl { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:12px; color:var(--dim); background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:6px 0 10px; }
  .gctl label { display:inline-flex; align-items:center; gap:4px; }
  .gctl select, .gctl input[type=range] { font-family:inherit; font-size:12px; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .gctl input[type=range] { padding:0; width:110px; }
  .gctl .seg-btns button { padding:3px 9px; font-size:12px; }
  .gctl .rng-lbl { min-width:118px; color:var(--fg); }
  .gnone { font-size:12px; color:var(--dim); margin:4px 0 14px; }
  .gcat { margin:22px 0 8px; padding:6px 0 0; border-top:2px solid var(--gold-line); display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .gcat h4 { margin:0; font-size:15px; color:var(--gold); }
  .gcat .c { font-size:12px; color:var(--dim); }
  .tsum { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0 16px; }
  .tsum h4 { margin:0 0 8px; font-size:14px; }
  .tsum .row { display:grid; grid-template-columns:104px 1fr; gap:6px 10px; padding:5px 0; border-top:1px dashed var(--line); font-size:13px; }
  .tsum .row:first-of-type { border-top:none; }
  .tsum .k { color:var(--dim); font-size:12px; }
  .tsum .v { display:flex; flex-wrap:wrap; gap:4px 8px; }
  .tsum .t { display:inline-flex; align-items:center; gap:4px; background:var(--card2); border:1px solid var(--line); border-radius:99px; padding:2px 9px; font-size:12px; }
  .tsum .t img { width:16px; height:16px; border-radius:3px; }
  .tsum .t .d { color:var(--dim); font-size:11px; }
  .tsum .t.add { border-color:var(--ins); } .tsum .t.rm { border-color:var(--del); } .tsum .t.mv { border-color:var(--purple); }
  .tsum .none { color:var(--dim); font-size:12px; }
  @media (max-width:600px) { .tsum .row { grid-template-columns:1fr; } }
  .gnone span { display:inline-block; margin:2px 6px 2px 0; }
  @media (max-width:600px) { .gline { grid-template-columns:1fr; gap:2px; } }
  .legend .m { cursor:default; }
  .hist .ent:target .box { border-color:var(--gold-line); box-shadow:0 0 0 2px var(--gold-line); }
  .hist .ent { scroll-margin-top:70px; }
  .nav a { text-decoration:none; color:var(--dim); border:1px solid var(--line); background:var(--card); border-radius:99px; padding:6px 16px; font-size:13px; }
  .nav a.on { color:var(--gold); border-color:var(--gold-line); font-weight:700; }
  .nav a:hover { border-color:var(--gold-line); color:var(--gold); }
  button, .btn { font-family:inherit; font-size:13px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:99px; padding:5px 12px; }
  button:hover, .btn:hover { border-color:var(--gold-line); color:var(--gold); }
  button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  input[type=search] { font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); width:100%; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  .filters .grp { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .filters .lbl { color:var(--dim); font-size:12px; margin-right:2px; }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--card2); border-radius:99px; padding:3px 10px 3px 4px; font-size:13px; cursor:pointer; }
  .chip img { width:22px; height:22px; border-radius:50%; object-fit:cover; }
  .chip .x { color:var(--dim); margin-left:2px; }
  .picker { position:relative; }
  .picker .menu { position:absolute; top:110%; left:0; z-index:20; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; width:min(92vw,420px); max-height:340px; overflow:auto; box-shadow:0 8px 30px rgba(0,0,0,.18); }
  .picker .menu input { margin-bottom:6px; }
  .picker .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:4px; }
  .picker .grid button { border-radius:8px; padding:4px 6px; display:flex; align-items:center; gap:5px; font-size:12px; text-align:left; }
  .picker .grid button img { width:20px; height:20px; border-radius:50%; object-fit:cover; flex:none; }
  .stat { color:var(--dim); font-size:12px; margin:6px 0 10px; }

  /* 카드 목록 — 허브의 앱 카드와 같은 톤 */
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:inherit; text-decoration:none; transition:border-color .15s, box-shadow .15s; }
  .row:hover { border-color:var(--gold-line); box-shadow:0 4px 18px rgba(0,0,0,.08); }
  .row .top { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .row .date { font-weight:700; font-variant-numeric:tabular-nums; }
  .row .title { flex:1 1 300px; font-size:14px; }
  .badge { font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; letter-spacing:.3px; color:#fff; background:var(--dim); white-space:nowrap; }
  .badge.official { background:var(--gold); } .badge.data { background:#4b5563; } .badge.translated { background:#7c3aed; }
  .trnote { display:flex; gap:10px; align-items:flex-start; background:var(--card2); border:1px solid var(--line); border-left:3px solid #7c3aed; border-radius:8px; padding:9px 12px; margin:0 0 12px; font-size:12px; color:var(--dim); line-height:1.6; }
  .trnote b { color:var(--fg); }
  .trnote .tag { flex:none; background:var(--purple); color:#fff; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:700; }
  .badge.live { background:#1758a8; } .badge.ptr { background:#6d28d9; }
  .badge.sub { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .row .heroes { display:flex; flex-wrap:wrap; gap:3px; margin-top:8px; align-items:center; }
  .row .heroes img, .pimg { width:26px; height:26px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--card2); }
  .row .heroes .more { color:var(--dim); font-size:12px; margin-left:4px; }
  .row .meta { color:var(--dim); font-size:12px; margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }

  /* 영웅·전장 격자 */
  .grid-h { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .grid-h a { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 8px; text-decoration:none; color:inherit; font-size:13px; }
  .grid-h a:hover { border-color:var(--gold-line); }
  .grid-h a img { width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none; background:var(--card2); }
  .grid-h a .n { color:var(--dim); font-size:11px; margin-left:auto; }
  .role { margin:18px 0 8px; font-size:15px; font-weight:700; color:var(--gold); }

  /* 상세 */
  .back { display:inline-block; margin-bottom:10px; }
  .tabs { display:flex; gap:6px; margin:14px 0 0; border-bottom:1px solid var(--line); }
  .tabs button { border-radius:8px 8px 0 0; border-bottom:none; }
  .tabs button.on { background:var(--card); color:var(--gold); border-color:var(--line); border-bottom:1px solid var(--card); margin-bottom:-1px; }
  .tabs button[disabled] { opacity:.45; cursor:default; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:0 12px 12px 12px; padding:16px 18px; }
  .panel.solo { border-radius:12px; }
  .jump { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .jump a { font-size:12px; border:1px solid var(--line); border-radius:99px; padding:3px 9px 3px 4px; text-decoration:none; color:var(--fg); background:var(--card2); display:inline-flex; align-items:center; gap:5px; }
  .jump a img { width:20px; height:20px; border-radius:50%; object-fit:cover; }
  .jump a.on { border-color:var(--gold-line); color:var(--gold); }
  .official h2, .official h3 { border-left:4px solid var(--gold-line); padding-left:10px; margin:22px 0 8px; font-size:18px; }
  .official h3 { font-size:16px; border-left-color:var(--line); }
  .official h4 { margin:18px 0 6px; font-size:16px; color:var(--purple); }
  .official ul { padding-left:20px; margin:4px 0; } .official li { margin:2px 0; }
  .official img { max-width:100%; height:auto; border-radius:8px; }
  .official blockquote { margin:8px 0; padding:8px 12px; background:var(--card2); border-left:3px solid var(--gold-line); border-radius:6px; font-size:13px; }
  .official table { border-collapse:collapse; font-size:12px; } .official td, .official th { border:1px solid var(--line); padding:2px 6px; }
  .official .pn-new { color:var(--new); } .official s { color:var(--del); }
  .official .pn-h { color:var(--purple); font-weight:700; } .official .pn-name { color:var(--blue); font-weight:700; }
  .hero-sec { border:1px solid var(--line); border-radius:10px; margin:10px 0; background:var(--card); }
  .hero-sec > summary { cursor:pointer; padding:8px 12px; display:flex; align-items:center; gap:8px; font-weight:700; list-style:none; }
  .hero-sec > summary::-webkit-details-marker { display:none; }
  .hero-sec > summary img { width:28px; height:28px; border-radius:50%; object-fit:cover; }
  .hero-sec > summary .n { color:var(--dim); font-weight:400; font-size:12px; margin-left:auto; }
  .hero-sec .body { padding:4px 14px 12px; }
  .chg { padding:6px 0; border-top:1px dashed var(--line); }
  .chg:first-child { border-top:none; }
  .chg .hd { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chg .hd .nm { font-weight:700; color:var(--blue); }
  .chg .hd .lv { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:0 5px; }
  .chg .hd .tp { font-size:11px; padding:1px 6px; border-radius:6px; background:var(--card2); color:var(--dim); }
  .chg .hd .tp.add { background:var(--ins-bg); color:var(--ins); } .chg .hd .tp.rm { background:var(--del-bg); color:var(--del); }
  .chg .f { margin:3px 0 0 8px; font-size:13px; white-space:pre-wrap; }
  .chg .f .k { color:var(--dim); font-size:12px; margin-right:6px; }
  del { background:var(--del-bg); color:var(--del); text-decoration:line-through; border-radius:3px; padding:0 2px; }
  ins { background:var(--ins-bg); color:var(--ins); text-decoration:none; border-radius:3px; padding:0 2px; }
  .empty { color:var(--dim); padding:20px; text-align:center; }
  .src { margin-top:16px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); padding-top:10px; }
  .credits { margin-top:30px; font-size:12px; color:var(--dim); line-height:1.7; border-top:1px solid var(--line); padding-top:12px; }
  .credits h4 { margin:0 0 6px; font-size:12px; color:var(--fg); font-weight:700; }
  .credits dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:3px 10px; }
  .credits dt { color:var(--fg); white-space:nowrap; }
  .credits dd { margin:0; }
  .credits .warn { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  @media (max-width:600px) { .credits dl { grid-template-columns:1fr; gap:0 0; } .credits dt { margin-top:6px; } }

  /* 이력 페이지 */
  .hist { border-left:2px solid var(--line); margin-left:10px; padding-left:16px; }
  .hist .ent { position:relative; margin:0 0 18px; }
  .hist .ent::before { content:''; position:absolute; left:-23px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--gold-line); border:2px solid var(--bg); }
  .hist .ent h3 { margin:0 0 6px; font-size:15px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hist .ent h3 a { text-decoration:none; color:inherit; } .hist .ent h3 a:hover { color:var(--gold); }
  .hist .ent .sec { font-size:12px; color:var(--dim); margin:8px 0 2px; }
  .hist .ent .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; }
  .hist .ent .box + .box { margin-top:8px; }
  .hist .ent .box .lab { font-size:12px; color:var(--gold); font-weight:700; margin-bottom:4px; }
  .hero-head { display:flex; align-items:center; gap:14px; margin:6px 0 14px; }
  .hero-head img { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--gold-line); }
  .hero-head h2 { margin:0; font-size:24px; } .hero-head .d { color:var(--dim); font-size:13px; }
  @media (max-width:600px) { .wrap { padding:16px 12px 50px; } .panel { padding:12px; } .row { padding:10px; } h1 { font-size:24px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<script src="../shared/scrap.js" defer></script>
<script>
(function () {
  const DATA = '../data/patchnotes/';
  const PORTRAIT = 'https://sin0nis.github.io/images/heroportraits/';
  const KIND = { live: '라이브', balance: '밸런스', ptr: 'PTR', hotfix: '핫픽스', patch: '패치', data: '데이터' };
  const ROLE = { Tank: '전사', Bruiser: '투사', Healer: '치유사', Support: '지원가', 'Melee Assassin': '근접 암살자', 'Ranged Assassin': '원거리 암살자' };
  const ROLE_ORDER = ['Tank', 'Bruiser', 'Healer', 'Support', 'Melee Assassin', 'Ranged Assassin'];
  const roleIdx = id => { const i = ROLE_ORDER.indexOf((HEROES[id] || {}).role); return i < 0 ? 99 : i; };
  const sortHeroes = ids => [...ids].sort((a, b) => roleIdx(a) - roleIdx(b) || heroName(a).localeCompare(heroName(b), 'ko'));
  const channelOf = r => (r.kind === 'ptr' || r.isPtr) ? 'ptr' : 'live';
  const sourceOf = r => r.translated ? 'translated' : r.official ? 'official' : 'data';
  const CH = { live: '라이브', ptr: '테스트 서버' }, SRC = { official: '공식 한글', translated: 'Claude 번역', data: '데이터' };
  const badges = r => `<span class="badge ${sourceOf(r)}">${SRC[sourceOf(r)]}</span><span class="badge ${channelOf(r)}">${CH[channelOf(r)]}</span>${(r.kind === 'balance' || r.kind === 'hotfix') ? `<span class="badge sub">${KIND[r.kind]}</span>` : ''}`;
  const app = document.getElementById('app');
  let INDEX = null, HEROES = {}, BGS = {};
  const cache = {};

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const q = () => new URLSearchParams(location.search);
  const heroName = id => (HEROES[id] || {}).name || id;
  const heroImg = id => { const p = (HEROES[id] || {}).portrait; return p ? `<img src="${PORTRAIT}${p}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''; };
  const bgName = s => BGS[s] || s;
  const markDiff = s => esc(s).replace(/\[\[-([\s\S]*?)-\]\]/g, '<del>$1</del>').replace(/\{\{\+([\s\S]*?)\+\}\}/g, '<ins>$1</ins>');
  const patchKey = r => r.date + (r.build ? '&b=' + r.build : '');

  async function getJSON(path) {
    if (cache[path]) return cache[path];
    const r = await fetch(DATA + path);
    if (!r.ok) throw new Error(path + ' ' + r.status);
    return (cache[path] = await r.json());
  }
  function go(params, push = true) {
    const u = new URL(location.href); u.search = '';
    Object.entries(params).forEach(([k, v]) => { if (v != null && v !== '' && !(Array.isArray(v) && !v.length)) u.searchParams.set(k, Array.isArray(v) ? v.join(',') : v); });
    push ? history.pushState(null, '', u) : history.replaceState(null, '', u);
    render();
  }
  window.addEventListener('popstate', render);

  function headHTML(view) {
    const tab = (k, label, href) => `<a href="${href}" class="${view === k ? 'on' : ''}">${label}</a>`;
    return `<div class="head"><h1>패치 <span class="s">기록</span><span class="en">Patch Note History</span></h1></div>
      <p class="sub">블리자드 <b>공식 한글</b> 패치 노트(2017년 1월~)를 그대로 싣고, 한국어판이 없는 회차는 영어 원문을 <b>Claude 가 번역</b>해 채웠습니다(2016년 9월~). 여기에 게임 파일에서 뽑은 <b>데이터 변경점</b>(2019년 10월~)을 함께 봅니다. 주소를 복사하면 그 화면 그대로 공유됩니다.</p>
      <div class="nav">${tab('list', '패치 목록', '?')}${tab('heroes', '영웅별 이력', '?view=heroes')}${tab('bgs', '전장별 이력', '?view=bgs')}</div>`;
  }

  // ---------- 목록 ----------
  function renderList() {
    const p = q();
    const ch = p.get('ch') || '', src = p.get('src') || '';
    const heroes = (p.get('hero') || '').split(',').filter(Boolean);
    const bgs = (p.get('bg') || '').split(',').filter(Boolean);
    const text = (p.get('q') || '').trim();
    let rows = INDEX;
    if (ch) rows = rows.filter(r => channelOf(r) === ch);
    if (src) rows = rows.filter(r => sourceOf(r) === src);
    if (heroes.length) rows = rows.filter(r => heroes.every(h => r.heroes.includes(h)));
    if (bgs.length) rows = rows.filter(r => bgs.every(b => r.battlegrounds.includes(b)));
    if (text) rows = rows.filter(r => (r.title + ' ' + (r.version || '') + ' ' + r.heroes.map(heroName).join(' ')).includes(text));

    const chBtns = ['', 'live', 'ptr'].map(k => `<button data-ch="${k}" class="${k === ch ? 'on' : ''}">${k ? CH[k] : '전체'}</button>`).join('');
    const SRCLBL = { official: '공식 한글', translated: 'Claude 번역', data: '데이터' };
    const srcBtns = ['', 'official', 'translated', 'data'].map(k => `<button data-src="${k}" class="${k === src ? 'on' : ''}">${k ? SRCLBL[k] : '전체'}</button>`).join('');
    const heroChips = heroes.map(h => `<span class="chip" data-rm-hero="${h}">${heroImg(h)}${esc(heroName(h))}<span class="x">×</span></span>`).join('');
    const bgChips = bgs.map(b => `<span class="chip" data-rm-bg="${b}">${esc(bgName(b))}<span class="x">×</span></span>`).join('');
    const bgOpts = Object.keys(BGS).filter(b => !bgs.includes(b)).map(b => `<option value="${b}">${esc(bgName(b))}</option>`).join('');

    app.innerHTML = headHTML('list') + `
      <input type="search" id="q" placeholder="제목·버전·영웅 검색" value="${esc(text)}">
      <div class="filters"><div class="grp"><span class="lbl">채널</span>${chBtns}</div><div class="grp"><span class="lbl">출처</span>${srcBtns}</div></div>
      <div class="filters">
        <div class="grp"><span class="lbl">영웅</span>${heroChips}<span class="picker"><button id="heroPick">+ 영웅</button><div class="menu" id="heroMenu" hidden></div></span></div>
        <div class="grp"><span class="lbl">전장</span>${bgChips}<select id="bgPick" class="btn"><option value="">+ 전장</option>${bgOpts}</select></div>
        ${(ch || src || heroes.length || bgs.length || text) ? '<button id="clear">필터 지우기</button>' : ''}
      </div>
      <div class="stat">${rows.length}건 / 전체 ${INDEX.length}건 · 공식 한글 ${INDEX.filter(r => r.official && !r.translated).length}건(2017년 1월~) · Claude 번역 ${INDEX.filter(r => r.translated).length}건(공식 한글판 없는 회차) · 데이터만 ${INDEX.filter(r => !r.official).length}건(게임 파일 비교)</div>
      <div class="list">${rows.map(rowHTML).join('') || '<div class="empty">조건에 맞는 패치가 없습니다.</div>'}</div>
      ${creditsHTML()}`;

    app.querySelector('#q').addEventListener('change', e => go({ ...cur(), q: e.target.value }));
    app.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => go({ ...cur(), ch: b.dataset.ch }));
    app.querySelectorAll('[data-src]').forEach(b => b.onclick = () => go({ ...cur(), src: b.dataset.src }));
    app.querySelectorAll('[data-rm-hero]').forEach(c => c.onclick = () => go({ ...cur(), hero: heroes.filter(h => h !== c.dataset.rmHero) }));
    app.querySelectorAll('[data-rm-bg]').forEach(c => c.onclick = () => go({ ...cur(), bg: bgs.filter(b => b !== c.dataset.rmBg) }));
    app.querySelector('#bgPick').onchange = e => { if (e.target.value) go({ ...cur(), bg: bgs.concat(e.target.value) }); };
    const clear = app.querySelector('#clear'); if (clear) clear.onclick = () => go({});
    setupHeroPicker(heroes);
  }
  function cur() { const p = q(); return { ch: p.get('ch'), src: p.get('src'), hero: p.get('hero'), bg: p.get('bg'), q: p.get('q') }; }

  function setupHeroPicker(selected) {
    const btn = app.querySelector('#heroPick'), menu = app.querySelector('#heroMenu');
    const ids = Object.keys(HEROES).filter(h => HEROES[h].portrait && !selected.includes(h)).sort((a, b) => heroName(a).localeCompare(heroName(b), 'ko'));
    const draw = f => menu.innerHTML = `<input type="search" placeholder="영웅 이름" value="${esc(f)}"><div class="grid">${ids.filter(h => !f || heroName(h).includes(f) || h.toLowerCase().includes(f.toLowerCase())).map(h => `<button data-h="${h}">${heroImg(h)}${esc(heroName(h))}</button>`).join('')}</div>`;
    btn.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; if (!menu.hidden) { draw(''); menu.querySelector('input').focus(); } };
    menu.onclick = e => { e.stopPropagation(); const b = e.target.closest('[data-h]'); if (b) go({ ...cur(), hero: selected.concat(b.dataset.h) }); };
    menu.oninput = e => { const v = e.target.value; draw(v); const i = menu.querySelector('input'); i.focus(); i.setSelectionRange(v.length, v.length); };
    document.addEventListener('click', () => { menu.hidden = true; }, { once: true });
  }

  function rowHTML(r) {
    const hs = sortHeroes(r.heroes).slice(0, 14).map(h => `<span title="${esc(heroName(h))}">${heroImg(h)}</span>`).join('');
    const more = r.heroes.length > 14 ? `<span class="more">+${r.heroes.length - 14}</span>` : '';
    const meta = [];
    if (r.version) meta.push(`빌드 ${r.version}`);
    if (r.summary) meta.push(`데이터 변경 영웅 ${r.summary.heroes} · 항목 ${r.summary.changes}`);
    if (r.battlegrounds.length) meta.push('전장: ' + r.battlegrounds.map(bgName).join(', '));
    if (!r.official) meta.push('공식 노트 없음 — 데이터에서만 확인된 변경');
    if (r.translated) meta.push('한글 공식판 없음 — 영문 원문을 Claude 가 번역');
    if (r.official && !r.diff) meta.push('데이터 diff 없음');
    return `<a class="row" href="?v=${patchKey(r)}">
      <div class="top"><span class="date">${r.date}</span>${badges(r)}<span class="title">${esc(r.title)}</span></div>
      ${hs ? `<div class="heroes">${hs}${more}</div>` : ''}
      <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div></a>`;
  }

  // ---------- 상세 ----------
  async function renderDetail(date) {
    const p = q();
    const build = p.get('b');
    const row = INDEX.find(r => r.date === date && (!build || String(r.build) === build)) || INDEX.find(r => r.date === date);
    if (!row) { app.innerHTML = headHTML('list') + `<div class="empty">${esc(date)} 패치를 찾을 수 없습니다.</div>`; return; }
    const tab = p.get('tab') || (row.official ? 'official' : 'data');
    const focus = p.get('hero') || '';
    let official = null, diff = null, enDoc = null;
    try { if (row.official) official = await getJSON(row.official); } catch (e) { console.warn(e); }
    try { if (row.diff) diff = await getJSON(row.diff); } catch (e) { console.warn(e); }
    if (tab === 'en' && row.en) { try { enDoc = await getJSON(row.en); } catch (e) { console.warn(e); } }
    const tabs = `<div class="tabs">
      <button data-tab="official" class="${tab === 'official' ? 'on' : ''}" ${official ? '' : 'disabled'}>${row.translated ? '한국어 (Claude 번역)' : '공식 패치 노트'}</button>
      <button data-tab="data" class="${tab === 'data' ? 'on' : ''}" ${diff ? '' : 'disabled'}>데이터 변경점${diff ? ` (${diff.summary.heroes}영웅 · ${diff.summary.changes})` : ''}</button>
      ${row.en ? `<button data-tab="en" class="${tab === 'en' ? 'on' : ''}">영어 원문</button>` : ''}</div>`;
    app.innerHTML = headHTML('list') + `<a id="pn-back" href="?${backParams()}">← 목록</a>
      <h2 style="margin:4px 0;font-size:22px">${badges(row)} ${esc(row.title)}</h2>
      <p class="sub">${row.date}${row.version ? ` · 빌드 ${row.version}` : ''}${row.buildDate && row.buildDate !== row.date ? ` (데이터 추출일 ${row.buildDate})` : ''}</p>
      ${tabs}<div class="panel">${tab === 'en' ? officialHTML(enDoc, focus, row) : tab === 'official' ? officialHTML(official, focus, row) : dataHTML(diff, focus)}</div>${creditsHTML()}`;
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go({ v: date, b: build, tab: b.dataset.tab, hero: focus }));
    app.querySelectorAll('[data-focus]').forEach(a => a.onclick = e => { e.preventDefault(); go({ v: date, b: build, tab, hero: a.dataset.focus === focus ? '' : a.dataset.focus }); });
  }
  function backParams() { try { return sessionStorage.getItem('patchnotes.list') || ''; } catch (e) { return ''; } }

  function trNote(doc, row) {
    if (!doc || doc.lang === 'en') return row && row.translated ? `<div class="trnote"><b class="tag">원문</b> <span>블리자드가 공개한 <b>영어 원문</b>입니다. 한국어는 위 탭에서 보세요.</span></div>` : '';
    const t = doc.translated;
    if (!t) return '';
    const miss = t.untranslated ? ` 원문 그대로 남은 문장 ${t.untranslated}개가 있습니다.` : '';
    return `<div class="trnote"><b class="tag">번역</b> <span><b>이 노트는 한국어 공식판이 없습니다.</b> 블리자드 영어 원문을 <b>${esc(t.by || 'Claude')}</b> 가 번역했습니다${t.at ? ` (${esc(t.at)})` : ''}. 공식 번역이 아니므로 표현이 다를 수 있습니다. 영웅·기술·특성 이름은 ${esc(t.glossary || '공식 게임 텍스트')}에 맞췄습니다.${miss} 원문은 위 <b>영어 원문</b> 탭과 아래 출처 링크에서 확인하세요.</span></div>`;
  }
  function officialHTML(doc, focus, row) {
    if (!doc) return `<div class="empty">${row && row.en && q().get('tab') === 'en' ? '영어 원문을 불러오지 못했습니다. 아래 출처 링크에서 확인하세요.' : '이 회차는 글 형태의 패치 노트가 없습니다. 데이터 변경점 탭을 보세요.'}</div>`;
    const heroIds = sortHeroes([...new Set(doc.sections.flatMap(s => (s.heroes || []).map(h => h.heroId).concat((s.items || []).map(i => i.heroId))).filter(Boolean))]);
    const jump = heroIds.length ? `<div class="jump">${heroIds.map(h => `<a href="#" data-focus="${h}" class="${h === focus ? 'on' : ''}">${heroImg(h)}${esc(heroName(h))}</a>`).join('')}</div>` : '';
    let body = '';
    for (const s of doc.sections) {
      if (focus) {
        const hs = (s.heroes || []).filter(h => (h.heroIds || [h.heroId]).includes(focus));
        const its = (s.items || []).filter(i => (i.heroIds || [i.heroId]).includes(focus));
        if (!hs.length && !its.length) continue;
        body += `<h2>${esc(s.name)}</h2>` + hs.map(h => `<h4>${esc(h.name)}</h4>${h.html}`).join('') + its.map(i => `<ul><li>${i.html}</li></ul>`).join('');
      } else {
        body += (s.key === 'intro' ? '' : `<h2>${esc(s.name)}</h2>`) + s.html;
      }
    }
    const focusLink = focus ? `<p class="sub"><a href="?view=hero&id=${focus}">${esc(heroName(focus))} 전체 이력 보기 →</a></p>` : '';
    return `${trNote(doc, row)}${jump}${focusLink}<div class="official">${body || '<div class="empty">이 영웅 항목이 없습니다.</div>'}</div>
      <div class="src">출처: <a href="${esc(doc.source)}" target="_blank" rel="noopener">${esc(doc.titleEn || doc.title)}</a> — Blizzard Entertainment. 원문 전문은 링크에서 확인하세요.</div>`;
  }

  function dataHTML(d, focus) {
    if (!d) return '<div class="empty">이 패치와 짝지어진 데이터 diff 가 없습니다.</div>';
    const ids = sortHeroes(Object.keys(d.heroes));
    const jump = `<div class="jump">${ids.map(h => `<a href="#" data-focus="${h}" class="${h === focus ? 'on' : ''}">${heroImg(h)}${esc(heroName(h))}</a>`).join('')}</div>`;
    const shown = focus ? ids.filter(h => h === focus) : ids;
    const secs = shown.map(h => {
      const x = d.heroes[h];
      const n = x.added ? '신규 영웅' : x.removed ? '제거' : `${x.changes.length}개 변경`;
      return `<details class="hero-sec" ${focus || shown.length <= 6 ? 'open' : ''}><summary>${heroImg(h)}${esc(heroName(h))}<span class="n">${n}</span></summary><div class="body">${x.changes.map(changeHTML).join('') || '<div class="empty">—</div>'}</div></details>`;
    }).join('');
    const focusLink = focus ? `<p class="sub"><a href="?view=hero&id=${focus}">${esc(heroName(focus))} 전체 이력 보기 →</a></p>` : '';
    return `<p class="sub">빌드 ${esc(d.from)} → ${esc(d.to)} 사이의 영웅 데이터 변화입니다. 괄호 안은 그 빌드가 게임 데이터 저장소에 올라온 날(${d.fromDate} → ${d.toDate})이라 패치 날짜와 며칠 다를 수 있습니다${d.toPtr ? '. 테스트 서버 빌드는 직전 라이브 빌드와 비교합니다' : ''}. 툴팁은 원문 마크업을 걷어낸 평문이며 <del>삭제</del> / <ins>추가</ins> 로 표시됩니다.</p>${jump}${focusLink}${secs || '<div class="empty">변경 없음</div>'}`;
  }

  const FIELD = { name: '이름', full: '설명', cooldown: '재사용 대기시간', energy: '자원', life: '생명력', quest: '퀘스트', level: '레벨' };
  function changeHTML(c) {
    const lv = c.level ? `<span class="lv">${c.level}레벨</span>` : '';
    const abt = c.abilityType ? `<span class="lv">${esc(c.abilityType)}</span>` : '';
    switch (c.type) {
      case 'stat': return `<div class="chg"><div class="hd"><span class="nm">능력치</span><span class="tp">${esc(c.field)}</span></div><div class="f"><del>${esc(fmt(c.before))}</del> → <ins>${esc(fmt(c.after))}</ins></div></div>`;

  // 카드 하나(기술·특성)의 변화 요약: 수치·레벨·판(설명 재작성)·생겨난/사라진 시점
  // 저장소가 처음 만들어질 때 같은 날짜로 몰아 올린 빌드들 — 이 구간에 처음 보이면 '원래 있던' 것이다

    groups.push({ name: '기술', rows: cur.abilities });
    [1, 4, 7, 10, 13, 16, 20].forEach(l => { const rs = cur.talents.filter(t => t.level === l); if (rs.length) groups.push({ name: `${l}레벨 특성`, rows: rs }); });
    if (gone.length) groups.push({ name: '삭제된 특성·기술', rows: gone.sort((a, b) => (a.level || 0) - (b.level || 0)) });
    const head = `<tr><th class="rowh">항목 \\ 패치</th>${cols.map(e => `<th class="col ${e.isPtr ? 'ptr' : ''}" title="${esc(e.title)}"><span>${e.date}${e.isPtr ? ' PTR' : ''}</span></th>`).join('')}</tr>`;
    const rowsHTML = groups.map(g => `<tr class="grp"><th colspan="${cols.length + 1}">${esc(g.name)}</th></tr>` + g.rows.map(r => {
      const cells = cols.map((e, ci) => { const m = (marks[r.id] || {})[ci]; return `<td class="c">${m ? `<span class="m ${m.cls}" title="${esc(m.title)}" data-go="e-${e.date}-${e.build || 0}">${m.sym}</span>` : ''}</td>`; }).join('');
      const icon = r.icon ? `<img src="${ICON}${r.icon}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';
      const lv = r.gone && r.level ? `<span class="lv">${r.level}레벨</span>` : (r.type && !r.level ? `<span class="lv">${esc(r.type)}</span>` : '');
      return `<tr><th class="rowh ${r.gone ? 'gone' : ''}" title="${esc(r.name)}">${icon}${esc(r.name)}${lv}</th>${cells}</tr>`;
    }).join('')).join('');
    return `<h3 style="margin:6px 0 6px;font-size:16px">특성 변천도 <span style="font-weight:400;font-size:12px;color:var(--dim)">현재 기준 ${esc(cur.build)} · 데이터 diff 가 있는 패치 ${cols.length}개 (2019년 10월~)</span></h3>
      <div class="chart-wrap"><table class="chart"><thead>${head}</thead><tbody>${rowsHTML}</tbody></table></div>
      <div class="legend"><span class="m add">+</span> 신규 <span class="m rm">×</span> 삭제 <span class="m mv">↑↓</span> 레벨 이동 <span class="m chg">●</span> 수치·설명 변경 · 칸을 누르면 아래 해당 패치로 이동, 올리면 요약</div>`;
  }

  // ---------- 전장 목록 / 이력 ----------
  function renderBgs() {
    const count = {};
    INDEX.forEach(r => r.battlegrounds.forEach(b => { count[b] = (count[b] || 0) + 1; }));
    const ids = Object.keys(BGS).sort((a, b) => bgName(a).localeCompare(bgName(b), 'ko'));
    app.innerHTML = headHTML('bgs') + `<p class="sub">전장을 고르면 그 전장이 언급된 공식 노트 항목을 시간순으로 봅니다.</p>
      <div class="grid-h">${ids.map(b => count[b]
        ? `<a href="?view=bg&id=${b}"><span>${esc(bgName(b))}</span><span class="n">${count[b]}</span></a>`
        : `<a style="opacity:.5;cursor:default" title="이 전장은 패치 노트에 따로 언급된 적이 없습니다"><span>${esc(bgName(b))}</span><span class="n">0</span></a>`).join('')}</div>` + creditsHTML();
  }
  async function renderBg(id) {
    let doc = null;
    try { doc = await getJSON(`battlegrounds/${id}.json`); } catch (e) {}
    const entries = doc ? doc.entries : [];
    if (!doc) console.info('전장 기록 없음:', id);
    const body = entries.map(e => `<div class="ent"><h3><a href="?v=${e.date}${e.build ? '&b=' + e.build : ''}">${e.date}</a>${badges({ ...e, official: 1 })}<span style="font-weight:400;font-size:13px;color:var(--dim)">${esc(e.title)}</span></h3>
      ${e.translated ? `<div class="trnote" style="margin:0 0 8px"><b class="tag">번역</b> <span>한국어 공식판이 없어 영어 원문을 <b>${esc(e.translated.by || 'Claude')}</b> 가 번역한 내용입니다. <a href="?v=${e.date}${e.build ? '&b=' + e.build : ''}&tab=en">영어 원문 보기</a></span></div>` : ''}
      ${e.official.map(o => `<div class="box"><div class="lab">${e.translated ? 'Claude 번역' : '공식 한글 노트'} · ${esc(o.section)}</div><div class="official">${o.html}</div></div>`).join('')}</div>`).join('');
    app.innerHTML = headHTML('bgs') + `<a id="pn-back" href="?view=bgs">← 전장 목록</a><div class="hero-head"><div><h2>${esc(bgName(id))}</h2><div class="d">공식 노트 ${entries.length}건</div></div></div>
      <div class="hist">${body || '<div class="empty">이 전장은 패치 노트에 따로 언급된 적이 없습니다. 영웅 변경 안에 섞여 있을 수 있습니다.</div>'}</div>${creditsHTML()}`;
  }

  function creditsHTML() {
    return `<div class="credits"><h4>자료 출처와 수록 범위</h4><dl>
      <dt>공식 한글 노트</dt><dd>블리자드 뉴스 한국어판에서 모았습니다(2017년 1월~). 본문의 권리는 Blizzard Entertainment 에 있으며, 각 노트에 원문 링크를 둡니다.</dd>
      <dt>Claude 번역</dt><dd>한국어 공식판이 없는 회차만, 블리자드 <b>영어 원문</b>을 Claude 가 옮겼습니다(2016년 9월~). 공식 번역이 아니며 노트마다 고지·원문 링크·영어 원문 탭을 함께 둡니다.</dd>
      <dt>데이터 변경점</dt><dd>게임 파일에서 뽑은 수치 비교입니다. <a href="https://github.com/HeroesToolChest/heroes-data" target="_blank" rel="noopener">HeroesToolChest/heroes-data</a> · <a href="https://github.com/HeroesToolChest/heroes-data2" target="_blank" rel="noopener">heroes-data2</a> (MIT), 2019년 10월(2.47.2) 이후 빌드만 있습니다.</dd>
      <dt>구성 참고</dt><dd>영문 아카이브 <a href="https://nexus-patch-notes.github.io/" target="_blank" rel="noopener">Nexus Patch Notes</a> 의 구성(패치 목록·영웅별 이력)을 참고했습니다. 그 사이트의 글과 코드는 가져오지 않았고, 이 페이지의 내용은 블리자드 원문과 게임 데이터에서 직접 만들었습니다.</dd>
      </dl><div class="warn">블리자드 뉴스 아카이브에 남아 있는 가장 오래된 글이 2016년 9월이라, 2014~2016년 상반기 패치는 싣지 못했습니다.<br>
      이 사이트는 <b>Blizzard Entertainment 와 아무 관계가 없는 개인 팬 아카이브</b>입니다. Heroes of the Storm 및 관련 자료의 권리는 Blizzard Entertainment 에 있으며, 이 사이트는 어떤 수익도 내지 않고 권리자의 요청이 있으면 즉시 내리겠습니다.</div></div>`;
  }

  async function render() {
    const p = q();
    window.scrollTo(0, 0);
    if (p.get('v')) return renderDetail(p.get('v'));
    const view = p.get('view') || 'list';
    if (view === 'heroes') return renderHeroes();
    if (view === 'hero') return renderHero(p.get('id'));
    if (view === 'bgs') return renderBgs();
    if (view === 'bg') return renderBg(p.get('id'));
    try { sessionStorage.setItem('patchnotes.list', p.toString()); } catch (e) {}
    renderList();
  }

  (async function init() {
    try {
      [INDEX, HEROES, BGS] = await Promise.all([getJSON('index.json'), getJSON('heroes.json'), getJSON('battlegrounds.json')]);
      render();
    } catch (e) {
      app.innerHTML = `<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`;
    }
  })();
})();
</script>
</body>
</html>
