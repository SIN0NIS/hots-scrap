<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="180" fill="#f4efe7"/>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4f463d"/>
      <stop offset="45%" stop-color="#332e29"/>
      <stop offset="100%" stop-color="#221d1a"/>
    </linearGradient>

    <filter id="rust" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" result="rustcol"
        values="0.9 0.4 0 0 0.12
                0.45 0.25 0 0 0.06
                0.15 0.1 0 0 0.03
                0 0 0 1.1 -0.60"/>
      <feComposite in="rustcol" in2="SourceGraphic" operator="in" result="clipped"/>
      <feBlend in="clipped" in2="SourceGraphic" mode="normal" result="blended"/>
      <feTurbulence type="fractalNoise" baseFrequency="3.2" numOctaves="3" seed="4" result="grain"/>
      <feColorMatrix in="grain" type="matrix" result="graina"
        values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.4  0 0 0 0.35 0"/>
      <feComposite in="graina" in2="SourceGraphic" operator="in" result="grainclip"/>
      <feBlend in="grainclip" in2="blended" mode="overlay"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>

    <g id="screw">
      <path d="M -80.0,-96.0 L -22.0,-96.0 L 28.0,-46.0 L 41.0,-29.0 L 54.0,-46.0 L 67.0,-29.0 L 80.0,-46.0 L 93.0,-29.0 L 106.0,-46.0 L 119.0,-29.0 L 132.0,-46.0 L 145.0,-29.0 L 158.0,-46.0 L 171.0,-29.0 L 184.0,-46.0 L 197.0,-29.0 L 210.0,-46.0 L 223.0,-29.0 L 236.0,-46.0 L 249.0,-29.0 L 262.0,-46.0 L 276.0,-38.0 L 340.0,0 L 276.0,38.0 L 262.0,46.0 L 249.0,29.0 L 236.0,46.0 L 223.0,29.0 L 210.0,46.0 L 197.0,29.0 L 184.0,46.0 L 171.0,29.0 L 158.0,46.0 L 145.0,29.0 L 132.0,46.0 L 119.0,29.0 L 106.0,46.0 L 93.0,29.0 L 80.0,46.0 L 67.0,29.0 L 54.0,46.0 L 41.0,29.0 L 28.0,46.0 L -22.0,96.0 L -80.0,96.0 Z" fill="url(#metal)"/>
      <path d="M -22.0,-90.0 L -22.0,90.0"
            stroke="#0f0c0a" stroke-opacity="0.45" stroke-width="6" fill="none"/>
      <path d="M -64.0,-78.0 L -64.0,78.0"
            stroke="#0f0c0a" stroke-opacity="0.30" stroke-width="5" fill="none"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <g filter="url(#rust)">
      <path d="M 970,500 L 735,907 L 265,907 L 30,500 L 265,93 L 735,93 Z"
            fill="none" stroke="url(#metal)" stroke-width="34" stroke-linejoin="round"/>
      <path d="M 908,500 L 704,853 L 296,853 L 92,500 L 296,147 L 704,147 Z"
            fill="none" stroke="url(#metal)" stroke-width="7" stroke-linejoin="round"/>

      <g transform="rotate(0 500 500)">
        <g transform="translate(500,500) rotate(-38) translate(-215,-140) scale(0.78)"><use href="#screw"/></g>
      </g>
      <g transform="rotate(120 500 500)">
        <g transform="translate(500,500) rotate(-38) translate(-215,-140) scale(0.78)"><use href="#screw"/></g>
      </g>
      <g transform="rotate(240 500 500)">
        <g transform="translate(500,500) rotate(-38) translate(-215,-140) scale(0.78)"><use href="#screw"/></g>
      </g>
    </g>
  </g>
</svg>
