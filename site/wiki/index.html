<!doctype html>
<html lang="ko" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HotS 자료 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 위 진남색 바(브랜드·세 갈래·검색) / 왼쪽 문서 나무 / 가운데 문서(오른쪽에 정보 상자, 위에 목차).
   색은 HotS Scrap 공통 토큰(--scrap-*)과 같은 값 — 같은 사이트 식구처럼 보이게. */
:root {
  --bg:#f3f6fb; --card:#ffffff; --card2:#eef2f8; --line:#cdd9ea; --fg:#122036; --dim:#5d6d84;
  --blue:#1758a8; --blue-soft:#e8f0fb; --gold:#8a6414; --gold-line:#d7b45c; --bar:#0b1526; --bar-fg:#eaf1fa;
  --hit:#8a6414; --ok:#26693a; --warn:#93500f; --bad:#b03a30; --order:#2463c4; --chaos:#c0392b;
  --foe:#c0392b; --ally:#1758a8; --both:#7a3fb0; --wiki:#7a3fb0;
  --f-body:"Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --fg:#eaf1fa; --dim:#8fa2bd;
  --blue:#5aa8ff; --blue-soft:#132b4d; --gold:#e8c268; --gold-line:#8a6d2f; --bar:#060d19; --bar-fg:#eaf1fa;
  --hit:#f0c46a; --ok:#5fcb84; --warn:#f0a050; --bad:#ff7a6e; --order:#66a3ff; --chaos:#ff7468;
  --foe:#ff7b6b; --ally:#5aa8ff; --both:#c79cf0; --wiki:#c79cf0; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0b1526; --card:#101f38; --card2:#152747; --line:#233a5c; --fg:#eaf1fa; --dim:#8fa2bd;
  --blue:#5aa8ff; --blue-soft:#132b4d; --gold:#e8c268; --gold-line:#8a6d2f; --bar:#060d19; --bar-fg:#eaf1fa;
  --hit:#f0c46a; --ok:#5fcb84; --warn:#f0a050; --bad:#ff7a6e; --order:#66a3ff; --chaos:#ff7468;
  --foe:#ff7b6b; --ally:#5aa8ff; --both:#c79cf0; --wiki:#c79cf0; color-scheme:dark }

html { scroll-padding-top: 70px; }
body { background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.7; word-break:keep-all; }
a { color:var(--blue); text-decoration:none; }
a:hover { text-decoration:underline; }
button { font:inherit; }
:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

/* ── 위 바 ── */
#bar { position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bar); color:var(--bar-fg); }
#bar .in { max-width:1320px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; }
#brand { display:flex; align-items:baseline; gap:8px; color:var(--bar-fg); font-weight:900; font-size:17px; letter-spacing:.3px; white-space:nowrap; }
#brand small { font-weight:500; font-size:11px; opacity:.7; letter-spacing:0; }
#brand .lock { font-size:10.5px; font-weight:700; border:1px solid rgba(255,255,255,.35); border-radius:99px; padding:0 7px; opacity:.85; }
#nav { display:flex; gap:2px; }
#nav a { color:var(--bar-fg); opacity:.8; padding:5px 10px; border-radius:99px; font-size:14px; white-space:nowrap; }
#nav a:hover { opacity:1; background:rgba(255,255,255,.1); text-decoration:none; }
#nav a.on { opacity:1; font-weight:700; background:rgba(255,255,255,.16); }
#sbox { position:relative; flex:1 1 160px; max-width:420px; margin-left:auto; }
@media (max-width:1100px) { #brand small, #brand .lock { display:none; } }
/* 폰 — 위 막대는 한 줄만(따라다니는 막대가 화면을 가리지 않게). 갈래 링크는 ☰ 서랍으로, 찾기는 🔍 로 연다 */
#sbtn { display:none; border:1px solid rgba(255,255,255,.25); background:transparent; color:var(--bar-fg); border-radius:8px; padding:3px 10px; cursor:pointer; margin-left:auto; }
#tree .tnav { display:none; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
#tree .tnav a { border:1px solid var(--line); border-radius:99px; padding:6px 12px; color:var(--fg); }
@media (max-width:700px) {
  #nav { display:none; }
  #sbtn { display:inline-flex; align-items:center; }
  #sbox { display:none; flex:1 1 100%; max-width:none; margin:0; }
  body.search-open #sbox { display:block; }
  #tree .tnav { display:flex; }
}
#q { width:100%; box-sizing:border-box; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:var(--bar-fg);
  border-radius:8px; padding:6px 10px; font:inherit; font-size:13.5px; }
#q::placeholder { color:rgba(234,241,250,.55); }
#sres { position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--card); color:var(--fg); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:0 10px 30px rgba(0,0,0,.25); max-height:60vh; overflow:auto; z-index:30; }
#sres a { display:flex; gap:8px; align-items:center; padding:6px 10px; color:var(--fg); border-bottom:1px solid var(--line); }
#sres a:last-child { border-bottom:0; }
#sres a.sel, #sres a:hover { background:var(--blue-soft); text-decoration:none; }
#sres .k { font-size:11px; color:var(--dim); white-space:nowrap; min-width:44px; }
#sres .sub { font-size:12px; color:var(--dim); margin-left:auto; text-align:right; }
#sres mark { background:none; color:var(--hit); font-weight:700; }
#theme { border:1px solid rgba(255,255,255,.25); background:transparent; color:var(--bar-fg); border-radius:99px; padding:3px 10px; cursor:pointer; font-size:12.5px; }
@media (any-pointer:coarse) {
  #sbtn { min-height:44px; }
  #nav a, #theme, #menu, .tchip button, .lnk, .bigbtn, .share, .sbar button, details > summary, .toc button { min-height:44px; display:inline-flex; align-items:center; }
  #tree .tnav a { min-height:44px; display:inline-flex; align-items:center; }
  #tree a, #side li button { min-height:44px; display:flex; align-items:center; }
}
#menu { border:1px solid rgba(255,255,255,.25); background:transparent; color:var(--bar-fg); border-radius:8px; padding:3px 10px; cursor:pointer; }

/* ── 몸 ── */
#wrap { max-width:1280px; margin:0 auto; padding-inline:16px; padding-block:18px 60px; display:grid; grid-template-columns:190px minmax(0,1fr); gap:24px; align-items:start; }
body.no-side #wrap { grid-template-columns:minmax(0,1fr); max-width:1080px; }
body.no-side #side { display:none; }
#side { position:sticky; top:calc(var(--hh, 60px) + 12px); max-height:calc(100vh - var(--hh, 60px) - 30px); overflow:auto; font-size:14px; }
#side .h { font-size:12px; font-weight:700; color:var(--dim); letter-spacing:.06em; margin:2px 0 6px 8px; }
#side ol { list-style:none; margin:0; padding:0; border-left:2px solid var(--line); }
#side li button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg); padding:5px 8px 5px 12px; margin-left:-2px; border-left:2px solid transparent; cursor:pointer; line-height:1.45; min-height:32px; }
#side li button:hover { color:var(--blue); }
#side li button.on { color:var(--blue); font-weight:700; border-left-color:var(--blue); }
#side .all { margin-top:12px; font-size:13px; }
@media (min-width:901px) { body:not(.no-side) #doc nav.toc { display:none; } }
#tree { position:fixed; z-index:60; top:0; bottom:0; left:0; width:min(320px, 86vw); overflow-y:auto; overflow-x:hidden; font-size:14.5px; background:var(--card); border-right:1px solid var(--line);
  box-shadow:6px 0 24px rgba(0,0,0,.2); transform:translateX(-105%); transition:transform .2s ease; visibility:hidden;
  padding:calc(12px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
body.tree-open #tree { transform:none; visibility:visible; }
#scrim { position:fixed; inset:0; z-index:55; background:rgba(4,10,20,.45); display:none; }
body.tree-open #scrim { display:block; }
#tree .th { display:flex; justify-content:space-between; align-items:center; font-weight:900; margin:0 0 8px; }
#tree .th button { border:1px solid var(--line); background:var(--card2); color:var(--fg); border-radius:8px; min-width:36px; min-height:32px; cursor:pointer; }
#tree details { margin-bottom:6px; }
#tree summary { cursor:pointer; font-weight:700; padding:3px 4px; list-style:none; display:flex; justify-content:space-between; }
#tree summary::-webkit-details-marker { display:none; }
#tree summary::after { content:"▸"; color:var(--dim); font-size:11px; }
#tree details[open] > summary::after { content:"▾"; }
#tree .g { font-size:11px; color:var(--dim); letter-spacing:.05em; padding:6px 4px 2px; }
#tree a { display:block; padding:5px 8px 5px 12px; color:var(--fg); border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#tree a:hover { background:var(--card2); text-decoration:none; }
#tree a.on { background:var(--blue-soft); color:var(--blue); font-weight:700; }
@media (max-width:900px) {
  #wrap { grid-template-columns:minmax(0,1fr); }
  #side { display:none; }
}
#doc { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 24px 28px; }
@media (max-width:600px) { #doc { padding:16px 14px 22px; } }
.crumb { font-size:13px; color:var(--dim); margin-bottom:4px; }
.crumb a { color:var(--dim); }
h1.title { font-size:30px; font-weight:900; margin:0 0 4px; line-height:1.25; text-wrap:balance; }
.lede { font-size:14.5px; color:var(--dim); margin:0 0 14px; }
.doc-head { border-bottom:2px solid var(--gold-line); padding-bottom:10px; margin-bottom:16px; }
h2.sec { font-size:21px; text-wrap:balance; font-weight:900; margin:26px 0 10px; padding-bottom:5px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:baseline; }
h2.sec .no { color:var(--blue); font-family:var(--f-mono); font-size:15px; }
h3.sub { font-size:15px; margin:16px 0 6px; }
p { margin:0 0 10px; }
#doc :is(p, .about, .lede, ul.plain, ol.steps, .rt, .rx, .summary, .desc, .stale) { max-width:44em; }
#doc :is(table, .tbl, .grid, .picks, .stg, .rules, .portal) p { max-width:none; }
.note { font-size:13.5px; color:var(--dim); }

/* 정보 상자 — 넓으면 오른쪽에 뜨고, 좁으면 위로 */
.info { float:right; width:290px; margin:0 0 14px 20px; border:1px solid var(--line); border-radius:var(--r); background:var(--card2); overflow:hidden; font-size:13px; }
.info .ih { background:var(--bar); color:var(--bar-fg); font-weight:900; text-align:center; padding:8px; font-size:15px; }
.info .pic { display:block; margin:10px auto 4px; width:96px; height:96px; border-radius:10px; border:2px solid var(--gold-line); background:var(--card); }
.info table { width:100%; border-collapse:collapse; }
.info th, .info td { padding:5px 10px; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
.info th { width:40%; color:var(--dim); font-weight:500; background:transparent; }
.info td { font-variant-numeric:tabular-nums; }
@media (max-width:760px) { .info { float:none; width:auto; margin:0 0 14px; } }

.toc { display:inline-block; min-width:220px; max-width:100%; border:1px solid var(--line); border-radius:var(--r); background:var(--card2); padding:8px 14px 10px; margin:0 0 6px; font-size:13px; }
.toc b { display:block; margin-bottom:4px; }
.toc ol { margin:0; padding-left:1.3em; }
.toc button { background:none; border:0; padding:0; color:var(--blue); cursor:pointer; text-align:left; }

.tbl { overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); margin:6px 0 12px; }
table.t { border-collapse:collapse; width:100%; font-size:13px; }
table.t th, table.t td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
table.t th { background:var(--card2); color:var(--dim); font-weight:500; font-size:12px; white-space:nowrap; }
table.t tr:last-child td { border-bottom:0; }
table.t td:first-child { min-width:5.5em; }
td.n, th.n { text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
td.src { font-family:var(--f-mono); font-size:11px; color:var(--dim); overflow-wrap:anywhere; }
.o { color:var(--order); } .c { color:var(--chaos); }

.ico { width:40px; height:40px; border-radius:6px; border:1px solid var(--line); background:var(--card2); flex:0 0 auto; }
.ico.sm { width:28px; height:28px; }
.ico.xs { width:18px; height:18px; border-radius:50%; }
.face { width:46px; height:46px; border-radius:8px; border:1px solid var(--line); background:var(--card2); }
.skill { display:grid; grid-template-columns:44px minmax(0,1fr); gap:4px 12px; padding:12px 0; border-bottom:1px dashed var(--line); }
.skill:last-child { border-bottom:0; }
.skill .nm { font-weight:700; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.key { font-family:var(--f-mono); font-size:11px; border:1px solid var(--gold-line); color:var(--gold); border-radius:4px; padding:0 5px; }
.meta { display:flex; flex-wrap:wrap; gap:2px 12px; font-size:12.5px; color:var(--dim); }
.meta b { color:var(--fg); font-family:var(--f-mono); font-weight:500; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.chip { font-size:12px; background:var(--card2); border:1px solid var(--line); border-radius:99px; padding:0 8px; }
.tier { display:grid; grid-template-columns:52px minmax(0,1fr); gap:10px; margin:10px 0; }
.tier .lv { text-align:center; font-weight:900; font-size:20px; color:var(--gold); line-height:1.1; padding-top:4px; }
.tier .lv small { display:block; font-size:10px; color:var(--dim); font-weight:500; }
.picks { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
.pick { display:grid; grid-template-columns:30px minmax(0,1fr); gap:2px 8px; border:1px solid var(--line); border-radius:var(--r); padding:8px; font-size:13px; background:var(--card); }
.pick .nm { font-weight:700; }
.pick .to { font-size:11px; color:var(--blue); }
.pick .ch { font-size:11.5px; color:var(--dim); grid-column:2; }
.pick details.more2 { grid-column:1 / -1; }
.pick:has(details.more2[open]) { grid-column:1 / -1; }
.pick .kv { font-size:12.5px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.tile { display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:var(--r); padding:6px 8px; background:var(--card); color:var(--fg); }
.tile:hover { border-color:var(--blue); text-decoration:none; }
.tile span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tile small { display:block; color:var(--dim); font-size:11px; }

/* 수치 통계 — 한눈에 카드 */
.stg { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:6px 0 10px; }
.stc { all:unset; box-sizing:border-box; border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:10px 12px; cursor:pointer; color:var(--fg); display:flex; flex-direction:column; gap:3px; min-width:0; }
.stc:hover, .stc:focus-visible { border-color:var(--blue); outline:none; box-shadow:0 0 0 2px var(--blue-soft); }
.stc .nm { font-weight:700; font-size:13.5px; display:flex; justify-content:space-between; gap:6px; }
.stc .nm small { font-weight:400; color:var(--dim); font-size:11.5px; white-space:nowrap; }
.stc .rg { font-family:var(--f-mono); font-size:17px; font-weight:700; color:var(--gold); }
.stc .hist { height:30px; margin:2px 0; }
.stc .ln { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stc .ln b { color:var(--fg); font-weight:600; }
.stc .go { font-size:11.5px; color:var(--blue); margin-top:2px; }
.bigbtn { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--card2); color:var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer; min-height:34px; }
.bigbtn:hover { border-color:var(--blue); }
.lnk { font:inherit; font-size:12.5px; border:1px solid var(--line); background:var(--card2); color:var(--blue); border-radius:99px; padding:2px 10px; cursor:pointer; white-space:nowrap; min-height:28px; }
.lnk[disabled] { color:var(--dim); cursor:default; }
/* 크게 보기 창 */
#bigview { position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; flex-direction:column; }
#bigview[hidden] { display:none; }
#bigview .bvbar { display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); background:var(--card);
  padding:calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
#bigview .bvbar b { flex:1; font-size:16px; min-width:0; }
#bigview .bvbox { flex:1; min-height:0; overflow:auto; padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#bigview .bvin { max-width:1500px; margin:0 auto; }
#bigview .bvin table.t { font-size:14px; }
#bigview .hist { height:120px; }
.ver { border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:10px 14px; margin:10px 0; }
.ver.now { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset; }
.ver .vh { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; }
.ver .vh .when { font-family:var(--f-mono); font-size:16px; font-weight:700; }
.vtag { font-size:11.5px; border-radius:99px; padding:1px 8px; border:1px solid var(--line); color:var(--dim); }
.vtag.now { background:var(--blue); border-color:var(--blue); color:var(--card); }
.vtag.k자료, .vtag.k히오스 { border-color:var(--gold-line); color:var(--gold); }
.vtag.k틀 { border-color:var(--blue); color:var(--blue); }
.ver .vno { font-family:var(--f-mono); font-size:20px; font-weight:900; color:var(--fg); }
.vrule { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin:6px 0 12px; }
.vrule div { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--card2); font-size:12.5px; }
.vrule b { font-family:var(--f-mono); font-size:15px; display:block; }
.chg { list-style:none; padding:0; margin:4px 0; font-size:13px; }
.chg li { padding:3px 0; border-bottom:1px dashed var(--line); }
.chg .was { color:var(--dim); text-decoration:line-through; }
.chg .is { color:var(--gold); font-weight:700; }
td.diff { background:var(--blue-soft); }
.desc { white-space:pre-line; }
.qnum { display:inline-block; min-width:1.3em; text-align:center; border:1px dashed var(--gold-line); border-radius:4px; color:var(--gold); font-weight:700; cursor:help; }
.lv0, .lvn { display:inline-block; font-size:11px; font-weight:700; border-radius:4px; padding:0 6px; line-height:1.6; vertical-align:1px; white-space:nowrap; }
.lv0 { color:var(--gold); border:1px solid var(--gold-line); background:color-mix(in srgb, var(--gold) 5%, transparent); }
.lvn { color:var(--blue); border:1px solid var(--blue); background:var(--blue-soft); }
.stale { border:1px solid var(--gold-line); background:color-mix(in srgb, var(--gold) 9%, var(--card)); border-radius:8px; padding:8px 12px; }
html[data-site] #theme, html[data-site] #brand .lock { display:none; }
.rel { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:6px 0 0; font-size:13.5px; color:var(--dim); }
.anc { margin-left:6px; font-size:12px; color:var(--dim); text-decoration:none; opacity:.55; }
.anc:hover { opacity:1; color:var(--blue); }
.flash { animation:flash 2.4s ease-out; border-radius:8px; }
@keyframes flash { 0%, 35% { background:var(--blue-soft); box-shadow:0 0 0 2px var(--blue); } 100% { background:transparent; box-shadow:none; } }
th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
th.sortable:hover { color:var(--blue); }
th.sortable.on { color:var(--blue); }
.pn { font-size:15px; }
.pnl > li { padding:6px 0; border-bottom:1px solid var(--line); }

/* 큰 갈래 카드 — HotS Scrap 허브와 같은 꼴(육각 테두리 금색 선 아이콘 · 한 줄 설명 · 바로 가는 칩) */
.hub-lead { color:var(--dim); margin:2px 0 20px; max-width:44em; }

  box-shadow:0 1px 2px rgba(0,0,0,.05); transition:border-color .14s, transform .14s; }

.exa:hover { border-color:var(--blue); text-decoration:none; }

.cnt { font-family:var(--f-mono); font-size:11px; color:var(--gold); margin-left:4px; }

/* ── 영웅 문서: 레벨 리모컨 · 특성 적용 · 바뀐 값 강조 (백과 개편 디자인에서 옮김) ── */
:root { --self:#17806d; }

}
#remote { position:sticky; top:66px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; font-size:13px; }

#remote .rhint { margin:0; font-size:11.5px; color:var(--dim); }
td.n.grow, .calc-v { color:var(--gold); font-weight:700; }
.skill.touched { box-shadow:inset 3px 0 0 var(--gold); padding-left:8px; background:color-mix(in srgb, var(--gold) 4%, transparent); }
.tsel { margin:8px 0 2px; }

.tsh { display:flex; flex-wrap:wrap; gap:5px; }
.tchip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:99px; padding:2px 3px 2px 2px; background:var(--card2); font-size:12px; }

.tname { display:flex; align-items:center; gap:6px; }
.est { font-size:10.5px; font-weight:700; color:var(--warn); border:1px solid currentColor; border-radius:99px; padding:0 6px; cursor:help; }

.tstk { display:grid; grid-template-columns:auto minmax(0,220px) auto 1fr; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
.tstk input { accent-color:var(--gold); min-width:0; }
.tstk output { font-family:var(--f-mono); color:var(--gold); font-weight:700; }

.kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-top:4px; }

@media (max-width:1099px) { body.remote-on:not(.remote-float) #wrap { padding-bottom:130px; } }
</style>

<script>
/* ─── 한글 검색기 — HotS Scrap site/shared/search.js 와 같은 규칙(다 친 글자는 글자대로, 자음 하나는 그 자리 초성) ─── */
(function(){var SB=0xac00,SL=0xd7a3,NJ=21,NO=28,CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',JONG='\u0000ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
function isS(c){var u=c.charCodeAt(0);return u>=SB&&u<=SL}function P(c){var u=c.charCodeAt(0)-SB;return{cho:Math.floor(u/(NJ*NO)),jung:Math.floor(u/NO)%NJ,jong:u%NO}}
function tok(q){var o=[];for(var i=0;i<q.length;i++){var c=q[i];if(isS(c))o.push({k:'s',c:c,p:P(c)});else if(CHO.indexOf(c)>-1)o.push({k:'c',c:c,n:CHO.indexOf(c)});else if(JUNG.indexOf(c)>-1)o.push({k:'j',c:c,n:JUNG.indexOf(c)});else o.push({k:'r',c:c})}return o}
function run(t,x,s){var i=s,f=0;for(var k=0;k<t.length;k++){var a=t[k],last=k===t.length-1;if(i>=x.length)return null;var c=x[i];
if(a.k==='s'){if(c===a.c){i++;continue}if(isS(c)&&a.p.jong===0){var p=P(c);if(p.cho===a.p.cho&&p.jung===a.p.jung){if(last){i++;f++;continue}var nx=t[k+1];if(p.jong!==0&&nx&&nx.k==='c'&&JONG.indexOf(nx.c)===p.jong){i++;f++;continue}}}return null}
if(a.k==='c'){if(k>0&&t[k-1].k==='s'&&t[k-1].p.jong===0&&i>s){var pv=x[i-1];if(isS(pv)&&JONG.indexOf(a.c)===P(pv).jong){f++;continue}}if(isS(c)&&P(c).cho===a.n){i++;f++;continue}if(c===a.c){i++;continue}return null}
if(a.k==='j'){if(isS(c)&&P(c).jung===a.n){i++;f++;continue}if(c===a.c){i++;continue}return null}if(c!==a.c)return null;i++}return{end:i,fuzzy:f}}
var SKIP=/[\s.'’·\-_,!?()[\]]/;function norm(s){var r=String(s==null?'':s).toLowerCase(),o='';for(var i=0;i<r.length;i++)if(!SKIP.test(r[i]))o+=r[i];return o}
function one(t,x){if(!t.length)return 1;var b=0;for(var s=0;s<x.length;s++){var r=run(t,x,s);if(!r)continue;var sc=1000-s*40-r.fuzzy*30-(x.length-r.end)*2;if(s===0&&r.end===x.length&&r.fuzzy===0)sc+=500;if(sc>b)b=sc;if(s===0)break}return b>0?b:0}
var ALIAS={'d.va':['디바']};function score(q,ts){q=norm(q);if(!q)return 1;var t=tok(q),L=[].concat(ts),b=0;for(var a=0,n=L.length;a<n;a++){var e=ALIAS[String(L[a]||'').toLowerCase()];if(e)L=L.concat(e)}
for(var i=0;i<L.length;i++){var sc=one(t,norm(L[i]));if(i>0)sc-=1;if(sc>b)b=sc}return b}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mark(text,q){var raw=String(text==null?'':text);q=norm(q);if(!q)return esc(raw);var flat='',map=[];for(var i=0;i<raw.length;i++){if(SKIP.test(raw[i]))continue;flat+=raw[i].toLowerCase();map.push(i)}var t=tok(q);
for(var s=0;s<flat.length;s++){var r=run(t,flat,s);if(!r)continue;var a=map[s],b=map[r.end-1];if(a==null||b==null)break;return esc(raw.slice(0,a))+'<mark>'+esc(raw.slice(a,b+1))+'</mark>'+esc(raw.slice(b+1))}return esc(raw)}
window.KS={score:score,mark:mark,esc:esc};})();
</script>
<script>
(function () {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = window.KS.esc;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const num = v => v == null || v === "" ? "—" : typeof v === "number"
    ? (Number.isInteger(v) ? v.toLocaleString("ko-KR") : (+v.toFixed(3)).toLocaleString("ko-KR")) : esc(v);
  const list = v => Array.isArray(v) ? v : (v == null ? [] : [v]);

  // ── 밝기 ──
  /* HotS Scrap 사이트 안에서는 공통 막대(shared/scrap.js)가 밝기(scrap.theme)를 맡는다 — 자기 밝기 단추는 숨긴다 */
  const IN_SITE = document.documentElement.hasAttribute("data-site");
  const th = IN_SITE ? null : store.get("wiki.theme");
  if (th === "dark" || th === "light") document.documentElement.dataset.theme = th;
  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = nx; store.set("wiki.theme", nx);
  });
  /* ☰ — 전체 문서 목록 서랍(어느 폭에서나). 바깥을 누르거나 Esc 면 닫힌다 */
  const drawer = on => { document.body.classList.toggle("tree-open", on); $("#menu").setAttribute("aria-expanded", on ? "true" : "false"); if (on) { const a = $("#tree a.on") || $("#tree a"); if (a) a.focus({ preventScroll: true }); } };
  $("#menu").addEventListener("click", () => drawer(!document.body.classList.contains("tree-open")));
  $("#scrim").addEventListener("click", () => drawer(false));
  $("#sbtn").addEventListener("click", () => { const on = document.body.classList.toggle("search-open"); if (on) $("#q").focus(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("tree-open")) { drawer(false); $("#menu").focus(); } });

  // ── 자료 ──
  let H = [], M = null, S = null, ICON = {}, YARD = {}, H0 = {};
  // 같은 것이 여러 줄로 나올 때 하나로 묶는다 — [{v, n}] (첫 등장 순서 유지)
  function uniq(arr, key) {
    const m = new Map();
    arr.forEach(v => { const k = key(v); if (m.has(k)) m.get(k).n++; else m.set(k, { v, n: 1 }); });
    return [...m.values()];
  }
  const unitKey = u => { const w = (u["무기"] || [])[0] || {}; return [u["이름"], u["생명"], u["보호막"], w["공격력"], w["주기"], w["사거리"]].join("|"); };
  const hById = {}, mById = {}, cById = {};
  let VER = "";        // 위키 버전(역사 기록) — 자료.틀.기타
  const showBV = () => { const b = $("#bv"); if (b) b.textContent = (VER ? `v${VER} · ` : "") + (H0 && H0["판"] ? "히오스 " + H0["판"] : ""); };
  const icon = (name, cls) => { const u = name && ICON[String(name).toLowerCase()]; return u ? `<img class="${cls || "ico"}" src="${u}" alt="">` : `<span class="${cls || "ico"}" aria-hidden="true"></span>`; };

  Promise.all(["heroes", "maps", "systems"].map(n => fetch(`data/${n}.json`).then(r => { if (!r.ok) throw new Error(n + " " + r.status); return r.json(); })))
    .then(([h, m, s]) => {
      H0 = h;
      H = Object.values(h["영웅"]).sort((a, b) => a["이름"].localeCompare(b["이름"], "ko"));
      YARD = h["기준"] || {};
      M = m; S = s;
      H.forEach(x => hById[x.id] = x);
      M["전장"].forEach(x => mById[x.id] = x);
      S["카드"].forEach(x => cById[x.id] = x);
      $("#fv").textContent = h["판"]; showBV();
      buildLinks(); buildTree(); route();
      fetch("data/icons.json").then(r => r.ok ? r.json() : {}).then(j => { ICON = Object.assign(j || {}, ICON); route(true); }).catch(() => {});
    })
    .catch(e => { $("#doc").innerHTML = `<p class="load">자료를 불러오지 못했습니다 (${esc(e.message)}). 새로 고쳐 보세요.</p>`; });

  /* 영웅 문서를 열 때 그 영웅의 자세한 자료와 그림만 받는다(처음엔 목록만 — 받는 양을 아낀다) */
  const HLOAD = {};
  function loadHero(id) {
    if (HLOAD[id]) return HLOAD[id];
    HLOAD[id] = Promise.all([fetch(`data/hero/${encodeURIComponent(id)}.json`).then(r => r.ok ? r.json() : null),
                             fetch(`data/icon/${encodeURIComponent(id)}.json`).then(r => r.ok ? r.json() : {}).catch(() => ({}))])
      .then(([full, ic]) => {
        if (!full) { HLOAD[id] = null; return; }
        Object.assign(hById[id], full, { __full: true }); Object.assign(ICON, ic || {});
        const cur = decodeURIComponent((location.hash || "").slice(1));
        if (cur === "h." + id || cur.startsWith("h." + id + ".")) route(true);
      }).catch(() => { HLOAD[id] = null; });
    return HLOAD[id];
  }
  // ── 문서끼리 잇기 — 글 속 이름을 다른 문서로(문서마다 첫 번째만) ──
  let LINKRX = null; const LINKTO = {};
  function buildLinks() {
    const add = (name, href, key) => { if (name && name.length >= 2 && !LINKTO[name]) LINKTO[name] = { href, key }; };
    S["카드"].forEach(c => add(c["이름"], "#s." + c.id, "s." + c.id));
    M["전장"].forEach(m => add(m["이름"], "#m." + m.id, "m." + m.id));
    H.forEach(h => add(h["이름"], "#h." + h.id, "h." + h.id));
    const names = Object.keys(LINKTO).sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    LINKRX = names.length ? new RegExp("(" + names.join("|") + ")", "g") : null;
  }
  function linkify(text, ctx) {
    const s = esc(text);
    if (!LINKRX) return s;
    return s.replace(LINKRX, (m) => {
      const t = LINKTO[m];
      if (!t || t.key === ctx.self || ctx.used.has(t.key)) return m;
      ctx.used.add(t.key);
      return `<a class="wl" href="${t.href}">${m}</a>`;
    });
  }

  // ── 왼쪽 나무 ──
  const SYS_ORDER = ["판 흐름", "구조물", "필드", "전투 규칙", "영웅 공용"];
  const sortedCards = () => S["카드"].slice().sort((a, b) => ((a["순서"] || [9, 0])[0] - (b["순서"] || [9, 0])[0]) || ((a["순서"] || [9, 0])[1] - (b["순서"] || [9, 0])[1]));
  function groupBy(arr, f) { const g = {}; arr.forEach(x => (g[f(x)] = g[f(x)] || []).push(x)); return g; }
  function buildTree() {
    const roles = groupBy(H, h => h["역할군"] || "기타");
    const mg = groupBy(M["전장"], m => m["구분"]);
    const sg = groupBy(sortedCards(), c => c["갈래"] || "기타");
    const open = store.get("wiki.tree") || "s";
    $("#tree").innerHTML = `<div class="th"><span>전체 문서</span><button type="button" data-close aria-label="닫기">✕</button></div>
      <nav class="tnav" aria-label="갈래">${[...document.querySelectorAll("#nav a")].map(a => a.outerHTML).join("")}</nav>
      <details data-k="h"${open === "h" ? " open" : ""}><summary>영웅 <span class="note">${H.length}</span></summary>
        ${Object.keys(roles).sort().map(r => `<div class="g">${esc(r)}</div>` + roles[r].map(h => `<a data-p="h.${esc(h.id)}" href="#h.${esc(h.id)}">${esc(h["이름"])}</a>`).join("")).join("")}</details>
      <details data-k="m"${open === "m" ? " open" : ""}><summary>전장 <span class="note">${M["전장"].length}</span></summary>
        ${Object.keys(mg).map(g => `<div class="g">${esc(g)}</div>` + mg[g].map(m => `<a data-p="m.${esc(m.id)}" href="#m.${esc(m.id)}">${esc(m["이름"])}</a>`).join("")).join("")}
        <div class="g">공용</div><a data-p="m.__shared" href="#m.__shared">공용 규칙·돌격병·용병</a></details>
      <details data-k="s"${open === "s" ? " open" : ""}><summary>시스템 <span class="note">${S["카드"].length}</span></summary>
        <a data-p="s.__overview" href="#s.__overview">한눈에 보기</a><a data-p="s.__todo" href="#s.__todo">확정 체크리스트</a>
        ${Object.keys(sg).sort((a, b) => ((SYS_ORDER.indexOf(a) + 1) || 99) - ((SYS_ORDER.indexOf(b) + 1) || 99)).map(g => `<div class="g">${esc(g)}</div>` + sg[g].map(c => `<a data-p="s.${esc(c.id)}" href="#s.${esc(c.id)}">${esc(c["이름"])}</a>`).join("")).join("")}</details>`;
    $("#tree").querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => { if (d.open) store.set("wiki.tree", d.dataset.k); }));
    $("#tree [data-close]").addEventListener("click", () => document.body.classList.remove("tree-open"));
  }
  function markTree(p) {
    $("#tree").querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.p === p));
    const k = p.split(".")[0];
    $("#nav").querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.k === k));
    if (k !== "home") $("#tree").querySelectorAll("details").forEach(d => { d.open = d.dataset.k === k; });   // 지금 갈래만 펼친다
    const on = $("#tree a.on"); if (on && on.scrollIntoView) (() => { const tr = $("#tree"); tr.scrollTop = Math.max(0, on.offsetTop - tr.clientHeight / 3); tr.scrollLeft = 0; })();
  }

  // ── 문서 틀 ──
  /* 확실성 배지 — 문서 어디서나 같은 뜻. 대문 '읽는 법' 에 설명이 있다 */
  /* 레벨 기준 배지 — 게임 파일(XML) 값은 0레벨이고 패치노트도 이 값으로 적는다. 게임 속 1레벨은 성장이 한 번 붙어 대개 4% 크다 */
  const LV0 = `<span class="lv0" title="게임 파일에 적힌 값 — 패치노트와 같은 기준(0레벨). 게임 속 1레벨은 성장이 한 번 붙어 대개 4% 큽니다">0레벨 값 · 패치노트 기준</span>`;
  const LVN = n => `<span class="lvn" title="레벨 성장을 ${n}번 적용한 값 — 게임 속 ${n}레벨에서 보이는 값">${n}레벨 값</span>`;
  const BD = {
    sure: `<span class="bd sure" title="게임 파일(XML·스크립트)에 적힌 값을 그대로 읽었습니다">자료</span>`,
    est: `<span class="bd est" title="우리가 계산하거나 유사 엔진으로 돌려 낸 값입니다 — 실제 게임과 다를 수 있습니다">추정</span>`,
    unk: `<span class="bd unk" title="게임 엔진 안에서만 정해져 자료로는 확정하지 못했습니다">미확인</span>`,
  };
  function page({ crumb, title, lede, about, info, sections, after }) {
    // 번호는 제목 있는 절에만 붙인다(제목 없는 첫 덩어리가 끼면 목차와 본문 번호가 어긋났다)
    let n = 0;
    const secs = sections.map(s => s.title ? { ...s, no: ++n } : s);
    const toc = secs.filter(s => s.title).map(s => `<li><button data-go="sec${s.no}">${esc(s.title)}</button></li>`).join("");
    return `<div class="doc-head"><div class="crumb">${crumb}<button type="button" class="share" data-share title="이 문서 주소를 복사합니다">🔗 링크 복사</button></div><h1 class="title">${esc(title)}</h1>${lede ? `<p class="lede">${lede}</p>` : ""}</div>
      ${about ? `<div class="about"><b>이 문서는</b> ${about}</div>` : ""}
      ${info || ""}${n > 2 ? `<nav class="toc" aria-label="목차"><b>목차</b><ol>${toc}</ol></nav>` : ""}
      ${secs.map(s => s.title ? `<h2 class="sec" id="sec${s.no}">${s.icon && GLYPH[s.icon] ? svgI(GLYPH[s.icon], "gi") : `<span class="no">${s.no}.</span>`}${esc(s.title)}${s.badge ? " " + s.badge : ""}</h2>${s.html}` : s.html).join("")}
      <div class="clear"></div>${after || ""}`;
  }
  const fold = (title, html, open) => `<details class="more"${open ? " open" : ""}><summary>${title}</summary><div>${html}</div></details>`;
  /* 게임 설명문 표기 맞춤 — 숫자와 단위 사이 띄움(6 초 → 6초) 없애고, 게임 툴팁이 못 푼 숫자 '?' 는 눈에 띄게 */
  const descHtml = (s, ctx) => linkify(s || "", ctx).replace(/(\d) (초|%)/g, "$1$2")
    .replace(/(^|[\s(:])\?(?=[초%의\s,.)]|$)/gm, '$1<span class="qnum" title="게임 툴팁이 이 숫자를 풀지 못했습니다(게임 자료의 참조가 끊김)">?</span>');
  const crumbs = (...xs) => [`<a href="#home">대문</a>`].concat(xs).join(" › ");
  function infobox(head, pic, rows) {
    return `<aside class="info"><div class="ih">${esc(head)}</div>${pic || ""}<table>${rows.filter(r => r[1] != null && r[1] !== "").map(([k, v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join("")}</table></aside>`;
  }
  const tbl = (head, rows) => `<div class="tbl"><table class="t"><thead><tr>${head.map(h => typeof h === "string" ? `<th>${esc(h)}</th>` : `<th class="n">${esc(h[0])}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  /* 상태 알약은 짧게 — ' — ' 뒤의 설명까지 줄바꿈 금지 알약에 넣으면 칸이 572px 로 늘어 옆 칸이 한 글자씩 눌렸다 */
  const statusHtml = s => { const [a, ...b] = String(s || "").split(" — "); return `<span class="pill ${pillCls(s)}">${esc(a)}</span>${b.length ? `<div class="note" style="margin-top:2px">${esc(b.join(" — "))}</div>` : ""}`; };

  MZ.querySelector(".mzbar").addEventListener("click", e => {
    const z = e.target.dataset && e.target.dataset.z; if (!z || !mzSvg) return;
    const r = mzSvg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (z === "in") zoomAt(0.7, cx, cy); else if (z === "out") zoomAt(1 / 0.7, cx, cy);
    else if (z === "fit") { vb = vb0.slice(); setVB(); } else closeMZ();
  });
  document.addEventListener("keydown", e => { if (!MZ.hidden && e.key === "Escape") closeMZ(); });
  const box = MZ.querySelector(".mzbox");
  box.addEventListener("wheel", e => { if (!mzSvg) return; e.preventDefault(); zoomAt(e.deltaY < 0 ? 0.85 : 1 / 0.85, e.clientX, e.clientY); }, { passive: false });
  const ptrs = new Map(); let last = null, pinch = null;
  box.addEventListener("pointerdown", e => { if (!mzSvg) return; box.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); last = [e.clientX, e.clientY]; box.classList.add("drag");
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  box.addEventListener("pointermove", e => {
    if (!mzSvg || !ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const r = mzSvg.getBoundingClientRect(), s = Math.max(vb[2] / r.width, vb[3] / r.height);
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (d > 0) zoomAt(pinch / d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch = d; return;
    }
    if (last) { vb[0] -= (e.clientX - last[0]) * s; vb[1] -= (e.clientY - last[1]) * s; setVB(); }
    last = [e.clientX, e.clientY];
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; last = ptrs.size ? [...ptrs.values()][0] : null; if (!ptrs.size) box.classList.remove("drag"); };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);

  // ── 찾기 ──
  let IDX = null;
  function buildIndex() {
    IDX = [];
    H.forEach(h => {
      IDX.push({ k: "영웅", t: h["이름"], alt: [h.id], href: "#h." + h.id, sub: h["역할군"] || "", ic: h["초상화"] });
      list(h["기술"]).forEach(a => IDX.push({ k: "기술", t: a["이름"] || a.id, alt: [a.id], href: `#h.${h.id}.sk-${a.id}`, sub: h["이름"], ic: a["아이콘"] }));
      list(h["특성"]).forEach(p => IDX.push({ k: "특성", t: p["이름"] || p.id, alt: [p.id], href: `#h.${h.id}.tal-${p.id}`, sub: `${h["이름"]} · ${p["레벨"]}레벨`, ic: p["아이콘"] }));
    });
    M["전장"].forEach(m => IDX.push({ k: "전장", t: m["이름"], alt: [m["영문"]], href: "#m." + m.id, sub: m["구분"] }));
    S["카드"].forEach(c => IDX.push({ k: "시스템", t: c["이름"], alt: [c.id].concat(list(c["출발점"]).slice(0, 3)), href: "#s." + c.id, sub: c["갈래"] || "" }));
    IDX.push({ k: "시스템", t: "한눈에 보기", alt: ["overview"], href: "#s.__overview", sub: "시스템" }, { k: "시스템", t: "확정 체크리스트", alt: ["todo"], href: "#s.__todo", sub: "시스템" });
  }
  const KW = { "영웅": 30, "전장": 25, "시스템": 20, "기술": 0, "특성": -5 };
  let sel = 0, hits = [];
  function search(q) {
    if (!IDX) buildIndex();
    const box = $("#sres");
    if (!q.trim()) { box.hidden = true; return; }
    hits = IDX.map(x => ({ x, s: window.KS.score(q, [x.t].concat(x.alt)) })).filter(r => r.s > 0)
      .map(r => ({ x: r.x, s: r.s + (KW[r.x.k] || 0) })).sort((a, b) => b.s - a.s).slice(0, 14).map(r => r.x);
    sel = 0;
    box.innerHTML = hits.length ? hits.map((x, i) => `<a href="${x.href}" class="${i === 0 ? "sel" : ""}"><span class="k">${x.k}</span>${x.ic ? icon(x.ic, "ico sm") : ""}<span>${window.KS.mark(x.t, q)}</span><span class="sub">${esc(x.sub || "")}</span></a>`).join("")
      : `<a><span class="note">맞는 문서가 없습니다</span></a>`;
    box.hidden = false;
  }
  const q = $("#q");
  q.addEventListener("input", () => search(q.value));
  q.addEventListener("focus", () => q.value && search(q.value));
  q.addEventListener("keydown", e => {
    const box = $("#sres"), as = box.querySelectorAll("a[href]");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!as.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle("sel", i === sel)); as[sel].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { if (as[sel]) { location.hash = as[sel].getAttribute("href"); box.hidden = true; q.blur(); } }
    else if (e.key === "Escape") { if (q.value) { q.value = ""; box.hidden = true; } else q.blur(); }
  });
  $("#sres").addEventListener("click", e => { if (e.target.closest("a[href]")) { $("#sres").hidden = true; q.value = ""; } });
  document.addEventListener("click", e => { if (!e.target.closest("#sbox")) $("#sres").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });
})();
</script>
